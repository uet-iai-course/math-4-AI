<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Hình chiếu bình phương nhỏ nhất và một bước gradient</title>
  <desc id="desc">Khung trái cho phần dư r bằng y mũ trừ y vuông góc với không gian cột. Khung phải vẽ các đường mức của mất mát trên lát w0 bằng 14 với trục w1, w2 cùng tỉ lệ; một bước gradient với độ dài bước 0,1 đi từ (1; 1) đến (1,5; 1,3), làm mất mát giảm từ 4,5 xuống 2,265, và tiến về nghiệm (2; 1) có mất mát nhỏ nhất bằng 2.</desc>
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b44b20"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d92"/></marker>
    <marker id="arrowDark" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24324a"/></marker>
    <clipPath id="plotClip"><rect x="651" y="113" width="489" height="291"/></clipPath>
    <style>
      .panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.plane{fill:#e6eef9;stroke:#315d92;stroke-width:3}.residual{stroke:#b44b20;stroke-width:5;marker-end:url(#arrowOrange)}.projection{stroke:#315d92;stroke-width:4;marker-end:url(#arrowBlue)}.contour{fill:none;stroke:#6a45a5;stroke-width:2}.step{stroke:#b44b20;stroke-width:4;marker-end:url(#arrowOrange)}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrowDark)}.tick{stroke:#24324a;stroke-width:2}.point{fill:#fff;stroke:#172033;stroke-width:3}.halo{paint-order:stroke;stroke:#fbfcff;stroke-width:5px;stroke-linejoin:round}.c-orange{fill:#b44b20}.c-teal{fill:#16706a}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">Bình phương nhỏ nhất: phép chiếu và một bước gradient</text>

  <rect class="panel" x="24" y="55" width="540" height="440" rx="14"/>
  <text class="title" x="294" y="88" text-anchor="middle">Không gian dữ liệu ℝ⁴</text>
  <polygon class="plane" points="85,350 400,245 515,305 200,410"/>
  <text class="label" x="383" y="372">Col(X)</text>
  <circle cx="140" cy="372" r="5" fill="#315d92"/><text class="small" x="128" y="390" text-anchor="end">0</text>
  <line class="projection" x1="140" y1="372" x2="280" y2="288"/>
  <line class="residual" x1="290" y1="168" x2="290" y2="271"/>
  <path d="M290 282h22v-22" fill="none" stroke="#172033" stroke-width="3"/>
  <circle class="point" cx="290" cy="160" r="7"/><text class="label" x="304" y="158">y</text>
  <circle cx="290" cy="282" r="7" fill="#315d92"/>
  <text class="label" x="302" y="222">r = ŷ − y</text>
  <text class="label" x="280" y="240" text-anchor="end">X<tspan baseline-shift="super" font-size="12">T</tspan>r = 0</text>
  <text class="label" x="322" y="302">ŷ = Xw<tspan baseline-shift="sub" font-size="12">LS</tspan></text>
  <text class="small" x="294" y="458" text-anchor="middle">Mặt phẳng chỉ là sơ đồ của một không gian con trong ℝ⁴.</text>

  <rect class="panel" x="588" y="55" width="588" height="440" rx="14"/>
  <text class="title" x="882" y="88" text-anchor="middle">Lát tham số w₀ = 14</text>
  <g clip-path="url(#plotClip)">
    <g class="contour" transform="rotate(58.28 930 260)">
      <ellipse cx="930" cy="260" rx="526.9" ry="76.9"/>
      <ellipse cx="930" cy="260" rx="333.2" ry="48.6"/>
      <ellipse cx="930" cy="260" rx="171.5" ry="25"/>
      <ellipse cx="930" cy="260" rx="74.5" ry="10.9"/>
    </g>
  </g>
  <line class="axis" x1="650" y1="405" x2="1140" y2="405"/>
  <line class="axis" x1="650" y1="405" x2="650" y2="112"/>
  <g class="tick"><line x1="750" y1="405" x2="750" y2="411"/><line x1="840" y1="405" x2="840" y2="411"/><line x1="930" y1="405" x2="930" y2="411"/><line x1="1020" y1="405" x2="1020" y2="411"/><line x1="1110" y1="405" x2="1110" y2="411"/><line x1="644" y1="350" x2="650" y2="350"/><line x1="644" y1="260" x2="650" y2="260"/><line x1="644" y1="170" x2="650" y2="170"/></g>
  <g class="small" text-anchor="middle"><text x="750" y="428">0</text><text x="840" y="428">1</text><text x="930" y="428">2</text><text x="1020" y="428">3</text><text x="1110" y="428">4</text></g>
  <g class="small" text-anchor="end"><text x="640" y="355">0</text><text x="640" y="265">1</text><text x="640" y="175">2</text></g>
  <text class="label" x="1146" y="410">w₁</text><text class="label" x="660" y="120">w₂</text>
  <line class="step" x1="840" y1="260" x2="879" y2="236.6"/>
  <circle class="point" cx="840" cy="260" r="7"/>
  <circle cx="885" cy="233" r="7" fill="#b44b20"/>
  <circle cx="930" cy="260" r="8" fill="#16706a"/>
  <text class="label halo" x="826" y="266" text-anchor="end">w<tspan baseline-shift="super" font-size="12">(0)</tspan> = (1; 1)</text>
  <text class="small halo" x="826" y="290" text-anchor="end">η = 0,1; hướng −∇f</text>
  <rect x="749" y="204" width="131" height="22" rx="4" fill="#fbfcff" fill-opacity=".92"/>
  <rect x="973" y="266" width="114" height="22" rx="4" fill="#fbfcff" fill-opacity=".92"/>
  <text class="label halo c-orange" x="875" y="220" text-anchor="end">w<tspan baseline-shift="super" font-size="12">+</tspan> = (1,5; 1,3)</text>
  <text class="label halo c-teal" x="978" y="282">w<tspan baseline-shift="sub" font-size="12">LS</tspan> = (2; 1)</text>
  <text class="label" x="882" y="456" text-anchor="middle">f: 4,5 → 2,265; giá trị nhỏ nhất 2 tại w<tspan baseline-shift="sub" font-size="12">LS</tspan></text>
  <text class="small" x="882" y="482" text-anchor="middle">Một bước tiến về nghiệm nhưng chưa đạt nghiệm.</text>
</svg>

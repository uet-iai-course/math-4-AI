<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">So sánh cách đo phần dư của OLS và GLS</title>
  <desc id="desc">OLS cho hai phần dư một một và một trừ một cùng chi phí bằng một theo quy ước một nửa bình phương chuẩn. Với hiệp phương sai có tương quan dương 0.5, GLS cho chi phí hai phần ba theo hướng cùng dấu và hai theo hướng trái dấu.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.circle{fill:none;stroke:#315d92;stroke-width:4}.ellipse{fill:none;stroke:#6a45a5;stroke-width:4}.plus{stroke:#16706a;stroke-width:5;marker-end:url(#arrow)}.minus{stroke:#b44b20;stroke-width:5;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="560" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">GLS phạt phần dư theo cấu trúc tương quan, không chỉ theo độ dài Euclid</text>
  <rect class="panel" x="25" y="58" width="545" height="470" rx="14"/><text class="title" x="298" y="94" text-anchor="middle">OLS: đường đồng mức là đường tròn</text>
  <line class="axis" x1="95" y1="330" x2="500" y2="330"/><line class="axis" x1="298" y1="475" x2="298" y2="135"/>
  <text class="small" x="500" y="352">r1</text><text class="small" x="310" y="137">r2</text>
  <circle class="circle" cx="298" cy="330" r="125"/>
  <line class="plus" x1="298" y1="330" x2="383" y2="245"/><line class="minus" x1="298" y1="330" x2="383" y2="415"/>
  <text class="label" x="390" y="238">r+=(1,1)</text><text class="label" x="390" y="440">r−=(1,−1)</text>
  <text class="label" x="298" y="155" text-anchor="middle">J_OLS=(1/2)||r||²</text>
  <text class="small" x="298" y="496" text-anchor="middle">J_OLS(r+)=J_OLS(r−)=1: OLS coi hai hướng như nhau.</text>

  <rect class="panel" x="595" y="58" width="580" height="470" rx="14"/><text class="title" x="885" y="94" text-anchor="middle">GLS: đường đồng mức theo Σ</text>
  <text class="label" x="885" y="132" text-anchor="middle">Σ=[[1,0.5],[0.5,1]]</text>
  <line class="axis" x1="650" y1="350" x2="1120" y2="350"/><line class="axis" x1="885" y1="485" x2="885" y2="150"/>
  <text class="small" x="1115" y="374">r1</text><text class="small" x="898" y="173">r2</text>
  <path class="ellipse" d="M690 445 C735 505 1035 250 1080 190 C1035 130 735 385 690 445 Z"/>
  <line class="plus" x1="885" y1="350" x2="985" y2="250"/><line class="minus" x1="885" y1="350" x2="985" y2="450"/>
  <text class="label" x="995" y="238">r+: J=2/3</text><text class="label" x="995" y="476">r−: J=2</text>
  <text class="small" x="680" y="175">J_GLS=(1/2)rᵀΣ⁻¹r</text>
  <text class="small" x="885" y="510" text-anchor="middle">Tương quan dương làm sai số cùng dấu “ít bất thường” hơn.</text>
</svg>

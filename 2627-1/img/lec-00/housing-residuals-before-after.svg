<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Phần dư trước và sau khi khớp mô hình giá nhà</title>
  <desc id="desc">Hai biểu đồ cột so sánh phần dư của bốn căn nhà. Trước khi khớp, phần dư là 0,5; 1,5; 0,5 và âm 2,5, cho SSE bằng 9 và mất mát bằng 4,5. Sau khi khớp, phần dư là âm 1; 1; 1 và âm 1, cho SSE bằng 4 và mất mát bằng 2.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.guide{stroke:#91a4bd;stroke-width:1.5;stroke-dasharray:6 5}.before{fill:#fff1e9;stroke:#b44b20;stroke-width:3}.after{fill:#eef4f3;stroke:#16706a;stroke-width:3}</style>
  </defs>
  <rect width="1200" height="550" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Khớp mô hình làm tổng bình phương phần dư giảm, không buộc từng phần dư bằng 0</text>
  <rect class="panel" x="22" y="58" width="550" height="455" rx="14"/><text class="title" x="297" y="94" text-anchor="middle">Trước: w0=(14,1,1)ᵀ</text>
  <line class="axis" x1="78" y1="300" x2="525" y2="300"/><line class="axis" x1="90" y1="430" x2="90" y2="125"/>
  <line class="guide" x1="78" y1="180" x2="525" y2="180"/><line class="guide" x1="78" y1="420" x2="525" y2="420"/>
  <text class="small" x="69" y="185" text-anchor="end">+2,5</text><text class="small" x="69" y="305" text-anchor="end">0</text><text class="small" x="69" y="425" text-anchor="end">−2,5</text>
  <rect class="before" x="132" y="276" width="55" height="24" fill="#fff1e9"/><rect class="before" x="232" y="228" width="55" height="72" fill="#fff1e9"/><rect class="before" x="332" y="276" width="55" height="24" fill="#fff1e9"/><rect class="before" x="432" y="300" width="55" height="120" fill="#fff1e9"/>
  <g class="label" text-anchor="middle"><text x="159" y="266">+0,5</text><text x="259" y="218">+1,5</text><text x="359" y="266">+0,5</text><text x="159" y="330">Căn 1</text><text x="259" y="330">Căn 2</text><text x="359" y="330">Căn 3</text><text x="459" y="330">Căn 4</text></g>
  <text class="label" x="495" y="414">−2,5</text>
  <text class="title" x="297" y="482" text-anchor="middle">SSE=9  →  f=SSE / 2=4,5</text>

  <rect class="panel" x="598" y="58" width="580" height="455" rx="14"/><text class="title" x="888" y="94" text-anchor="middle">Sau: wLS=(14,2,1)ᵀ</text>
  <line class="axis" x1="654" y1="300" x2="1130" y2="300"/><line class="axis" x1="666" y1="430" x2="666" y2="125"/>
  <line class="guide" x1="654" y1="252" x2="1130" y2="252"/><line class="guide" x1="654" y1="348" x2="1130" y2="348"/>
  <text class="small" x="645" y="257" text-anchor="end">+1</text><text class="small" x="645" y="305" text-anchor="end">0</text><text class="small" x="645" y="353" text-anchor="end">−1</text>
  <rect class="after" x="720" y="300" width="60" height="48" fill="#eef4f3"/><rect class="after" x="825" y="252" width="60" height="48" fill="#eef4f3"/><rect class="after" x="930" y="252" width="60" height="48" fill="#eef4f3"/><rect class="after" x="1035" y="300" width="60" height="48" fill="#eef4f3"/>
  <g class="label" text-anchor="middle"><text x="750" y="375">−1</text><text x="855" y="242">+1</text><text x="960" y="242">+1</text><text x="1065" y="375">−1</text><text x="750" y="400">Căn 1</text><text x="855" y="400">Căn 2</text><text x="960" y="400">Căn 3</text><text x="1065" y="400">Căn 4</text></g>
  <text class="title" x="888" y="430" text-anchor="middle">SSE=4  →  f=SSE / 2=2</text>
  <text class="small" x="888" y="468" text-anchor="middle">X^T r=0: không còn hướng bậc nhất để giảm lỗi</text><text class="small" x="888" y="493" text-anchor="middle">trong không gian đặc trưng, dù r khác 0.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Quy trình xây dựng mô hình giá nhà tuyến tính</title>
  <desc id="desc">Sáu bước nối dữ liệu bốn căn nhà với đặc trưng chuẩn hóa, ma trận thiết kế X kích thước bốn nhân ba, trọng số ba chiều, dự đoán và phần dư bốn chiều, rồi đến dự đoán kèm bất định.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.stage{fill:#e9f1fb;stroke:#315d92;stroke-width:3}.stage2{fill:#eef4f3;stroke:#16706a;stroke-width:3}.stage3{fill:#fff1e9;stroke:#b44b20;stroke-width:3}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.arrow{stroke:#24324a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="550" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">Dữ liệu → biểu diễn → khớp mô hình → dự đoán kèm bất định</text>
  <rect class="panel" x="22" y="58" width="1156" height="455" rx="14"/>

  <rect class="stage" x="44" y="103" width="165" height="320" rx="12"/>
  <text class="title" x="126" y="137" text-anchor="middle">Dữ liệu thô</text>
  <text class="small" x="126" y="173" text-anchor="middle">a (m²), b (phòng), y</text>
  <g class="label" text-anchor="middle"><text x="126" y="215">40, 1, 11</text><text x="126" y="251">50, 2, 12</text><text x="126" y="287">60, 2, 14</text><text x="126" y="323">70, 3, 19</text></g>
  <text class="small" x="126" y="372" text-anchor="middle">y dùng đơn vị</text><text class="small" x="126" y="398" text-anchor="middle">100 triệu đồng</text>

  <path class="arrow" d="M213 263 L249 263"/>
  <rect class="stage2" x="255" y="103" width="175" height="320" rx="12"/>
  <text class="title" x="342" y="137" text-anchor="middle">Đặc trưng</text>
  <text class="label" x="342" y="181" text-anchor="middle">a′=(a−55)/10</text>
  <text class="label" x="342" y="217" text-anchor="middle">b′=b−2</text>
  <text class="label" x="342" y="270" text-anchor="middle">φ=[1,a′,b′]ᵀ</text>
  <text class="small" x="342" y="318" text-anchor="middle">Mỗi căn → một</text><text class="small" x="342" y="344" text-anchor="middle">véc-tơ 3 chiều</text>
  <text class="small" x="342" y="390" text-anchor="middle">Giữ đúng đơn vị</text>

  <path class="arrow" d="M434 263 L470 263"/>
  <rect class="stage" x="476" y="83" width="220" height="360" rx="12"/>
  <text class="title" x="586" y="117" text-anchor="middle">Ghép thành ma trận</text>
  <text class="label" x="586" y="154" text-anchor="middle">X: 4×3; y: 4 phần tử</text>
  <text class="small" x="586" y="193" text-anchor="middle">X = [</text>
  <g class="small" text-anchor="middle"><text x="586" y="222">1  −1,5  −1</text><text x="586" y="249">1  −0,5   0</text><text x="586" y="276">1   0,5   0</text><text x="586" y="303">1   1,5   1</text></g>
  <text class="small" x="586" y="330" text-anchor="middle">]</text>
  <text class="label" x="586" y="371" text-anchor="middle">y=[11,12,14,19]ᵀ</text>
  <text class="small" x="586" y="411" text-anchor="middle">Bốn hàng = bốn mẫu</text>

  <path class="arrow" d="M700 263 L736 263"/>
  <rect class="stage3" x="742" y="103" width="175" height="320" rx="12"/>
  <text class="title" x="829" y="137" text-anchor="middle">Khớp trọng số</text>
  <text class="label" x="829" y="184" text-anchor="middle">w: 3 phần tử</text>
  <text class="label" x="829" y="225" text-anchor="middle">ŷ=Xw</text>
  <text class="label" x="829" y="266" text-anchor="middle">r=ŷ−y: 4 phần tử</text>
  <text class="label" x="829" y="307" text-anchor="middle">min ½||r||²</text>
  <text class="small" x="829" y="362" text-anchor="middle">Đại số biểu diễn;</text><text class="small" x="829" y="388" text-anchor="middle">giải tích tìm w.</text>

  <path class="arrow" d="M921 263 L957 263"/>
  <rect class="stage2" x="963" y="103" width="190" height="320" rx="12"/>
  <text class="title" x="1058" y="137" text-anchor="middle">Nhà mới</text>
  <text class="label" x="1058" y="181" text-anchor="middle">65 m², 2 phòng</text>
  <text class="label" x="1058" y="222" text-anchor="middle">φ*=[1,1,0]ᵀ</text>
  <text class="label" x="1058" y="263" text-anchor="middle">ŷ*=wᵀφ*</text>
  <rect x="990" y="293" width="136" height="54" rx="10" fill="#fff" stroke="#16706a" stroke-width="2"/>
  <text class="title" x="1058" y="328" text-anchor="middle">1,6 tỷ</text>
  <text class="small" x="1058" y="378" text-anchor="middle">Xác suất bổ sung</text><text class="small" x="1058" y="402" text-anchor="middle">dải bất định.</text>
  <text class="small" x="600" y="484" text-anchor="middle">Các mũi tên chỉ quan hệ tính toán; dữ liệu tổng hợp này không phải bằng chứng về thị trường.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Hiệp phương sai, Gauss nhiều biến và phép làm trắng</title>
  <desc id="desc">Khung đầu biểu diễn bốn kết quả nhị phân U,V với khối lượng 0,30; 0,20; 0,10 và 0,40, cho tương quan xấp xỉ 0,408. Hai khung sau biểu diễn các đường đồng mật độ của Gauss hai biến với tương quan 0,8 (ba elip ứng với khoảng cách Mahalanobis 1, 2, 3) và phép làm trắng véc-tơ ngẫu nhiên biến các elip Mahalanobis thành đường tròn.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker><marker id="arrowOrange" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b44b20"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.ellipse{fill:none;stroke:#315d92;stroke-width:4}.ellipse2{fill:none;stroke:#6a45a5;stroke-width:4}.point{fill:#b44b20}.mean{fill:#fff;stroke:#16706a;stroke-width:4}</style></defs>
  <rect width="1200" height="570" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Hiệp phương sai mã hóa độ trải và hướng phụ thuộc tuyến tính</text>
  <rect class="panel" x="20" y="58" width="370" height="480" rx="14"/><text class="title" x="205" y="94" text-anchor="middle">Hiệp phương sai từ bảng U,V</text>
  <line class="axis" x1="100" y1="365" x2="345" y2="365"/><line class="axis" x1="115" y1="400" x2="115" y2="130"/>
  <text class="small" x="338" y="389">U</text><text class="small" x="91" y="145">V</text>
  <line x1="140" y1="330" x2="300" y2="180" stroke="#315d92" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="140" cy="330" r="27" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/><text class="small" x="140" y="336" text-anchor="middle">0,30</text>
  <circle cx="140" cy="180" r="23" fill="#fff1e9" stroke="#b44b20" stroke-width="3"/><text class="small" x="140" y="186" text-anchor="middle">0,20</text>
  <circle cx="300" cy="330" r="18" fill="#fff1e9" stroke="#b44b20" stroke-width="3"/><text class="small" x="300" y="336" text-anchor="middle">0,10</text>
  <circle cx="300" cy="180" r="31" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/><text class="small" x="300" y="186" text-anchor="middle">0,40</text>
  <text class="small" x="140" y="390" text-anchor="middle">0</text><text class="small" x="300" y="390" text-anchor="middle">1</text>
  <text class="small" x="93" y="336" text-anchor="middle">0</text><text class="small" x="93" y="186" text-anchor="middle">1</text>
  <circle class="mean" cx="220" cy="240" r="7"/><text class="small" x="234" y="264">μ = (0,5; 0,6)</text>
  <text class="label" x="160" y="458" text-anchor="end">Σ =</text><path d="M174 424h-6v46h6M276 424h6v46h-6" fill="none" stroke="#24324a" stroke-width="2"/><g class="label" text-anchor="end"><text x="218" y="443">0,25</text><text x="268" y="443">0,10</text><text x="218" y="465">0,10</text><text x="268" y="465">0,24</text></g>
  <text class="small" x="205" y="501" text-anchor="middle">ρ = 0,10/√(0,25·0,24) ≈ 0,408</text>

  <rect class="panel" x="415" y="58" width="370" height="480" rx="14"/><text class="title" x="600" y="94" text-anchor="middle">Gauss hai biến, ρ = 0,8</text>
  <line class="axis" x1="460" y1="280" x2="752" y2="280"/><line class="axis" x1="605" y1="420" x2="605" y2="132"/>
  <text class="small" x="742" y="302">g₁</text><text class="small" x="614" y="142">g₂</text>
  <g class="ellipse2" transform="rotate(-45 605 280)"><ellipse cx="605" cy="280" rx="169" ry="56.3"/><ellipse cx="605" cy="280" rx="112.7" ry="37.6"/><ellipse cx="605" cy="280" rx="56.3" ry="18.8"/></g>
  <circle class="mean" cx="605" cy="280" r="7"/>
  <line x1="485" y1="400" x2="725" y2="160" stroke="#16706a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text class="label" x="552" y="458" text-anchor="end">Σ =</text><path d="M568 424h-6v46h6M652 424h6v46h-6" fill="none" stroke="#24324a" stroke-width="2"/><g class="label" text-anchor="end"><text x="602" y="443">1</text><text x="644" y="443">0,8</text><text x="602" y="465">0,8</text><text x="644" y="465">1</text></g>
  <text class="small" x="600" y="496" text-anchor="middle">Đồng mật độ ⇔ cùng khoảng cách Mahalanobis.</text>
  <text class="small" x="600" y="520" text-anchor="middle">Trục dài là hướng biến thiên mạnh.</text>

  <rect class="panel" x="810" y="58" width="370" height="480" rx="14"/><text class="title" x="995" y="94" text-anchor="middle">Làm trắng</text>
  <text class="label" x="995" y="132" text-anchor="middle">Z̃ = Σ<tspan baseline-shift="super" font-size="13">−1/2</tspan>(Z − μ)</text>
  <line class="axis" x1="850" y1="315" x2="1140" y2="315"/><line class="axis" x1="995" y1="455" x2="995" y2="165"/>
  <text class="small" x="1130" y="338">z̃₁</text><text class="small" x="1006" y="178">z̃₂</text>
  <g class="ellipse2"><circle cx="995" cy="315" r="35"/><circle cx="995" cy="315" r="70"/><circle cx="995" cy="315" r="105"/></g>
  <circle class="mean" cx="995" cy="315" r="7"/>
  <line x1="995" y1="315" x2="1067" y2="243" stroke="#b44b20" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text class="small" x="1076" y="232">d<tspan baseline-shift="sub" font-size="12">M</tspan> = 3</text>
  <text class="label" x="995" y="487" text-anchor="middle">Cov(Z̃) = I</text>
  <text class="small" x="995" y="514" text-anchor="middle">Elip trở thành tròn; các hướng cùng thang đo.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị, lát cắt và tập mức của hàm hai biến</title>
  <desc id="desc">Ba khung biểu diễn hàm h bằng u bình phương cộng uv cộng hai v bình phương cộng u trừ hai v. Khung trái là bề mặt với đường lát v bằng 2. Khung giữa là parabol của lát cắt. Khung phải là elip tập mức h bằng 0.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>
      .panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.grid{fill:none;stroke:#91a4bd;stroke-width:1.4}.slice{fill:none;stroke:#b44b20;stroke-width:4}.level{fill:none;stroke:#6a45a5;stroke-width:4;stroke-dasharray:10 6}.guide{stroke:#66758c;stroke-width:1.5;stroke-dasharray:5 5}.point{fill:#fff;stroke:#172033;stroke-width:3}.minimum{fill:#fff;stroke:#16706a;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="460" fill="#f3f6fb"/>
  <text x="600" y="30" text-anchor="middle" class="title">Một hàm, ba cách nhìn hình học</text>

  <rect class="panel" x="20" y="48" width="390" height="390" rx="14"/>
  <text x="215" y="78" text-anchor="middle" class="title">Bề mặt z = h(u,v)</text>
  <g aria-label="Lưới bề mặt chiếu xiên">
    <polyline class="grid" points="73,257 94,273 115,285 136,293 157,297 178,297 199,293 220,285 241,273"/>
    <polyline class="grid" points="85,270 106,284 127,294 148,300 169,302 190,300 211,294 232,284 253,270"/>
    <polyline class="grid" points="97,275 118,287 139,295 160,299 181,299 202,295 223,287 244,275 265,259"/>
    <polyline class="grid" points="109,272 130,282 151,288 172,290 193,288 214,282 235,272 256,258 277,240"/>
    <polyline class="grid" points="121,261 142,269 163,273 184,273 205,269 226,261 247,249 268,233 289,213"/>
    <polyline class="slice" points="133,242 154,248 175,250 196,248 217,242 238,232 259,218 280,200 301,178"/>
    <polyline class="grid" points="145,215 166,219 187,219 208,215 229,207 250,195 271,179 292,159 313,135"/>
    <polyline class="grid" points="73,257 85,270 97,275 109,272 121,261 133,242 145,215"/>
    <polyline class="grid" points="115,285 127,294 139,295 151,288 163,273 175,250 187,219"/>
    <polyline class="grid" points="157,297 169,302 181,299 193,288 205,269 217,242 229,207"/>
    <polyline class="grid" points="199,293 211,294 223,287 235,272 247,249 259,218 271,179"/>
    <polyline class="grid" points="241,273 253,270 265,259 277,240 289,213 301,178 313,135"/>
  </g>
  <line class="axis" x1="62" y1="340" x2="280" y2="340"/><text class="label" x="288" y="347">u</text>
  <line class="axis" x1="62" y1="340" x2="117" y2="298"/><text class="label" x="120" y="294">v</text>
  <line class="axis" x1="62" y1="340" x2="62" y2="112"/><text class="label" x="42" y="105">z</text>
  <circle class="point" cx="280" cy="200" r="6"/><text class="small" x="287" y="193">P=(1,2,8)</text>
  <path class="minimum" d="M160 291l7 7-7 7-7-7z"/><text class="small" x="72" y="322">M=(-6/7,5/7,-8/7)</text>
  <line x1="252" y1="226" x2="332" y2="247" class="slice"/><text class="label" x="238" y="267">lát v=2</text>
  <text class="small" x="215" y="420" text-anchor="middle">Lưới là hình chiếu phối cảnh, không phải dữ liệu đo.</text>

  <rect class="panel" x="425" y="48" width="350" height="390" rx="14"/>
  <text x="600" y="78" text-anchor="middle" class="title">Lát cắt v = 2</text>
  <line class="axis" x1="440" y1="350" x2="745" y2="350"/><text class="label" x="748" y="357">u</text>
  <line class="axis" x1="580" y1="365" x2="580" y2="100"/><text class="label" x="562" y="96">p</text>
  <polyline class="slice" points="430,250 455,275 480,290 505,295 530,290 555,275 580,250 605,215 630,170 655,115 680,50"/>
  <line class="guide" x1="505" y1="295" x2="505" y2="350"/><circle class="minimum" cx="505" cy="295" r="6"/>
  <text class="small" x="512" y="316">đỉnh (-3/2, 7/4)</text>
  <circle class="point" cx="630" cy="170" r="6"/><text class="small" x="638" y="162">(1,8)</text>
  <text class="label" x="600" y="392" text-anchor="middle">p(u)=u²+3u+4 &gt; 0</text>
  <text class="small" x="600" y="418" text-anchor="middle">Lát này không cắt mức h=0.</text>

  <rect class="panel" x="790" y="48" width="390" height="390" rx="14"/>
  <text x="985" y="78" text-anchor="middle" class="title">Tập mức L0 trong mặt phẳng (u,v)</text>
  <line class="axis" x1="820" y1="255" x2="1145" y2="255"/><text class="label" x="1148" y="262">u</text>
  <line class="axis" x1="1000" y1="370" x2="1000" y2="105"/><text class="label" x="985" y="101">v</text>
  <line class="guide" x1="840" y1="255" x2="1035" y2="150"/>
  <line class="guide" x1="900" y1="125" x2="1010" y2="330"/>
  <polyline class="level" points="1016,201 1005,186 990,171 971,159 950,149 927,143 905,142 886,146 869,153 858,164 851,177 850,192 856,207 866,222 881,236 900,248 922,255 944,261 966,262 986,260 1002,253 1014,244 1020,229 1021,214 1016,201"/>
  <circle class="minimum" cx="936" cy="201" r="6"/><text class="small" x="807" y="181">tâm C=(-6/7,5/7)</text>
  <circle class="point" cx="1000" cy="255" r="6"/><text class="small" x="1008" y="275">(0,0)</text>
  <circle class="point" cx="1000" cy="180" r="6"/><text class="small" x="1008" y="173">(0,1)</text>
  <text class="label" x="985" y="392" text-anchor="middle">u^2 + uv + 2v^2 + u - 2v = 0</text>
  <text class="small" x="985" y="418" text-anchor="middle">Elip xoay và tịnh tiến; hai trục dùng cùng tỉ lệ.</text>
</svg>

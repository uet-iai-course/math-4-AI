<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Từ phép thử ngẫu nhiên đến biến ngẫu nhiên</title>
  <desc id="desc">Một lần gieo xúc xắc tạo ra một phần tử của không gian mẫu. Hai ánh xạ xác định biến kết quả X và biến chỉ báo B bằng một khi X là số chẵn.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.arrow{stroke:#24324a;stroke-width:3;fill:none;marker-end:url(#arrow)}.outcome{fill:#e9f1fb;stroke:#315d92;stroke-width:2}.high{fill:#fff1e9;stroke:#b44b20;stroke-width:3}.zero{fill:#eef4f3;stroke:#16706a;stroke-width:3}</style>
  </defs>
  <rect width="1200" height="540" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">Ngẫu nhiên nằm ở kết quả; biến ngẫu nhiên là một ánh xạ xác định</text>
  <rect class="panel" x="25" y="58" width="350" height="440" rx="14"/>
  <text class="title" x="200" y="94" text-anchor="middle">Không gian mẫu Ω</text>
  <text class="label" x="200" y="126" text-anchor="middle">Gieo một xúc xắc cân bằng</text>
  <g aria-label="Sáu kết quả có thể">
    <circle class="outcome" cx="115" cy="195" r="39"/><text class="title" x="115" y="203" text-anchor="middle">1</text>
    <circle class="high" cx="200" cy="195" r="39"/><text class="title" x="200" y="203" text-anchor="middle">2</text>
    <circle class="outcome" cx="285" cy="195" r="39"/><text class="title" x="285" y="203" text-anchor="middle">3</text>
    <circle class="high" cx="115" cy="290" r="39"/><text class="title" x="115" y="298" text-anchor="middle">4</text>
    <circle class="outcome" cx="200" cy="290" r="39"/><text class="title" x="200" y="298" text-anchor="middle">5</text>
    <circle class="high" cx="285" cy="290" r="39"/><text class="title" x="285" y="298" text-anchor="middle">6</text>
  </g>
  <text class="label" x="200" y="369" text-anchor="middle">P({ω}) = 1/6</text>
  <text class="small" x="200" y="405" text-anchor="middle">Trước khi gieo: chưa biết ω.</text>
  <text class="small" x="200" y="432" text-anchor="middle">Sau khi gieo: chỉ một ω xảy ra.</text>

  <path class="arrow" d="M380 215 C430 185 450 172 495 172"/>
  <text class="label" x="436" y="151" text-anchor="middle">X(ω)=ω</text>
  <path class="arrow" d="M380 315 C430 350 450 375 495 375"/>
  <text class="label" x="434" y="405" text-anchor="middle">B=1{X chẵn}</text>

  <rect class="panel" x="500" y="58" width="300" height="440" rx="14"/>
  <text class="title" x="650" y="94" text-anchor="middle">Biến kết quả X</text>
  <line x1="548" y1="195" x2="752" y2="195" class="arrow"/>
  <g class="label" text-anchor="middle">
    <text x="548" y="231">1</text><text x="588" y="231">2</text><text x="628" y="231">3</text>
    <text x="668" y="231">4</text><text x="708" y="231">5</text><text x="748" y="231">6</text>
  </g>
  <circle class="outcome" cx="548" cy="195" r="6"/><circle class="high" cx="588" cy="195" r="7"/><circle class="outcome" cx="628" cy="195" r="6"/><circle class="high" cx="668" cy="195" r="7"/><circle class="outcome" cx="708" cy="195" r="6"/><circle class="high" cx="748" cy="195" r="7"/>
  <text class="small" x="650" y="275" text-anchor="middle">X giữ lại số chấm.</text>
  <text class="title" x="650" y="335" text-anchor="middle">Biến chỉ báo B</text>
  <circle class="zero" cx="585" cy="400" r="31"/><text class="title" x="585" y="408" text-anchor="middle">0</text>
  <circle class="high" cx="715" cy="400" r="31"/><text class="title" x="715" y="408" text-anchor="middle">1</text>
  <text class="small" x="650" y="463" text-anchor="middle">B chỉ giữ câu trả lời “X chẵn?”.</text>

  <rect class="panel" x="825" y="58" width="350" height="440" rx="14"/>
  <text class="title" x="1000" y="94" text-anchor="middle">Luật phân phối</text>
  <text class="label" x="1000" y="137" text-anchor="middle">P(X=k)=1/6, k=1,…,6</text>
  <text class="label" x="1000" y="187" text-anchor="middle">P(B=1)=3/6=1/2</text>
  <text class="label" x="1000" y="225" text-anchor="middle">P(B=0)=3/6=1/2</text>
  <line x1="880" y1="360" x2="1125" y2="360" class="arrow"/>
  <rect x="930" y="300" width="44" height="60" fill="#d9ebe8" stroke="#16706a" stroke-width="2"/>
  <rect x="1032" y="300" width="44" height="60" fill="#ffe2d3" stroke="#b44b20" stroke-width="2"/>
  <text class="label" x="952" y="389" text-anchor="middle">0</text><text class="label" x="1054" y="389" text-anchor="middle">1</text>
  <text class="small" x="952" y="290" text-anchor="middle">1/2</text><text class="small" x="1054" y="290" text-anchor="middle">1/2</text>
  <text class="small" x="1000" y="445" text-anchor="middle">Phân phối tóm tắt độ bất định</text>
  <text class="small" x="1000" y="471" text-anchor="middle">trước khi quan sát kết quả.</text>
</svg>

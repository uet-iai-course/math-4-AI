<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Hessian, độ cong theo hướng và Taylor bậc hai</title>
  <desc id="desc">Đường mức elip quanh cực tiểu với hai hướng riêng của Hessian, hai lát cắt có độ cong khác nhau, và hiệu chỉnh Taylor từ 7,8 lên 7,82.</desc>
  <defs>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16706a"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b44b20"/></marker>
    <style>
      .panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.contour{fill:none;stroke:#6a45a5;stroke-width:2.5}.low{stroke:#16706a;stroke-width:4;marker-end:url(#arrowTeal)}.high{stroke:#b44b20;stroke-width:4;marker-end:url(#arrowOrange)}.curve1{fill:none;stroke:#16706a;stroke-width:4}.curve2{fill:none;stroke:#b44b20;stroke-width:4}.guide{stroke:#708096;stroke-width:1.5;stroke-dasharray:5 5}.box{fill:#fff;stroke:#8392a8;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">Hessian biến “độ cong” thành một đại lượng theo hướng</text>

  <rect class="panel" x="20" y="55" width="380" height="440" rx="14"/>
  <text class="title" x="210" y="88" text-anchor="middle">Đường mức quanh điểm dừng</text>
  <path class="contour" d="M270.1 245.1 C276.8 261.5 255.4 285.8 222.2 299.6 C189.1 313.3 156.7 311.2 149.9 294.9 C143.2 278.5 164.6 254.2 197.8 240.4 C230.9 226.7 263.3 228.8 270.1 245.1Z"/>
  <path class="contour" d="M316.2 226.0 C328.3 255.1 290.5 298.4 231.8 322.7 C173.1 347.0 115.8 343.1 103.8 314.0 C91.7 284.9 129.5 241.6 188.2 217.3 C246.9 193.0 304.2 196.9 316.2 226.0Z"/>
  <path class="contour" d="M362.4 206.9 C379.8 248.7 325.6 310.9 241.4 345.8 C157.2 380.6 74.9 375.0 57.6 333.1 C40.2 291.3 94.4 229.1 178.6 194.2 C262.8 159.4 345.1 165.0 362.4 206.9Z"/>
  <line class="low" x1="210" y1="270" x2="349" y2="212"/>
  <line class="high" x1="210" y1="270" x2="180" y2="198"/>
  <circle cx="210" cy="270" r="7" fill="#fff" stroke="#172033" stroke-width="3"/>
  <text class="label" x="210" y="405" text-anchor="middle">x* = (-6/7, 5/7)</text>
  <text class="small" x="48" y="438">hướng riêng ít cong: lambda=3-sqrt(2)</text>
  <text class="small" x="48" y="466">hướng riêng nhiều cong: lambda=3+sqrt(2)</text>

  <rect class="panel" x="420" y="55" width="350" height="440" rx="14"/>
  <text class="title" x="595" y="88" text-anchor="middle">Hai lát cắt theo hướng</text>
  <line x1="455" y1="375" x2="735" y2="375" stroke="#24324a" stroke-width="2"/>
  <line x1="595" y1="405" x2="595" y2="125" stroke="#24324a" stroke-width="2"/>
  <path class="curve1" d="M470 250 Q595 410 720 250"/>
  <path class="curve2" d="M500 180 Q595 480 690 180"/>
  <text class="label" x="455" y="402">d=e1: d^T H d=2</text>
  <text class="label" x="505" y="155">d=(1,1)/sqrt(2): d^T H d=4</text>
  <text class="label" x="742" y="382">t</text>
  <text class="label" x="568" y="120">phi(t)</text>
  <text class="small" x="595" y="428" text-anchor="middle">Cùng điểm, đổi hướng</text>
  <text class="small" x="595" y="451" text-anchor="middle">→ độ cong thay đổi.</text>
  <text class="small" x="595" y="478" text-anchor="middle">Đây không phải hai hướng riêng.</text>

  <rect class="panel" x="790" y="55" width="390" height="440" rx="14"/>
  <text class="title" x="985" y="88" text-anchor="middle">Taylor tại P=(1,2)</text>
  <rect class="box" x="830" y="120" width="310" height="70" rx="12"/>
  <text class="label" x="985" y="150" text-anchor="middle">Bậc nhất: 8 - 0,2 = 7,8</text>
  <text class="small" x="985" y="176" text-anchor="middle">mặt phẳng tiếp xúc</text>
  <line class="high" x1="985" y1="194" x2="985" y2="238"/>
  <rect class="box" x="830" y="245" width="310" height="76" rx="12"/>
  <text class="label" x="985" y="276" text-anchor="middle">Hiệu chỉnh cong: + 0,02</text>
  <text class="small" x="985" y="303" text-anchor="middle">0.5 Delta^T H Delta</text>
  <line class="high" x1="985" y1="324" x2="985" y2="364"/>
  <rect x="850" y="371" width="270" height="60" rx="12" fill="#edf8f5" stroke="#16706a" stroke-width="3"/>
  <text class="title" x="985" y="409" text-anchor="middle">Bậc hai: 7,82</text>
  <text class="small" x="985" y="460" text-anchor="middle">Chính xác ở đây vì h là đa thức bậc hai.</text>
</svg>

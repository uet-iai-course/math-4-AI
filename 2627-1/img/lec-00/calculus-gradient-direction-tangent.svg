<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Gradient, đạo hàm theo hướng và tuyến tính hóa</title>
  <desc id="desc">Khung trái vẽ ba đường mức elip của h, trong đó đường mức h bằng 8 đi qua P bằng (1, 2); gradient (5, 7) vuông góc với tiếp tuyến của đường mức tại P và gần cùng phương với hướng đơn vị d bằng (3/5, 4/5). Khung phải vẽ lát phi(t) bằng h(P cộng t Delta) cùng tiếp tuyến tại t bằng 0, cho dự đoán tuyến tính 7,8 và giá trị đúng 7,82 tại t bằng 1; độ cong được phóng đại để dễ nhìn.</desc>
  <defs>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24324a"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b44b20"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16706a"/></marker>
    <style>
      .panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.contour{fill:none;stroke:#6a45a5;stroke-width:2.5}.grad{stroke:#b44b20;stroke-width:5;marker-end:url(#arrowOrange)}.direction{stroke:#16706a;stroke-width:4;stroke-dasharray:8 4;marker-end:url(#arrowTeal)}.tangent{stroke:#b44b20;stroke-width:4}.curve{fill:none;stroke:#315d92;stroke-width:5}.guide{stroke:#708096;stroke-width:1.5;stroke-dasharray:5 5}.point{fill:white;stroke:#172033;stroke-width:3}
    .c-teal{fill:#16706a}.c-orange{fill:#b44b20}.c-purple{fill:#6a45a5}</style>
  </defs>
  <rect width="1200" height="500" fill="#f3f6fb"/>
  <text x="600" y="34" text-anchor="middle" class="title">Đạo hàm bậc nhất là hình học cục bộ</text>
  <rect class="panel" x="24" y="55" width="555" height="420" rx="14"/>
  <text x="301" y="88" text-anchor="middle" class="title">Đường mức và các hướng tại P=(1,2)</text>
  <g class="contour" transform="rotate(22.5 270 250)">
    <ellipse cx="270" cy="250" rx="169.8" ry="101.8"/>
    <ellipse cx="270" cy="250" rx="114.3" ry="68.5"/>
    <ellipse cx="270" cy="250" rx="60" ry="36"/>
  </g>
  <text class="small c-purple" x="100" y="205" text-anchor="end">h = 8</text>
  <line class="guide" x1="301.8" y1="142.1" x2="424" y2="229.3"/>
  <line class="grad" x1="362.9" y1="185.7" x2="415.2" y2="112.4"/>
  <line class="direction" x1="362.9" y1="185.7" x2="392.9" y2="145.7"/>
  <circle class="point" cx="362.9" cy="185.7" r="7"/>
  <text class="label c-orange" x="425" y="118">∇h(P) = (5, 7)</text>
  <text class="small c-teal" x="385" y="125" text-anchor="end">d = (3/5, 4/5)</text>
  <text class="small" x="80" y="390">Gradient là pháp tuyến của đường mức qua P.</text>
  <text class="label" x="80" y="420">D<tspan baseline-shift="sub" font-size="13">d</tspan>h(P) = ∇h(P)<tspan baseline-shift="super" font-size="13">T</tspan>d = 43/5</text>
  <text class="small" x="80" y="450">Mũi tên d chỉ hướng; tích vô hướng cho tốc độ thay đổi.</text>

  <rect class="panel" x="601" y="55" width="575" height="420" rx="14"/>
  <text x="889" y="88" text-anchor="middle" class="title">Tuyến tính hóa trên một lát cắt</text>
  <line x1="650" y1="390" x2="1125" y2="390" stroke="#24324a" stroke-width="2" marker-end="url(#arrowDark)"/>
  <line x1="680" y1="420" x2="680" y2="115" stroke="#24324a" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text class="label" x="1130" y="397">t</text>
  <text class="label" x="672" y="122" text-anchor="end">φ(t)</text>
  <line x1="760" y1="390" x2="760" y2="397" stroke="#24324a" stroke-width="2"/><text class="small" x="760" y="414" text-anchor="middle">0</text>
  <line x1="980" y1="390" x2="980" y2="397" stroke="#24324a" stroke-width="2"/><text class="small" x="980" y="414" text-anchor="middle">1</text>
  <text class="label" x="1150" y="135" text-anchor="end">φ(t) = h(P + tΔ), Δ = (0,1; −0,1)</text>
  <line class="tangent" x1="694" y1="167" x2="1101" y2="370.5"/>
  <polyline class="curve" points="694,164 716,176.7 738,188.7 760,200 782,210.7 804,220.7 826,230 848,238.7 870,246.8 892,254.1 914,260.8 936,266.9 958,272.3 980,277 1002,281.1 1024,284.5 1046,287.2 1068,289.3 1090,290.8 1101,291.2"/>
  <circle class="point" cx="760" cy="200" r="7"/><text class="small" x="775" y="185">φ(0) = h(P) = 8</text>
  <line class="guide" x1="980" y1="390" x2="980" y2="277"/>
  <rect x="972" y="302" width="16" height="16" fill="white" stroke="#b44b20" stroke-width="3"/>
  <circle cx="980" cy="277" r="7" fill="#315d92"/>
  <text class="small" x="994" y="268">giá trị đúng: 7,82</text>
  <text class="small" x="966" y="345" text-anchor="end">tuyến tính hóa: 7,8</text>
  <text class="label" x="889" y="438" text-anchor="middle">z = 8 + 5(u − 1) + 7(v − 2)</text>
  <text class="small" x="889" y="462" text-anchor="middle">Sai khác 0,02 là số hạng bậc hai; độ cong được phóng đại.</text>
</svg>

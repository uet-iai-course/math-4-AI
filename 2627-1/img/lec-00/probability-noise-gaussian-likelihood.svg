<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Nhiễu Gauss, phần dư và hàm hợp lý</title>
  <desc id="desc">Ba khung mô tả dữ liệu quanh đường hồi quy, quy ước phần dư bằng dự đoán trừ quan sát, xác suất 0.6827 trong khoảng một độ lệch chuẩn của Gauss, và việc cực đại hóa hợp lý tương đương cực tiểu hóa tổng bình phương sai số khi phương sai cố định.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#315d92;stroke-width:5}.resid{stroke:#b44b20;stroke-width:4;marker-end:url(#arrow)}.point{fill:#fff;stroke:#172033;stroke-width:3}.shade{fill:#ffe2d3;stroke:none}</style></defs>
  <rect width="1200" height="560" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Mô hình dự đoán phần có cấu trúc; phân phối nhiễu mô tả phần chưa biết</text>
  <rect class="panel" x="20" y="58" width="370" height="470" rx="14"/><text class="title" x="205" y="94" text-anchor="middle">Quan sát = tín hiệu + nhiễu</text>
  <line class="axis" x1="65" y1="420" x2="345" y2="420"/><line class="axis" x1="78" y1="440" x2="78" y2="125"/>
  <text class="small" x="330" y="446" text-anchor="end">đặc trưng</text><text class="small" x="48" y="140">giá</text>
  <line x1="95" y1="385" x2="335" y2="165" stroke="#315d92" stroke-width="5"/>
  <g class="point"><circle cx="115" cy="350" r="6"/><circle cx="158" cy="343" r="6"/><circle cx="202" cy="281" r="6"/><circle cx="247" cy="215" r="6"/><circle cx="292" cy="235" r="6"/><circle cx="325" cy="155" r="6"/></g>
  <line class="resid" x1="247" y1="215" x2="247" y2="246"/><text class="small" x="255" y="263">r_i=ŷ_i−y_i</text>
  <text class="small" x="205" y="472" text-anchor="middle">Dấu của r phụ thuộc quy ước;</text><text class="small" x="205" y="496" text-anchor="middle">bình phương r không phụ thuộc dấu.</text>

  <rect class="panel" x="415" y="58" width="370" height="470" rx="14"/><text class="title" x="600" y="94" text-anchor="middle">ε ~ N(0,σ²)</text>
  <line class="axis" x1="455" y1="400" x2="745" y2="400"/>
  <text class="small" x="735" y="388">e</text>
  <path class="shade" d="M525 400 C545 370 560 255 600 180 C640 255 655 370 675 400 Z"/>
  <path class="curve" d="M455 400 C500 398 520 385 540 330 C560 255 575 180 600 160 C625 180 640 255 660 330 C680 385 700 398 745 400"/>
  <line x1="525" y1="400" x2="525" y2="343" stroke="#b44b20" stroke-width="2" stroke-dasharray="6 4"/><line x1="675" y1="400" x2="675" y2="343" stroke="#b44b20" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="label" x="525" y="430" text-anchor="middle">−σ</text><text class="label" x="600" y="430" text-anchor="middle">0</text><text class="label" x="675" y="430" text-anchor="middle">+σ</text>
  <text class="title" x="600" y="286" text-anchor="middle">0.6827</text>
  <text class="small" x="600" y="472" text-anchor="middle">Khoảng ±σ chứa khoảng 68.27%</text><text class="small" x="600" y="496" text-anchor="middle">khối lượng xác suất.</text>

  <rect class="panel" x="810" y="58" width="370" height="470" rx="14"/><text class="title" x="995" y="94" text-anchor="middle">Hợp lý cực đại → SSE</text>
  <text class="label" x="995" y="153" text-anchor="middle">y_i = f(x_i;θ) + ε_i</text>
  <text class="label" x="995" y="205" text-anchor="middle">L(θ)=∏ p(y_i | x_i,θ)</text>
  <path d="M995 225 L995 270" class="axis"/>
  <text class="label" x="995" y="310" text-anchor="middle">−log L(θ) = hằng số</text>
  <text class="label" x="995" y="346" text-anchor="middle">+ (1/2σ²) Σ r_i²</text>
  <rect x="865" y="380" width="260" height="68" rx="12" fill="#eef4f3" stroke="#16706a" stroke-width="3"/>
  <text class="title" x="995" y="423" text-anchor="middle">min Σ r_i²</text>
  <text class="small" x="995" y="484" text-anchor="middle">Tương đương khi σ² cố định</text><text class="small" x="995" y="507" text-anchor="middle">và các nhiễu độc lập.</text>
</svg>

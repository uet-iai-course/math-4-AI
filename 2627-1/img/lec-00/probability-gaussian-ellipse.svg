<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Đường đồng mật độ của phân phối Gauss hai biến</title>
  <desc id="desc">Ba elip đồng tâm tại gốc tọa độ, trục dài nằm trên đường chéo g1 bằng g2, biểu diễn phân phối Gauss hai biến có trung bình 0, phương sai 1 và tương quan dương 0,8; tỉ số hai bán trục bằng 3.</desc>
  <rect width="720" height="360" fill="#f3f6fb"/>
  <line x1="70" y1="180" x2="670" y2="180" stroke="#24324a" stroke-width="4"/>
  <path d="M670 180l-16-10v20z" fill="#24324a"/>
  <line x1="390" y1="345" x2="390" y2="18" stroke="#24324a" stroke-width="4"/>
  <path d="M390 18l-10 16h20z" fill="#24324a"/>
  <g fill="none" stroke="#315d92" stroke-width="6" transform="rotate(-45 390 180)">
    <ellipse cx="390" cy="180" rx="195" ry="65"/>
    <ellipse cx="390" cy="180" rx="130" ry="43.3"/>
    <ellipse cx="390" cy="180" rx="65" ry="21.7"/>
  </g>
  <circle cx="390" cy="180" r="8" fill="#b44b20"/>
  <text x="640" y="218" font-family="sans-serif" font-size="28" fill="#24324a">g₁</text>
  <text x="404" y="40" font-family="sans-serif" font-size="28" fill="#24324a">g₂</text>
  <text x="30" y="52" font-family="sans-serif" font-size="27" font-weight="700" fill="#172033">đường đồng mật độ</text>
  <text x="560" y="300" font-family="sans-serif" font-size="27" font-weight="700" fill="#16706a">ρ = 0,8</text>
</svg>

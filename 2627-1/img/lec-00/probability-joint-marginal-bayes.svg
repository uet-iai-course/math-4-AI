<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Phân phối đồng thời, phân phối biên và công thức Bayes</title>
  <desc id="desc">Bảng xác suất đồng thời của hai biến nhị phân U và V có các ô 0.30, 0.20, 0.10 và 0.40. Tổng hàng và cột tạo phân phối biên. Điều kiện V bằng 1 chuẩn hóa cột có tổng 0.60 và cho xác suất U bằng 1 là hai phần ba, cũng thu được bằng công thức Bayes.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.cell{fill:#e9f1fb;stroke:#91a4bd;stroke-width:2}.focus{fill:#fff1e9;stroke:#b44b20;stroke-width:3}.margin{fill:#eef4f3;stroke:#16706a;stroke-width:2}.arrow{stroke:#24324a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="560" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Đồng thời giữ quan hệ; lấy biên cộng bỏ biến; điều kiện chuẩn hóa lại</text>
  <rect class="panel" x="20" y="58" width="500" height="470" rx="14"/><text class="title" x="270" y="94" text-anchor="middle">Bảng phân phối đồng thời P(U,V)</text>
  <text class="label" x="290" y="140" text-anchor="middle">V=0</text><text class="label" x="390" y="140" text-anchor="middle">V=1</text><text class="label" x="475" y="140" text-anchor="middle">P(U)</text>
  <text class="label" x="160" y="205" text-anchor="middle">U=0</text><text class="label" x="160" y="295" text-anchor="middle">U=1</text><text class="label" x="160" y="385" text-anchor="middle">P(V)</text>
  <rect class="cell" x="240" y="160" width="100" height="90"/><rect class="focus" x="340" y="160" width="100" height="90"/><rect class="cell" x="240" y="250" width="100" height="90"/><rect class="focus" x="340" y="250" width="100" height="90"/>
  <rect class="margin" x="440" y="160" width="60" height="90"/><rect class="margin" x="440" y="250" width="60" height="90"/><rect class="margin" x="240" y="340" width="100" height="80"/><rect class="margin" x="340" y="340" width="100" height="80"/>
  <g class="label" text-anchor="middle"><text x="290" y="213">0.30</text><text x="390" y="213">0.20</text><text x="290" y="303">0.10</text><text x="390" y="303">0.40</text><text x="470" y="213">0.50</text><text x="470" y="303">0.50</text><text x="290" y="388">0.40</text><text x="390" y="388">0.60</text></g>
  <text class="small" x="270" y="462" text-anchor="middle">Tổng bốn ô bằng 1; tổng hàng/cột là phân phối biên.</text>

  <path class="arrow" d="M525 280 C570 280 590 280 625 280"/>
  <rect class="panel" x="630" y="58" width="545" height="470" rx="14"/><text class="title" x="902" y="94" text-anchor="middle">Điều kiện V=1: chỉ giữ và chuẩn hóa cột</text>
  <rect class="focus" x="690" y="145" width="150" height="100"/><rect class="focus" x="690" y="245" width="150" height="100"/>
  <text class="label" x="765" y="186" text-anchor="middle">U=0: 0.20</text><text class="label" x="765" y="221" text-anchor="middle">0.20/0.60=1/3</text>
  <text class="label" x="765" y="286" text-anchor="middle">U=1: 0.40</text><text class="label" x="765" y="321" text-anchor="middle">0.40/0.60=2/3</text>
  <text class="label" x="940" y="175">P(U=1|V=1)=2/3</text>
  <text class="small" x="940" y="212">Mẫu số P(V=1)=0.60 &gt; 0.</text>
  <line x1="680" y1="385" x2="1125" y2="385" stroke="#bac5d6" stroke-width="2"/>
  <text class="title" x="902" y="423" text-anchor="middle">Cùng kết quả qua Bayes</text>
  <text class="label" x="902" y="463" text-anchor="middle">P(V=1|U=1)P(U=1) / P(V=1)</text>
  <text class="label" x="902" y="496" text-anchor="middle">= 0.8 × 0.5 / 0.6 = 2/3</text>
</svg>

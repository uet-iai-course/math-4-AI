<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Tích phân một biến và hai biến</title>
  <desc id="desc">Khung trái tô diện tích dưới đường y bằng 2x cộng 1 từ 0 đến 1. Khung phải minh họa thể tích dưới mặt z bằng x cộng y trên hình chữ nhật D bằng 0 đến 1 nhân 0 đến 2.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>
      .panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#315d92;stroke-width:5}.surface{fill:#dce9f8;fill-opacity:.8;stroke:#315d92;stroke-width:3}.strip{fill:#fff1e9;stroke:#b44b20;stroke-width:2}.guide{stroke:#708096;stroke-width:1.4;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1200" height="500" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">Tích phân cộng các phần tử vô cùng nhỏ trên một miền</text>

  <rect class="panel" x="24" y="55" width="550" height="420" rx="14"/>
  <text class="title" x="299" y="88" text-anchor="middle">Một biến: diện tích có dấu</text>
  <line class="axis" x1="92" y1="390" x2="520" y2="390"/><text class="label" x="527" y="397">x</text>
  <line class="axis" x1="110" y1="420" x2="110" y2="115"/><text class="label" x="92" y="110">ψ</text>
  <path d="M110 390 L110 310 L460 150 L460 390 Z" fill="#e9f1fb" stroke="#315d92" stroke-width="2"/>
  <line x1="180" y1="390" x2="180" y2="278" stroke="#91a4bd" stroke-width="2"/>
  <line x1="250" y1="390" x2="250" y2="246" stroke="#91a4bd" stroke-width="2"/>
  <line x1="320" y1="390" x2="320" y2="214" stroke="#91a4bd" stroke-width="2"/>
  <line x1="390" y1="390" x2="390" y2="182" stroke="#91a4bd" stroke-width="2"/>
  <line class="curve" x1="110" y1="310" x2="460" y2="150"/>
  <line class="guide" x1="460" y1="150" x2="460" y2="390"/>
  <line x1="104" y1="310" x2="110" y2="310" stroke="#24324a" stroke-width="2"/><line x1="104" y1="150" x2="110" y2="150" stroke="#24324a" stroke-width="2"/>
  <text class="small" x="104" y="414" text-anchor="end">0</text><text class="small" x="460" y="414" text-anchor="middle">1</text>
  <text class="small" x="96" y="316" text-anchor="end">1</text><text class="small" x="96" y="156" text-anchor="end">3</text>
  <text class="label" x="300" y="160">ψ(x) = 2x + 1</text>
  <text class="title" x="299" y="452" text-anchor="middle">Tích phân trên [0,1] của (2x+1) bằng 2</text>

  <rect class="panel" x="598" y="55" width="578" height="420" rx="14"/>
  <text class="title" x="887" y="88" text-anchor="middle">Hai biến: thể tích trên miền D</text>
  <polygon points="680,375 925,375 1080,300 835,300" fill="#e9f1fb" stroke="#315d92" stroke-width="1.5"/>
  <polygon points="807.4,375 962.4,300 962.4,136.2 807.4,341.2" fill="#fff1e9" stroke="#b44b20" stroke-width="2"/>
  <polygon points="925,375 1080,300 1080,105 925,310" fill="#dce9f8" fill-opacity=".45" stroke="#315d92" stroke-width="2"/>
  <polygon class="surface" points="680,375 925,310 1080,105 835,170" fill-opacity=".6"/>
  <polygon points="778,349 933,144 962.4,136.2 807.4,341.2" fill="#f6c9ae" stroke="#b44b20" stroke-width="2"/>
  <line x1="835" y1="300" x2="835" y2="170" stroke="#315d92" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line class="axis" x1="680" y1="375" x2="950" y2="375"/><text class="label" x="956" y="382">x</text>
  <line class="axis" x1="680" y1="375" x2="850" y2="293"/>
  <text class="label" x="856" y="292">y</text>
  <line class="axis" x1="680" y1="375" x2="680" y2="250"/><text class="label" x="664" y="252">z</text>
  <text class="label" x="1088" y="140">z = x + y</text>
  <line x1="740" y1="146" x2="868" y2="242" stroke="#b44b20" stroke-width="1.5"/>
  <text class="small" x="612" y="140">lát x cố định, cộng theo y</text>
  <text class="label" x="887" y="423" text-anchor="middle">D = [0, 1] × [0, 2]</text>
  <text class="title" x="887" y="452" text-anchor="middle">Tích phân kép của (x+y) trên D bằng 3</text>
</svg>

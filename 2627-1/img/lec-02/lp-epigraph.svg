<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc"><title id="title">Biến phụ chặn giá trị tuyệt đối</title><desc id="desc">Miền tô gồm các điểm (r,t) thỏa t lớn hơn hoặc bằng trị tuyệt đối của r. Giao của hai nửa không gian t&gt;=r và t&gt;=-r tạo miền phía trên chữ V.</desc><rect width="600" height="400" fill="white"/><polygon points="75,93.5714 310,325 545,93.5714 545,55 75,55" fill="#E8ECF8" opacity="1"/><line x1="75" y1="93.5714" x2="310" y2="325" stroke="#2F3E7A" stroke-width="4"/><line x1="310" y1="325" x2="545" y2="93.5714" stroke="#2F3E7A" stroke-width="4"/><line x1="75" y1="325" x2="545" y2="325" stroke="#555" stroke-width="2"/><line x1="75" y1="325" x2="75" y2="55" stroke="#555" stroke-width="2"/><text x="75" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">-3</text><text x="310" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">0</text><text x="545" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">3</text><text x="63" y="333" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">0</text><text x="63" y="255.857" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">1</text><text x="63" y="178.714" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">2</text><text x="63" y="101.571" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">3</text><text x="547" y="392" fill="#555" text-anchor="end" font-family="sans-serif" font-size="27">r</text><text x="75" y="29" fill="#555" text-anchor="start" font-family="sans-serif" font-size="27">t</text><text x="305" y="90" fill="#2F3E7A" text-anchor="middle" font-family="sans-serif" font-size="27">t ≥ |r|</text><text x="166" y="236" fill="#2F3E7A" text-anchor="start" font-family="sans-serif" font-size="27">t = −r</text><text x="405" y="236" fill="#2F3E7A" text-anchor="start" font-family="sans-serif" font-size="27">t = r</text></svg>
  <path class="quad" d="M675.0 219.8 L686.8 219.9 L698.5 220.0 L710.2 220.2 L721.9 220.4 L733.6 220.8 L745.3 221.2 L756.8 221.7 L768.4 222.2 L779.8 222.9 L791.2 223.6 L802.6 224.4 L813.8 225.3 L824.9 226.2 L836.0 227.2 L846.9 228.3 L857.7 229.4 L868.4 230.6 L878.9 231.9 L889.3 233.3 L899.6 234.7 L909.7 236.2 L919.6 237.8 L929.4 239.4 L939.0 241.0 L948.4 242.8 L957.6 244.6 L966.7 246.5 L975.5 248.4 L984.2 250.3 L992.6 252.4 L1000.8 254.5 L1008.8 256.6 L1016.5 258.8 L1024.0 261.0 L1031.3 263.3 L1038.4 265.6 L1045.1 268.0 L1051.7 270.4 L1057.9 272.9 L1064.0 275.4 L1069.7 277.9 L1075.2 280.5 L1080.4 283.1 L1085.3 285.8 L1089.9 288.5 L1094.3 291.2 L1098.4 293.9 L1102.2 296.6 L1105.6 299.4 L1108.8 302.2 L1111.7 305.0 L1114.3 307.9 L1116.6 310.7 L1118.6 313.6 L1120.3 316.5 L1121.7 319.4 L1122.7 322.3 L1123.5 325.2 L1124.0 328.1 L1124.1 331.0" opacity=".65"/>
  <circle class="point" cx="1003" cy="290" r="7"/><text class="label" x="988" y="314" text-anchor="end">(0,8; 0,2)</text>
  <text class="small" x="895" y="360" text-anchor="middle">min x₁² + 4x₂² trên x₁ + x₂ = 1, x ≥ 0</text>

  <rect class="panel" x="22" y="404" width="566" height="324" rx="14"/><text class="head" x="305" y="437" text-anchor="middle">QCQP lồi: một tập mức bậc hai lồi</text>
  <circle cx="245" cy="610" r="90" fill="#dcecfb" stroke="#315d92" stroke-width="4"/>
  <line class="axis" x1="65" y1="610" x2="555" y2="610"/><line class="axis" x1="245" y1="700" x2="245" y2="462"/>
  <line class="level" x1="233.6" y1="471.4" x2="403.6" y2="641.4"/>
  <circle class="point" cx="308.6" cy="546.4" r="7"/><text class="small" x="322.6" y="534.4">(1/√2; 1/√2)</text>
  <text class="small" x="305" y="716" text-anchor="middle">min −x₁−x₂;  x₁²+x₂² ≤ 1</text>

  <rect class="panel" x="612" y="404" width="566" height="324" rx="14"/><text class="head" x="895" y="437" text-anchor="middle">QCQP không lồi: trung điểm ra ngoài tập</text>
  <path d="M652 492.5 L972.8 492.5 L966.2 497.7 L959.8 502.9 L953.6 508.0 L947.5 513.2 L941.7 518.4 L936.1 523.5 L930.7 528.7 L925.6 533.9 L920.7 539.1 L916.2 544.2 L912.0 549.4 L908.1 554.6 L904.6 559.8 L901.6 565.0 L898.9 570.1 L896.7 575.3 L895.0 580.5 L893.7 585.6 L893.0 590.8 L892.7 596.0 L893.0 601.2 L893.7 606.4 L895.0 611.5 L896.7 616.7 L898.9 621.9 L901.6 627.0 L904.6 632.2 L908.1 637.4 L912.0 642.6 L916.2 647.8 L920.7 652.9 L925.6 658.1 L930.7 663.3 L936.1 668.4 L941.7 673.6 L947.5 678.8 L953.6 684.0 L959.8 689.1 L966.2 694.3 L972.8 699.5 L652 699.5 Z" fill="#fff1ec" opacity=".9"/>
  <line class="axis" x1="652" y1="596" x2="1142" y2="596"/><line class="axis" x1="740" y1="700" x2="740" y2="466"/>
  <path class="boundary" d="M972.8 492.5 L966.2 497.7 L959.8 502.9 L953.6 508.0 L947.5 513.2 L941.7 518.4 L936.1 523.5 L930.7 528.7 L925.6 533.9 L920.7 539.1 L916.2 544.2 L912.0 549.4 L908.1 554.6 L904.6 559.8 L901.6 565.0 L898.9 570.1 L896.7 575.3 L895.0 580.5 L893.7 585.6 L893.0 590.8 L892.7 596.0 L893.0 601.2 L893.7 606.4 L895.0 611.5 L896.7 616.7 L898.9 621.9 L901.6 627.0 L904.6 632.2 L908.1 637.4 L912.0 642.6 L916.2 647.8 L920.7 652.9 L925.6 658.1 L930.7 663.3 L936.1 668.4 L941.7 673.6 L947.5 678.8 L953.6 684.0 L959.8 689.1 L966.2 694.3 L972.8 699.5"/>
  <line class="chord" x1="956" y1="506" x2="956" y2="686"/>
  <circle class="point" cx="956" cy="506" r="7"/><circle class="point" cx="956" cy="686" r="7"/><circle cx="956" cy="596" r="8" fill="#fff" stroke="#b44b20" stroke-width="4"/>
  <text class="small" x="985" y="500">a = (√2; 1)</text><text class="small" x="985" y="692">b = (√2; −1)</text>
  <text class="small" x="970" y="584">(a+b)/2 không khả thi</text>
  <text class="small" x="895" y="716" text-anchor="middle">x₁² − x₂² ≤ 1;  diag(1, −1) không nửa xác định dương</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Hình học của LP, QP, QCQP lồi và phản ví dụ bất định</title>
  <desc id="desc">Bốn khung so sánh đường mức affine tiếp xúc một đa diện không bị chặn tại một đỉnh, đường mức elip x một bình phương cộng 4 x hai bình phương bằng 0,8 tiếp xúc đoạn đơn hình tại (0,8; 0,2), một đĩa tròn tạo bởi ràng buộc bậc hai lồi, và tập bậc hai bất định có hai điểm khả thi nhưng trung điểm không khả thi.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 5L0 10Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.head{font-family:"DejaVu Sans";font-size:22px;font-weight:700;fill:#172033}.label{font-family:"DejaVu Sans";font-size:17px;fill:#24324a}.small{font-family:"DejaVu Sans";font-size:15px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.level{stroke:#b44b20;stroke-width:3;stroke-dasharray:9 6}.boundary{fill:none;stroke:#315d92;stroke-width:4}.feasible{fill:#dcecfb;stroke:#315d92;stroke-width:3}.quad{fill:none;stroke:#6a45a5;stroke-width:3}.point{fill:#fff8e6;stroke:#16706a;stroke-width:4}.bad{fill:#fff1ec;stroke:#b44b20;stroke-width:3}.chord{stroke:#16706a;stroke-width:3;stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1200" height="760" fill="#f3f6fb"/><text class="head" x="600" y="36" text-anchor="middle">Hình học nhận dạng của LP, QP và QCQP</text>

  <rect class="panel" x="22" y="58" width="566" height="324" rx="14"/><text class="head" x="305" y="91" text-anchor="middle">LP: đường mức tiếp xúc đa diện</text>
  <path class="feasible" d="M82 122 L538 122 L538 331 L355 331 Z" opacity="0.82" style="stroke:none"/>
  <line class="axis" x1="72" y1="331" x2="560" y2="331"/><line class="axis" x1="82" y1="350" x2="82" y2="110"/>
  <line class="boundary" x1="82" y1="122" x2="355" y2="331"/>
  <line class="level" x1="82" y1="156.8" x2="537" y2="331"/><line class="level" x1="82" y1="226.5" x2="355" y2="331"/>
  <circle class="point" cx="355" cy="331" r="7"/><text class="label" x="366" y="320">x*</text>
  <text class="small" x="302" y="360" text-anchor="middle">min x₁ + 2x₂;  x₁ + x₂ ≥ 3;  x ≥ 0;  x* = (3; 0)</text>
  <text class="small" x="522" y="145" text-anchor="end">tập khả thi kéo dài</text>

  <rect class="panel" x="612" y="58" width="566" height="324" rx="14"/><text class="head" x="895" y="91" text-anchor="middle">QP: elip tiếp xúc đoạn đơn hình</text>
  <line class="axis" x1="658" y1="331" x2="1135" y2="331"/><line class="axis" x1="675" y1="350" x2="675" y2="115"/>
  <line class="boundary" x1="675" y1="128" x2="1085" y2="331"/>

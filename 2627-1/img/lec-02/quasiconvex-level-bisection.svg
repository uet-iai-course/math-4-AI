<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Tập mức dưới và phép chia đôi giá trị mục tiêu</title>
  <desc id="desc">Đồ thị hàm x bình cộng một chia x cộng hai trên đoạn từ không đến hai. Mức không phẩy năm tạo tập mức dưới từ không đến không phẩy năm; các mức không phẩy hai năm và không phẩy ba bảy năm không khả thi. Ba bước chia đôi thu hẹp khoảng chứa giá trị tối ưu về không phẩy ba bảy năm đến không phẩy năm.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.head{font-family:"DejaVu Sans";font-size:24px;font-weight:700;fill:#172033}.label{font-family:"DejaVu Sans";font-size:18px;fill:#24324a}.small{font-family:"DejaVu Sans";font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#315d92;stroke-width:5}.level{stroke:#b44b20;stroke-width:3;stroke-dasharray:9 7}.level2{stroke:#6a45a5;stroke-width:2;stroke-dasharray:6 6}.projection{fill:#dcecfb;stroke:#315d92;stroke-width:2}.point{fill:#fff8e6;stroke:#16706a;stroke-width:4}.bar{stroke:#9aa7b8;stroke-width:12;stroke-linecap:round}.keep{stroke:#16706a;stroke-width:12;stroke-linecap:round}.cut{stroke:#b44b20;stroke-width:3}.yes{fill:#e9f6f0;stroke:#16706a;stroke-width:2}.no{fill:#fff1ec;stroke:#b44b20;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="650" fill="#f3f6fb"/><text class="head" x="600" y="38" text-anchor="middle">Tối ưu tựa lồi bằng chuỗi câu hỏi khả thi</text>
  <rect class="panel" x="24" y="62" width="660" height="550" rx="14"/><text class="head" x="354" y="99" text-anchor="middle">Tập mức dưới của f(x) = (x² + 1)/(x + 2)</text>
  <line class="axis" x1="82" y1="500" x2="638" y2="500"/><line class="axis" x1="98" y1="530" x2="98" y2="132"/>
  <text class="label" x="645" y="521">x</text><text class="label" x="78" y="138">f(x)</text>
  <!-- x: 0..2 maps 110..610; y: .2..1.4 maps 480..150 -->
  <path class="curve" d="M110 397 C132 402 151 406 169 405 C190 404 215 400 235 397 C310 374 360 340 410 310 C490 249 555 196 610 150"/>
  <line class="level" x1="98" y1="397" x2="638" y2="397"/><text class="label" x="624" y="386" text-anchor="end">t = 0,5</text>
  <line class="level2" x1="98" y1="431" x2="638" y2="431"/><text class="small" x="624" y="452" text-anchor="end">t = 0,375: rỗng</text>
  <line class="level2" x1="98" y1="465" x2="638" y2="465"/><text class="small" x="400" y="484">t = 0,25: rỗng</text>
  <rect class="projection" x="110" y="505" width="125" height="22" rx="8"/><text class="small" x="172" y="554" text-anchor="middle">S₀,₅ = [0; 0,5]</text>
  <line class="guide" x1="110" y1="397" x2="110" y2="505" stroke="#8b98aa" stroke-dasharray="6 5"/><line x1="235" y1="397" x2="235" y2="505" stroke="#8b98aa" stroke-width="2" stroke-dasharray="6 5"/>
  <circle class="point" cx="169" cy="405" r="8"/><line x1="176" y1="398" x2="270" y2="342" stroke="#16706a" stroke-width="2"/>
  <rect x="270" y="274" width="300" height="68" rx="10" fill="#e9f6f0" stroke="#16706a" stroke-width="2"/>
  <text class="small" x="285" y="300">x* = √5 − 2 ≈ 0,236</text>
  <text class="small" x="285" y="327">p* = 2√5 − 4 ≈ 0,472</text>
  <text class="small" x="110" y="523" text-anchor="middle">0</text><text class="small" x="235" y="523" text-anchor="middle">0,5</text><text class="small" x="610" y="523" text-anchor="middle">2</text>

  <rect class="panel" x="708" y="62" width="468" height="550" rx="14"/><text class="head" x="942" y="99" text-anchor="middle">Ba bước chia đôi</text>
  <text class="small" x="748" y="134">Khoảng ban đầu chứa p*: [0; 1]</text>
  <g transform="translate(0 0)">
    <rect class="yes" x="740" y="156" width="404" height="105" rx="12"/><text class="label" x="760" y="184">Bước 1: t = 0,5 — khả thi</text>
    <line class="bar" x1="770" y1="220" x2="1115" y2="220"/><line class="keep" x1="770" y1="220" x2="942" y2="220"/><line class="cut" x1="942" y1="204" x2="942" y2="236"/>
    <text class="small" x="770" y="248" text-anchor="middle">0</text><text class="small" x="942" y="248" text-anchor="middle">0,5</text><text class="small" x="1115" y="248" text-anchor="middle">1</text>
  </g>
  <rect class="no" x="740" y="281" width="404" height="105" rx="12"/><text class="label" x="760" y="309">Bước 2: t = 0,25 — không khả thi</text>
  <line class="bar" x1="770" y1="345" x2="1115" y2="345"/><line class="keep" x1="942" y1="345" x2="1115" y2="345"/><line class="cut" x1="942" y1="329" x2="942" y2="361"/>
  <text class="small" x="770" y="373" text-anchor="middle">0</text><text class="small" x="942" y="373" text-anchor="middle">0,25</text><text class="small" x="1115" y="373" text-anchor="middle">0,5</text>
  <rect class="no" x="740" y="406" width="404" height="105" rx="12"/><text class="label" x="760" y="434">Bước 3: t = 0,375 — không khả thi</text>
  <line class="bar" x1="770" y1="470" x2="1115" y2="470"/><line class="keep" x1="1030" y1="470" x2="1115" y2="470"/><line class="cut" x1="1030" y1="454" x2="1030" y2="486"/>
  <text class="small" x="770" y="498" text-anchor="middle">0,25</text><text class="small" x="1030" y="498" text-anchor="middle">0,375</text><text class="small" x="1115" y="498" text-anchor="middle">0,5</text>
  <rect class="yes" x="784" y="535" width="316" height="50" rx="12"/><text class="label" x="942" y="567" text-anchor="middle">p* ∈ [0,375; 0,5]</text>
</svg>

<g font-family="sans-serif" font-size="26" text-anchor="middle" fill="#2F3E7A"><text x="102" y="118">Phát 1</text><text x="102" y="318">Phát 2</text><text x="530" y="118">Thu 1</text><text x="530" y="318">Thu 2</text><text x="310" y="95">G₁₁ = 1</text><text x="310" y="350">G₂₂ = 1</text></g>
<g font-family="sans-serif" font-size="23" fill="#B15A2B"><text x="350" y="190">G₁₂ = 1/4</text><text x="158" y="178">G₂₁ = 3/2</text><text x="133" y="407">Nét đứt: nhiễu giữa hai đường</text></g></svg>
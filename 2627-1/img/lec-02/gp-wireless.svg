<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="t d"><title id="t">Hai đường truyền cùng kênh</title><desc id="d">Bộ phát1 tới bộ thu1 và bộ phát2 tới bộ thu2 có hệ số1; phát2 gây nhiễu thu1 với hệ số1/4; phát1 gây nhiễu thu2 với hệ số3/2. Mỗi bộ thu có tạp âm1.</desc><rect width="640" height="430" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#2F3E7A"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#B15A2B"/></marker></defs>
<g stroke="#2F3E7A" stroke-width="3" marker-end="url(#a)"><path d="M170 110H455"/><path d="M170 310H455"/></g>
<g stroke="#B15A2B" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#b)" fill="none"><path d="M170 130L455 290"/><path d="M170 290L455 130"/></g>

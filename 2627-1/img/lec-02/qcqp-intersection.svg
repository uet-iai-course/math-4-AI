<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Giao của elip và đĩa: miền khả thi QCQP</title><desc id="desc">Elip x một bình phương chia 4 cộng x hai bình phương không vượt quá 1 (nét liền) và đĩa tâm (1; 1) bán kính căn 2 (nét đứt). Phần giao tô màu là miền khả thi của QCQP lồi, chứa điểm (0,8; 0,7).</desc>
<rect width="600" height="420" fill="#fff"/>
<defs><clipPath id="ell"><ellipse cx="207.5" cy="263.0" rx="125.0" ry="62.5"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#333"/></marker></defs>
<g font-family="Arial,sans-serif" font-size="24" fill="#222">
<circle cx="270.0" cy="200.5" r="88.39" fill="#edf6ef" stroke="none" clip-path="url(#ell)"/>
<line x1="60.0" y1="263.0" x2="392.0" y2="263.0" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="207.5" y1="348.0" x2="207.5" y2="40.0" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<text x="398.00" y="271.00" text-anchor="start" fill="#222" font-size="24">x₁</text>
<text x="219.5" y="44.00" text-anchor="start" fill="#222" font-size="24">x₂</text>
<line x1="82.5" y1="258.0" x2="82.5" y2="268.0" stroke="#333" stroke-width="2"/>
<line x1="145.0" y1="258.0" x2="145.0" y2="268.0" stroke="#333" stroke-width="2"/>
<line x1="270.0" y1="258.0" x2="270.0" y2="268.0" stroke="#333" stroke-width="2"/>
<line x1="332.5" y1="258.0" x2="332.5" y2="268.0" stroke="#333" stroke-width="2"/>
<line x1="202.5" y1="325.5" x2="212.5" y2="325.5" stroke="#333" stroke-width="2"/>
<line x1="202.5" y1="200.5" x2="212.5" y2="200.5" stroke="#333" stroke-width="2"/>
<line x1="202.5" y1="138.0" x2="212.5" y2="138.0" stroke="#333" stroke-width="2"/>
<text x="78.5" y="285.0" text-anchor="end" fill="#222" font-size="20">−2</text><text x="145.0" y="287.0" text-anchor="middle" fill="#222" font-size="20">−1</text><text x="336.5" y="285.0" text-anchor="start" fill="#222" font-size="20">2</text><text x="215.5" y="192.5" text-anchor="start" fill="#222" font-size="20">1</text><text x="197.5" y="134.0" text-anchor="end" fill="#222" font-size="20">2</text><text x="215.5" y="345.5" text-anchor="start" fill="#222" font-size="20">−1</text>
<ellipse cx="207.5" cy="263.0" rx="125.0" ry="62.5" fill="none" stroke="#2f3e7a" stroke-width="3"/>
<circle cx="270.0" cy="200.5" r="88.39" fill="none" stroke="#b15a2b" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="257.5" cy="219.2" r="6" fill="#28664b" stroke="#fff" stroke-width="2"/>
<text x="279.4" y="241.1" text-anchor="middle" fill="#28664b" font-size="20">khả thi</text>
<text x="60.0" y="378.0" text-anchor="start" fill="#2f3e7a" font-size="20">x₁²/4 + x₂² ≤ 1</text>
<text x="316.9" y="116.1" text-anchor="start" fill="#b15a2b" font-size="20">(x₁−1)² + (x₂−1)² ≤ 2</text>
<text x="300.00" y="406.00" text-anchor="middle" fill="#222" font-size="22">Elip nét liền; đĩa nét đứt; điểm (0,8; 0,7)</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Biên Pareto và vô hướng hóa bằng trọng số</title>
  <desc id="desc">Đoạn tham số từ không đến hai được ánh xạ thành đường đánh đổi giữa hai mục tiêu. Mọi điểm trên đường là Pareto; các đường mức trọng số chọn những tiếp điểm khác nhau. Một ví dụ rời rạc cho thấy điểm ba ba bị điểm hai hai trội.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#b9c5d6;stroke-width:3}.title{font-family:DejaVu Sans;font-size:28px;font-weight:700;fill:#172033}.head{font-family:DejaVu Sans;font-size:22px;font-weight:700;fill:#2f3e7a}.txt{font-family:DejaVu Sans;font-size:18px;fill:#24324a}.small{font-family:DejaVu Sans;font-size:16px;fill:#44516a}.tiny{font-family:DejaVu Sans;font-size:14px;fill:#44516a}.axis{stroke:#24324a;stroke-width:3;marker-end:url(#arr)}.front{fill:none;stroke:#315d92;stroke-width:6}.support{stroke:#b15a2b;stroke-width:3;stroke-dasharray:9 6}.pt{fill:#2e7d32;stroke:#fff;stroke-width:2}.dom{fill:#f7e8df;stroke:#b15a2b;stroke-width:2}</style></defs>
  <rect width="1200" height="650" fill="#f3f6fb"/><text class="title" x="600" y="42" text-anchor="middle">Nhiều mục tiêu: loại điểm bị trội, rồi mới chọn đánh đổi</text>
  <rect class="panel" x="25" y="70" width="350" height="535" rx="18"/><text class="head" x="200" y="108" text-anchor="middle">Ánh xạ mục tiêu</text>
  <line class="axis" x1="75" y1="230" x2="325" y2="230"/><circle class="pt" cx="75" cy="230" r="9"/><circle class="pt" cx="200" cy="230" r="9"/><circle class="pt" cx="325" cy="230" r="9"/><text class="small" x="75" y="260" text-anchor="middle">x=0</text><text class="small" x="200" y="260" text-anchor="middle">x=1</text><text class="small" x="325" y="260" text-anchor="middle">x=2</text>
  <line class="axis" x1="200" y1="280" x2="200" y2="345"/><text class="txt" x="220" y="320">Φ(x)=(x²,(x−2)²)</text>
  <rect x="65" y="370" width="270" height="150" rx="14" fill="#edf4ff" stroke="#315d92" stroke-width="3"/><text class="txt" x="200" y="410" text-anchor="middle">x=0 → (0,4)</text><text class="txt" x="200" y="450" text-anchor="middle">x=1 → (1,1)</text><text class="txt" x="200" y="490" text-anchor="middle">x=2 → (4,0)</text>
  <text class="tiny" x="200" y="560" text-anchor="middle">Giảm một mục tiêu làm tăng mục tiêu kia.</text>

  <rect class="panel" x="400" y="70" width="470" height="535" rx="18"/><text class="head" x="635" y="108" text-anchor="middle">Biên Pareto trong không gian mục tiêu</text>
  <g transform="translate(455,555)"><line class="axis" x1="0" y1="0" x2="355" y2="0"/><line class="axis" x1="0" y1="0" x2="0" y2="-400"/><text class="small" x="275" y="-12">Mục tiêu 1</text><text class="small" x="-28" y="-405">Mục tiêu 2</text>
    <path class="front" d="M15 -370 C65 -245 160 -120 330 -15"/>
    <line class="support" x1="20" y1="-225" x2="220" y2="-425"/><line class="support" x1="60" y1="-70" x2="310" y2="-320"/><line class="support" x1="170" y1="-25" x2="355" y2="-210"/>
    <circle class="pt" cx="55" cy="-285" r="8"/><circle class="pt" cx="150" cy="-155" r="8"/><circle class="pt" cx="260" cy="-55" r="8"/>
    <path class="dom" d="M165 -155 L335 -155 L335 -325 L165 -325 Z" opacity=".55"/><text class="small" x="250" y="-300" text-anchor="middle">vùng bị (1,1) trội</text>
  </g>
  <text class="tiny" x="635" y="582" text-anchor="middle">Đường mức trọng số tiếp xúc tại một điểm được hỗ trợ.</text>

  <rect class="panel" x="895" y="70" width="280" height="535" rx="18"/><text class="head" x="1035" y="108" text-anchor="middle">Kiểm tra quan hệ trội</text>
  <g transform="translate(930,390)"><line class="axis" x1="0" y1="0" x2="205" y2="0"/><line class="axis" x1="0" y1="0" x2="0" y2="-225"/>
    <circle class="pt" cx="45" cy="-180" r="9"/><text class="small" x="55" y="-190">(1,4)</text><circle class="pt" cx="90" cy="-90" r="9"/><text class="small" x="100" y="-100">(2,2)</text><circle class="pt" cx="180" cy="-45" r="9"/><text class="small" x="125" y="-25">(4,1)</text><circle class="dom" cx="135" cy="-135" r="9"/><text class="small" x="145" y="-145">(3,3)</text>
    <line x1="132" y1="-132" x2="96" y2="-96" stroke="#b15a2b" stroke-width="3" marker-end="url(#arr)"/>
  </g>
  <text class="txt" x="1035" y="445" text-anchor="middle">(2,2) trội (3,3)</text><text class="small" x="1035" y="482" text-anchor="middle">vì cả hai tọa độ đều nhỏ hơn.</text>
  <rect x="930" y="515" width="210" height="58" rx="12" fill="#e6f3ec" stroke="#2e7d32" stroke-width="3"/><text class="tiny" x="1035" y="542" text-anchor="middle">Ba điểm còn lại</text><text class="tiny" x="1035" y="560" text-anchor="middle">không bị trội</text>
</svg>

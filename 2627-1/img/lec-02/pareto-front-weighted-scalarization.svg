<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Biên Pareto và vô hướng hóa bằng trọng số</title>
  <desc id="desc">Đoạn tham số từ không đến hai được ánh xạ qua Φ của x bằng (x bình phương, (x trừ 2) bình phương) thành đường đánh đổi lồi từ (0, 4) qua (1, 1) tới (4, 0). Mọi điểm trên đường là Pareto; mỗi đường mức của tổng có trọng số w một Φ một cộng w hai Φ hai tiếp xúc biên tại một điểm khác nhau, ứng với x bằng 0,5; 1 và 1,5. Một ví dụ rời rạc cho thấy điểm ba ba bị điểm hai hai trội.</desc>
  <defs><marker id="arr" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L16 6L0 12Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#b9c5d6;stroke-width:3}.title{font-family:DejaVu Sans;font-size:28px;font-weight:700;fill:#172033}.head{font-family:DejaVu Sans;font-size:22px;font-weight:700;fill:#2f3e7a}.txt{font-family:DejaVu Sans;font-size:18px;fill:#24324a}.small{font-family:DejaVu Sans;font-size:16px;fill:#44516a}.tiny{font-family:DejaVu Sans;font-size:14px;fill:#44516a}.axis{stroke:#24324a;stroke-width:3;marker-end:url(#arr)}.front{fill:none;stroke:#315d92;stroke-width:4}.support{stroke:#b15a2b;stroke-width:2.5;stroke-dasharray:8 5}.pt{fill:#2e7d32;stroke:#fff;stroke-width:2}.dom{fill:#f7e8df;stroke:#b15a2b;stroke-width:2}</style></defs>
  <rect width="1200" height="650" fill="#f3f6fb"/><text class="title" x="600" y="42" text-anchor="middle">Bài toán hai mục tiêu: biên Pareto và vô hướng hóa</text>
  <rect class="panel" x="25" y="70" width="350" height="535" rx="18"/><text class="head" x="200" y="108" text-anchor="middle">Ánh xạ mục tiêu</text>
  <line class="axis" x1="75" y1="230" x2="360" y2="230"/><circle class="pt" cx="75" cy="230" r="9"/><circle class="pt" cx="200" cy="230" r="9"/><circle class="pt" cx="325" cy="230" r="9"/><text class="small" x="75" y="260" text-anchor="middle">x=0</text><text class="small" x="200" y="260" text-anchor="middle">x=1</text><text class="small" x="325" y="260" text-anchor="middle">x=2</text>
  <line class="axis" x1="200" y1="280" x2="200" y2="345"/><text class="txt" x="220" y="320">Φ(x)=(x²,(x−2)²)</text>
  <rect x="65" y="370" width="270" height="150" rx="14" fill="#edf4ff" stroke="#315d92" stroke-width="3"/><text class="txt" x="200" y="410" text-anchor="middle">x=0 → (0,4)</text><text class="txt" x="200" y="450" text-anchor="middle">x=1 → (1,1)</text><text class="txt" x="200" y="490" text-anchor="middle">x=2 → (4,0)</text>
  <text class="tiny" x="200" y="560" text-anchor="middle">Giảm một mục tiêu làm tăng mục tiêu kia.</text>

  <rect class="panel" x="400" y="70" width="470" height="535" rx="18"/><text class="head" x="635" y="108" text-anchor="middle">Biên Pareto và trọng số</text>
  <g transform="translate(455,530)"><line class="axis" x1="0" y1="0" x2="355" y2="0"/><line class="axis" x1="0" y1="0" x2="0" y2="-360"/><text class="txt" x="362" y="6">Φ₁</text><text class="txt" x="12" y="-354">Φ₂</text>
    <text class="small" x="80" y="22" text-anchor="middle">1</text><text class="small" x="320" y="22" text-anchor="middle">4</text><text class="small" x="-8" y="-75" text-anchor="end">1</text><text class="small" x="-8" y="-315" text-anchor="end">4</text>
    <path class="dom" d="M80 -80 L335 -80 L335 -330 L80 -330 Z" opacity=".55"/><text class="small" x="210" y="-300" text-anchor="middle">vùng bị (1,1) trội</text>
    <path class="front" d="M0.0 -320.0 L0.1 -312.1 L0.2 -304.2 L0.4 -296.5 L0.8 -288.8 L1.2 -281.2 L1.8 -273.8 L2.4 -266.4 L3.2 -259.2 L4.1 -252.0 L5.0 -245.0 L6.1 -238.1 L7.2 -231.2 L8.5 -224.4 L9.8 -217.8 L11.2 -211.2 L12.8 -204.8 L14.4 -198.4 L16.2 -192.2 L18.1 -186.0 L20.0 -180.0 L22.1 -174.1 L24.2 -168.2 L26.4 -162.5 L28.8 -156.8 L31.2 -151.2 L33.8 -145.8 L36.5 -140.4 L39.2 -135.2 L42.0 -130.0 L45.0 -125.0 L48.1 -120.1 L51.2 -115.2 L54.4 -110.5 L57.8 -105.8 L61.2 -101.2 L64.8 -96.8 L68.5 -92.4 L72.2 -88.2 L76.0 -84.0 L80.0 -80.0 L84.0 -76.1 L88.2 -72.2 L92.4 -68.5 L96.8 -64.8 L101.2 -61.2 L105.8 -57.8 L110.5 -54.4 L115.2 -51.2 L120.1 -48.0 L125.0 -45.0 L130.0 -42.1 L135.2 -39.2 L140.4 -36.5 L145.8 -33.8 L151.2 -31.2 L156.8 -28.8 L162.5 -26.4 L168.2 -24.2 L174.1 -22.0 L180.0 -20.0 L186.0 -18.1 L192.2 -16.2 L198.4 -14.5 L204.8 -12.8 L211.2 -11.2 L217.8 -9.8 L224.4 -8.4 L231.2 -7.2 L238.1 -6.0 L245.0 -5.0 L252.0 -4.1 L259.2 -3.2 L266.4 -2.5 L273.8 -1.8 L281.2 -1.2 L288.8 -0.8 L296.5 -0.4 L304.2 -0.2 L312.1 -0.0 L320.0 -0.0"/>
    <line class="support" x1="0" y1="-240" x2="80" y2="0"/>
    <line class="support" x1="0" y1="-160" x2="160" y2="0"/>
    <line class="support" x1="0" y1="-80" x2="240" y2="0"/>
    <circle class="pt" cx="20" cy="-180" r="8"/>
    <circle class="pt" cx="80" cy="-80" r="8"/><text class="small" x="92" y="-92">(1,1)</text>
    <circle class="pt" cx="180" cy="-20" r="8"/>
  </g>
  <text class="tiny" x="635" y="582" text-anchor="middle">Mỗi đường w₁Φ₁ + w₂Φ₂ = c tiếp xúc biên tại một điểm.</text>

  <rect class="panel" x="895" y="70" width="280" height="535" rx="18"/><text class="head" x="1035" y="108" text-anchor="middle">Quan hệ trội</text>
  <g transform="translate(930,390)"><line class="axis" x1="0" y1="0" x2="205" y2="0"/><line class="axis" x1="0" y1="0" x2="0" y2="-225"/>
    <circle class="pt" cx="45" cy="-180" r="9"/><text class="small" x="55" y="-190">(1,4)</text><circle class="pt" cx="90" cy="-90" r="9"/><text class="small" x="80" y="-68" text-anchor="end">(2,2)</text><circle class="pt" cx="180" cy="-45" r="9"/><text class="small" x="125" y="-25">(4,1)</text><circle class="dom" cx="135" cy="-135" r="9"/><text class="small" x="145" y="-145">(3,3)</text>
    <line x1="128" y1="-128" x2="99" y2="-99" stroke="#b15a2b" stroke-width="3" marker-end="url(#arr)"/>
  </g>
  <text class="txt" x="1035" y="445" text-anchor="middle">(2,2) trội (3,3)</text><text class="small" x="1035" y="482" text-anchor="middle">vì cả hai tọa độ đều nhỏ hơn.</text>
  <rect x="930" y="515" width="210" height="58" rx="12" fill="#e6f3ec" stroke="#2e7d32" stroke-width="3"/><text class="tiny" x="1035" y="542" text-anchor="middle">Ba điểm còn lại</text><text class="tiny" x="1035" y="560" text-anchor="middle">không bị trội</text>
</svg>

              <line x1="305.00" y1="275" x2="305.00" y2="282" stroke="#333" stroke-width="2"/><text x="305.00" y="314" text-anchor="middle" font-size="30" fill="#333">2</text>
              <line x1="468.33" y1="275" x2="468.33" y2="282" stroke="#333" stroke-width="2"/><text x="468.33" y="314" text-anchor="middle" font-size="30" fill="#333">4</text>
              <line x1="134.67" y1="157.50" x2="141.67" y2="157.50" stroke="#333" stroke-width="2"/><text x="128.67" y="167.50" text-anchor="end" font-size="30" fill="#333">2</text>
              <line x1="134.67" y1="40.00" x2="141.67" y2="40.00" stroke="#333" stroke-width="2"/><text x="128.67" y="50.00" text-anchor="end" font-size="30" fill="#333">4</text>
              <polyline data-function="gtd" points="60.000,98.750 305.000,275.000 550.000,98.750" fill="none" stroke="#B15A2B" stroke-width="6"  marker-start="url(#arrow-gtd)" marker-end="url(#arrow-gtd)"/>
              <line x1="65" y1="339" x2="545" y2="339" stroke="#B15A2B" stroke-width="7" marker-start="url(#arrow-gtd)" marker-end="url(#arrow-gtd)"/>

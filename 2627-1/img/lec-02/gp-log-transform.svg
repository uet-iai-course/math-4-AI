<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Phép đổi biến log của một quy hoạch hình học</title>
  <desc id="desc">Trong không gian dương x y, bài toán cực tiểu hóa nghịch đảo của tích dưới ràng buộc x cộng y không quá bốn đạt nghiệm hai, hai, nơi đường mức xy bằng bốn tiếp xúc đường x cộng y bằng bốn. Phép đổi biến y một bằng log x và y hai bằng log y biến mục tiêu thành affine và ràng buộc thành tập mức dưới lồi của log tổng mũ, với nghiệm log hai, log hai, nơi đường mức y một cộng y hai bằng log bốn tiếp xúc biên.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.head{font-family:"DejaVu Sans";font-size:23px;font-weight:700;fill:#172033}.label{font-family:"DejaVu Sans";font-size:18px;fill:#24324a}.small{font-family:"DejaVu Sans";font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.budget{stroke:#315d92;stroke-width:4;fill:none}.feasible{fill:#dcecfb;stroke:#315d92;stroke-width:2}.contour{fill:none;stroke:#6a45a5;stroke-width:3}.level{stroke:#b44b20;stroke-width:3;stroke-dasharray:8 6}.point{fill:#fff8e6;stroke:#16706a;stroke-width:4}.map{fill:#f5f0fb;stroke:#6a45a5;stroke-width:2}.ok{fill:#e9f6f0;stroke:#16706a;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="650" fill="#f3f6fb"/><text class="head" x="600" y="38" text-anchor="middle">Phép log làm lộ cấu trúc lồi của GP</text>

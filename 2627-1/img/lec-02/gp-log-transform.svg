<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Phép đổi biến log của một quy hoạch hình học</title>
  <desc id="desc">Trong không gian dương x y, bài toán tối thiểu nghịch đảo tích dưới ràng buộc x cộng y không quá bốn đạt nghiệm hai, hai. Phép đổi biến y một bằng log x và y hai bằng log y biến mục tiêu thành affine và ràng buộc thành tập mức dưới lồi của log tổng mũ, với nghiệm log hai, log hai.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.head{font-family:"DejaVu Sans";font-size:23px;font-weight:700;fill:#172033}.label{font-family:"DejaVu Sans";font-size:18px;fill:#24324a}.small{font-family:"DejaVu Sans";font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.budget{stroke:#315d92;stroke-width:4;fill:none}.feasible{fill:#dcecfb;stroke:#315d92;stroke-width:2}.contour{fill:none;stroke:#6a45a5;stroke-width:3}.level{stroke:#b44b20;stroke-width:3;stroke-dasharray:8 6}.point{fill:#fff8e6;stroke:#16706a;stroke-width:4}.map{fill:#f5f0fb;stroke:#6a45a5;stroke-width:2}.ok{fill:#e9f6f0;stroke:#16706a;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="650" fill="#f3f6fb"/><text class="head" x="600" y="38" text-anchor="middle">Phép log làm lộ cấu trúc lồi của GP</text>
  <rect class="panel" x="22" y="62" width="480" height="455" rx="14"/><text class="head" x="262" y="98" text-anchor="middle">Không gian biến dương</text>
  <line class="axis" x1="72" y1="458" x2="464" y2="458"/><line class="axis" x1="82" y1="478" x2="82" y2="126"/>
  <path class="feasible" d="M84 456 L84 143 L444 456 Z" opacity=".78"/><line class="budget" x1="84" y1="143" x2="444" y2="456"/>
  <path class="contour" d="M105 225 C150 345 240 410 430 438"/><path class="contour" d="M120 176 C170 305 270 382 455 420" opacity=".7"/>
  <circle class="point" cx="264" cy="300" r="8"/><text class="label" x="278" y="289">(2; 2)</text>
  <text class="small" x="446" y="480">x</text><text class="small" x="62" y="130">y</text><text class="small" x="340" y="206">x + y = 4</text>
  <text class="small" x="290" y="404">xy = hằng số</text>
  <text class="label" x="262" y="498" text-anchor="middle">min (xy)⁻¹,  x+y ≤ 4</text>

  <rect class="map" x="520" y="144" width="160" height="214" rx="16"/>
  <text class="head" x="600" y="180" text-anchor="middle">Đổi biến</text>
  <text class="label" x="600" y="220" text-anchor="middle">y₁ = log x</text><text class="label" x="600" y="252" text-anchor="middle">y₂ = log y</text>
  <line class="axis" x1="545" y1="292" x2="654" y2="292"/><text class="small" x="600" y="324" text-anchor="middle">song ánh vì x,y &gt; 0</text>

  <rect class="panel" x="698" y="62" width="480" height="455" rx="14"/><text class="head" x="938" y="98" text-anchor="middle">Không gian log</text>
  <line class="axis" x1="744" y1="458" x2="1138" y2="458"/><line class="axis" x1="870" y1="486" x2="870" y2="126"/>
  <path class="feasible" d="M746 458 L746 300 C810 304 870 317 935 365 C986 402 1018 438 1035 458 Z" opacity=".75"/>
  <path class="budget" d="M746 300 C810 304 870 317 935 365 C986 402 1018 438 1035 458"/>
  <line class="level" x1="770" y1="200" x2="1045" y2="475"/><line class="level" x1="810" y1="160" x2="1120" y2="470" opacity=".6"/>
  <circle class="point" cx="935" cy="365" r="8"/><text class="label" x="948" y="353">(log 2; log 2)</text>
  <text class="small" x="1124" y="482">y₁</text><text class="small" x="882" y="136">y₂</text>
  <text class="small" x="760" y="282">log(eʸ¹ + eʸ²) ≤ log 4</text>
  <text class="label" x="938" y="498" text-anchor="middle">min −y₁ − y₂</text>

  <rect class="ok" x="22" y="541" width="555" height="82" rx="14"/><text class="label" x="299" y="574" text-anchor="middle">Đơn thức → log biến thành hàm affine</text><text class="small" x="299" y="603" text-anchor="middle">c x₁ᵃ¹⋯xₙᵃⁿ  ↦  aᵀy + log c</text>
  <rect class="ok" x="623" y="541" width="555" height="82" rx="14"/><text class="label" x="900" y="574" text-anchor="middle">Đa thức dương → hàm log-tổng-mũ lồi</text><text class="small" x="900" y="603" text-anchor="middle">Σ exp(aₖᵀy + log cₖ)  ↦  log Σ exp(aₖᵀy + log cₖ)</text>
</svg>

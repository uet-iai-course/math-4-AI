  <circle class="point" cx="1004.0" cy="296.0" r="8"/><text class="label" x="1016.0" y="282.0">(log 2; log 2)</text>
  <text class="small" x="1140" y="390">y₁</text><text class="small" x="912" y="136">y₂</text>
  <text class="small" x="822" y="335" text-anchor="middle">log(eʸ¹ + eʸ²)</text><text class="small" x="822" y="357" text-anchor="middle">≤ log 4</text>
  <text class="label" x="938" y="498" text-anchor="middle">min −y₁ − y₂</text>

  <rect class="ok" x="22" y="541" width="555" height="82" rx="14"/><text class="label" x="299" y="574" text-anchor="middle">Đơn thức → log biến thành hàm affine</text><text class="small" x="299" y="603" text-anchor="middle">c x₁ᵃ¹⋯xₙᵃⁿ  ↦  aᵀy + log c</text>
  <rect class="ok" x="623" y="541" width="555" height="82" rx="14"/><text class="label" x="900" y="574" text-anchor="middle">Tổng đơn thức dương → hàm log-tổng-mũ lồi</text><text class="small" x="900" y="603" text-anchor="middle">Σ exp(aₖᵀy + log cₖ)  ↦  log Σ exp(aₖᵀy + log cₖ)</text>

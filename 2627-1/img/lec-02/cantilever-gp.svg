<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Dầm công-xôn được chia thành bốn đoạn</title>
  <desc id="desc">Một dầm cố định bên trái, chịu lực hướng xuống ở đầu phải. Bốn đoạn có chiều dài bằng nhau và chiều cao h1 đến h4 là biến thiết kế dương.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b15a2b"/>
    </marker>
  </defs>
  <rect x="34" y="45" width="24" height="200" fill="#2f3e7a"/>
  <g stroke="#2f3e7a" stroke-width="3">
    <line x1="20" y1="55" x2="34" y2="45"/><line x1="20" y1="85" x2="34" y2="75"/>
    <line x1="20" y1="115" x2="34" y2="105"/><line x1="20" y1="145" x2="34" y2="135"/>
    <line x1="20" y1="175" x2="34" y2="165"/><line x1="20" y1="205" x2="34" y2="195"/>
    <line x1="20" y1="235" x2="34" y2="225"/>
  </g>
  <path d="M58 85 L220 100 L382 116 L544 132 L706 145 L706 180 L544 176 L382 172 L220 168 L58 165 Z" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/>
  <g stroke="#657783" stroke-width="2" stroke-dasharray="7 6">
    <line x1="220" y1="94" x2="220" y2="176"/><line x1="382" y1="110" x2="382" y2="180"/><line x1="544" y1="126" x2="544" y2="184"/>
  </g>
  <g stroke="#2e7d32" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="180" y1="103" x2="180" y2="165"/><line x1="342" y1="118" x2="342" y2="170"/>
    <line x1="504" y1="134" x2="504" y2="174"/><line x1="666" y1="146" x2="666" y2="178"/>
  </g>
  <g fill="#2e7d32" font-family="sans-serif" font-size="22" font-weight="700">
    <text x="150" y="205">h₁</text><text x="312" y="205">h₂</text><text x="474" y="205">h₃</text><text x="636" y="205">h₄</text>
  </g>
  <line x1="706" y1="45" x2="706" y2="125" stroke="#b15a2b" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="720" y="80" fill="#b15a2b" font-family="sans-serif" font-size="24" font-weight="700">F</text>
  <text x="250" y="270" fill="#333" font-family="sans-serif" font-size="22">Chiều rộng cố định; chọn hᵢ &gt; 0</text>
</svg>

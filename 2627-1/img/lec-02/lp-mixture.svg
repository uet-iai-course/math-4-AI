<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc"><title id="title">Miền khả thi của bài toán pha trộn</title><desc id="desc">Phần tô là giao x1,x2 không âm, 2x1+x2 từ4 trở lên, x1+2x2 từ5 trở lên. Hai biên giao tại (1,2); đường chi phí7 chạm tại đó. Miền khả thi tiếp tục về phía trên và phải ngoài khung.</desc><rect width="600" height="400" fill="white"/><polygon points="75,109 160.455,217 502.273,325 545,325 545,55 75,55" fill="#E8ECF8" opacity="1"/><line x1="75" y1="109" x2="245.909" y2="325" stroke="#2F3E7A" stroke-width="3"/><line x1="75" y1="190" x2="502.273" y2="325" stroke="#2F3E7A" stroke-width="3" stroke-dasharray="9 6"/><line x1="75" y1="136" x2="274.394" y2="325" stroke="#B15A2B" stroke-width="4"/><line x1="75" y1="325" x2="545" y2="325" stroke="#555" stroke-width="2"/><line x1="75" y1="325" x2="75" y2="55" stroke="#555" stroke-width="2"/><text x="75" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">0</text><text x="160.455" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">1</text><text x="331.364" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">3</text><text x="502.273" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">5</text><text x="63" y="333" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">0</text><text x="63" y="225" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">2</text><text x="63" y="117" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">4</text><text x="547" y="392" fill="#555" text-anchor="end" font-family="sans-serif" font-size="27">x₁ (kg)</text><text x="75" y="29" fill="#555" text-anchor="start" font-family="sans-serif" font-size="27">x₂ (kg)</text><circle cx="160.455" cy="217" r="6" fill="#B15A2B" stroke="white" stroke-width="2"/><text x="305" y="87" fill="#2F3E7A" text-anchor="start" font-family="sans-serif" font-size="27">Miền khả thi</text><text x="175" y="209" fill="#B15A2B" text-anchor="start" font-family="sans-serif" font-size="27">(1, 2)</text><path d="M 292 300 L 228.818 281.8" fill="none" stroke="#B15A2B" stroke-width="2"/><text x="302" y="311" fill="#B15A2B" text-anchor="start" font-family="sans-serif" font-size="27">Chi phí = 7</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc"><title id="title">Hồi quy tối thiểu sai số lớn nhất</title><desc id="desc">Năm điểm dữ liệu u=(-2,-1,0,1,2), y=(-2,-1,3,1,2). Đường dự đoán y=u+1.5. Các đoạn thẳng đứng thể hiện sai số. Dải tô có nửa độ rộng1,5, chặn mọi sai số.</desc><rect width="600" height="400" fill="white"/><polygon points="75,313 545,157 545,67 75,223" fill="#E8ECF8" opacity="1"/><line x1="75" y1="313" x2="545" y2="157" stroke="#2F3E7A" stroke-width="2" stroke-dasharray="8 6"/><line x1="75" y1="223" x2="545" y2="67" stroke="#2F3E7A" stroke-width="2" stroke-dasharray="8 6"/><line x1="75" y1="268" x2="545" y2="112" stroke="#2F3E7A" stroke-width="3"/><line x1="129.231" y1="250" x2="129.231" y2="295" stroke="#B15A2B" stroke-width="4"/><circle cx="129.231" cy="295" r="6" fill="#2F3E7A" stroke="white" stroke-width="2"/><line x1="219.615" y1="220" x2="219.615" y2="265" stroke="#B15A2B" stroke-width="4"/><circle cx="219.615" cy="265" r="6" fill="#2F3E7A" stroke="white" stroke-width="2"/><line x1="310" y1="190" x2="310" y2="145" stroke="#B15A2B" stroke-width="4"/><circle cx="310" cy="145" r="6" fill="#2F3E7A" stroke="white" stroke-width="2"/><line x1="400.385" y1="160" x2="400.385" y2="205" stroke="#B15A2B" stroke-width="4"/><circle cx="400.385" cy="205" r="6" fill="#2F3E7A" stroke="white" stroke-width="2"/><line x1="490.769" y1="130" x2="490.769" y2="175" stroke="#B15A2B" stroke-width="4"/><circle cx="490.769" cy="175" r="6" fill="#2F3E7A" stroke="white" stroke-width="2"/><line x1="75" y1="325" x2="545" y2="325" stroke="#555" stroke-width="2"/><line x1="75" y1="325" x2="75" y2="55" stroke="#555" stroke-width="2"/><text x="129.231" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">-2</text><text x="219.615" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">-1</text><text x="310" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">0</text><text x="400.385" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">1</text><text x="490.769" y="356" fill="#555" text-anchor="middle" font-family="sans-serif" font-size="26">2</text><text x="63" y="303" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">-2</text><text x="63" y="243" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">0</text><text x="63" y="183" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">2</text><text x="63" y="123" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">4</text><text x="63" y="63" fill="#555" text-anchor="end" font-family="sans-serif" font-size="26">6</text><text x="547" y="392" fill="#555" text-anchor="end" font-family="sans-serif" font-size="27">u</text><text x="75" y="29" fill="#555" text-anchor="start" font-family="sans-serif" font-size="27">y, ŷ</text><text x="92" y="74" fill="#2F3E7A" text-anchor="start" font-family="sans-serif" font-size="27">ŷ = u + 1,5</text><text x="282" y="99" fill="#2F3E7A" text-anchor="start" font-family="sans-serif" font-size="27">Dải ±1,5</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Tia khả thi x=(-s,s), s≥0</title><desc id="desc">Tập khả thi chung là tia xuất phát từ gốc theo hướng (âm 1; 1). Trên tia, mục tiêu x một bình phương cộng x hai bình phương bằng 2 s bình phương, nhỏ nhất tại gốc.</desc>
<rect width="600" height="420" fill="#fff"/>
<defs><clipPath id="plot"><rect x="70" y="38" width="300" height="300"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#333"/></marker></defs>
<g font-family="Arial,sans-serif" font-size="24" fill="#222">
<line x1="60.0" y1="238.0" x2="392.0" y2="238.0" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="270.0" y1="348.0" x2="270.0" y2="22.0" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<text x="398.00" y="246.00" text-anchor="start" fill="#222" font-size="24">x₁</text>
<text x="282.00" y="28.00" text-anchor="start" fill="#222" font-size="24">x₂</text>
<text x="70.00" y="266.00" text-anchor="middle" fill="#222" font-size="22">−2</text>
<text x="170.00" y="266.00" text-anchor="middle" fill="#222" font-size="22">−1</text>
<text x="370.00" y="266.00" text-anchor="middle" fill="#222" font-size="22">1</text>
<text x="260.00" y="145.00" text-anchor="end" fill="#222" font-size="22">1</text>
<text x="260.00" y="45.00" text-anchor="end" fill="#222" font-size="22">2</text>
<text x="260.00" y="345.00" text-anchor="end" fill="#222" font-size="22">−1</text>
<line x1="270.0" y1="238.0" x2="70.0" y2="38.0" stroke="#2f3e7a" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<circle cx="270.0" cy="238.0" r="6" fill="#b15a2b" stroke="#fff" stroke-width="2"/>
<text x="70.00" y="194.00" text-anchor="start" fill="#222" font-size="24">x=(−s,s)</text><text x="70.00" y="222.00" text-anchor="start" fill="#222" font-size="24">s ≥ 0</text>
<text x="282.00" y="226.00" text-anchor="start" fill="#b15a2b" font-size="22">x* = (0, 0)</text>
<text x="300.00" y="406.00" text-anchor="middle" fill="#222" font-size="22">Trên tia, x₁² + x₂² = 2s², nhỏ nhất tại s = 0</text>
</g></svg>
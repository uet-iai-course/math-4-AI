<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Hồi quy bình phương nhỏ nhất trên miền trọng số</title><desc id="desc">Miền C là tam giác w không âm, w một cộng w hai không vượt quá 2. Các đường tròn tâm y bằng (2; 1) là đường mức của tổng bình phương sai số; đường tròn nhỏ nhất chạm C tiếp xúc cạnh huyền tại w* bằng (1,5; 0,5).</desc>

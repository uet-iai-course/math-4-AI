<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="t d"><title id="t">Nghiệm LP chọn nửa của mỗi gói</title><desc id="d">Ba thanh cho x1=x2=x3=1/2. Mỗi thanh chỉ tô nửa chiều cao để biểu diễn nghiệm phân số, không phải một giao dịch được phép. Mỗi gói chỉ bán nguyên.</desc><rect width="640" height="430" fill="white"/><rect x="70" y="95" width="120" height="220" fill="#F3F4F8" stroke="#2F3E7A" stroke-width="3"/><rect x="70" y="205" width="120" height="110" fill="#B15A2B" opacity=".8"/><line x1="70" x2="190" y1="205" y2="205" stroke="#2F3E7A" stroke-width="2" stroke-dasharray="7 5"/><text x="130" y="65" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#2F3E7A">Gói 1</text><text x="130" y="356" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#2F3E7A">x₁ = 1/2</text><rect x="260" y="95" width="120" height="220" fill="#F3F4F8" stroke="#2F3E7A" stroke-width="3"/><rect x="260" y="205" width="120" height="110" fill="#B15A2B" opacity=".8"/><line x1="260" x2="380" y1="205" y2="205" stroke="#2F3E7A" stroke-width="2" stroke-dasharray="7 5"/><text x="320" y="65" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#2F3E7A">Gói 2</text><text x="320" y="356" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#2F3E7A">x₂ = 1/2</text><rect x="450" y="95" width="120" height="220" fill="#F3F4F8" stroke="#2F3E7A" stroke-width="3"/><rect x="450" y="205" width="120" height="110" fill="#B15A2B" opacity=".8"/><line x1="450" x2="570" y1="205" y2="205" stroke="#2F3E7A" stroke-width="2" stroke-dasharray="7 5"/><text x="510" y="65" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#2F3E7A">Gói 3</text><text x="510" y="356" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#2F3E7A">x₃ = 1/2</text><text x="320" y="411" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#666">Nghiệm phân số: chưa mua được nguyên gói</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title"><title id="title">Tại θ=1, hướng âm gradient của ba mẫu lần lượt là −2, 0 và 2.</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="24" fill="#263238"><line x1="90" y1="80" x2="530" y2="80" stroke="#667078" stroke-width="2"/><circle cx="310" cy="80" r="5" fill="#2F3E7A"/><text x="45" y="88" fill="#263238" text-anchor="middle" font-size="23">y=-1</text><line x1="310" y1="80" x2="140" y2="80" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)"/><text x="310" y="118" fill="#263238" text-anchor="middle" font-size="24">−g = -2</text><line x1="90" y1="180" x2="530" y2="180" stroke="#667078" stroke-width="2"/><circle cx="310" cy="180" r="5" fill="#2F3E7A"/><text x="45" y="188" fill="#263238" text-anchor="middle" font-size="23">y=1</text><text x="310" y="218" fill="#263238" text-anchor="middle" font-size="24">−g = 0</text><line x1="90" y1="280" x2="530" y2="280" stroke="#667078" stroke-width="2"/><circle cx="310" cy="280" r="5" fill="#2F3E7A"/><text x="45" y="288" fill="#263238" text-anchor="middle" font-size="23">y=3</text><line x1="310" y1="280" x2="480" y2="280" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)"/><text x="310" y="318" fill="#263238" text-anchor="middle" font-size="24">−g = 2</text><text x="310" y="375" fill="#263238" text-anchor="middle" font-size="24">Cùng điểm θ = 1</text></g></svg>
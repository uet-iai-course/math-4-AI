<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title"><title id="title">Ba bước từ θ=1: −2η, 0 và 2η. Khi η giảm một nửa, độ dài bước giảm một nửa.</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="24" fill="#263238"><text x="50" y="62" fill="#263238" text-anchor="start" font-size="24">η = 0.1</text><line x1="90" y1="110" x2="530" y2="110" stroke="#667078" stroke-width="2"/><circle cx="310" cy="110" r="6" fill="#2F3E7A"/><line x1="310" y1="110" x2="210.0" y2="110" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)"/><line x1="310" y1="110" x2="410.0" y2="110" stroke="#2F3E7A" stroke-width="5" marker-end="url(#arr)"/><text x="310" y="148" fill="#263238" text-anchor="middle" font-size="24">θ = 1; b = 1</text><text x="50" y="207" fill="#263238" text-anchor="start" font-size="24">η = 0.05</text><line x1="90" y1="255" x2="530" y2="255" stroke="#667078" stroke-width="2"/><circle cx="310" cy="255" r="6" fill="#2F3E7A"/><line x1="310" y1="255" x2="260.0" y2="255" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)"/><line x1="310" y1="255" x2="360.0" y2="255" stroke="#2F3E7A" stroke-width="5" marker-end="url(#arr)"/><text x="310" y="293" fill="#263238" text-anchor="middle" font-size="24">θ = 1; b = 1</text></g></svg>
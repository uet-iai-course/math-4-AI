<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc"><title id="title">Dữ liệu năm mẫu và bốn điểm ngoài mẫu</title><desc id="desc">Năm mẫu huấn luyện (chấm đặc) tại u = −1; −0,5; 0; 0,5; 1 với y = −0,9; −0,7; 0,2; 0,4; 1,0, nằm quanh đường thật y = u (nét đứt). Bốn điểm ngoài mẫu (vòng rỗng) tại u = ±0,25, ±0,75 nằm đúng trên đường y = u.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#263238"><line x1="80.0" y1="301.0" x2="560.0" y2="301.0" stroke="#d5d9db" stroke-width="1"/><line x1="74.0" y1="301.0" x2="80.0" y2="301.0" stroke="#667078" stroke-width="2"/><text x="70.0" y="308.0" text-anchor="end" font-size="19" fill="#263238">−1</text><line x1="80.0" y1="243.0" x2="560.0" y2="243.0" stroke="#d5d9db" stroke-width="1"/><line x1="74.0" y1="243.0" x2="80.0" y2="243.0" stroke="#667078" stroke-width="2"/><text x="70.0" y="250.0" text-anchor="end" font-size="19" fill="#263238">−0,5</text><line x1="80.0" y1="185.0" x2="560.0" y2="185.0" stroke="#d5d9db" stroke-width="1"/><line x1="74.0" y1="185.0" x2="80.0" y2="185.0" stroke="#667078" stroke-width="2"/><text x="70.0" y="192.0" text-anchor="end" font-size="19" fill="#263238">0</text><line x1="80.0" y1="127.0" x2="560.0" y2="127.0" stroke="#d5d9db" stroke-width="1"/><line x1="74.0" y1="127.0" x2="80.0" y2="127.0" stroke="#667078" stroke-width="2"/><text x="70.0" y="134.0" text-anchor="end" font-size="19" fill="#263238">0,5</text><line x1="80.0" y1="69.0" x2="560.0" y2="69.0" stroke="#d5d9db" stroke-width="1"/><line x1="74.0" y1="69.0" x2="80.0" y2="69.0" stroke="#667078" stroke-width="2"/><text x="70.0" y="76.0" text-anchor="end" font-size="19" fill="#263238">1</text><line x1="128.0" y1="330.0" x2="128.0" y2="336.0" stroke="#667078" stroke-width="2"/><text x="128.0" y="358.0" text-anchor="middle" font-size="19" fill="#263238">−1</text><line x1="224.0" y1="330.0" x2="224.0" y2="
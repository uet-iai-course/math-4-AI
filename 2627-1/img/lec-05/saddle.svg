<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Hai lát cắt tại điểm yên ngựa</title>
  <desc id="desc">Với f của u v bằng u bình phương trừ v bình phương, lát v bằng không cong lên theo u, còn lát u bằng không cong xuống theo v. Hai lát cùng đi qua gốc, nơi gradient bằng không nhưng Hessian có một trị riêng dương hai và một trị riêng âm hai, nên gốc không phải cực tiểu.</desc>
  <defs><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.head{font-size:24px;font-weight:700;fill:#172033}.label{font-size:18px;fill:#24324a}.small{font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2}.up{fill:none;stroke:#315d92;stroke-width:6}.down{fill:none;stroke:#b44b20;stroke-width:6}.point{fill:#fff8e6;stroke:#16706a;stroke-width:4}</style></defs>
  <rect width="1200" height="620" fill="#f3f6fb"/><text class="head" x="600" y="38" text-anchor="middle">Điểm dừng có thể cong theo hai chiều trái dấu</text>
  <rect class="panel" x="22" y="62" width="566" height="420" rx="14"/><text class="head" x="305" y="99" text-anchor="middle">Lát v=0: f(u,0)=u²</text><line class="axis" x1="70" y1="360" x2="545" y2="360"/><line class="axis" x1="305" y1="410" x2="305" y2="130"/><path class="up" d="M95 160 Q305 470 515 160"/><circle class="point" cx="305" cy="360" r="9"/><text class="label" x="322" y="350">(0,0)</text><text class="label" x="330" y="150" fill="#315d92">cong lên</text><text class="small" x="530" y="385">u</text>
  <rect class="panel" x="612" y="62" width="566" height="420" rx="14"/><text class="head" x="895" y="99" text-anchor="middle">Lát u=0: f(0,v)=−v²</text><line class="axis" x1="660" y1="210" x2="1135" y2="210"/><line class="axis" x1="895" y1="430" x2="895" y2="130"/><path class="down" d="M685 410 Q895 100 1105 410"/><circle class="point" cx="895" cy="210" r="9"/><text class="label" x="912" y="201">(0,0)</text><text class="label" x="920" y="400" fill="#b44b20">cong xuống</text><text class="small" x="1120" y="235">v</text>
  <rect x="180" y="510" width="840" height="78" rx="14" fill="#fff1ec" stroke="#b44b20" stroke-width="2"/><text class="head" x="600" y="544" text-anchor="middle">∇f(0,0)=0 nhưng H=diag(2,−2) bất định</text><text class="label" x="600" y="574" text-anchor="middle">Một hướng tăng và một hướng giảm ⇒ không phải cực tiểu.</text>
</svg>

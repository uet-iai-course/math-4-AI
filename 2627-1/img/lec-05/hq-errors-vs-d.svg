<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc"><title id="title">Sai số huấn luyện và sai số ngoài mẫu theo số chiều</title><desc id="desc">Trục tung logarit. Sai số bình phương trung bình huấn luyện (chấm đặc, nét liền) giảm theo d: 0,5; 0,0198; 0,0197; 0,0179; bằng 0 tại d = 5 (tam giác ở đáy). Sai số trên bốn điểm ngoài mẫu (ô vuông rỗng, nét đứt): 0,3125; 0,000125; 0,000205; 0,00107; 0,0487, nhỏ nhất ở d = 2 và tăng 389 lần khi d lên 5.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#263238"><line x1="95.0" y1="330.0" x2="560.0" y2="330.0" stroke="#d5d9db" stroke-width="1"/><line x1="89.0" y1="330.0" x2="95.0" y2="330.0" stroke="#667078" stroke-width="2"/><text x="85.0" y="337.0" text-anchor="end" font-size="19" fill="#263238">10⁻⁵</text><line x1="95.0" y1="272.0" x2="560.0" y2="272.0" stroke="#d5d9db" stroke-width="1"/><line x1="89.0" y1="272.0" x2="95.0" y2="272.0" stroke="#667078" stroke-width="2"/><text x="85.0" y="279.0" text-anchor="end" font-size="19" fill="#263238">10⁻⁴</text><line x1="95.0" y1="214.0" x2="560.0" y2="214.0" stroke="#d5d9db" stroke-width="1"/><line x1="89.0" y1="214.0" x2="95.0" y2="214.0" stroke="#667078" stroke-width="2"/><text x="85.0" y="221.0" text-anchor="end" font-size="19" fill="#263238">10⁻³</text><line x1="95.0" y1="156.0" x2="560.0" y2="156.0" stroke="#d5d9db" stroke-width="1"/><line x1="89.0" y1="156.0" x2="95.0" y2="156.0" stroke="#667078" stroke-width="2"/><text x="85.0" y="163.0" text-anchor="end" font-size="19" fill="#263238">10⁻²</text><line x1="95.0" y1="98.0" x2="560.0" y2="98.0" stroke="#d5d9db" stroke-width="1"/><line x1="89.0" y1="98.0" x2="95.0" y2="98.0" stroke="#667078" stroke-width="2"/><text x="85.0" y="105.0" text-anchor="end" font-size="19" fill="#263238">10⁻¹</text><line x1="95.0" y1="40.0" x2="560.0" y2="40.0" stroke="#d5d9db" stroke-width="1"/><line x1="89.0" y1="40.0" x2="95.0" y2="40.0" stroke="#667078" stroke-width="2"/><text x="85.0" y="47.0" text-anchor="end" font-size="19" fill="#263238">10⁰</text><line x1="133.8" y1="330.0" x2="133.8" y2="336.0" stroke="#667078" stroke-width="2"/><text x="133.8" y="358.0" text-anchor="middle" font-size="19" fill="#263238">1</text><line x1="230.6" y1="330.0" x2="230.6" y2="336.0" stroke="#667078" stroke-width="2"/><text x="230.6" y="358.0" text-anchor="middle" font-size="19" fill="#263238">2</text><line x1="327.5" y1="330.0" x2="327.5" y2="336.0" stroke="#667078" stroke-width="2"/><text x="327.5" y="358.0" text-anchor="middle" font-size="19" fill="#263238">3</text><line x1="424.4" y1="330.0" x2="424.4" y2="336.0" stroke="#667078" stroke-width="2"/><text x="424.4" y="358.0" text-anchor="middle" font-size="19" fill="#263238">4</text><line x1="521.2" y1="330.0" x2="521.2" y2="336.0" stroke="#667078" stroke-width="2"/><text x="521.2" y="358.0" text-anchor="middle" font-size="19" fill="#263238">5</text><line x1="95.0" y1="330.0" x2="560.0" y2="330.0" stroke="#667078" stroke-width="2"/><line x1="95.0" y1="40.0" x2="95.0" y2="330.0" stroke="#667078" stroke-width="2"/><text x="560.0" y="382.0" text-anchor="end" font-size="20" fill="#263238">số đặc trưng d</text><text x="91.0" y="26.0" text-anchor="start" font-size="20" fill="#263238">sai số bình phương trung bình</text><polyline points="133.8,57.5 230.6,138.8 327.5,139.0 424.4,141.4" fill="none" stroke="#263238" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="424.4" y1="141.4" x2="521.2" y2="318.0" stroke="#263238" stroke-width="3" stroke-dasharray="2 5"/><circle cx="133.8" cy="57.5" r="7" fill="#263238" stroke="#263238" stroke-width="2.5"/><circle cx="230.6" cy="138.8" r="7" fill="#263238" stroke="#263238" stroke-width="2.5"/><circle cx="327.5" cy="139.0" r="7" fill="#263238" stroke="#263238" stroke-width="2.5"/><circle cx="424.4" cy="141.4" r="7" fill="#263238" stroke="#263238" stroke-width="2.5"/><path d="M
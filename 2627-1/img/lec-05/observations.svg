<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title"><title id="title">Ba quan sát −1, 1, 3; dự đoán θ=1 có sai số có dấu 2, 0, −2.</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="24" fill="#263238"><line x1="65" y1="285" x2="540" y2="285" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><text x="552" y="317" fill="#263238" text-anchor="middle" font-size="24">y</text><circle cx="110" cy="285" r="7" fill="#B15A2B"/><text x="110" y="324" fill="#263238" text-anchor="middle" font-size="24">-1</text><circle cx="290" cy="285" r="7" fill="#B15A2B"/><text x="290" y="324" fill="#263238" text-anchor="middle" font-size="24">1</text><circle cx="470" cy="285" r="7" fill="#B15A2B"/><text x="470" y="324" fill="#263238" text-anchor="middle" font-size="24">3</text><line x1="290" y1="58" x2="290" y2="300" stroke="#2F3E7A" stroke-width="3" stroke-dasharray="7 5"/><text x="305" y="42" fill="#2F3E7A" text-anchor="start" font-size="24">θ = 1</text><line x1="110" y1="120" x2="290" y2="120" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/><text x="200.0" y="102" fill="#263238" text-anchor="middle" font-size="22">θ − y₁ = 2</text><line x1="470" y1="210" x2="290" y2="210" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/><text x="380.0" y="192" fill="#263238" text-anchor="middle" font-size="22">θ − y₃ = −2</text><text x="290" y="365" fill="#263238" text-anchor="middle" font-size="24">Quan sát : −1, 1, 3</text></g></svg>
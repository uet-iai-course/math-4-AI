<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title desc"><title id="title">Mất mát theo số bước trên hồi quy có số điều kiện 100</title><desc id="desc">Trục ngang là số bước t từ 0 tới 120, trục dọc là log cơ số 10 của J từ −6 tới 3. Giảm gradient với bước 1/L (nét đứt) giảm từ 50,5 xuống khoảng 0,49 sau một bước rồi giảm chậm theo hệ số 0,99² mỗi bước, còn khoảng 0,045 ở bước 120. Momentum với tham số Polyak (nét liền) tăng lên khoảng 687 ở bước 4 rồi giảm nhanh, qua mức 10⁻⁴ ở bước 56. Nesterov với η = 1/L, β = 9/11 (nét chấm gạch) giảm đơn điệu, qua mức 10⁻⁴ ở bước 59. Đường chấm ngang đánh dấu mức 10⁻⁴.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#263238">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Đường mất mát huấn luyện và xác thực</title>
  <desc id="desc">Mất mát huấn luyện giảm liên tục, còn mất mát xác thực giảm rồi tăng; điểm thấp nhất của đường xác thực là điểm dừng sớm.</desc>
  <rect width="900" height="500" fill="#fff"/>
  <g stroke="#33467f" stroke-width="3"><line x1="95" y1="410" x2="840" y2="410"/><line x1="95" y1="410" x2="95" y2="60"/></g>
  <g fill="#26345f" font-family="Arial,sans-serif" font-size="24"><text x="730" y="455">Vòng lặp</text><text x="18" y="75">Mất mát</text></g>
  <path d="M115 105 C260 190 420 270 815 365" fill="none" stroke="#2f3e7a" stroke-width="8"/>
  <path d="M115 150 C280 235 420 285 530 290 C655 295 730 250 815 180" fill="none" stroke="#b24a2b" stroke-width="8"/>
  <line x1="530" y1="290" x2="530" y2="410" stroke="#666" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="530" cy="290" r="10" fill="#b24a2b"/>
  <g font-family="Arial,sans-serif" font-size="24"><text x="655" y="350" fill="#2f3e7a">huấn luyện</text><text x="650" y="205" fill="#b24a2b">xác thực</text><text x="445" y="455" fill="#333">dừng sớm</text></g>
</svg>

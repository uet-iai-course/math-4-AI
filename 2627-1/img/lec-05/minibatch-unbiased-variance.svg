<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Gradient lô không chệch và phương sai giảm theo cỡ lô</title>
  <desc id="desc">Hai độ lệch gradient mẫu là âm một, âm bốn và một, bốn, có trung bình bằng không và bình phương chuẩn bằng mười bảy. Khi lấy các chỉ số độc lập, đều và có hoàn lại, gradient trung bình lô không chệch và sai số bình phương kỳ vọng bằng mười bảy chia b; ba cột cho b bằng một, hai và bốn có giá trị mười bảy, tám phẩy năm và bốn phẩy hai năm.</desc>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#33467f"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.head{font-size:23px;font-weight:700;fill:#172033}.label{font-size:18px;fill:#24324a}.small{font-size:16px;fill:#44516a}.sample1{stroke:#315d92;stroke-width:5}.sample2{stroke:#b44b20;stroke-width:5}.bar{fill:#dcecfb;stroke:#315d92;stroke-width:3}.good{fill:#e9f6f0;stroke:#16706a;stroke-width:2}.warn{fill:#fff8e6;stroke:#b44b20;stroke-width:2}</style></defs>
  <rect width="1200" height="650" fill="#f3f6fb"/><text class="head" x="600" y="38" text-anchor="middle">Lấy trung bình giảm nhiễu nhưng mỗi cập nhật tốn nhiều gradient mẫu hơn</text>
  <rect class="panel" x="22" y="62" width="360" height="430" rx="14"/><text class="head" x="202" y="99" text-anchor="middle">Hai độ lệch gradient mẫu</text><line x1="72" y1="300" x2="332" y2="300" stroke="#24324a" stroke-width="2"/><line x1="202" y1="425" x2="202" y2="145" stroke="#24324a" stroke-width="2"/>
  <line class="sample1" x1="202" y1="300" x2="172" y2="420" marker-end="url(#arr)"/><line class="sample2" x1="202" y1="300" x2="232" y2="180" marker-end="url(#arr)"/><text class="label" x="55" y="438" fill="#315d92">ξ₁=(−1;−4)</text><text class="label" x="220" y="164" fill="#b44b20">ξ₂=(1;4)</text><text class="label" x="202" y="333" text-anchor="middle">E[ξ]=0</text><text class="small" x="202" y="470" text-anchor="middle">‖ξ₁‖²=‖ξ₂‖²=17</text>
  <rect class="panel" x="406" y="62" width="370" height="430" rx="14"/><text class="head" x="591" y="99" text-anchor="middle">Cơ chế lấy mẫu quyết định</text><rect class="good" x="438" y="130" width="306" height="100" rx="12"/><text class="label" x="591" y="164" text-anchor="middle">I₁,…,Iⱼ,… độc lập, đều</text><text class="label" x="591" y="197" text-anchor="middle">và có hoàn lại</text>
  <text class="label" x="591" y="276" text-anchor="middle">g lô = trung bình b gradient mẫu</text><line x1="591" y1="292" x2="591" y2="335" stroke="#33467f" stroke-width="3" marker-end="url(#arr)"/><text class="label" x="591" y="370" text-anchor="middle">E[g lô | θ]=∇F(θ)</text><text class="label" x="591" y="410" text-anchor="middle">E‖g lô−∇F‖²=17/b</text><text class="small" x="591" y="459" text-anchor="middle">Chi phí mỗi cập nhật: O(b C∇)</text>
  <rect class="panel" x="800" y="62" width="378" height="430" rx="14"/><text class="head" x="989" y="99" text-anchor="middle">Phương sai theo cỡ lô</text><line x1="848" y1="423" x2="1135" y2="423" stroke="#24324a" stroke-width="2"/><line x1="848" y1="423" x2="848" y2="142" stroke="#24324a" stroke-width="2"/>
  <rect class="bar" x="880" y="168" width="55" height="255"/><rect class="bar" x="973" y="296" width="55" height="127"/><rect class="bar" x="1066" y="359" width="55" height="64"/><text class="label" x="907" y="157" text-anchor="middle">17</text><text class="label" x="1000" y="285" text-anchor="middle">8,5</text><text class="label" x="1093" y="348" text-anchor="middle">4,25</text><text class="small" x="907" y="451" text-anchor="middle">b=1</text><text class="small" x="1000" y="451" text-anchor="middle">b=2</text><text class="small" x="1093" y="451" text-anchor="middle">b=4</text><text class="small" x="989" y="478" text-anchor="middle">Giảm theo 1/b, không bằng 0 khi b hữu hạn.</text>
  <rect class="warn" x="130" y="530" width="940" height="84" rx="14"/><text class="head" x="600" y="563" text-anchor="middle">Phân biệt ví dụ tái lập với mô hình ngẫu nhiên</text><text class="label" x="600" y="596" text-anchor="middle">Thứ tự cố định B₀={1}, B₁={2} chỉ để tính hai vòng; không chứng minh tính không chệch.</text>
</svg>

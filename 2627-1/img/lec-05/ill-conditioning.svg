<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Khe hẹp điều kiện kém</title>
  <desc id="desc">Các đường mức elip dài và hẹp của hàm bậc hai có số điều kiện κ bằng 12, trục dài nghiêng lên phải. Quỹ đạo hạ gradient với một độ dài bước chung đổi dấu theo trục ngắn ở mỗi bước, biên độ giảm theo hệ số 0,75, trong khi chỉ tiến chậm theo trục dài, hệ số 0,85 mỗi bước, về cực tiểu ở tâm.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#26345f"/></marker></defs>
  <rect width="900" height="500" fill="#fff"/>
  <g transform="translate(450 250) rotate(-18)">
    <g fill="none" stroke="#cfd6e8" stroke-width="4"><ellipse cx="0" cy="0" rx="360" ry="103.9"/><ellipse cx="0" cy="0" rx="270" ry="77.9"/><ellipse cx="0" cy="0" rx="180" ry="52.0"/><ellipse cx="0" cy="0" rx="90" ry="26.0"/></g>
    <path d="M-380 0H380M0 -128V128" stroke="#8a94b0" stroke-width="1.5" stroke-dasharray="6 6"/>
    <polyline points="-280.0,60.0 -239.2,-45.0 -204.3,33.8 -174.5,-25.3 -149.0,19.0 -127.3,-14.2 -108.7,10.7 -92.9,-8.0 -79.3,6.0" fill="none" stroke="#b24a2b" stroke-width="6" stroke-linejoin="round"/>
    <g fill="#b24a2b"><circle cx="-280.0" cy="60.0" r="7"/><circle cx="-239.2" cy="-45.0" r="7"/><circle cx="-204.3" cy="33.8" r="7"/><circle cx="-174.5" cy="-25.3" r="7"/><circle cx="-149.0" cy="19.0" r="7"/><circle cx="-127.3" cy="-14.2" r="7"/><circle cx="-108.7" cy="10.7" r="7"/><circle cx="-92.9" cy="-8.0" r="7"/><circle cx="-79.3" cy="6.0" r="7"/></g>
    <path d="M-9 -9L9 9M-9 9L9 -9" stroke="#26345f" stroke-width="3"/>
  </g>
  <g fill="#26345f" font-size="22" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
    <text x="407" y="111" text-anchor="middle">trục ngắn: độ cong lớn</text>
    <text x="840" y="128" text-anchor="end">trục dài: độ cong nhỏ</text>
    <text x="484" y="292">cực tiểu</text>
    <text x="188" y="402" text-anchor="end">điểm đầu</text>
  </g>
  <rect x="85" y="420" width="730" height="48" rx="10" fill="#fff8e6" stroke="#b44b20" stroke-width="2"/>
  <text x="450" y="450" text-anchor="middle" font-size="17" fill="#44516a">κ = 12: một độ dài bước chung dao động theo trục ngắn, tiến chậm theo trục dài.</text>
</svg>

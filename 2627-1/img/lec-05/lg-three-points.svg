<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc"><title id="title">Ba điểm nhãn −, +, − và điểm số bậc hai</title><desc id="desc">Trục ngang u từ −1,5 đến 1,5. Ba điểm: u = −1 nhãn −1, u = 0 nhãn +1, u = 1 nhãn −1. Đường cong điểm số 1 − 2u² đi qua cả ba điểm, dương trên khoảng (−1/√2; 1/√2) và âm ngoài khoảng đó, nên phân loại đúng cả ba. Một điểm số affine w₀ + w₁u đổi dấu nhiều nhất một lần nên không làm được.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#263238"><line x1="80.0" y1="272.0" x2="560.0" y2="272.0" stroke="#d5d9db" stroke-width="1"/><line x1="74.0" y1="272.0" x2="80.0" y2="272.0" stroke="#667078" stroke-width="2"/><text x="70.0" y="279.0" text-anchor="end" font-size="19" fill="#263238">−1</text><line x1="80.0" y1="175.3" x2="560.0" y2="175.3" stroke="#d5d9db" stroke-width="1"/><line x1="74.0" y1="175.3" x2="80.0" y2="175.3" stroke="#667078" stroke-width="2"/><text x="70.0" y="182.3" text-anchor="end" font-size="19" fill="#263238">0</text><line x1="80.0" y1="78.7" x2="560.0" y2="78.7" stroke="#d5d9db" stroke-width="1"/><line x1="74.0" y1="78.7" x2="80.0" y2="78.7" stroke="#667078" stroke-width="2"/><text x="70.0" y="85.7" text-anchor="end" font-size="19" fill="#263238">1</text><line x1="80.0" y1="330.0" x2="80.0" y2="336.0" stroke="#667078" stroke-width="2"/><text x="80.0" y="358.0" text-anchor="middle" font-size="19" fill="#263238">−1,5</text><line x1="160.0" y1="330.0" x2="160.0" y2="336.0" stroke="#667078" stroke-width="2"/><text x="160.0" y="358.0" text-anchor="middle" font-size="19" fill="#263238">−1</text><line x1="240.0" y1="330.0" x2="240.0" y2="336.0" stroke="#667078" stroke-width="2"/><text x="240.0" y="358.0" text-anchor="middle" font-size="19" fill="#263238">−0,5</text><line x1="320.0" y1="330.0" x2="320.0" y2="336.0" stroke="#667078" stroke-width="2"/><text x="320.0" y="358.0" text-anchor
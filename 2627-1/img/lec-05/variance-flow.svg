<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Lan truyền mômen bậc hai và thang khởi tạo</title>
  <desc id="desc">Mômen bậc hai qua mỗi lớp được nhân xấp xỉ bởi c phi nhân fan in nhân phương sai trọng số. Với fan in bằng bốn và fan out bằng hai, Xavier có phương sai một phần ba và độ lệch chuẩn xấp xỉ không phẩy năm bảy bảy; He có phương sai một phần hai và độ lệch chuẩn xấp xỉ không phẩy bảy không bảy. Hình nhấn mạnh đây là xấp xỉ tại khởi tạo.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#33467f"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.head{font-size:24px;font-weight:700;fill:#172033}.label{font-size:18px;fill:#24324a}.small{font-size:16px;fill:#44516a}.box{fill:#eef2fb;stroke:#33467f;stroke-width:3}.good{fill:#e9f6f0;stroke:#16706a;stroke-width:2}.warn{fill:#fff8e6;stroke:#b44b20;stroke-width:2}</style></defs>
  <rect width="1200" height="650" fill="#f3f6fb"/><text class="head" x="600" y="38" text-anchor="middle">Khởi tạo kiểm soát thang tín hiệu, không bảo đảm toàn bộ huấn luyện</text>
  <rect class="panel" x="22" y="62" width="1156" height="255" rx="14"/><text class="head" x="600" y="100" text-anchor="middle">Hệ số truyền mômen bậc hai qua một lớp</text>
  <g class="box"><rect x="80" y="145" width="190" height="92" rx="12"/><rect x="380" y="145" width="190" height="92" rx="12"/><rect x="680" y="145" width="190" height="92" rx="12"/><rect x="980" y="145" width="150" height="92" rx="12"/></g>
  <g stroke="#33467f" stroke-width="5" marker-end="url(#arr)"><line x1="270" y1="191" x2="370" y2="191"/><line x1="570" y1="191" x2="670" y2="191"/><line x1="870" y1="191" x2="970" y2="191"/></g>
  <g class="label" text-anchor="middle"><text x="175" y="198">E[a²]</text><text x="475" y="182">nhân W</text><text x="475" y="209">và kích hoạt</text><text x="775" y="182">nhân W</text><text x="775" y="209">và kích hoạt</text><text x="1055" y="198">đầu ra</text></g>
  <text class="label" x="600" y="276" text-anchor="middle">mỗi lớp: E[a_mới²] ≈ cφ fan_in Var(W) E[a_cũ²]</text><text class="small" x="600" y="302" text-anchor="middle">cφ≈1 gần tuyến tính; cφ≈1/2 với ReLU và tiền kích hoạt gần đối xứng.</text>
  <rect class="good" x="22" y="341" width="566" height="210" rx="14"/><text class="head" x="305" y="378" text-anchor="middle">Xavier/Glorot · fan_in=4, fan_out=2</text><text class="label" x="305" y="417" text-anchor="middle">Var(W)=2/(4+2)=1/3</text><text class="label" x="305" y="452" text-anchor="middle">Std(W)=√(1/3)≈0,577</text><text class="label" x="305" y="487" text-anchor="middle">Đều cùng phương sai: U[−1;1]</text><text class="small" x="305" y="524" text-anchor="middle">Phù hợp điểm đầu cho tanh hoặc lớp gần tuyến tính.</text>
  <rect class="warn" x="612" y="341" width="566" height="210" rx="14"/><text class="head" x="895" y="378" text-anchor="middle">He · ReLU · fan_in=4</text><text class="label" x="895" y="417" text-anchor="middle">Var(W)=2/4=1/2</text><text class="label" x="895" y="452" text-anchor="middle">Std(W)=√(1/2)≈0,707</text><text class="label" x="895" y="487" text-anchor="middle">Đều cùng phương sai: U[−1,225;1,225]</text><text class="small" x="895" y="524" text-anchor="middle">Hệ số 1/2 của ReLU được bù bằng phương sai 2/fan_in.</text>
  <rect x="180" y="575" width="840" height="48" rx="10" fill="#fff" stroke="#8b98aa" stroke-width="2"/><text class="small" x="600" y="605" text-anchor="middle">Var là phương sai; Std là độ lệch chuẩn. Các quan hệ trên là xấp xỉ tại khởi tạo dưới giả thiết đã nêu.</text>
</svg>

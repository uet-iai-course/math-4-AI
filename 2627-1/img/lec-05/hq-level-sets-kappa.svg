<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Đường mức của hai hàm bậc hai với số điều kiện 2 và 50</title><desc id="desc">Hai khung. Trái: κ = 2, các elip mức gần tròn, tỉ lệ bán trục √2 ≈ 1,41. Phải: κ = 50, các elip mức rất dẹt, tỉ lệ bán trục √50 ≈ 7,07; theo trục dài hàm gần như phẳng.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#263238"><line x1="20.0" y1="175.0" x2="310.0" y2="175.0" stroke="#d5d9db" stroke-width="1.5"/><line x1="165.0" y1="45.0" x2="165.0" y2="305.0" stroke="#d5d9db" stroke-width="1.5"/><ellipse cx="165" cy="175" rx="34.7" ry="24.5" fill="none" stroke="#2F3E7A" stroke-width="2.5"/><ellipse cx="165" cy="175" rx="69.4" ry="49.0" fill="none" stroke="#2F3E7A" stroke-width="2.5"/><ellipse cx="165" cy="175" rx="104.0" ry="73.6" fill="none" stroke="#2F3E7A" stroke-width="2.5"/><circle cx="165.0" cy="175.0" r="4" fill="#263238" stroke="#263238" stroke-width="2.5"/><text x="165.0" y="32.0" text-anchor="middle" font-size="22" fill="#263238" font-weight="600">κ = 2</text><text x="165.0" y="330.0" text-anchor="middle" font-size="19" fill="#263238">bán trục: tỉ lệ √2 ≈ 1,41</text><line x1="330.0" y1="175.0" x2="620.0" y2="175.0" stroke="#d5d9db" stroke-width="1.5"/><line x1="475.0" y1="45.0" x2="475.0" y2="305.0" stroke="#d5d9db" stroke-width="1.5"/><ellipse cx="475" cy="175" rx="45.9" ry="6.5" fill="none" stroke="#B15A2B" stroke-width="2.5"/><ellipse cx="475" cy="175" rx="91.8" ry="13.0" fill="none" stroke="#B15A2B" stroke-width="2.5"/><ellipse cx="475" cy="175" rx="137.7" ry="19.5" fill="none" stroke="#B15A2B" stroke-width="2.5"/><circle cx="475.0" cy="175.0" r="4" fill="#263238" stroke="#263238" stroke-width="2.5"/><text x="475.0" y="32.0" text-anchor="middle" font-size="22" fill="#263238" font-weight="600">κ = 50</text><text x="475.0" y="330.0" text-anchor="middle" font-size="19" fill="#263238">bán trục: tỉ lệ √50 ≈ 7,07</text><text x="475.0" y="250.0" text-anchor="middle" font-size="18" fill="#B15A2B">trục dài: hướng gần phẳng</text></g></svg>

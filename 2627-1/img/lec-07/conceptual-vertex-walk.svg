<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Đường đỉnh kề trên miền hộp hạt</title>
  <desc id="desc">Miền khả thi hộp hạt có năm đỉnh. Đường tô đậm đi từ không, không đến ba mươi, không rồi ba mươi, mười hai; giá trị mục tiêu tương ứng là không, sáu mươi và chín mươi sáu.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b15a2b"/></marker></defs>
  <rect width="920" height="500" fill="#fff"/>
  <path d="M120 420L620 420L620 215L365 85L120 85Z" fill="#edf3ff" stroke="#2f3e7a" stroke-width="5"/>
  <path d="M120 420L620 420L620 215" fill="none" stroke="#b15a2b" stroke-width="10" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
  <g fill="#fff" stroke="#2f3e7a" stroke-width="5"><circle cx="120" cy="420" r="13"/><circle cx="620" cy="420" r="13"/><circle cx="620" cy="215" r="13"/><circle cx="365" cy="85" r="13"/><circle cx="120" cy="85" r="13"/></g>
  <circle cx="620" cy="215" r="15" fill="#2e7d32" stroke="#fff" stroke-width="4"/>
  <g font-family="sans-serif" font-size="30" fill="#222" text-anchor="middle"><text x="120" y="468">(0,0) · 0</text><text x="620" y="468">(30,0) · 60</text><text x="770" y="220" font-weight="700" fill="#2e7d32">(30,12) · 96</text></g>
  <text x="275" y="370" font-family="sans-serif" font-size="32" font-weight="700" fill="#b15a2b">cải thiện</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 190 700 310" role="img" aria-labelledby="title desc">
  <title id="title">Đường đi qua các đỉnh kề của bài hộp hạt</title>
  <desc id="desc">Miền khả thi hộp hạt với năm đỉnh và giá trị z. Đường đi tô đậm từ (0,0) với z bằng 0 sang (30,0) với z bằng 60, rồi lên (30,12) với z bằng 96. Tại (30,12), hai đỉnh kề là (30,0) với z bằng 60 và (14,20) với z bằng 88, đều nhỏ hơn 96, nên thuật toán dừng.</desc>
  <defs><marker id="aw" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="11" refY="11" orient="auto"><path d="M0 2L20 11L0 20Z" fill="#b15a2b"/></marker></defs>
  <rect x="20" y="190" width="700" height="310" fill="#fff"/>
  <path d="M80 450L410 450L410 318L234 230L80 230Z" fill="#eef3fc" stroke="#2f3e7a" stroke-width="4"/>
  <line x1="80" y1="450" x2="410" y2="450" stroke="#b15a2b" stroke-width="8"/>
  <line x1="410" y1="450" x2="410" y2="318" stroke="#b15a2b" stroke-width="8"/>
  <line x1="230" y1="450" x2="260" y2="450" stroke="none" marker-end="url(#aw)"/>
  <line x1="410" y1="400" x2="410" y2="370" stroke="none" marker-end="url(#aw)"/>
  <g stroke="#fff" stroke-width="3"><circle cx="80" cy="450" r="10" fill="#b15a2b"/><circle cx="410" cy="450" r="10" fill="#b15a2b"/><circle cx="410" cy="318" r="12" fill="#2e7d32"/><circle cx="234" cy="230" r="9" fill="#7a8aa8"/><circle cx="80" cy="230" r="9" fill="#7a8aa8"/></g>
  <g font-family="sans-serif" font-size="25">
    <text x="60" y="484" fill="#b15a2b" font-weight="700">(0,0): 0</text>
    <text x="360" y="484" fill="#b15a2b" font-weight="700">(30,0): 60</text>
    <text x="428" y="324" fill="#2e7d32" font-weight="700">(30,12): 96</text>
    <text x="242" y="218" fill="#55627e">(14,20): 88</text>
    <text x="40" y="218" fill="#55627e">(0,20): 60</text>
    <text x="250" y="430" fill="#b15a2b">bước 1</text>
    <text x="420" y="398" fill="#b15a2b">bước 2</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 150 640 380" role="img" aria-labelledby="title desc">
  <title id="title">Hai đường đơn hình trên bài toán hộp hạt</title>
  <desc id="desc">Ngũ giác khả thi của bài toán hộp hạt với giá trị z tại năm đỉnh: (0,0) là 0, (30,0) là 60, (30,12) là 96, (14,20) là 88, (0,20) là 60. Đường liền nét, biến vào có chi phí rút gọn lớn nhất: (0,0) lên (0,20), sang (14,20), xuống (30,12), ba bước, z đi 0, 60, 88, 96. Đường nét đứt, x1 vào trước: (0,0) sang (30,0), lên (30,12), hai bước, z đi 0, 60, 96. Cả hai dừng tại (30,12).</desc>
  <defs>
    <marker id="pb" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0 2L20 11L0 20Z" fill="#2f3e7a"/></marker>
    <marker id="po" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0 2L20 11L0 20Z" fill="#b15a2b"/></marker>
  </defs>
  <rect x="-10" y="150" width="640" height="380" fill="#fff"/>
  <path d="M80 450L410 450L410 318L234 230L80 230Z" fill="#eef3fc" stroke="#9aa6c2" stroke-width="3"/>
  <g stroke="#2f3e7a" stroke-width="7" fill="none">
    <line x1="80" y1="440" x2="80" y2="244" marker-end="url(#pb)"/>
    <line x1="84" y1="230" x2="220" y2="230" marker-end="url(#pb)"/>
    <line x1="238" y1="232" x2="398" y2="312" marker-end="url(#pb)"/>
  </g>
  <g stroke="#b15a2b" stroke-width="7" stroke-dasharray="16 9" fill="none">
    <line x1="90" y1="450" x2="396" y2="450" marker-end="url(#po)"/>
    <line x1="410" y1="446" x2="410" y2="332" marker-end="url(#po)"/>
  </g>
  <g stroke="#fff" stroke-width="3"><circle cx="80" cy="450" r="10" fill="#222"/><circle cx="410" cy="450" r="9" fill="#b15a2b"/><circle cx="410" cy="318" r="12" fill="#2e7d32"/><circle cx="234" cy="230" r="9" fill="#2f3e7a"/><circle cx="80" cy="230" r="9" fill="#2f3e7a"/></g>
  <g font-family="sans-serif" font-size="25" fill="#222">
    <text x="68" y="486" text-anchor="end">(0,0): 0</text>
    <text x="410" y="486" text-anchor="middle" fill="#b15a2b">(30,0): 60</text>
    <text x="428" y="314" fill="#2e7d32" font-weight="700">(30,12): 96</text>
    <text x="250" y="212" text-anchor="middle" fill="#2f3e7a">(14,20): 88</text>
    <text x="70" y="212" text-anchor="middle" fill="#2f3e7a">(0,20): 60</text>
  </g>
  <g font-family="sans-serif" font-size="23">
    <line x1="0" y1="508" x2="40" y2="508" stroke="#2f3e7a" stroke-width="7"/>
    <text x="50" y="516" fill="#2f3e7a">c̄ lớn nhất vào: 3 bước</text>
    <line x1="330" y1="508" x2="370" y2="508" stroke="#b15a2b" stroke-width="7" stroke-dasharray="12 7"/>
    <text x="380" y="516" fill="#b15a2b">x₁ vào trước: 2 bước</text>
  </g>
</svg>

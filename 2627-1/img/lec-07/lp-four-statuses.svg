<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Bốn kết cục của quy hoạch tuyến tính</title>
  <desc id="desc">Bốn ô minh họa bằng hình và nhãn: miền rỗng, mục tiêu không bị chặn, một điểm tối ưu duy nhất và cả một cạnh gồm nhiều nghiệm tối ưu.</desc>
  <rect width="960" height="470" fill="#fff"/>
  <g font-family="sans-serif" font-size="30" fill="#222" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(20 20)"><rect width="440" height="195" rx="12" fill="#fff6f3" stroke="#a33a1f" stroke-width="3"/><text x="20" y="38" font-size="34" font-weight="700">Không khả thi</text><line x1="70" y1="155" x2="370" y2="65" stroke="#2f3e7a" stroke-width="5"/><line x1="70" y1="105" x2="370" y2="15" stroke="#b15a2b" stroke-width="5"/><text x="165" y="181" fill="#a33a1f">P rỗng</text></g>
    <g transform="translate(500 20)"><rect width="440" height="195" rx="12" fill="#f2f6ff" stroke="#2f3e7a" stroke-width="3"/><text x="20" y="38" font-size="34" font-weight="700">Không bị chặn</text><path d="M65 160L170 75L430 75L430 160Z" fill="#e7eefb" stroke="none"/><path d="M65 160L170 75L405 75M65 160L405 160" fill="none" stroke="#2f3e7a" stroke-width="4"/><path d="M390 65L415 75L390 85M390 150L415 160L390 170" fill="none" stroke="#2f3e7a" stroke-width="4"/><path d="M235 145L355 95M355 95L330 93M355 95L340 116" stroke="#b15a2b" stroke-width="5"/></g>
    <g transform="translate(20 245)"><rect width="440" height="195" rx="12" fill="#f3fbf4" stroke="#2e7d32" stroke-width="3"/><text x="20" y="38" font-size="34" font-weight="700">Tối ưu duy nhất</text><path d="M70 160L150 70L360 110L320 160Z" fill="#e6f4e8" stroke="#2f3e7a" stroke-width="4"/><circle cx="150" cy="70" r="11" fill="#2e7d32"/><text x="180" y="82" fill="#2e7d32">một điểm</text></g>
    <g transform="translate(500 245)"><rect width="440" height="195" rx="12" fill="#fff9ed" stroke="#b15a2b" stroke-width="3"/><text x="20" y="38" font-size="34" font-weight="700">Nhiều tối ưu</text><path d="M70 160L150 70L360 70L320 160Z" fill="#fff1d6" stroke="#2f3e7a" stroke-width="4"/><line x1="150" y1="70" x2="360" y2="70" stroke="#b15a2b" stroke-width="10"/><text x="185" y="118" fill="#b15a2b">cả cạnh</text></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Từ dữ kiện đến mô hình quy hoạch tuyến tính</title>
  <desc id="desc">Sơ đồ bốn bước nối dữ kiện có đơn vị với biến quyết định, ràng buộc và mục tiêu của bài hộp hạt.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#294f7c"/></marker></defs>
  <rect width="900" height="520" rx="24" fill="#f7f9fc"/>
  <text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Kiểm đơn vị trước khi viết LP</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="35" y="120" width="180" height="235" rx="18" fill="#e8f1fb" stroke="#2e6098" stroke-width="4"/><text x="125" y="165" font-size="28" font-weight="700" fill="#17365d">Dữ kiện</text><text x="125" y="205" font-size="18" fill="#24344d">x: nghìn hộp</text><text x="125" y="245" font-size="18" fill="#24344d">giới hạn: 30 và 20</text><text x="125" y="280" font-size="18" fill="#24344d">nguồn: 54 giờ máy</text><text x="125" y="315" font-size="16" fill="#24344d">tiêu hao: 1, 2 giờ/nghìn</text></g>
    <g><rect x="255" y="120" width="170" height="235" rx="18" fill="#edf7f1" stroke="#24714f" stroke-width="4"/><text x="340" y="165" font-size="28" font-weight="700" fill="#174936">Biến</text><text x="340" y="220" font-size="17" fill="#24344d">x1: nghìn hộp loại 1</text><text x="340" y="265" font-size="17" fill="#24344d">x2: nghìn hộp loại 2</text><text x="340" y="315" font-size="21" fill="#24344d">x1, x2 ≥ 0</text></g>
    <g><rect x="465" y="120" width="190" height="235" rx="18" fill="#fff5e7" stroke="#ad651f" stroke-width="4"/><text x="560" y="165" font-size="28" font-weight="700" fill="#714014">Ràng buộc</text><text x="560" y="215" font-size="24" fill="#24344d">x1 ≤ 30</text><text x="560" y="255" font-size="24" fill="#24344d">x2 ≤ 20</text><text x="560" y="295" font-size="24" fill="#24344d">x1+2x2 ≤ 54</text></g>
    <g><rect x="695" y="120" width="170" height="235" rx="18" fill="#f3ecfb" stroke="#6945a4" stroke-width="4"/><text x="780" y="165" font-size="28" font-weight="700" fill="#452675">Mục tiêu</text><text x="780" y="225" font-size="24" fill="#24344d">cực đại</text><text x="780" y="275" font-size="26" font-weight="700" fill="#452675">2x1+3x2</text><text x="780" y="320" font-size="22" fill="#24344d">đơn vị lợi ích</text></g>
  </g>
  <g stroke="#294f7c" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M215 238 H247"/><path d="M425 238 H457"/><path d="M655 238 H687"/></g>
  <rect x="105" y="405" width="690" height="70" rx="16" fill="#ffffff" stroke="#9aabc2" stroke-width="3"/>
  <text x="450" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#172033">Chỉ cộng các đại lượng có đơn vị tương thích</text>
  <text x="450" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#172033">trong cùng một ràng buộc.</text>
</svg>

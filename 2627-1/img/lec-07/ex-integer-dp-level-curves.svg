<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d">
<title id="t">Đường mức z = 110 gần cạnh x1 + 2x2 = 25</title>
<desc id="d">Phần miền khả thi với 8 ≤ x1 ≤ 20, 2 ≤ x2 ≤ 9,5. Các điểm nguyên khả thi vẽ bằng chấm xám nhỏ. Cạnh x1 + 2x2 = 25 là đoạn thẳng xanh đậm. Đường mức z = 110, tức (x1 + 1)(x2 + 2) = 112, là đường cong xanh lá đi qua hai điểm nguyên (13,6) và (15,5), đánh dấu bằng chấm xanh lá lớn. Điểm (14; 5,5) trên cạnh, nơi nới lỏng liên tục đạt 110,5, đánh dấu bằng vòng tròn rỗng màu cam. Không điểm nguyên khả thi nào khác nằm trên hoặc phía trên đường mức.</desc>

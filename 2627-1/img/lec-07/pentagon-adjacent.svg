<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 170 620 330" role="img" aria-labelledby="title desc">
  <title id="title">Các đỉnh kề của đỉnh (30,0) trên miền hộp hạt</title>
  <desc id="desc">Ngũ giác khả thi của bài toán hộp hạt với năm đỉnh (0,0), (30,0), (30,12), (14,20), (0,20). Đỉnh (30,0) được tô đậm. Hai cạnh xuất phát từ (30,0) được tô đậm: cạnh trên đường x2 = 0 nối tới (0,0) và cạnh trên đường x1 = 30 nối tới (30,12); hai đỉnh này kề (30,0). Đỉnh (14,20) để nhạt, nối với (30,0) bằng nét đứt mảnh có nhãn không kề, vì hai đỉnh không có ràng buộc hoạt động chung.</desc>
  <rect x="-10" y="170" width="620" height="330" fill="#fff"/>
  <line x1="60" y1="450" x2="560" y2="450" stroke="#222" stroke-width="3"/>
  <line x1="80" y1="470" x2="80" y2="190" stroke="#222" stroke-width="3"/>
  <path d="M80 450L410 450L410 318L234 230L80 230Z" fill="#e7eefb" stroke="#2f3e7a" stroke-width="5"/>
  <line x1="80" y1="450" x2="410" y2="450" stroke="#b15a2b" stroke-width="8"/>
  <line x1="410" y1="450" x2="410" y2="318" stroke="#b15a2b" stroke-width="8"/>
  <line x1="410" y1="450" x2="234" y2="230" stroke="#7a8aa8" stroke-width="3" stroke-dasharray="10 8"/>
  <g stroke="#fff" stroke-width="3"><circle cx="80" cy="450" r="10" fill="#b15a2b"/><circle cx="410" cy="318" r="10" fill="#b15a2b"/><circle cx="234" cy="230" r="9" fill="#a9b4c8"/><circle cx="80" cy="230" r="9" fill="#2f3e7a"/><circle cx="410" cy="450" r="13" fill="#2e7d32"/></g>
  <g font-family="sans-serif" font-size="26" fill="#222">
    <text x="568" y="458">x₁</text>
    <text x="92" y="200">x₂</text>
    <text x="70" y="222" text-anchor="end">(0,20)</text>
  </g>
  <g font-family="sans-serif" font-size="26">
    <text x="420" y="488" font-weight="700" fill="#2e7d32">(30,0)</text>
    <text x="70" y="488" text-anchor="end" fill="#b15a2b" font-weight="700">(0,0)</text>
    <text x="96" y="488" fill="#b15a2b">kề</text>
    <text x="424" y="314" fill="#b15a2b" font-weight="700">(30,12)</text>
    <text x="424" y="344" fill="#b15a2b">kề</text>
    <text x="234" y="216" text-anchor="middle" fill="#8a95aa">(14,20)</text>
    <text x="290" y="350" text-anchor="end" fill="#55627e">không kề</text>
    <text x="230" y="436" text-anchor="middle" fill="#b15a2b">x₂ = 0</text>
    <text x="424" y="402" fill="#b15a2b">x₁ = 30</text>
  </g>
</svg>

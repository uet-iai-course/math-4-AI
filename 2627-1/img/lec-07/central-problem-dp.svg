<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 350" role="img" aria-labelledby="title desc">
  <title id="title">Một chuỗi quyết định: đồ thị ba tầng có bốn đường đi</title>
  <desc id="desc">Đồ thị ba tầng từ nút s qua A, B rồi C, D đến nút t; có bốn đường đi từ s đến t.</desc>
  <rect width="420" height="350" fill="#fff"/>
  <text x="210" y="34" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#24714f">Một chuỗi quyết định</text>
  <g stroke="#7a8aa8" stroke-width="3">
    <line x1="50" y1="190" x2="150" y2="110"/><line x1="50" y1="190" x2="150" y2="270"/>
    <line x1="150" y1="110" x2="270" y2="110"/><line x1="150" y1="110" x2="270" y2="270"/>
    <line x1="150" y1="270" x2="270" y2="110"/><line x1="150" y1="270" x2="270" y2="270"/>
    <line x1="270" y1="110" x2="370" y2="190"/><line x1="270" y1="270" x2="370" y2="190"/>
  </g>
  <g fill="#edf7f1" stroke="#24714f" stroke-width="3"><circle cx="50" cy="190" r="24"/><circle cx="150" cy="110" r="24"/><circle cx="150" cy="270" r="24"/><circle cx="270" cy="110" r="24"/><circle cx="270" cy="270" r="24"/><circle cx="370" cy="190" r="24"/></g>
  <g font-family="sans-serif" font-size="24" font-weight="700" fill="#174936" text-anchor="middle">
    <text x="50" y="198">s</text><text x="150" y="118">A</text><text x="150" y="278">B</text><text x="270" y="118">C</text><text x="270" y="278">D</text><text x="370" y="198">t</text>
  </g>
  <text x="210" y="335" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#24714f">4 đường đi s → t</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 150 660 360" role="img" aria-labelledby="title desc">
  <title id="title">Đỉnh suy biến (30,0) khi thêm giới hạn tổng sản lượng</title>
  <desc id="desc">Miền khả thi của bài toán hộp hạt khi thêm ràng buộc x1 + x2 ≤ 30 là tứ giác với bốn đỉnh (0,0), (30,0), (10,20), (0,20), có giá trị z lần lượt 0, 60, 80, 60. Ba đường biên x2 = 0, x1 = 30 (tức s1 = 0) và x1 + x2 = 30 (tức s4 = 0) cùng đi qua đỉnh (30,0), nên đỉnh này suy biến. Đỉnh tối ưu là (10,20) với z bằng 80.</desc>
  <rect x="-10" y="150" width="660" height="360" fill="#fff"/>
  <line x1="60" y1="450" x2="600" y2="450" stroke="#222" stroke-width="3"/>
  <line x1="80" y1="470" x2="80" y2="170" stroke="#222" stroke-width="3"/>
  <path d="M80 450L410 450L190 230L80 230Z" fill="#e7eefb" stroke="#2f3e7a" stroke-width="4"/>
  <line x1="410" y1="480" x2="410" y2="290" stroke="#b15a2b" stroke-width="5"/>
  <line x1="168" y1="208" x2="452" y2="492" stroke="#b15a2b" stroke-width="5"/>
  <line x1="80" y1="450" x2="560" y2="450" stroke="#b15a2b" stroke-width="5"/>
  <g stroke="#fff" stroke-width="3"><circle cx="80" cy="450" r="9" fill="#2f3e7a"/><circle cx="410" cy="450" r="13" fill="#b15a2b"/><circle cx="190" cy="230" r="11" fill="#2e7d32"/><circle cx="80" cy="230" r="9" fill="#2f3e7a"/></g>
  <g font-family="sans-serif" font-size="25" fill="#222">
    <text x="608" y="458">x₁</text>
    <text x="92" y="182">x₂</text>
    <text x="70" y="486" text-anchor="end">(0,0): 0</text>
    <text x="92" y="264">(0,20): 60</text>
    <text x="206" y="222" fill="#2e7d32" font-weight="700">(10,20): 80</text>
    <text x="398" y="488" text-anchor="end" fill="#b15a2b" font-weight="700">(30,0): 60</text>
    <text x="420" y="304" fill="#b15a2b">x₁ = 30 (s₁ = 0)</text>
    <text x="255" y="264" fill="#b15a2b">x₁ + x₂ = 30 (s₄ = 0)</text>
    <text x="470" y="440" fill="#b15a2b">x₂ = 0</text>
  </g>
</svg>

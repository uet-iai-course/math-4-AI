<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Gộp lịch sử bằng trạng thái đủ</title>
  <desc id="desc">Ba lịch sử khác nhau hội tụ về cùng trạng thái C. Từ C, một bài toán con duy nhất được tính và dùng lại cho cả ba lịch sử.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#294f7c"/></marker></defs>
  <rect width="900" height="520" rx="24" fill="#f7f9fc"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Trạng thái đủ tránh tính lại cùng một phần đuôi</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="130" y="105" font-size="26" fill="#24344d">Các lịch sử</text><text x="450" y="105" font-size="26" fill="#24344d">Trạng thái đủ</text><text x="755" y="105" font-size="26" fill="#24344d">Bài toán con</text>
    <g fill="#e8f1fb" stroke="#2e6098" stroke-width="4"><rect x="45" y="145" width="175" height="70" rx="16"/><rect x="45" y="250" width="175" height="70" rx="16"/><rect x="45" y="355" width="175" height="70" rx="16"/></g>
    <g font-size="24" fill="#17365d"><text x="132" y="190">s→A→C</text><text x="132" y="295">s→B→C</text><text x="132" y="400">lịch sử khác</text></g>
    <circle cx="450" cy="285" r="92" fill="#fff5e7" stroke="#ad651f" stroke-width="5"/><text x="450" y="270" font-size="27" font-weight="700" fill="#714014">Trạng thái C</text><text x="450" y="310" font-size="22" fill="#24344d">tương lai như nhau</text>
    <rect x="650" y="205" width="210" height="160" rx="20" fill="#edf7f1" stroke="#24714f" stroke-width="4"/><text x="755" y="255" font-size="28" font-weight="700" fill="#174936">Tính một lần</text><text x="755" y="305" font-size="28" fill="#24344d">J(C)=3</text><text x="755" y="345" font-size="24" fill="#24344d">rồi dùng lại</text>
  </g>
  <g stroke="#294f7c" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M220 180 C315 180 320 230 370 255"/><path d="M220 285 H360"/><path d="M220 390 C315 390 320 340 370 315"/><path d="M535 285 H642"/></g>
  <text x="450" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#172033">Chỉ gộp khi quá khứ không còn ảnh hưởng tới tương lai</text>
  <text x="450" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#172033">ngoài thông tin đã giữ trong trạng thái.</text>
</svg>

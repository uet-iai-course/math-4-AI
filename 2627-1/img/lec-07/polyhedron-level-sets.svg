<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Miền khả thi và đường mức của bài hộp hạt</title>
  <desc id="desc">Đa giác khả thi có năm đỉnh. Đường mức nét đứt z bằng bảy mươi hai đi qua không, hai mươi bốn và ba mươi sáu, không; đường đỏ song song z bằng chín mươi sáu đi qua đỉnh ba mươi, mười hai.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b15a2b"/></marker></defs>
  <rect width="900" height="520" fill="#fff"/>
  <line x1="95" y1="445" x2="560" y2="445" stroke="#222" stroke-width="3"/><line x1="95" y1="445" x2="95" y2="65" stroke="#222" stroke-width="3"/>
  <path d="M95 445L425 445L425 241L249 105L95 105Z" fill="#e7eefb" stroke="#2f3e7a" stroke-width="5"/>
  <line x1="95" y1="37" x2="491" y2="445" stroke="#9aa8c7" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="191" y1="-0.0909" x2="623" y2="445" stroke="#b15a2b" stroke-width="5"/>
  <g fill="#2e7d32" stroke="#fff" stroke-width="3"><circle cx="95" cy="445" r="9"/><circle cx="425" cy="445" r="9"/><circle cx="425" cy="241" r="11"/><circle cx="249" cy="105" r="9"/><circle cx="95" cy="105" r="9"/></g>
  <g font-family="sans-serif" font-size="30" fill="#222"><text x="565" y="455" font-size="32">x1</text><text x="62" y="58" font-size="32">x2</text><text x="105" y="482">(0,0)</text><text x="355" y="482">(30,0)</text><text x="443" y="235" font-size="32" font-weight="700" fill="#2e7d32">(30,12) · 96</text><text x="210" y="92">(14,20)</text><text x="105" y="96">(0,20)</text><text x="285" y="205" fill="#2f3e7a">mức 72</text><text x="545" y="365" fill="#b15a2b">mức 96</text></g>

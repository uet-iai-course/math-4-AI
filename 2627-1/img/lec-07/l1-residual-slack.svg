<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Biến phụ cho trị tuyệt đối</title>
  <desc id="desc">Bên trái là đồ thị chữ V của trị tuyệt đối. Bên phải là hai bất đẳng thức t lớn hơn hoặc bằng r và âm r, cùng mục tiêu kéo t xuống.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#294f7c"/></marker></defs>
  <rect width="900" height="520" rx="24" fill="#f7f9fc"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Trị tuyệt đối trở thành hai ràng buộc tuyến tính</text>
  <g transform="translate(55 95)" font-family="Arial,sans-serif">
    <line x1="35" y1="310" x2="360" y2="310" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/><line x1="195" y1="350" x2="195" y2="25" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M65 60 L195 310 L325 60" fill="none" stroke="#b64b22" stroke-width="8"/>
    <text x="342" y="347" font-size="26" fill="#172033">r</text><text x="212" y="35" font-size="26" fill="#172033">t</text><text x="80" y="92" font-size="25" fill="#b64b22">t = −r</text><text x="275" y="92" font-size="25" fill="#b64b22">t = r</text>
    <circle cx="250" cy="205" r="8" fill="#294f7c"/><text x="265" y="208" font-size="24" fill="#24344d">t = |r|</text>
  </g>
  <path d="M420 255 H485" stroke="#294f7c" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="505" y="112" width="340" height="260" rx="20" fill="#edf7f1" stroke="#24714f" stroke-width="4"/>
    <text x="675" y="165" font-size="29" font-weight="700" fill="#174936">Miền epigraph</text>
    <text x="675" y="220" font-size="30" fill="#172033">t ≥ r</text><text x="675" y="265" font-size="30" fill="#172033">t ≥ −r</text><text x="675" y="315" font-size="28" fill="#6945a4">cực tiểu t</text>
    <text x="675" y="415" font-size="26" fill="#24344d">Tại tối ưu: t = |r|</text>
  </g>
</svg>

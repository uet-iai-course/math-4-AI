<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 40 500 400" role="img" aria-labelledby="title desc">
  <title id="title">Trị tuyệt đối qua hai ràng buộc tuyến tính</title>
  <desc id="desc">Đồ thị chữ V của t bằng trị tuyệt đối của r. Vùng phía trên chữ V được tô, là tập các điểm thỏa t lớn hơn hoặc bằng r và t lớn hơn hoặc bằng âm r. Trên một đường thẳng đứng tại r cố định, giá trị t nhỏ nhất trong vùng tô nằm trên chữ V, bằng trị tuyệt đối của r.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#b15a2b"/></marker></defs>
  <rect x="20" y="40" width="500" height="400" fill="#fff"/>
  <path d="M60 180L260 380L460 180L460 70L60 70Z" fill="#e3f1e8"/>
  <line x1="40" y1="380" x2="480" y2="380" stroke="#222" stroke-width="3"/>
  <line x1="260" y1="420" x2="260" y2="55" stroke="#222" stroke-width="3"/>
  <polyline points="60,180 260,380 460,180" fill="none" stroke="#2f3e7a" stroke-width="5"/>
  <line x1="350" y1="380" x2="350" y2="70" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="350" y1="105" x2="350" y2="270" stroke="#b15a2b" stroke-width="4" marker-end="url(#arr)"/>
  <circle cx="350" cy="290" r="9" fill="#b15a2b" stroke="#fff" stroke-width="3"/>
  <g font-family="sans-serif" font-size="26" fill="#222">
    <text x="488" y="390">r</text>
    <text x="270" y="62">t</text>
    <text x="45" y="300" fill="#2f3e7a">t = −r</text>
    <text x="395" y="320" fill="#2f3e7a">t = r</text>
    <text x="100" y="112" fill="#24714f" font-weight="700">t ≥ r</text><text x="100" y="148" fill="#24714f" font-weight="700">t ≥ −r</text>
    <text x="338" y="300" text-anchor="end" fill="#b15a2b" font-weight="700">t = |r|</text>
    <text x="362" y="100" fill="#b15a2b">giảm t</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 170 620 330" role="img" aria-labelledby="title desc">
  <title id="title">Cả một cạnh tối ưu với mục tiêu 2x1 + 4x2</title>
  <desc id="desc">Ngũ giác khả thi của bài toán hộp hạt với năm đỉnh. Đường mức 2x1 + 4x2 = 108 trùng đường giờ máy x1 + 2x2 = 54; cạnh nối (30,12) và (14,20) được tô đậm, mọi điểm của cạnh này tối ưu, kể cả trung điểm (22,16). Mũi tên chỉ hướng c = (2,4), vuông góc với cạnh đó.</desc>
  <defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0 2L20 11L0 20Z" fill="#b15a2b"/></marker></defs>
  <rect x="-10" y="170" width="620" height="330" fill="#fff"/>
  <line x1="60" y1="450" x2="560" y2="450" stroke="#222" stroke-width="3"/>
  <line x1="80" y1="470" x2="80" y2="190" stroke="#222" stroke-width="3"/>
  <path d="M80 450L410 450L410 318L234 230L80 230Z" fill="#e7eefb" stroke="#2f3e7a" stroke-width="5"/>
  <line x1="146" y1="186" x2="586" y2="406" stroke="#b15a2b" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="234" y1="230" x2="410" y2="318" stroke="#b15a2b" stroke-width="9"/>
  <line x1="322" y1="274" x2="352" y2="214" stroke="#b15a2b" stroke-width="4" marker-end="url(#ar)"/>
  <g stroke="#fff" stroke-width="3"><circle cx="80" cy="450" r="9" fill="#2f3e7a"/><circle cx="410" cy="450" r="9" fill="#2f3e7a"/><circle cx="80" cy="230" r="9" fill="#2f3e7a"/><circle cx="410" cy="318" r="11" fill="#2e7d32"/><circle cx="234" cy="230" r="11" fill="#2e7d32"/><circle cx="322" cy="274" r="8" fill="#2e7d32"/></g>
  <g font-family="sans-serif" font-size="26" fill="#222">
    <text x="568" y="458">x₁</text>
    <text x="92" y="200">x₂</text>
    <text x="70" y="486" text-anchor="end">(0,0)</text>
    <text x="420" y="486">(30,0)</text>
    <text x="70" y="222" text-anchor="end">(0,20)</text>
  </g>
  <g font-family="sans-serif" font-size="26" font-weight="700" fill="#2e7d32">
    <text x="398" y="350" text-anchor="end">(30,12)</text>
    <text x="222" y="264" text-anchor="end">(14,20)</text>
    <text x="310" y="306" text-anchor="end">(22,16)</text>
  </g>
  <g font-family="sans-serif" font-size="26" fill="#b15a2b">
    <text x="364" y="214">c = (2,4)</text>
    <text x="490" y="340">z = 108</text>
  </g>
</svg>

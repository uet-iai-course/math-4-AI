<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Bản đồ chọn quy hoạch tuyến tính hoặc quy hoạch động</title>
  <desc id="desc">Một nút phân loại, ghi kiểm tra giả thiết trước khi chọn công cụ, tách quyết định một lần có quan hệ tuyến tính sang quy hoạch tuyến tính và chuỗi quyết định có trạng thái đủ sang quy hoạch động hữu hạn tất định. Dòng chú thích: biến nguyên hoặc chuyển ngẫu nhiên nằm ngoài phạm vi hai lớp mô hình đang xét.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0,2 L18,10 L0,18 z" fill="#294f7c"/></marker></defs>
  <rect width="900" height="520" rx="24" fill="#f7f9fc"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Chọn theo cấu trúc quyết định</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="215" y="88" width="470" height="100" rx="18" fill="#ffffff" stroke="#294f7c" stroke-width="4"/><text x="450" y="126" font-size="25" font-weight="700" fill="#172033">Quyết định có cấu trúc nào?</text><text x="450" y="163" font-size="22" fill="#24344d">Kiểm tra giả thiết trước khi chọn công cụ</text>
    <rect x="35" y="265" width="370" height="185" rx="20" fill="#e8f1fb" stroke="#2e6098" stroke-width="4"/><text x="220" y="307" font-size="28" font-weight="700" fill="#17365d">Quy hoạch tuyến tính</text><text x="220" y="346" font-size="23" fill="#24344d">Một véc-tơ quyết định</text><text x="220" y="382" font-size="22" fill="#24344d">Mục tiêu và ràng buộc tuyến tính</text><text x="220" y="420" font-size="22" fill="#2e6098">Đa diện · cơ sở · điểm cực biên</text>
    <rect x="495" y="265" width="370" height="185" rx="20" fill="#edf7f1" stroke="#24714f" stroke-width="4"/><text x="680" y="307" font-size="28" font-weight="700" fill="#174936">Quy hoạch động</text><text x="680" y="346" font-size="23" fill="#24344d">Chuỗi quyết định hữu hạn</text><text x="680" y="382" font-size="22" fill="#24344d">Trạng thái đủ và chi phí cộng</text><text x="680" y="420" font-size="22" fill="#24714f">Bellman · giải ngược · chính sách</text>
    <text x="258" y="222" font-size="23" fill="#17365d" text-anchor="end">một lần, tuyến tính</text><text x="642" y="222" font-size="23" fill="#174936" text-anchor="start">theo giai đoạn</text>
  </g>
  <g stroke="#294f7c" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M400 190 C350 210 285 225 240 260"/><path d="M500 190 C550 210 615 225 660 260"/></g>
  <text x="450" y="492" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#7a3e16">Biến nguyên hoặc chuyển ngẫu nhiên nằm ngoài phạm vi hai lớp mô hình đang xét.</text>
</svg>

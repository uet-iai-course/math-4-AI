  <title id="title">Đường mất mát huấn luyện và xác thực</title>
  <desc id="desc">Mất mát huấn luyện giảm liên tục; mất mát xác thực luôn lớn hơn, giảm rồi tăng. Điểm thấp nhất của đường xác thực, đánh dấu bằng đường đứt thẳng đứng, là điểm dừng sớm. Đây là sơ đồ định tính.</desc>

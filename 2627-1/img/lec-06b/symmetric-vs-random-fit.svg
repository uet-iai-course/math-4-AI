<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title desc"><title id="title">Hàm học được sau 1000 vòng với khởi tạo đối xứng và khởi tạo Glorot</title><desc id="desc">Mặt phẳng (x, y) với x từ −1,5 tới 2,5. Ba chấm tròn là ba quan sát (−1; 1), (1; 1) và (2; 2) lấy từ y = |x|. Đường nét đứt màu cam là hàm học được từ khởi tạo đối xứng: bằng 0 khi x âm và xấp xỉ x khi x dương, trùng đường xanh ở phía x dương, nên bỏ qua quan sát tại x = −1. Đường nét liền màu xanh là hàm học được từ khởi tạo Glorot: gần |x|, đi qua cả ba quan sát.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#263238">

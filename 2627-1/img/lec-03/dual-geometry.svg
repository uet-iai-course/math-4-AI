<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Tập giá trị và đường đỡ của hàm đối ngẫu</title>
  <desc id="desc">Đường cong G lấy mẫu từ u bằng x trừ 2 nhân x trừ 4 và t bằng x bình cộng 1. Vùng A bằng G cộng góc phần tư không âm mở rộng sang phải và lên trên. Đường t bằng 5 trừ 2u đi qua điểm (0, 5) và tiếp xúc nhánh dưới tại x bằng 2. Mũi tên pháp tuyến (2, 1) được vẽ vuông góc với đường trên hình; hai trục có tỉ lệ khác nhau.</desc>

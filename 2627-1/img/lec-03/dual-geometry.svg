  <path d="M60 310H690M222.5 326V20" stroke="#222" stroke-width="2.5" fill="none"/>
  <text x="82" y="48" font-size="18" fill="#2f3e7a">u≤0: khả thi gốc</text>
  <polyline points="662.5,303 583.4,302.6 511.3,301.3 445.9,299.1 387.5,296 335.9,292.1 291.3,287.3 253.4,281.6 222.5,275 198.4,267.6 181.3,259.3 170.9,250.1 167.5,240 170.9,229.1 181.3,217.3 198.4,204.6 222.5,191 253.4,176.6 291.3,161.3 335.9,145.1 387.5,128 445.9,110.1 511.3,91.3 583.4,71.6 662.5,51" fill="none" stroke="#2f3e7a" stroke-width="4"/>
  <line x1="140" y1="254" x2="360" y2="310" stroke="#b15a2b" stroke-width="3.5"/>
  <circle cx="222.5" cy="275" r="7" fill="#2e7d32"/>
  <line x1="222.5" y1="275" x2="244" y2="191" stroke="#16706a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="250" y="196" font-size="16" fill="#16706a">pháp tuyến (2,1)</text>
  <text x="232" y="269" font-size="18" fill="#2e7d32">(0,p*)=(0,5)</text>
  <text x="275" y="292" font-size="18" fill="#b15a2b">t=5−2u</text>
  <text x="530" y="78" font-size="18" fill="#2f3e7a">G</text><text x="540" y="115" text-anchor="middle" font-size="17" fill="#16706a">Tập mở rộng A = G + R₊²</text>
  <text x="693" y="329" font-size="18">u</text><text x="199" y="20" font-size="18">t</text>
  <text x="228" y="329" font-size="17">0</text><text x="199" y="281" font-size="17">5</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Hàm đối ngẫu của ví dụ xuyên suốt</title>
  <desc id="desc">Đồ thị lấy mẫu từ g lambda bằng âm lambda bình cộng 9 lambda cộng 1, chia cho 1 cộng lambda. Miền hữu hiệu lớn hơn âm một, miền khả thi đối ngẫu không âm, và cực đại đúng tại lambda bằng 2, g bằng 5.</desc>
  <rect width="720" height="320" fill="#fff"/>
  <rect x="200" y="30" width="480" height="245" fill="#f7f9fc"/>
  <path d="M70 275H690M120 300V24" stroke="#222" stroke-width="2.5" fill="none"/>
  <line x1="120" y1="30" x2="120" y2="275" stroke="#a33a1f" stroke-width="2" stroke-dasharray="7 5"/>
  <polyline points="184,311.8 200,240 220,185.8 240,152.5 260,131.3 280,117.5 300,108.8 320,103.5 340,100.8 360,100 380,100.7 400,102.5 440,108.8 480,117.5 520,128 560,139.8 600,152.5 640,166 680,180" fill="none" stroke="#2f3e7a" stroke-width="4"/>
  <circle cx="360" cy="100" r="7" fill="#2e7d32"/>
  <line x1="360" y1="100" x2="360" y2="275" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="200" y1="100" x2="360" y2="100" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="372" y="94" font-size="19" fill="#2e7d32">λ*=2, d*=5</text>
  <text x="76" y="50" font-size="16" fill="#a33a1f">g(λ)→−∞ khi λ↓−1</text>
  <text x="242" y="50" font-size="18">miền đối ngẫu: λ≥0</text>
  <text x="112" y="300" font-size="17">−1</text><text x="194" y="300" font-size="17">0</text><text x="354" y="300" font-size="17">2</text>
  <text x="692" y="300" font-size="18">λ</text><text x="152" y="25" font-size="18">g(λ)</text>
</svg>

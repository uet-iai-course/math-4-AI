  <title id="title">Hàm đối ngẫu của ví dụ xuyên suốt</title>
  <desc id="desc">Đồ thị lấy mẫu từ g lambda bằng âm lambda bình cộng 9 lambda cộng 1, chia cho 1 cộng lambda. Miền hữu hiệu lớn hơn âm một, có tiệm cận đứng tại lambda bằng âm một; miền khả thi đối ngẫu không âm được tô nền; cực đại đúng tại lambda bằng 2, g bằng 5; khoảng từ g(0) bằng 1 tới p sao bằng 5 là 4.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Thứ tự do nón sinh trên vector và ma trận đối xứng</title>
  <desc id="desc">Bên trái, nón dương dịch từ vector u chứa v nhưng không chứa w, nên u nhỏ hơn v còn u và w không so sánh được. Bên phải, thứ tự ma trận được kiểm tra bằng các trị riêng của hiệu, không phải bằng từng phần tử.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#b9c5d6;stroke-width:3}.title{font-family:DejaVu Sans;font-size:28px;font-weight:700;fill:#172033}.head{font-family:DejaVu Sans;font-size:23px;font-weight:700;fill:#2f3e7a}.txt{font-family:DejaVu Sans;font-size:19px;fill:#24324a}.small{font-family:DejaVu Sans;font-size:17px;fill:#44516a}.axis{stroke:#24324a;stroke-width:3;marker-end:url(#arrow)}.grid{stroke:#d7deea;stroke-width:1.5}.cone{fill:#e6f3ec;stroke:#2e7d32;stroke-width:3}.good{fill:#2e7d32}.bad{fill:#b15a2b}.matrix{fill:#edf4ff;stroke:#315d92;stroke-width:3}</style>
  </defs>
  <rect width="1200" height="620" fill="#f3f6fb"/>
  <text class="title" x="600" y="42" text-anchor="middle">Thứ tự sinh bởi nón: so sánh qua hiệu</text>
  <rect class="panel" x="28" y="70" width="555" height="510" rx="18"/>
  <text class="head" x="305" y="108" text-anchor="middle">Vector: nón dương theo tọa độ</text>
  <g transform="translate(82,515)">
    <g class="grid"><line x1="0" y1="-100" x2="430" y2="-100"/><line x1="0" y1="-200" x2="430" y2="-200"/><line x1="0" y1="-300" x2="430" y2="-300"/><line x1="120" y1="0" x2="120" y2="-390"/><line x1="240" y1="0" x2="240" y2="-390"/><line x1="360" y1="0" x2="360" y2="-390"/></g>
    <path class="cone" d="M120 -100 L430 -100 L430 -390 L120 -390 Z" opacity=".82"/>
    <line class="axis" x1="0" y1="0" x2="445" y2="0"/><line class="axis" x1="0" y1="0" x2="0" y2="-405"/>
    <circle class="good" cx="120" cy="-100" r="9"/><text class="txt" x="82" y="-72" stroke="#fbfcff" stroke-width="5" paint-order="stroke">u=(1,1)</text>
    <circle class="good" cx="360" cy="-200" r="9"/><text class="txt" x="300" y="-216" stroke="#e6f3ec" stroke-width="5" paint-order="stroke">v=(3,2)</text>
    <circle class="bad" cx="60" cy="-300" r="9"/><text class="txt" x="10" y="-322" stroke="#fbfcff" stroke-width="5" paint-order="stroke">w=(1/2,3)</text>
    <text class="small" x="422" y="-360" text-anchor="end" stroke="#e6f3ec" stroke-width="5" paint-order="stroke">u + nón dương: các vector trội u</text>
    <text class="small" x="422" y="-130" text-anchor="end" stroke="#e6f3ec" stroke-width="5" paint-order="stroke">v−u=(2,1) có tọa độ không âm</text>
  </g>
  <text class="txt" x="305" y="562" text-anchor="middle">u đứng trước v; u và w không so sánh được.</text>

  <rect class="panel" x="617" y="70" width="555" height="510" rx="18"/>
  <text class="head" x="895" y="108" text-anchor="middle">Ma trận: nón nửa xác định dương</text>
  <rect class="matrix" x="660" y="140" width="190" height="104" rx="12"/><text class="txt" x="755" y="175" text-anchor="middle">X=diag(1,2)</text><text class="small" x="755" y="215" text-anchor="middle">ma trận gốc</text>
  <rect class="matrix" x="940" y="140" width="190" height="104" rx="12"/><text class="txt" x="1035" y="175" text-anchor="middle">Y=diag(3,3)</text><text class="small" x="1035" y="215" text-anchor="middle">ma trận so sánh</text>
  <line class="axis" x1="770" y1="246" x2="808" y2="282"/><line class="axis" x1="1020" y1="246" x2="982" y2="282"/><text class="small" x="895" y="266" text-anchor="middle">lấy hiệu</text>
  <rect class="matrix" x="708" y="286" width="374" height="105" rx="12"/><text class="txt" x="895" y="324" text-anchor="middle">Y−X=diag(2,1)</text><text class="txt" x="895" y="364" text-anchor="middle">trị riêng: 2 và 1 ≥ 0</text>
  <line class="axis" x1="895" y1="393" x2="895" y2="452"/>
  <rect x="715" y="456" width="360" height="72" rx="12" fill="#e6f3ec" stroke="#2e7d32" stroke-width="3"/><text class="txt" x="895" y="486" text-anchor="middle" fill="#215f3a">Y−X nửa xác định dương</text><text class="txt" x="895" y="514" text-anchor="middle" fill="#215f3a">nên X đứng trước Y</text>
  <text class="small" x="895" y="556" text-anchor="middle">Không kiểm tra bằng từng phần tử của X và Y.</text>
</svg>

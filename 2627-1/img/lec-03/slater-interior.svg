<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Điểm Slater bên trong đoạn khả thi</title>
<desc id="desc">Đoạn khả thi từ 2 đến 4. Điểm Slater 3 ở giữa. Cả đoạn từ 2,5 đến 3,5 quanh 3 vẫn thỏa nghiêm ràng buộc. Nghiệm tối ưu 2 nằm trên biên.</desc>
<rect width="600" height="360" fill="white"/>
<g font-family="Arial, sans-serif" font-size="25" fill="#333">
<text x="300" y="38" text-anchor="middle">Miền khả thi [2, 4]</text>
<rect x="90" y="173" width="400" height="40" rx="5" fill="#edf3ed" stroke="#557455" stroke-width="2"/>
<rect x="190" y="180" width="200" height="26" rx="4" fill="#dbe2f5" stroke="#2F3E7A" stroke-width="2" stroke-dasharray="7 4"/>
<path d="M40 193H555l-12 -7m12 7l-12 7" fill="none" stroke="#666" stroke-width="2"/>
<path d="M90 181v26M300 181v26M490 181v26" stroke="#333" stroke-width="2"/>
<circle cx="90" cy="193" r="8" fill="#B15A2B"/>
<circle cx="300" cy="193" r="9" fill="#2F3E7A"/>
<circle cx="490" cy="193" r="6" fill="#557455" stroke="#557455" stroke-width="3"/>
<text x="90" y="240" text-anchor="middle">2</text><text x="300" y="240" text-anchor="middle">3</text><text x="490" y="240" text-anchor="middle">4</text><text x="560" y="232">x</text>
<path d="M300 146v25" stroke="#2F3E7A" stroke-width="2"/>
<text x="300" y="78" text-anchor="middle" fill="#2F3E7A">Điểm Slater</text>
<path d="M190 148v-13h200v13" fill="none" stroke="#2F3E7A" stroke-width="2"/>
<text x="300" y="122" text-anchor="middle" font-size="23">Dịch chuyển nhỏ quanh 3</text>
<text x="90" y="283" text-anchor="middle" fill="#B15A2B">Nghiệm tối ưu</text>
<text x="300" y="331" text-anchor="middle" font-size="24">[2,5; 3,5] vẫn thỏa nghiêm</text>
</g></svg>
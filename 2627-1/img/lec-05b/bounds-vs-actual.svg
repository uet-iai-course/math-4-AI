<svg xmlns="http://www.w3.org/2000/svg" width="600" height="262" viewBox="0 0 600 262" role="img" aria-labelledby="title desc"><title id="title">Cận và giá trị thật trên hai ví dụ</title><desc id="desc">Ví dụ C, số bước để sai số giá trị không vượt 0,01, thang logarit có vạch 1, 10, 100, 1000, 10 mũ 4: T1 bảo đảm 7000 bước, T2b bảo đảm 16 bước, thực tế cần 6 bước. Ví dụ A, SGD bước 0,1: cận T5 cho sàn nhiễu 0,267, giá trị giới hạn thật của kỳ vọng bình phương sai lệch là 0,140.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><text x="10.0" y="26.0" fill="#263238" text-anchor="start" font-size="26" font-weight="bold">Ví dụ C: số bước để eₖ ≤ 0,01 (thang log)</text><rect x="120.0" y="36.0" width="365.3" height="24.0" rx="3" fill="#B15A2B" stroke="#B15A2B" stroke-width="1"/><text x="108.0" y="56.0" fill="#263238" text-anchor="end" font-size="26">T1</text><text x="495.3" y="56.0" fill="#263238" text-anchor="start" font-size="26">7000</text><rect x="120.0" y="67.0" width="114.4" height="24.0" rx="3" fill="#B15A2B" stroke="#B15A2B" stroke-width="1"/><text x="108.0" y="87.0" fill="#263238" text-anchor="end" font-size="26">T2b</text><text x="244.4" y="87.0" fill="#263238" text-anchor="start" font-size="26">16</text><rect x="120.0" y="98.0" width="73.9" height="24.0" rx="3" fill="#2F3E7A" stroke="#2F3E7A" stroke-width="1"/><text x="108.0" y="118.0" fill="#263238" text-anchor="end" font-size="26">thật</text><text x="203.9" y="118.0" fill="#263238" text-anchor="start" font-size="26">6</text><line x1="120.0" y1="129.0" x2="500.0" y2="129.0" stroke="#667078" stroke-width="1.5"/><line x1="120.0" y1="129.0" x2="120.0" y2="135.0" stroke="#667078" stroke-width="1.5"/><text class="tick" x="120.0" y="156.0" fill="#667078" text-anchor="middle" font-size="24">1</text><line x1="215.0" y1="129.0" x2="215.0" y2="135.0" stroke="#667078" stroke-width="1.5"/><text class="tick" x="215.0" y="156.0" fill="#667078" text-anchor="middle" font-size="24">10</text><line x1="310.0" y1="129.0" x2="310.0" y2="135.0" stroke="#667078" stroke-width="1.5"/><text class="tick" x="310.0" y="156.0" fill="#667078" text-anchor="middle" font-size="24">100</text><line x1="405.0" y1="129.0" x2="405.0" y2="135.0" stroke="#667078" stroke-width="1.5"/><text class="tick" x="405.0" y="156.0" fill="#667078" text-anchor="middle" font-size="24">1000</text><line x1="500.0" y1="129.0" x2="500.0" y2="135.0" stroke="#667078" stroke-width="1.5"/><text class="tick" x="500.0" y="156.0" fill="#667078" text-anchor="middle" font-size="24">10⁴</text><text x="10.0" y="192.0" fill="#263238" text-anchor="start" font-size="26" font-weight="bold">Ví dụ A: giới hạn của aₖ</text><rect x="120.0" y="202.0" width="338.2" height="24.0" rx="3" fill="#B15A2B" stroke="#B15A2B" stroke-width="1"/><text x="108.0" y="222.0" fill="#263238" text-anchor="end" font-size="26">cận T5</text><text x="468.2" y="222.0" fill="#263238" text-anchor="start" font-size="26">0,267</text><rect x="120.0" y="233.0" width="177.3" height="24.0" rx="3" fill="#2F3E7A" stroke="#2F3E7A" stroke-width="1"/><text x="108.0" y="253.0" fill="#263238" text-anchor="end" font-size="26">thật</text><text x="307.3" y="253.0" fill="#263238" text-anchor="start" font-size="26">0,140</text></g></svg>

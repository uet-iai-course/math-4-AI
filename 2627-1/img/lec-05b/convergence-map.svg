<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title desc"><title id="title">Bản đồ ba dạng hội tụ</title><desc id="desc">Ba nút: khoảng cách d, sai số giá trị e và chuẩn gradient. Mũi tên từ A sang B nghĩa là A nhỏ kéo theo B nhỏ. Từ d sang e: e ≤ (L/2)d² dưới H2. Từ e sang chuẩn gradient: ‖∇f‖² ≤ 2Le dưới H2. Từ chuẩn gradient sang e: e ≤ ‖∇f‖²/(2μ) dưới H3. Từ e sang d: (μ/2)d² ≤ e dưới H3. Từ chuẩn gradient sang d: d ≤ (2/μ)‖∇f‖ dưới H3.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><rect x="13.0" y="320.0" width="224.0" height="60.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="125.0" y="359.0" fill="#263238" text-anchor="middle" font-size="29">d = ‖x − x*‖</text><rect x="298.0" y="20.0" width="224.0" height="60.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="410.0" y="59.0" fill="#263238" text-anchor="middle" font-size="29">e = f(x) − f*</text><rect x="583.0" y="320.0" width="224.0" height="60.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="695.0" y="359.0" fill="#263238" text-anchor="middle" font-size="29">‖∇f(x)‖</text><line x1="174.7" y1="271.6" x2="334.3" y2="103.6" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arr)"/><text x="120.0" y="175.0" fill="#2F3E7A" text-anchor="middle" font-size="29" stroke="white" stroke-width="6" paint-order="stroke" stroke-linejoin="round">e ≤ (L/2)d²</text><text x="120.0" y="207.0" fill="#2F3E7A" text-anchor="middle" font-size="29" stroke="white" stroke-width="6" paint-order="stroke" stroke-linejoin="round">(H2)</text><line x1="360.3" y1="128.4" x2="200.7" y2="296.4" stroke="#2E7D32" stroke-width="3" marker-end="url(#arr)"/><text x="410.0" y="190.0" fill="#2E7D32" text-anchor="middle" font-size="29" stroke="white" stroke-width="6" paint-order="stroke" stroke-linejoin="round">(μ/2)d² ≤ e</text><text x="410.0" y="222.0" fill="#2E7D32" text-anchor="middle" font-size="29" stroke="white" stroke-width="6" paint-order="stroke" stroke-linejoin="round">(H3)</text><line x1="459.7" y1="128.4" x2="619.3" y2="296.4" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arr)"/><text x="478.0" y="268.0" fill="#2F3E7A" text-anchor="middle" font-size="29" stroke="white" stroke-width="6" paint-order="stroke" stroke-linejoin="round">‖∇f‖² ≤ 2Le</text><text x="478.0" y="300.0" fill="#2F3E7A" text-anchor="middle" font-size="29" stroke="white" stroke-width="6" paint-order="stroke" stroke-linejoin="round">(H2)</text><line x1="645.3" y1="271.6" x2="485.7" y2="103.6" stroke="#2E7D32" stroke-width="3" marker-end="url(#arr)"/><text x="700.0" y="175.0" fill="#2E7D32" text-anchor="middle" font-size="29" stroke="white" stroke-width="6" paint-order="stroke" stroke-linejoin="round">e ≤ ‖∇f‖²/(2μ)</text><text x="700.0" y="207.0" fill="#2E7D32" text-anchor="middle" font-size="29" stroke="white" stroke-width="6" paint-order="stroke" stroke-linejoin="round">(H3)</text><line x1="578.0" y1="350.0" x2="242.0" y2="350.0" stroke="#2E7D32" stroke-width="3" marker-end="url(#arr)"/><text x="410.0" y="336.0" fill="#2E7D32" text-anchor="middle" font-size="29">d ≤ (2/μ)‖∇f‖  (H3)</text><text x="410.0" y="440.0" fill="#667078" text-anchor="middle" font-size="29">Mũi tên A → B: A nhỏ kéo theo B nhỏ</text></g></svg>

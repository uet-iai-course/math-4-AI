<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="title desc"><title id="title">Hạ gradient ngẫu nhiên trên ví dụ ba quan sát</title><desc id="desc">Trục hoành k từ 0 đến 40, trục tung từ 0 đến 1. Đường mảnh màu xám là bình phương sai lệch (θ_k − 1)² của một lần chạy: dao động và không tiến về 0. Đường đậm là kỳ vọng E(θ_k − 1)²: 0,837 tại k = 1, 0,153 tại k = 20, giảm về giá trị giới hạn 0,140 (đường nét đứt).</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><line x1="80.0" y1="186.0" x2="482.0" y2="186.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="80.0" y1="186.0" x2="80.0" y2="8.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="80.0" y1="182.0" x2="80.0" y2="190.0" stroke="#667078" stroke-width="2"/><text class="tick" x="80.0" y="212.0" fill="#263238" text-anchor="middle" font-size="23">0</text><line x1="177.5" y1="182.0" x2="177.5" y2="190.0" stroke="#667078" stroke-width="2"/><text class="tick" x="177.5" y="212.0" fill="#263238" text-anchor="middle" font-size="23">10</text><line x1="275.0" y1="182.0" x2="275.0" y2="190.0" stroke="#667078" stroke-width="2"/><text class="tick" x="275.0" y="212.0" fill="#263238" text-anchor="middle" font-size="23">20</text><line x1="372.5" y1="182.0" x2="372.5" y2="190.0" stroke="#667078" stroke-width="2"/><text class="tick" x="372.5" y="212.0" fill="#263238" text-anchor="middle" font-size="23">30</text><line x1="470.0" y1="182.0" x2="470.0" y2="190.0" stroke="#667078" stroke-width="2"/><text class="tick" x="470.0" y="212.0" fill="#263238" text-anchor="middle" font-size="23">40</text><line x1="76.0" y1="186.0" x2="84.0" y2="186.0" stroke="#667078" stroke-width="2"/><line
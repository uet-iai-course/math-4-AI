<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">Cây lịch sử hai bước của hạ gradient ngẫu nhiên</title><desc id="desc">Gốc θ₀ = 0. Mỗi nút tách ba nhánh theo quan sát được chọn −1, 1, 3, mỗi nhánh xác suất 1/3. Bước một cho θ₁ bằng −0,1; 0,1; 0,3. Bước hai cho chín lá θ₂. Tại nút θ₁ = 0,1, trung bình ba nhánh con của g₁ bằng −0,9.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><rect x="330.0" y="28.0" width="110.0" height="40.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="385.0" y="56.0" fill="#263238" text-anchor="middle" font-size="26">θ₀ = 0</text><line x1="385.0" y1="68.0" x2="160.0" y2="168.0" stroke="#667078" stroke-width="2"/><text x="258.5" y="118.0" fill="#667078" text-anchor="end" font-size="26">y = −1</text><rect x="90.0" y="168.0" width="140.0" height="42.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="160.0" y="196.0" fill="#263238" text-anchor="middle" font-size="26">θ₁ = −0,1</text><line x1="160.0" y1="208.0" x2="88.0" y2="290.0" stroke="#667078" stroke-width="2"/><text x="88.0" y="318.0" fill="#263238" text-anchor="middle" font-size="26">−0,19</text><line x1="160.0" y1="208.0" x2="160.0" y2="290.0" stroke="#667078" stroke-width="2"/><text x="160.0" y="318.0" fill="#263238" text-anchor="middle" font-size="26">0,01</text><line x1="160.0" y1="208.0" x2="232.0" y2="290.0" stroke="#667078" stroke-width="2"/><text x="232.0" y="318.0" fill="#263238" text-anchor="middle" font-size="26">0,21</text><line x1="385.0" y1="68.0" x2="385.0" y2="168.0" stroke="#667078" stroke-width="2"/><text x="393.0" y="118.0" fill="#667078" text-anchor="start" font-size="26">y = 1</text><rect x="315.0" y="168.0" width="140.0" height="42.0" rx="8" fill="#e9ecf6" stroke="#2F3E7A" stroke-width="3"/><text x="385.0" y="196.0" fill="#263238" text-anchor="middle" font-size="26">θ₁ = 0,1</text><line x1="385.0" y1="208.0" x2="313.0" y2="290.0" stroke="#667078" stroke-width="2"/><text x="313.0" y="318.0" fill="#263238" text-anchor="middle" font-size="26">−0,01</text><line x1="385.0" y1="208.0" x2="385.0" y2="290.0" stroke="#667078" stroke-width="2"/><text x="385.0" y="318.0" fill="#263238" text-anchor="middle" font-size="26">0,19</text><line x1="385.0" y1="208.0" x2="457.0" y2="290.0" stroke="#667078" stroke-width="2"/><text x="457.0" y="318.0" fill="#263238" text-anchor="middle" font-size="26">0,39</text><line x1="385.0" y1="68.0" x2="610.0" y2="168.0" stroke="#667078" stroke-width="2"/><text x="511.5" y="118.0" fill="#667078" text-anchor="start" font-size="26">y = 3</text><rect x="540.0" y="168.0" width="140.0" height="42.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="610.0" y="196.0" fill="#263238" text-anchor="middle" font-size="26">θ₁ = 0,3</text><line x1="610.0" y1="208.0" x2="538.0" y2="290.0" stroke="#667078" stroke-width="2"/><text x="538.0" y="318.0" fill="#263238" text-anchor="middle" font-size="26">0,17</text><line x1="610.0" y1="208.0" x2="610.0" y2="290.0" stroke="#667078" stroke-width="2"/><text x="610.0" y="318.0" fill="#263238" text-anchor="middle" font-size="26">0,37</text><line x1="610.0" y1="208.0" x2="682.0" y2="290.0" stroke="#667078" stroke-width="2"/><text x="682.0" y="318.0" fill="#263238" text-anchor="middle" font-size="26">0,57</text><text x="10.0" y="318.0" fill="#263238" text-anchor="start" font-size="26">θ₂</text><text x="10.0" y="196.0" fill="#263238" text-anchor="start" font-size="26">θ₁</text><rect x="130.0" y="345.0" width="510.0" height="76.0" rx="8" fill="white" stroke="#2F3E7A" stroke-width="2"/><text x="385.0" y="375.0" fill="#2F3E7A" text-anchor="middle" font-size="26">tại θ₁ = 0,1: g₁ = θ₁ − y ∈ {1,1; −0,9; −2,9}</text><text x="385.0" y="407.0" fill="#2F3E7A" text-anchor="middle" font-size="26">trung bình ba nhánh: −0,9 = J′(θ₁)</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title desc"><title id="title">Phương pháp dưới gradient với bước 4,5</title><desc id="desc">Đồ thị hàm trị tuyệt đối trung bình trên đoạn từ −0,5 đến 2. Từ x₀ = 0, bước 4,5 đưa tới x₁ = 1,5, rồi về x₂ = 0, rồi x₃ = 1,5: dãy dao động qua điểm gãy 1 và f tăng từ 1,5 lên 5/3 ở bước thứ hai. Trung bình lặp 0,75 có sai số 1/12, nhỏ hơn sai số của mọi điểm lặp.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><line x1="70.0" y1="320.0" x2="557.0" y2="320.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="70.0" y1="320.0" x2="70.0" y2="28.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="165.0" y1="316.0" x2="165.0" y2="324.0" stroke="#667078" stroke-width="2"/><text class="tick" x="165.0" y="346.0" fill="#263238" text-anchor="middle" font-size="21">0</text><line x1="260.0" y1="316.0" x2="260.0" y2="324.0" stroke="#667078" stroke-width="2"/><text class="tick" x="260.0" y="346.0" fill="#263238" text-anchor="middle" font-size="21">0,5</text><line x1="355.0" y1="316.0" x2="355.0" y2="324.0" stroke="#667078" stroke-width="2"/><text class="tick" x="355.0" y="346.0" fill="#263238" text-anchor="middle" font-size="21">1</text><line x1="450.0" y1="316.0" x2="450.0" y2="324.0" stroke="#667078" stroke-width="2"/><text class="tick" x="450.0" y="346.0" fill="#263238" text-anchor="middle" font-size="21">1,5</text><line x1="545.0" y1="316.0" x2="545.0" y2="324.0" stroke="#667078" stroke-width="2"/><text class="tick" x="545.0" y="346.0" fill="#263238" text-anchor="middle" font-size="21">2</text><line x1="66.0" y1="280.0" x2="74.0" y2="280.0" stroke="#667078" stroke-width="2"/><line x1="70.0" y1="280.0" x2="545.0" y2="280.0" stroke="#ccd0d2" stroke-width="1"/><text class="tick" x="62.0" y="287.0" fill="#263238" text-anchor="end" font-size="21">1,3</text><line x1="66.0" y1="200.0" x2="74.0" y2="200.0" stroke="#667078" stroke-width="2"/><line x1="70.0" y1="200.0" x2="545.0" y2="200.0" stroke="#ccd0d2" stroke-width="1"/><text class="tick" x="62.0" y="207.0" fill="#263238" text-anchor="end" font-size="21">1,5</text><line x1="66.0" y1="120.0" x2="74.0" y2="120.0" stroke="#667078" stroke-width="2"/><line x1="70.0" y1="120.0" x2="545.0" y2="120.0" stroke="#ccd0d2" stroke-width="1"/><text class="tick" x="62.0" y="127.0" fill="#263238" text-anchor="end" font-size="21">1,7</text><line x1="66.0" y1="40.0" x2="74.0" y2="40.0" stroke="#667078" stroke-width="2"/><line x1="70.0" y1="40.0" x2="545.0" y2="40.0" stroke="#ccd0d2" stroke-width="1"/><text class="tick" x="62.0" y="47.0" fill="#263238" text-anchor="end" font-size="21">1,9</text><text class="tick" x="551.0" y="310.0" fill="#263238" text-anchor="end" font-size="22" font-style="italic">x</text><path d="M70.0 66.7 L355.0 266.7 L545.0 133.3" fill="none" stroke="#B15A2B" stroke-width="4" stroke-linejoin="round"/><circle cx="165.0" cy="133.3" r="7" fill="#2F3E7A" stroke="#2F3E7A" stroke-width="2"/><circle cx="450.0" cy="200.0" r="7" fill="#2F3E7A" stroke="#2F3E7A" stroke-width="2"/><path d="M173.0 123.3 Q307.5 43.3 444.0 188.0" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arr)"/><path d="M442.0 212.0 Q307.5 260.0 173.0 145.3" fill="none" stroke="#2F3E7A" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr)"/><text x="155.0" y="163.3" fill="#263238" text-anchor="end" font-size="23">x₀, x₂</text><text x="464.0" y="230.0" fill="#263238" text-anchor="start" font-size="23">x₁, x₃</text><path d="M307.5 224.3L316.5 233.3L307.5 242.3L298.5 233.3Z" fill="#2E7D32" stroke="#2E7D32" stroke-width="2"/><text x="295.5" y="263.3" fill="#2E7D32" text-anchor="end" font-size="23">x̄₄ = 0,75</text><circle cx="355.0" cy="266.7" r="5" fill="#263238" stroke="#263238" stroke-width="2"/><text x="361.0" y="292.7" fill="#263238" text-anchor="start" font-size="23">x* = 1</text></g></svg>

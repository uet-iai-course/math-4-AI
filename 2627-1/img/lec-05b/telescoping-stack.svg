<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc"><title id="title">Tổng lồng của các hiệu liên tiếp</title><desc id="desc">Bên trái: năm cột u₀ đến u₄ giảm dần. Bên phải: các hiệu u₀ − u₁, u₁ − u₂, u₂ − u₃, u₃ − u₄ và phần còn lại u₄ xếp chồng thành một cột cao đúng bằng u₀, nên tổng các hiệu không vượt quá u₀.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><rect x="60.0" y="28.0" width="40.0" height="270.0" rx="2" fill="#e9ecf6" stroke="#2F3E7A" stroke-width="2"/><text x="80.0" y="326.0" fill="#263238" text-anchor="middle" font-size="21">u₀</text><rect x="115.0" y="127.0" width="40.0" height="171.0" rx="2" fill="#e9ecf6" stroke="#2F3E7A" stroke-width="2"/><text x="135.0" y="326.0" fill="#263238" text-anchor="middle" font-size="21">u₁</text><rect x="170.0" y="185.5" width="40.0" height="112.5" rx="2" fill="#e9ecf6" stroke="#2F3E7A" stroke-width="2"/><text x="190.0" y="326.0" fill="#263238" text-anchor="middle" font-size="21">u₂</text><rect x="225.0" y="221.5" width="40.0" height="76.5" rx="2" fill="#e9ecf6" stroke="#2F3E7A" stroke-width="2"/><text x="245.0" y="326.0" fill="#263238" text-anchor="middle" font-size="21">u₃</text><rect x="280.0" y="244.0" width="40.0" height="54.0" rx="2" fill="#e9ecf6" stroke="#2F3E7A" stroke-width="2"/><text x="300.0" y="326.0" fill="#263238" text-anchor="middle" font-size="21">u₄</text><line x1="40.0" y1="298.0" x2="340.0" y2="298.0" stroke="#667078" stroke-width="2"/><rect x="430.0" y="199.0" width="70.0" height="99.0" rx="2" fill="#f3d9c6" stroke="#B15A2B" stroke-width="2"/><text x="512.0" y="255.5" fill="#263238" text-anchor="start" font-size="21">u₀ − u₁</text><rect x="430.0" y="140.5" width="70.0" h
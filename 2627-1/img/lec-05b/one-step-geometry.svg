<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title desc"><title id="title">Hình học của một bước cập nhật</title><desc id="desc">Với hàm ½(3x₁² + 7x₂²), nghiệm x* = 0, điểm x = (2, 4), gradient g = (6, 28), bước η = 1/7. Mũi tên −ηg đưa x tới x − ηg = (8/7, 0). Khoảng cách tới x* giảm từ √20 xuống 8/7.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><line x1="60.0" y1="330.0" x2="560.0" y2="330.0" stroke="#ccd0d2" stroke-width="1"/><line x1="150.0" y1="375.0" x2="150.0" y2="20.0" stroke="#ccd0d2" stroke-width="1"/><line x1="150.0" y1="330.0" x2="274.0" y2="82.0" stroke="#667078" stroke-width="3" stroke-dasharray="8 6"/><line x1="150.0" y1="330.0" x2="220.9" y2="330.0" stroke="#2E7D32" stroke-width="4"/><line x1="274.0" y1="82.0" x2="220.9" y2="330.0" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/><circle cx="150.0" cy="330.0" r="7" fill="#263238" stroke="#263238" stroke-width="2"/><circle cx="274.0" cy="82.0" r="7" fill="#2F3E7A" stroke="#2F3E7A" stroke-width="2"/><rect x="214.9" y="324.0" width="12" height="12" fill="#2E7D32" stroke="#2E7D32" stroke-width="2"/><text x="138.0" y="360.0" fill="#263238" text-anchor="middle" font-size="24" font-style="italic">x*</text><text x="286.0" y="88.0" fill="#263238" text-anchor="start" font-size="23">x = (2, 4)</text><text x="232.9" y="360.0" fill="#263238" text-anchor="start" font-size="23">x − ηg = (8/7, 0)</text><text x="265.4" y="206.0" fill="#B15A2B" text-anchor="start" font-size="23">−ηg</text><text x="196.0" y="206.0" fill="#667078" text-anchor="end" font-size="23">x − x*</text><text x="335.0" y="190.0" fill="#667078" text-anchor="start" font-size="23">‖x − x*‖² = 20</text><text x="335.0" y="224.0" fill="#2E7D32" text-anchor="start" font-size="23">‖x − ηg − x*‖² = 64/49</text><text x="335.0" y="258.0" fill="#263238" text-anchor="start" font-size="23">gᵀ(x − x*) = 124</text></g></svg>

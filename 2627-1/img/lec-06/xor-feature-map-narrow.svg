<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1020" viewBox="0 0 520 1020" role="img" aria-labelledby="title desc"><title id="title">Lớp ẩn ReLU đưa bốn điểm XOR sang không gian đặc trưng (bản cho màn hẹp)</title><desc id="desc">Phía trên: bốn điểm XOR trong không gian đầu vào. Phía dưới: ảnh qua h₁ = max(0, x₁ − x₂), h₂ = max(0, x₂ − x₁). Hai điểm lớp 0, (0, 0) và (1, 1), cùng đi tới gốc; điểm (1, 0) đi tới (1, 0); điểm (0, 1) đi tới (0, 1). Đường nét đứt h₁ + h₂ = ½ tách gốc khỏi hai điểm lớp 1.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238"><line x1="57.5" y1="360.0" x2="425.0" y2="360.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="95.0" y1="397.5" x2="95.0" y2="30.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><text x="435.0" y="368.0" font-size="27" text-anchor="start" fill="#263238" font-style="italic">x<tspan font-size="22" dy="7.6">1</tspan><tspan dy="-7.6">​</tspan></text><text x="81.0" y="41.0" font-size="27" text-anchor="end" fill="#263238" font-style="italic">x<tspan font-size="22" dy="7.6">2</tspan><tspan dy="-7.6">​</tspan></text><line x1="95.0" y1="360.0" x2="95.0" y2="366.0" stroke="#667078" stroke-width="2"/><line x1="89.0" y1="360.0" x2="95.0" y2="360.0" stroke="#667078" stroke-width="2"/><line x1="345.0" y1="360.0" x2="345.0" y2="366.0" stroke="#667078" stroke-width="2"/><line x1="89.0" y1="110.0" x2="95.0" y2="110.0" stroke="#667078" stroke-width="2"/><text x="345.0" y="394.0" font-size="24" text-anchor="middle" fill="#263238">1</text><text x="75.0" y="118.0" font-size="24" text-anchor="end" fill="#263238">1</text><text x="75.0" y="390.0" font-size="24" text-anchor="end" fill="#263238">0</text><rect x="95.0" y="110.0" width="250" height="250" fill="none" stroke="#d5d9db" stroke-width="1.5"/><rect x="83.0" y="348.0" width="24" height="24" fill="white" stroke="#263238" stroke-width="3"/><rect x="333.0" y="98.0" width="24" height="24" fill="white" stroke="#263238" stroke-width="3"/><circle cx="95.0" cy="110.0" r="12" fill="#B15A2B"/><circle cx="345.0" cy="360.0" r="12" fill="#B15A2B"/><text x="115.0" y="346.0" font-size="26" text-anchor="start" fill="#263238">(0, 0)</text><text x="363.0" y="118.0" font-size="26" text-anchor="start" fill="#263238">(1, 1)</text><text x="115.0" y="96.0" font-size="26" text-anchor="start" fill="#263238">(0, 1)</text><text x="363.0" y="346.0" font-size="26" text-anchor="start" fill="#263238">(1, 0)</text><text x="220.0" y="430.0" font-size="27" text-anchor="middle" fill="#263238">không gian đầu vào x</text><line x1="220.0" y1="455.0" x2="220.0" y2="535.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arr)"/><text x="240.0" y="502.0" font-size="27" text-anchor="start" fill="#263238" font-style="italic">h = σ(W<tspan font-size="22" dy="7.6">1</tspan><tspan dy="-7.6">​</tspan>x)</text><line x1="57.5" y1="890.0" x2="425.0" y2="890.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="95.0" y1="927.5" x2="95.0" y2="560.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><text x="435.0" y="898.0" font-size="28" text-anchor="start" fill="#263238" font-style="italic">h<tspan font-size="23" dy="7.8">1</tspan><tspan dy="-7.8">​</tspan></text><text x="81.0" y="571.0" font-size="28" text-anchor="end" fill="#263238" font-style="italic">h<tspan font-size="23" dy="7.8">2</tspan><tspan dy="-7.8">​</
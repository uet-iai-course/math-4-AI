<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="280" viewBox="0 0 1080 280" role="img" aria-labelledby="title desc"><title id="title">Đồ thị tính toán của mạng hai tầng và các giá trị truyền xuôi</title><desc id="desc">Chuỗi nút x → z → h → f → ℓ; các tham số W₁, b₁ đi vào z, w₂, b₂ đi vào f, nhãn y đi vào ℓ. Giá trị truyền xuôi với x = (1, 1), y = 0: z = (1, ½), h = (1, ½), f = ½, ℓ = ⅛. Dưới mỗi cạnh ghi phép toán: W₁x + b₁, σ, w₂ᵀh + b₂, ½(f − y)².</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238"><line x1="178.0" y1="170.0" x2="244.0" y2="170.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="403.0" y1="170.0" x2="464.0" y2="170.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="623.0" y1="170.0" x2="684.0" y2="170.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="843.0" y1="170.0" x2="904.0" y2="170.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="269.6" y1="83.0" x2="300.2" y2="131.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="380.4" y1="83.0" x2="349.8" y2="131.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="709.6" y1="83.0" x2="740.2" y2="131.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="820.4" y1="83.0" x2="789.8" y2="131.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="985.0" y1="83.0" x2="985.0" y2="131.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><rect x="25.0" y="137.0" width="150" height="66" rx="10" fill="white" stroke="#263238" stroke-width="2.5"/><text x="100.0" y="166.0" font-size="24" text-anchor="middle" fill="#263238" font-style="italic">x</text><text x="100.0" y="194.0" font-size="22" text-anchor="middle" fill="#263238">(1, 1)</text><rect x="250.0" y="137.0" width="150" height="66" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2.5"/><text x="325.0" y="166.0" font-size="24" text-anchor="middle" fill="#263238" font-style="italic">z</text><text x="325.0" y="194.0" font-size="22" text-anchor="middle" fill="#263238">(1, ½)</text><rect x="470.0" y="137.0" width="150" height="66" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2.5"/><text x="545.0" y="166.0" font-size="24" text-anchor="middle" fill="#263238" font-style="italic">h</text><text x="545.0" y="194.0" font-size="22" text-anchor="middle" fill="#263238">(1, ½)</text><rect x="690.0" y="137.0" width="150" height="66" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2.5"/><text x="765.0" y="166.0" font-size="24" text-anchor="middle" fill="#263238" font-style="italic">f</text><text x="765.0" y="194.0" font-size="22" text-anchor="middle" fill="#263238">½</text><rect x="910.0" y="137.0" width="150" height="66" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2.5"/><text x="985.0" y="166.0" font-size="24" text-anchor="middle" fill="#263238" font-style="italic">ℓ</text><text x="985.0" y="194.0" font-size="22" text-anchor="middle" fill="#263238">⅛</text><rect x="217.0" y="40.0" width="76" height="40" rx="8" fill="white" stroke="#667078" stroke-width="2"/><text x="255.0" y="68.0" font-size="22" text-anchor="middle" fill="#263238" font-style="italic">W<tspan font-size="21" dy="6.2">1</tspan><tspan dy="-6.2">​</tspan></text><rect x="357.0" y="40.0" width="76" height="40" rx="8" fill="white" stroke="#6
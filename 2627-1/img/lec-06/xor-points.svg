<svg xmlns="http://www.w3.org/2000/svg" width="580" height="440" viewBox="0 0 580 440" role="img" aria-labelledby="title desc"><title id="title">Bốn điểm của bài toán XOR</title><desc id="desc">Bốn đỉnh của hình vuông đơn vị trên mặt phẳng x₁, x₂. Hai điểm (0, 0) và (1, 1) có nhãn y = 0, vẽ bằng ô vuông rỗng; hai điểm (0, 1) và (1, 0) có nhãn y = 1, vẽ bằng hình tròn đặc. Hai lớp nằm trên hai đường chéo của hình vuông.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238"><line x1="56.0" y1="375.0" x2="438.2" y2="375.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="95.0" y1="414.0" x2="95.0" y2="31.8" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><text x="448.6" y="383.0" font-size="27" text-anchor="start" fill="#263238" font-style="italic">x<tspan font-size="22" dy="7.6">1</tspan><tspan dy="-7.6">​</tspan></text><text x="81.0" y="43.0" font-size="27" text-anchor="end" fill="#263238" font-style="italic">x<tspan font-size="22" dy="7.6">2</tspan><tspan dy="-7.6">​</tspan></text><line x1="95.0" y1="375.0" x2="95.0" y2="381.0" stroke="#667078" stroke-width="2"/><line x1="89.0" y1="375.0" x2="95.0" y2="375.0" stroke="#667078" stroke-width="2"/><line x1="355.0" y1="375.0" x2="355.0" y2="381.0" stroke="#667078" stroke-width="2"/><line x1="89.0" y1="115.0" x2="95.0" y2="115.0" stroke="#667078" stroke-width="2"/><text x="355.0" y="409.0" font-size="24" text-anchor="middle" fill="#263238">1</text><text x="75.0" y="123.0" font-size="24" text-anchor="end" fill="#263238">1</text><text x="75.0" y="405.0" font-size="24" text-anchor="end" fill="#263238">0</text><rect x="95.0" y="115.0" width="260" height="260" fill="none" stroke="#d5d9db" stroke-width="1.5"/><rect x="83.0" y="363.0" width="24" height="24" fill="white" stroke="#263238" stroke-width="3"/><rect x="343.0" y="103.0" width="24" height="24" fill="white" stroke="#263238" stroke-width="3"/><circle cx="95.0" cy="115.0" r="12" fill="#B15A2B"/><circle cx="355.0" cy="375.0" r="12" fill="#B15A2B"/><text x="115.0" y="361.0" font-size="23" text-anchor="start" fill="#263238">(0, 0)</text><text x="373.0" y="123.0" font-size="23" text-anchor="start" fill="#263238">(1, 1)</text><text x="115.0" y="101.0" font-size="23" text-anchor="start" fill="#263238">(0, 1)</text><text x="373.0" y="361.0" font-size="23" text-anchor="start" fill="#263238">(1, 0)</text><rect x="449.0" y="132.0" width="22" height="22" fill="white" stroke="#263238" stroke-width="3"/><text x="482.0" y="150.0" font-size="24" text-anchor="start" fill="#263238">y = 0</text><circle cx="460.0" cy="181.0" r="11" fill="#B15A2B"/><text x="482.0" y="188.0" font-size="24" text-anchor="start" fill="#263238">y = 1</text></g></svg>

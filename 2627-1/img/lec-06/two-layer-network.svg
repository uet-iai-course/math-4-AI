<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" aria-labelledby="title desc"><title id="title">Mạng hai tầng với hai đầu vào, hai đơn vị ẩn và một đầu ra</title><desc id="desc">Sơ đồ mạng 2–2–1. Hai nút đầu vào x₁, x₂ nối tới hai đơn vị ẩn qua trọng số W₁ và độ chệch b₁; mỗi đơn vị ẩn tính tiền kích hoạt z và kích hoạt h = σ(z). Hai đơn vị ẩn nối tới đầu ra f = w₂ᵀh + b₂.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238"><line x1="130.0" y1="120.0" x2="286.0" y2="120.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="122.6" y1="143.1" x2="294.1" y2="264.6" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="122.6" y1="266.9" x2="294.1" y2="145.4" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="130.0" y1="290.0" x2="286.0" y2="290.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="367.7" y1="133.4" x2="528.5" y2="190.3" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><line x1="367.7" y1="276.6" x2="528.5" y2="219.7" stroke="#667078" stroke-width="2.5" marker-end="url(#arrs)"/><circle cx="90.0" cy="120.0" r="40" fill="white" stroke="#263238" stroke-width="3"/><text x="90.0" y="129.0" font-size="26" text-anchor="middle" fill="#263238" font-style="italic">x₁</text><circle cx="90.0" cy="290.0" r="40" fill="white" stroke="#263238" stroke-width="3"/><text x="90.0" y="299.0" font-size="26" text-anchor="middle" fill="#263238" font-style="italic">x₂</text><circle cx="330.0" cy="120.0" r="40" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="330.0" y="118.0" font-size="22" text-anchor="middle" fill="#263238" font-style="italic">z₁</text><text x="330.0" y="144.0" font-size="22" text-anchor="middle" fill="#263238" font-style="italic">h₁</text><circle cx="330.0" cy="290.0" r="40" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="330.0" y="288.0" font-size="22" text-anchor="middle" fill="#263238" font-style="italic">z₂</text><text x="330.0" y="314.0" font-size="22" text-anchor="middle" fill="#263238" font-style="italic">h₂</text><circle cx="570.0" cy="205.0" r="40" fill="white" stroke="#263238" stroke-width="3"/><text x="570.0" y="214.0" font-size="28" text-anchor="middle" fill="#263238" font-style="italic">f</text><text x="210.0" y="40.0" font-size="24" text-anchor="middle" fill="#263238" font-style="italic">W₁, b₁</text><text x="450.0" y="40.0" font-size="24" text-anchor="middle" fill="#263238" font-style="italic">w₂, b₂</text><text x="90.0" y="375.0" font-size="22" text-anchor="middle" fill="#263238">đầu vào</text><text x="330.0" y="375.0" font-size="22" text-anchor="middle" fill="#263238">tầng ẩn</text><text x="330.0" y="401.0" font-size="21" text-anchor="middle" fill="#263238" font-style="italic">z = W₁x + b₁, h = σ(z)</text><text x="570.0" y="375.0" font-size="22" text-anchor="middle" fill="#263238">đầu ra</text><text x="570.0" y="401.0" font-size="21" text-anchor="middle" fill="#263238" font-style="italic">f = w₂ᵀh + b₂</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Chuỗi biến đổi của chuẩn hóa theo lô</title>
  <desc id="desc">Ma trận kích hoạt gồm m mẫu và d đặc trưng được chuẩn hóa độc lập theo từng cột với epsilon ổn định, sau đó co giãn và tịnh tiến bằng hai véc tơ tham số gamma và beta.</desc>
  <defs><marker id="bn-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7b3b1c"/></marker></defs>
  <rect width="1000" height="430" rx="18" fill="#fbfaf8"/>
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="500" y="44" font-size="27" font-weight="bold" fill="#263238">Chuẩn hóa từng đặc trưng trong một lô</text>
    <rect x="35" y="125" width="185" height="125" rx="13" fill="#e8edf8" stroke="#2f3e7a" stroke-width="3"/>
    <text x="128" y="172" font-size="26" font-weight="bold">H ∈ ℝᵐˣᵈ</text><text x="128" y="207" font-size="16">m mẫu × d đặc trưng</text>
    <rect x="280" y="94" width="260" height="187" rx="13" fill="#f7efe6" stroke="#9a481f" stroke-width="3"/>
    <text x="410" y="134" font-size="25" font-weight="bold">thống kê theo cột j</text>
    <text x="410" y="171" font-size="21">μⱼ = trung bình lô</text><text x="410" y="205" font-size="21">σⱼ² = phương sai lô</text>
    <text x="410" y="245" font-size="21">Ĥᵢⱼ=(Hᵢⱼ−μⱼ)/√(σⱼ²+ε)</text>
    <rect x="600" y="112" width="225" height="151" rx="13" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
    <text x="713" y="161" font-size="25" font-weight="bold">Yᵢⱼ=γⱼĤᵢⱼ+βⱼ</text>
    <text x="713" y="199" font-size="20">γ, β ∈ ℝᵈ</text><text x="713" y="229" font-size="18">phát theo m hàng</text>
    <rect x="885" y="139" width="80" height="98" rx="13" fill="#fff" stroke="#455a64" stroke-width="3"/>
    <text x="925" y="196" font-size="27" font-weight="bold">Y</text>
  </g>
  <g stroke="#7b3b1c" stroke-width="4" marker-end="url(#bn-arrow)"><line x1="220" y1="188" x2="268" y2="188"/><line x1="540" y1="188" x2="588" y2="188"/><line x1="825" y1="188" x2="873" y2="188"/></g>
  <g font-family="DejaVu Sans, sans-serif">
    <rect x="90" y="326" width="820" height="70" rx="14" fill="#eef2f8" stroke="#455a64" stroke-width="2"/>
    <text x="500" y="355" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">Hai chế độ dùng thống kê khác nhau</text>
    <text x="500" y="383" text-anchor="middle" font-size="20" fill="#263238">Huấn luyện: thống kê lô  ·  Suy diễn: trung bình và phương sai chạy</text>
  </g>
</svg>

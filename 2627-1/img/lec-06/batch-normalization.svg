<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="title desc">
  <title id="title">Chuỗi biến đổi của chuẩn hóa theo lô</title>
  <desc id="desc">Kích hoạt H được chuẩn hóa theo thống kê lô rồi co giãn và tịnh tiến bằng gamma và beta; khi suy diễn dùng thống kê chạy.</desc>
  <defs><marker id="n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
  <rect width="820" height="350" rx="18" fill="#fbfaf8"/><g font-family="sans-serif" text-anchor="middle">
  <rect x="35" y="105" width="150" height="100" rx="12" fill="#e8edf8" stroke="#2f3e7a" stroke-width="3"/><text x="110" y="148" font-size="25" font-weight="bold">H ∈ ℝᵐˣᵈ</text><text x="110" y="180" font-size="20">kích hoạt</text>
  <rect x="245" y="85" width="180" height="140" rx="12" fill="#f7efe6" stroke="#B15A2B" stroke-width="3"/><text x="335" y="130" font-size="25" font-weight="bold">chuẩn hóa</text><text x="335" y="168" font-size="20">μ, σ² theo cột</text><text x="335" y="198" font-size="20">Ĥ=(H−μ)/√(σ²+ε)</text>
  <rect x="485" y="105" width="150" height="100" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="560" y="148" font-size="25" font-weight="bold">γ ⊙ Ĥ + β</text><text x="560" y="180" font-size="20">học được</text>
  <rect x="690" y="105" width="95" height="100" rx="12" fill="#fff" stroke="#455a64" stroke-width="3"/><text x="738" y="162" font-size="25" font-weight="bold">Y</text></g>
  <line x1="185" y1="155" x2="235" y2="155" stroke="#B15A2B" stroke-width="4" marker-end="url(#n)"/><line x1="425" y1="155" x2="475" y2="155" stroke="#B15A2B" stroke-width="4" marker-end="url(#n)"/><line x1="635" y1="155" x2="680" y2="155" stroke="#B15A2B" stroke-width="4" marker-end="url(#n)"/>
  <text x="410" y="292" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#37474f">Huấn luyện: thống kê lô · Suy diễn: trung bình/phương sai chạy</text>
</svg>

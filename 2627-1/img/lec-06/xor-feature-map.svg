<svg xmlns="http://www.w3.org/2000/svg" width="990" height="455" viewBox="0 0 990 455" role="img" aria-labelledby="title desc"><title id="title">Lớp ẩn ReLU đưa bốn điểm XOR sang không gian đặc trưng</title><desc id="desc">Bên trái: bốn điểm XOR trong không gian đầu vào, hai lớp nằm trên hai đường chéo. Bên phải: ảnh qua h₁ = max(0, x₁ − x₂), h₂ = max(0, x₂ − x₁). Hai điểm lớp 0, (0, 0) và (1, 1), cùng đi tới gốc; điểm (1, 0) đi tới (1, 0); điểm (0, 1) đi tới (0, 1). Đường nét đứt h₁ + h₂ = ½ tách gốc khỏi hai điểm lớp 1.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238"><line x1="50.5" y1="345.0" x2="388.6" y2="345.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="85.0" y1="379.5" x2="85.0" y2="41.4" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><text x="397.8" y="353.0" font-size="27" text-anchor="start" fill="#263238" font-style="italic">x<tspan font-size="22" dy="7.6">1</tspan><tspan dy="-7.6">​</tspan></text><text x="71.0" y="52.0" font-size="27" text-anchor="end" fill="#263238" font-style="italic">x<tspan font-size="22" dy="7.6">2</tspan><tspan dy="-7.6">​</tspan></text><line x1="85.0" y1="345.0" x2="85.0" y2="351.0" stroke="#667078" stroke-width="2"/><line x1="79.0" y1="345.0" x2="85.0" y2="345.0" stroke="#667078" stroke-width="2"/><line x1="315.0" y1="345.0" x2="315.0" y2="351.0" stroke="#667078" stroke-width="2"/><line x1="79.0" y1="115.0" x2="85.0" y2="115.0" stroke="#667078" stroke-width="2"/><text x="315.0" y="379.0" font-size="24" text-anchor="middle" fill="#263238">1</text><text x="65.0" y="123.0" font-size="24" text-anchor="end" fill="#263238">1</text><text x="65.0" y="375.0" font-size="24" text-anchor="end" fill="#263238">0</text><rect x="85.0" y="115.0" width="230" height="230" fill="none" stroke="#d5d9db" stroke-width="1.5"/><rect x="73.0" y="333.0" width="24" height="24" fill="white" stroke="#263238" stroke-width="3"/><rect x="303.0" y="103.0" width="24" height="24" fill="white" stroke="#263238" stroke-width="3"/><circle cx="85.0" cy="115.0" r="12" fill="#B15A2B"/><circle cx="315.0" cy="345.0" r="12" fill="#B15A2B"/><text x="105.0" y="331.0" font-size="26" text-anchor="start" fill="#263238">(0, 0)</text><text x="333.0" y="123.0" font-size="26" text-anchor="start" fill="#263238">(1, 1)</text><text x="105.0" y="101.0" font-size="26" text-anchor="start" fill="#263238">(0, 1)</text><text x="333.0" y="331.0" font-size="26" text-anchor="start" fill="#263238">(1, 0)</text><text x="200.0" y="438.0" font-size="27" text-anchor="middle" fill="#263238">không gian đầu vào x</text><line x1="420.0" y1="215.0" x2="510.0" y2="215.0" stroke="#667078" stroke-width="2.5" marker-end="url(#arr)"/><text x="465.0" y="196.0" font-size="27" text-anchor="middle" fill="#263238" font-style="italic">h = σ(W<tspan font-size="22" dy="7.6">1</tspan><tspan dy="-7.6">​</tspan>x)</text><line x1="575.5" y1="345.0" x2="913.6" y2="345.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="610.0" y1="379.5" x2="610.0" y2="41.4" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><text x="922.8" y="353.0" font-size="27" text-anchor="start" fill="#263238" font-style="italic">h<tspan font-size="22" dy="7.6">1</tspan><tspan dy="-7.6">​</tspan></text><text x="596.0" y="52.0" font-size="27" text-anchor="end" fill="#263238" font-style="italic">h<tspan font-size="22" dy="7.6">2</tspan><tspan dy="-7.6">​</tspan></text><line x1="610.0" y1="345.0" x2="610.0" y2="351.0" stroke="#667078" stroke-width="2"/><line x1="604.0" y1="345.0" x2="610.0" y2="345.0" stroke="#667078" stroke-width="2"/><line x1="840.0" y1="345.0" x2="840.0" y2="351.0" stroke="#667078" stroke-width="2"/><line x1="604.0" y1="115.0" x2="610.0" y2="115.0" stroke="#667078" stroke-width="2"/><text x="840.0" y="379.0" font-size="28" text-anchor="middle" fill="#263238">1</text><text x="590.0" y="123.0" font-size="28" text-anchor="end" fill="#263238">1</text><text x="590.0" y="375.0" font-size="28" text-anchor="end" fill="#263238">0</text><line x1="738.8" y1="358.8" x2="591.6" y2="211.6" stroke="#B15A2B" stroke-width="3" stroke-dasharray="10 7"/><text x="679.0" y="262.2" font-size="26" text-anchor="start" fill="#B15A2B" font-style="italic">h<tspan font-size="21" dy="7.3">1</tspan><tspan dy="-7.3">​</tspan> + h<tspan font-size="21" dy="7.3">2</tspan><tspan dy="-7.3">​</tspan> = ½</text><rect x="598.0" y="333.0" width="24" height="24" fill="white" stroke="#263238" stroke-width="3"/><circle cx="840.0" cy="345.0" r="12" fill="#B15A2B"/><circle cx="610.0" cy="115.0" r="12" fill="#B15A2B"/><text x="588.0" y="279.0" font-size="26" text-anchor="end" fill="#263238">gốc: ảnh của</text><text x="588.0" y="311.0" font-size="26" text-anchor="end" fill="#263238">(0, 0) và (1, 1)</text><text x="840.0" y="323.0" font-size="26" text-anchor="middle" fill="#263238">(1, 0)</text><text x="630.0" y="122.0" font-size="26" text-anchor="start" fill="#263238">(0, 1)</text><text x="725.0" y="438.0" font-size="27" text-anchor="middle" fill="#263238">không gian đặc trưng h</text></g></svg>

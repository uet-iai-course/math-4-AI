<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1160" role="img" aria-labelledby="title desc">
  <title id="title">Hình học của hạ tọa độ và trung bình Polyak</title>
  <desc id="desc">Panel trên minh họa các bước ngang và dọc của hạ tọa độ trên các đường mức kéo dài quanh đường chéo, kèm hệ số co chính xác khi alpha bằng không phẩy không một. Panel dưới cho bốn điểm luân phiên giữa hai vị trí đối xứng và trung bình Polyak tại gốc.</desc>
  <defs>
    <marker id="coord-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a421f"/></marker>
    <clipPath id="coord-plot-clip"><rect x="80" y="70" width="740" height="370" rx="14"/></clipPath>
  </defs>
  <rect width="900" height="1160" rx="20" fill="#fbfaf8"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#263238">
    <text x="450" y="45" text-anchor="middle" font-size="29" font-weight="bold">A · Hạ lần lượt từng tọa độ</text>
    <rect x="80" y="70" width="740" height="370" rx="14" fill="#fff" stroke="#c2ccd1" stroke-width="2"/>
    <line x1="145" y1="380" x2="755" y2="380" stroke="#455a64" stroke-width="2"/><line x1="450" y1="408" x2="450" y2="104" stroke="#455a64" stroke-width="2"/>
    <text x="745" y="412" font-size="21">x₁</text><text x="420" y="114" font-size="21">x₂</text>
    <g fill="none" stroke="#90a4ae" stroke-width="3">
      <path d="M150 365C235 405 680 135 750 92C665 70 220 325 150 365Z"/>
      <path d="M235 340C300 365 625 165 690 122C620 112 295 305 235 340Z"/>
      <path d="M330 300C370 311 535 215 585 174C535 177 370 273 330 300Z"/>
    </g>
    <line x1="205" y1="398" x2="700" y2="92" stroke="#2f3e7a" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="555" y="330" font-size="20" fill="#2f3e7a">thung lũng x₁≈x₂</text>
    <circle cx="170" cy="135" r="8" fill="#263238"/><text x="185" y="125" font-size="20">x⁽ᵏ⁾</text>
    <path d="M170 135H700V190H640V238" fill="none" stroke="#8a421f" stroke-width="7" marker-end="url(#coord-arrow)"/>
    <circle cx="700" cy="135" r="8" fill="#fff" stroke="#8a421f" stroke-width="4"/><circle cx="700" cy="190" r="8" fill="#fff" stroke="#8a421f" stroke-width="4"/>
    <text x="400" y="124" font-size="20" fill="#7b3b1c">cập nhật x₁: đoạn ngang</text><text x="712" y="180" font-size="20" fill="#7b3b1c">x₂</text>
    <text x="100" y="426" font-size="17" fill="#455a64">Sơ đồ đường đi, không theo tỉ lệ.</text>
    <rect x="110" y="465" width="680" height="124" rx="13" fill="#eef2f8" stroke="#2f3e7a" stroke-width="2"/>
    <text x="450" y="497" text-anchor="middle" font-size="20">F=(x₁−x₂)²+α(x₁²+x₂²),  α=0,01</text>
    <text x="450" y="533" text-anchor="middle" font-size="20">x₁ᵏ⁺¹=x₂ᵏ/1,01  ⇒  một cập nhật có hệ số 0,9901</text>
    <text x="450" y="569" text-anchor="middle" font-size="20">x₂ᵏ⁺¹=x₂ᵏ/(1,01)²  ⇒  một chu kỳ có hệ số 0,9803</text>

    <line x1="70" y1="620" x2="830" y2="620" stroke="#b0bec5" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="450" y="665" text-anchor="middle" font-size="29" font-weight="bold">B · Lấy trung bình quỹ đạo</text>
    <rect x="80" y="690" width="740" height="310" rx="14" fill="#fff" stroke="#c2ccd1" stroke-width="2"/>
    <line x1="145" y1="845" x2="755" y2="845" stroke="#455a64" stroke-width="2"/><line x1="450" y1="965" x2="450" y2="725" stroke="#455a64" stroke-width="2"/>
    <text x="745" y="875" font-size="21">θ₁</text><text x="420" y="738" font-size="21">θ₂</text>
    <path d="M700 950L200 740L700 950L200 740" fill="none" stroke="#8a421f" stroke-width="4" stroke-dasharray="11 8" marker-end="url(#coord-arrow)"/>
    <rect x="688" y="938" width="24" height="24" fill="#e8edf8" stroke="#2f3e7a" stroke-width="3"/><text x="545" y="925" font-size="20">θ₁=θ₃=(1,−1)</text>
    <circle cx="200" cy="740" r="13" fill="#f7efe6" stroke="#8a421f" stroke-width="3"/><text x="220" y="730" font-size="20">θ₂=θ₄=(−1,1)</text>
    <path d="M450 830l6 12 14 2-10 10 3 14-13-7-13 7 3-14-10-10 14-2Z" fill="#fff" stroke="#2e7d32" stroke-width="4"/>
    <text x="475" y="827" font-size="21" font-weight="bold" fill="#1f6728">θ̂₄=(0,0)</text>
    <text x="450" y="988" text-anchor="middle" font-size="18" fill="#455a64">Nét đứt: quỹ đạo dao động; ngôi sao: trung bình.</text>
    <rect x="110" y="1025" width="680" height="100" rx="13" fill="#eef7ef" stroke="#2e7d32" stroke-width="2"/>
    <text x="450" y="1060" text-anchor="middle" font-size="21">θ̂₄=(θ₁+θ₂+θ₃+θ₄)/4=(0,0)</text>
    <text x="450" y="1096" text-anchor="middle" font-size="19">Trung bình triệt dao động đối xứng; không đổi quy tắc cập nhật gốc.</text>
  </g>
</svg>

nchor="middle" fill="#2F3E7A">= (½, −1)</text><text x="225.0" y="18.0" font-size="20" text-anchor="middle" fill="#2F3E7A">∇<tspan font-size="21" dy="5.6">W₁</tspan><tspan dy="-5.6">​</tspan>ℓ = δ<tspan font-size="21" dy="5.6">z</tspan><tspan dy="-5.6">​</tspan>x<tspan font-size="21" dy="-8.4">⊤</tspan><tspan dy="8.4">​</tspan></text><text x="435.0" y="18.0" font-size="20" text-anchor="middle" fill="#2F3E7A">∇<tspan font-size="21" dy="5.6">b₁</tspan><tspan dy="-5.6">​</tspan>ℓ = δ<tspan font-size="21" dy="5.6">z</tspan><tspan dy="-5.6">​</tspan></text><text x="675.0" y="18.0" font-size="20" text-anchor="middle" fill="#2F3E7A">∇<tspan font-size="21" dy="5.6">w₂</tspan><tspan dy="-5.6">​</tspan>ℓ = e h = (½, ¼)</text><text x="905.0" y="18.0" font-size="20" text-anchor="middle" fill="#2F3E7A">∇<tspan font-size="21" dy="5.6">b₂</tspan><tspan dy="-5.6">​</tspan>ℓ = e = ½</text></g></g></svg>

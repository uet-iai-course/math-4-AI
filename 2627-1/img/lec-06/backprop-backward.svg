<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Truyền ngược trên đồ thị tính toán của mạng hai tầng</title><desc id="desc">Cùng đồ thị x → z → h → f → ℓ, cạnh xuôi vẽ nhạt. Các mũi tên nét đứt bên dưới chạy từ phải sang trái, mang đạo hàm ngược: e = f − y = ½ tại f, δ_h = e w₂ = (½, −1) tại h, δ_z = δ_h ⊙ σ′(z) = (½, −1) tại z. Phía trên ghi gradient theo tham số: ∇W₁ = δ_z xᵀ, ∇b₁ = δ_z, ∇w₂ = e h = (½, ¼), ∇b₂ = e = ½.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#263238"><g transform="translate(0,26)"><line x1="178.0" y1="170.0" x2="244.0" y2="170.0" stroke="#b9bfc3" stroke-width="2" marker-end="url(#arrs)"/><line x1="403.0" y1="170.0" x2="464.0" y2="170.0" stroke="#b9bfc3" stroke-width="2" marker-end="url(#arrs)"/><line x1="623.0" y1="170.0" x2="684.0" y2="170.0" stroke="#b9bfc3" stroke-width="2" marker-end="url(#arrs)"/><line x1="843.0" y1="170.0" x2="904.0" y2="170.0" stroke="#b9bfc3" stroke-width="2" marker-end="url(#arrs)"/><line x1="269.6" y1="83.0" x2="300.2" y2="131.0" stroke="#b9bfc3" stroke-width="2" marker-end="url(#arrs)"/><line x1="380.4" y1="83.0" x2="349.8" y2="131.0" stroke="#b9bfc3" stroke-width="2" marker-end="url(#arrs)"/><line x1="709.6" y1="83.0" x2="740.2" y2="131.0" stroke="#b9bfc3" stroke-width="2" marker-end="url(#arrs)"/><line x1="
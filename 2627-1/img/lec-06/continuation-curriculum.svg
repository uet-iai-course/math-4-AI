<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="title desc">
  <title id="title">Tiếp tục hóa và học theo chương trình</title>
  <desc id="desc">Một chuỗi mục tiêu từ dễ đến đích truyền nghiệm khởi tạo; học theo chương trình hiện thực hóa chuỗi bằng cách tăng dần tỷ trọng ví dụ khó.</desc>
  <defs><marker id="c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs><rect width="820" height="350" rx="18" fill="#fbfaf8"/>
  <g font-family="sans-serif" text-anchor="middle"><circle cx="115" cy="150" r="62" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="115" y="145" font-size="25" font-weight="bold">J⁽⁰⁾</text><text x="115" y="178" font-size="20">dễ</text><circle cx="335" cy="150" r="62" fill="#f7efe6" stroke="#B15A2B" stroke-width="3"/><text x="335" y="145" font-size="25" font-weight="bold">J⁽¹⁾</text><text x="335" y="178" font-size="20">trung gian</text><circle cx="555" cy="150" r="62" fill="#e8edf8" stroke="#2f3e7a" stroke-width="3"/><text x="555" y="145" font-size="25" font-weight="bold">J⁽²⁾</text><text x="555" y="178" font-size="20">gần đích</text><circle cx="735" cy="150" r="62" fill="#fff" stroke="#455a64" stroke-width="3"/><text x="735" y="145" font-size="25" font-weight="bold">J</text><text x="735" y="178" font-size="20">mục tiêu thật</text></g>
  <line x1="177" y1="150" x2="263" y2="150" stroke="#B15A2B" stroke-width="4" marker-end="url(#c)"/><line x1="397" y1="150" x2="483" y2="150" stroke="#B15A2B" stroke-width="4" marker-end="url(#c)"/><line x1="617" y1="150" x2="663" y2="150" stroke="#B15A2B" stroke-width="4" marker-end="url(#c)"/>
  <text x="410" y="292" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#37474f">Nghiệm của bài dễ trở thành điểm đầu cho bài khó hơn</text>
</svg>

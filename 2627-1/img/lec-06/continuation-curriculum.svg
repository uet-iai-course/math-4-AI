<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Khởi tạo ấm trong phương pháp tiếp tục</title>
  <desc id="desc">Ba mục tiêu bậc hai liên tiếp có nghiệm không, một và hai, dùng để minh họa cơ chế khởi tạo ấm. Hình không khẳng định mục tiêu đầu trơn hơn hay dễ hơn.</desc>
  <defs><marker id="cont-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8a421f"/></marker></defs>
  <rect width="900" height="430" rx="18" fill="#fbfaf8"/>
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="450" y="48" font-size="28" font-weight="bold" fill="#263238">Chuỗi mục tiêu cùng không gian tham số</text>
    <circle cx="165" cy="180" r="92" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
    <text x="165" y="148" font-size="27" font-weight="bold">J⁽⁰⁾(θ)=θ²</text><text x="165" y="187" font-size="22">giai đoạn đầu</text><text x="165" y="224" font-size="24" font-weight="bold">θ*⁽⁰⁾=0</text>
    <circle cx="450" cy="180" r="92" fill="#f7efe6" stroke="#9a481f" stroke-width="4"/>
    <text x="450" y="148" font-size="25" font-weight="bold">J⁽¹⁾(θ)=(θ−1)²</text><text x="450" y="187" font-size="22">trung gian</text><text x="450" y="224" font-size="24" font-weight="bold">θ*⁽¹⁾=1</text>
    <circle cx="735" cy="180" r="92" fill="#e8edf8" stroke="#2f3e7a" stroke-width="4"/>
    <text x="735" y="148" font-size="25" font-weight="bold">J⁽²⁾(θ)=(θ−2)²</text><text x="735" y="187" font-size="22">mục tiêu thật J</text><text x="735" y="224" font-size="24" font-weight="bold">θ*⁽²⁾=2</text>
  </g>
  <g stroke="#8a421f" stroke-width="5" marker-end="url(#cont-arrow)"><line x1="257" y1="180" x2="346" y2="180"/><line x1="542" y1="180" x2="631" y2="180"/></g>
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle" fill="#263238">
    <text x="301" y="104" font-size="18">khởi tạo ấm</text><text x="586" y="104" font-size="18">khởi tạo ấm</text>
    <rect x="120" y="326" width="660" height="64" rx="13" fill="#eef2f8" stroke="#455a64" stroke-width="2"/>
    <text x="450" y="366" font-size="22">0  →  1  →  2: nghiệm trước trở thành điểm đầu cho bài sau</text>
  </g>
</svg>

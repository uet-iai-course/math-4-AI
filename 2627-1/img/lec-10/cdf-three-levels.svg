<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 246" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Hàm phân phối tích lũy bậc thang của mức xử lý</title>
  <desc id="d">Đồ thị bậc thang của F theo t. F bằng 0 khi t nhỏ hơn 0, bằng 0,70 trên nửa khoảng từ 0 đến 1, bằng 0,90 trên nửa khoảng từ 1 đến 2, bằng 1 khi t từ 2 trở lên. Chấm đặc ở đầu trái mỗi bậc, chấm rỗng ở đầu phải: hàm liên tục phải. Bước nhảy tại 0, 1, 2 có độ cao 0,70; 0,20; 0,10.</desc>
  <rect width="420" height="246" fill="#ffffff"/>
  <g stroke="#444" stroke-width="1.5">
    <line x1="20" y1="210" x2="410" y2="210"/>
    <line x1="110" y1="218" x2="110" y2="20"/>
  </g>
  <g stroke="#ccc" stroke-dasharray="4 4">
    <line x1="110" y1="84" x2="410" y2="84"/><line x1="110" y1="48" x2="410" y2="48"/><line x1="110" y1="30" x2="410" y2="30"/>
  </g>
  <g font-size="19" fill="#222" text-anchor="middle">
    <text x="110" y="236">0</text><text x="210" y="236">1</text><text x="310" y="236">2</text><text x="398" y="236">t</text>
  </g>
  <g font-size="18" fill="#222" text-anchor="end">
    <text x="96" y="200">0</text><text x="102" y="90">0,70</text><text x="102" y="58">0,90</text><text x="102" y="34">1</text>
  </g>
  <text x="20" y="22" font-size="19" fill="#222">F(t)</text>
  <g stroke="#2f3e7a" stroke-width="4" fill="none">
    <line x1="20" y1="210" x2="110" y2="210"/>
    <line x1="110" y1="84" x2="210" y2="84"/>
    <line x1="210" y1="48" x2="310" y2="48"/>
    <line x1="310" y1="30" x2="410" y2="30"/>
  </g>
  <g stroke="#2f3e7a" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="110" y1="210" x2="110" y2="84"/><line x1="210" y1="84" x2="210" y2="48"/><line x1="310" y1="48" x2="310" y2="30"/>
  </g>
  <g fill="#2f3e7a"><circle cx="110" cy="84" r="6"/><circle cx="210" cy="48" r="6"/><circle cx="310" cy="30" r="6"/></g>
  <g fill="#ffffff" stroke="#2f3e7a" stroke-width="2.5"><circle cx="110" cy="210" r="6"/><circle cx="210" cy="84" r="6"/><circle cx="310" cy="48" r="6"/></g>
  <g font-size="18" fill="#8a3d17">
    <text x="120" y="152">+0,70</text><text x="218" y="74">+0,20</text><text x="318" y="70">+0,10</text>
  </g>
</svg>

  <rect x="105" y="130" width="50" height="50" fill="#dfe6f6" stroke="#2f3e7a" stroke-width="2"/>
  <rect x="185" y="40" width="50" height="140" fill="#dfe6f6" stroke="#2f3e7a" stroke-width="2"/>
  <rect x="265" y="130" width="50" height="50" fill="#dfe6f6" stroke="#2f3e7a" stroke-width="2"/>

  <g font-size="18" text-anchor="middle" fill="#222"><text x="50" y="162">0,022</text><text x="130" y="122">0,2</text><text x="210" y="32">0,556</text><text x="290" y="122">0,2</text><text x="370" y="162">0,022</text></g>

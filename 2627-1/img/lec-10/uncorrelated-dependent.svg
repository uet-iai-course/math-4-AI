<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Phân phối của độ lệch kích thước và nhãn lỗi</title>
  <desc id="d">Biểu đồ cột của xác suất độ lệch X tại năm giá trị âm 2, âm 1, 0, 1, 2 với độ cao 0,022; 0,2; 0,556; 0,2; 0,022. Hai cột ngoài cùng tại âm 2 và 2 được gạch chéo, viền đậm, ghi lỗi. Ba cột giữa tô trơn, ghi đạt. Hình đối xứng qua 0.</desc>
  <defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8a3d17" stroke-width="3"/></pattern></defs>
  <rect width="420" height="236" fill="#ffffff"/>

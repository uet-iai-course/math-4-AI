    <line x1="186" y1="166" x2="268" y2="144"/>
    <line x1="186" y1="178" x2="268" y2="204"/>
  </g>
  <g fill="#eef2fb" stroke="#2f3e7a" stroke-width="2">
    <circle cx="36" cy="116" r="19"/><circle cx="171" cy="58" r="17"/><circle cx="171" cy="172" r="17"/>
  </g>
  <g font-size="20" font-weight="700" text-anchor="middle" fill="#222">
    <text x="36" y="123">S</text><text x="171" y="65">a</text><text x="171" y="179">b</text>
  </g>
  <g font-size="19" fill="#222">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 232" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Cây xác suất của nguồn hàng và tình trạng lỗi</title>
  <desc id="d">Gốc S tách thành nhánh nhà cung cấp a với xác suất 0,6 và nhánh b với xác suất 0,4. Từ a: lỗi với xác suất 0,02, cho lá lỗi 0,012; đạt với xác suất 0,98, cho lá đạt 0,588. Từ b: lỗi 0,08, cho lá lỗi 0,032; đạt 0,92, cho lá đạt 0,368. Hai lá lỗi có viền liền đậm, hai lá đạt viền mảnh.</desc>
  <rect width="420" height="232" fill="#ffffff"/>
  <g stroke="#555" stroke-width="2" fill="none">

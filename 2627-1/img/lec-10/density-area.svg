<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 246" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Mật độ đều cao 10 trên đoạn từ 0 đến 0,1</title>
  <desc id="d">Đồ thị mật độ f theo x. Mật độ bằng 10 trên đoạn từ 0 đến 0,1 và bằng 0 ngoài đoạn. Hình chữ nhật dưới đồ thị được tô, ghi diện tích bằng 10 nhân 0,1 bằng 1. Một dải hẹp từ x không đến x không cộng delta được gạch chéo; khung bên phải ghi xác suất của dải xấp xỉ f tại x không nhân delta.</desc>
  <defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8a3d17" stroke-width="3"/></pattern></defs>
  <rect width="460" height="246" fill="#ffffff"/>
  <g stroke="#444" stroke-width="1.5"><line x1="20" y1="200" x2="456" y2="200"/><line x1="64" y1="208" x2="64" y2="22"/></g>
  <rect x="64" y="50" width="262" height="150" fill="#eef2fb" stroke="#2f3e7a" stroke-width="3"/>
  <rect x="200" y="50" width="44" height="150" fill="url(#h)" stroke="#8a3d17" stroke-width="2"/>
  <line x1="20" y1="200" x2="64" y2="200" stroke="#2f3e7a" stroke-width="4"/>
  <line x1="326" y1="200" x2="456" y2="200" stroke="#2f3e7a" stroke-width="4"/>
  <g font-size="20" fill="#222" text-anchor="middle"><text x="64" y="226">0</text><text x="326" y="226">0,1</text><text x="444" y="226">x</text><text x="196" y="226">x₀</text><text x="252" y="226">x₀ + δ</text></g>
  <text x="56" y="57" font-size="20" text-anchor="end" fill="#222">10</text>
  <text x="72" y="22" font-size="20" fill="#222">f(x)</text>
  <g font-size="20" text-anchor="middle" fill="#2f3e7a"><text x="131" y="118">diện tích</text><text x="131" y="144">10 · 0,1 = 1</text></g>
  <rect x="336" y="84" width="120" height="58" rx="6" fill="#ffffff" stroke="#8a3d17" stroke-width="2"/>
  <line x1="336" y1="113" x2="244" y2="113" stroke="#8a3d17" stroke-width="2"/>
  <g font-size="19" text-anchor="middle" fill="#8a3d17"><text x="396" y="107">xác suất dải</text><text x="396" y="132">≈ f(x₀) · δ</text></g>
</svg>

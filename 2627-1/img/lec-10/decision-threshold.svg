<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 276" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Chi phí kỳ vọng của hai hành động theo hậu nghiệm r</title>
  <desc id="d">Trục hoành là hậu nghiệm r từ 0 đến 0,6, trục tung là chi phí kỳ vọng từ 0 đến 1,2. Đường liền 5r là chi phí kỳ vọng khi chấp nhận, đường nét đứt 1 trừ r là chi phí kỳ vọng khi loại. Hai đường cắt nhau tại r bằng 1/6. Dưới trục hoành, vạch đứng tại 1/6 chia hai miền: bên trái ghi chấp nhận, r nhỏ hơn 1/6; bên phải ghi loại, r lớn hơn 1/6. Hai tam giác trên trục hoành đánh dấu r xấp xỉ 0,0048 khi không cảnh báo, sát gốc, và r xấp xỉ 0,453 khi có cảnh báo, có ghi số 0,0048 và 0,453.</desc>
  <rect width="430" height="276" fill="#ffffff"/>
  <g stroke="#444" stroke-width="1.5"><line x1="50" y1="200" x2="410" y2="200"/><line x1="50" y1="208" x2="50" y2="20"/></g>
  <line x1="45" y1="60" x2="55" y2="60" stroke="#444" stroke-width="1.5"/>
  <g font-size="19" fill="#222" text-anchor="end"><text x="42" y="66">1</text><text x="42" y="206">0</text></g>
  <line x1="50" y1="200" x2="190" y2="32" stroke="#b15a2b" stroke-width="4"/>
  <line x1="50" y1="60" x2="400" y2="144" stroke="#2f3e7a" stroke-width="4" stroke-dasharray="12 7"/>
  <line x1="147.2" y1="83.3" x2="147.2" y2="200" stroke="#666" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="147.2" cy="83.3" r="5.5" fill="#222"/>
  <text x="155" y="132" font-size="19" fill="#222">r = 1/6</text>
  <text x="196" y="42" font-size="19" font-weight="700" fill="#b15a2b">5r</text>
  <text x="404" y="132" font-size="19" font-weight="700" text-anchor="end" fill="#2f3e7a">1 − r</text>
  <path d="M52.8 200 l-6 12 h12 z" fill="#222"/>
  <path d="M314.3 200 l-6 12 h12 z" fill="#222"/>
  <text x="58" y="228" font-size="19" fill="#222">0,0048</text><text x="314" y="228" font-size="19" text-anchor="middle" fill="#222">0,453</text>
  <text x="420" y="206" font-size="19" text-anchor="end" fill="#222">r</text>
  <line x1="147.2" y1="236" x2="147.2" y2="274" stroke="#666" stroke-width="1.5"/>
  <g font-size="19" text-anchor="middle" fill="#444">
    <text x="98" y="252">chấp nhận</text><text x="98" y="272">r &lt; 1/6</text>
    <text x="270" y="252">loại</text><text x="270" y="272">r &gt; 1/6</text>
  </g>
</svg>

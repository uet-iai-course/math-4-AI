<text x="278" y="321" font-size="16">μ</text>
<path d="M423 165L435 177 M423 177L435 165" stroke="#a63826" stroke-width="3"/>
<text x="440" y="164" font-size="18" fill="#a63826">A</text>
<path d="M380 380L392 392 M380 392L392 380" stroke="#087b63" stroke-width="3"/>
<text x="397" y="379" font-size="18" fill="#087b63">B</text>
<text x="560" y="103" font-size="15" fill="#172b4d">Dữ liệu cảm biến (giả lập)</text>
<text x="560" y="135" font-size="15" fill="#172b4d">μ = (10, 20)</text>
<text x="560" y="167" font-size="15" fill="#172b4d">S = [[2,5; 1,5], [1,5; 2,5]]</text>
<text x="560" y="199" font-size="15" fill="#172b4d">λ+ = 4;  λ− = 1</text>
<text x="560" y="231" font-size="15" fill="#172b4d">u+ = (1, 1) / √2</text>
<text x="560" y="263" font-size="15" fill="#172b4d">u− = (1, −1) / √2</text>
<text x="560" y="295" font-size="15" fill="#376bc6">Đường mức: d = 1, 2, 3</text>
<text x="560" y="327" font-size="15" fill="#a63826">A = (13, 23)</text>
<text x="560" y="359" font-size="15" fill="#a63826">||A − μ||² = 18;  d²(A) = 4,5</text>
<text x="560" y="391" font-size="15" fill="#087b63">B = (12, 18)</text>
<text x="560" y="423" font-size="15" fill="#087b63">||B − μ||² = 8;  d²(B) = 8</text>
<text x="24" y="569" font-size="14">Cùng một tâm: độ lệch theo hướng phân tán rộng được chia cho trị riêng lớn hơn.</text>

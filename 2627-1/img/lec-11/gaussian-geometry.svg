<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 590" role="img" aria-labelledby="title desc">
<title id="title">Hình học Gaussian với hiệp phương sai tương quan</title>
<desc id="desc">Tâm (10,20), ma trận hiệp phương sai có hai trị riêng 4 và 1. Ellipse dài theo hướng (1,1). Điểm A (13,23) có khoảng cách Euclid bình phương 18 nhưng Mahalanobis bình phương 4,5; điểm B (12,18) có hai khoảng cách bình phương đều bằng 8. Ba đường đồng mức có khoảng cách Mahalanobis 1, 2 và 3.</desc>

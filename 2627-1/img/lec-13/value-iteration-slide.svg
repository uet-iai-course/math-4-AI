<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Hai nhánh của phép cập nhật Bellman và hội tụ của lặp giá trị cho robot</title>
<desc id="desc">Hai đồ thị. Bên trái: trục hoành là giá trị v tại trạng thái hoạt động từ 0 đến 7, trục tung là giá trị sau một phép cập nhật. Nhánh A có độ dốc nhỏ, nhánh B có độ dốc lớn; hai nhánh cắt nhau tại v = 8/9; nhánh B cắt đường chéo tại điểm bất động 6. Bên phải: giá trị v_k theo số vòng lặp k từ 0 đến 30; dãy tăng qua 1; 1,5; 1,95; 2,355 và tiến tới đường ngang 6. Điểm v_1 tạo bởi nhánh A là hình tam giác, các điểm sau tạo bởi nhánh B là hình tròn.</desc>

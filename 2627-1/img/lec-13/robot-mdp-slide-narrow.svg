<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Hai hành động của robot trong mô hình quyết định Markov</title>
<desc id="desc">Hai hình tròn là trạng thái: h (hoạt động) và z (hấp thụ). Từ h có hai ô hành động. Ô A ghi thưởng 1, có mũi tên về h với xác suất 0,5 và mũi tên sang z với xác suất 0,5. Ô B ghi thưởng 0,6, có mũi tên về h với xác suất 1. Tại z có vòng tự lặp xác suất 1, thưởng 0. Hệ số chiết khấu 0,9.</desc>
<defs>
<marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56677f"/></marker>
<marker id="aa" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b34b36"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2456a6"/></marker>
<marker id="az" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect width="900" height="540" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#17304e">
<circle cx="180" cy="245" r="58" fill="#edf4ff" stroke="#2456a6" stroke-width="3"/>
<text x="180" y="265" font-size="56" text-anchor="middle">h</text>
<circle cx="740" cy="245" r="58" fill="#f3f4f6" stroke="#64748b" stroke-width="3"/>
<text x="740" y="265" font-size="56" text-anchor="middle">z</text>
<rect x="315" y="20" width="310" height="120" rx="10" fill="#fff0ed" stroke="#b34b36" stroke-width="3"/>
<text x="470" y="72" font-size="44" text-anchor="middle">Hành động A</text>
<text x="470" y="124" font-size="44" text-anchor="middle">thưởng 1</text>
<rect x="315" y="330" width="310" height="120" rx="10" fill="#eaf4ff" stroke="#2456a6" stroke-width="3"/>
<text x="470" y="382" font-size="44" text-anchor="middle">Hành động B</text>
<text x="470" y="434" font-size="44" text-anchor="middle">thưởng 0,6</text>
<g fill="none" stroke-width="2.6">
<path d="M226 212 L311 140" stroke="#56677f" marker-end="url(#ag)"/>
<path d="M226 278 L311 335" stroke="#56677f" marker-end="url(#ag)"/>
<path d="M370 20 C300 -20 150 30 166 185" stroke="#b34b36" marker-end="url(#aa)"/>
<path d="M625 80 C675 80 712 125 724 187" stroke="#b34b36" marker-end="url(#aa)"/>
<path d="M315 410 C240 470 150 400 166 305" stroke="#2456a6" marker-end="url(#ab)"/>
<path d="M712 297 C680 390 800 390 768 301" stroke="#64748b" marker-end="url(#az)"/>
</g>
<text x="245" y="95" font-size="44" fill="#b34b36" text-anchor="middle">0,5</text>
<text x="700" y="64" font-size="44" fill="#b34b36" text-anchor="middle">0,5</text>
<text x="140" y="452" font-size="44" fill="#2456a6" text-anchor="middle">1</text>
<text x="760" y="425" font-size="44" text-anchor="middle">1;</text><text x="760" y="472" font-size="44" text-anchor="middle">thưởng 0</text>
<text x="450" y="528" font-size="44" text-anchor="middle">h: hoạt động · z: hấp thụ · γ = 0,9</text>
</g></svg>

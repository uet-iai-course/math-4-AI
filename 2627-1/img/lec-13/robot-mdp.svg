<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Hai lựa chọn của robot trong mô hình quyết định Markov</title>
<desc id="desc">Trạng thái hoạt động h và trạng thái hấp thụ z. Chọn A nhận thưởng 1, rồi quay về h với xác suất 0,5 hoặc đến z với xác suất 0,5. Chọn B nhận thưởng 0,6 rồi về h với xác suất 1. Tại z luôn ở z và mọi thưởng tiếp theo bằng 0. Hệ số chiết khấu 0,9. Các ô A và B biểu diễn hành động, không phải trạng thái.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#53677f" stroke-width="1.4"/></marker></defs>
<rect width="900" height="520" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#17304e">
<text x="30" y="34" font-size="21" font-weight="bold">Robot: phần thưởng và khả năng tiếp tục hoạt động</text>
<text x="30" y="65" font-size="16">Hai trạng thái h, z; hệ số chiết khấu γ = 0,9</text>
<circle cx="140" cy="250" r="46" fill="#edf4ff" stroke="#2456a6" stroke-width="2"/>
<text x="140" y="258" font-size="25" text-anchor="middle">h</text>
<text x="140" y="321" font-size="16" text-anchor="middle">Hoạt động</text>
<circle cx="690" cy="250" r="46" fill="#f3f4f6" stroke="#64748b" stroke-width="2"/>
<text x="690" y="258" font-size="25" text-anchor="middle">z</text>
<text x="690" y="321" font-size="16" text-anchor="middle">Hấp thụ</text>
<rect x="330" y="105" width="160" height="78" rx="8" fill="#fff0ed" stroke="#b34b36" stroke-width="2"/>
<text x="410" y="136" font-size="18" text-anchor="middle">Hành động A</text>
<text x="410" y="162" font-size="16" text-anchor="middle">Thưởng 1</text>
<rect x="330" y="350" width="160" height="78" rx="8" fill="#eaf4ff" stroke="#2456a6" stroke-width="2"/>
<text x="410" y="381" font-size="18" text-anchor="middle">Hành động B</text>
<text x="410" y="407" font-size="16" text-anchor="middle">Thưởng 0,6</text>
<path d="M180 227 L330 162 M177 279 L330 369" stroke="#56677f" stroke-width="2" fill="none"/>
<path d="M352 105 C260 20 65 105 112 211" stroke="#b34b36" stroke-width="2.4" fill="none"/>
<text x="190" y="105" font-size="17" fill="#b34b36">P = 0,5</text>
<path d="M490 145 C575 145 624 167 666 210" stroke="#b34b36" stroke-width="2.4" fill="none"/>
<text x="564" y="137" font-size="17" fill="#b34b36">P = 0,5</text>
<path d="M330 407 C180 475 48 409 110 285" stroke="#2456a6" stroke-width="2.4" fill="none"/>
<text x="148" y="450" font-size="17" fill="#2456a6">P = 1</text>
<path d="M722 216 C822 140 822 358 722 284" stroke="#64748b" stroke-width="2" fill="none"/>
<text x="814" y="244" font-size="16">P = 1</text>
<text x="812" y="270" font-size="15">Thưởng 0</text>
<text x="30" y="494" font-size="15">Ô A, B là các lựa chọn hành động; chỉ hai hình tròn h và z là trạng thái của mô hình.</text>
<polygon points="330,162 320.58,170.44 317.40,163.10" fill="#56677f"/>
<polygon points="330,369 317.63,366.36 321.68,359.47" fill="#56677f"/>
<polygon points="112,211 103.48,201.65 110.79,198.41" fill="#b34b36"/>
<polygon points="666,210 654.75,204.21 660.48,198.62" fill="#b34b36"/>
<polygon points="110,285 108.21,297.52 101.06,293.94" fill="#2456a6"/>
<polygon points="722,284 734.03,287.92 729.27,294.35" fill="#64748b"/>
</g></svg>

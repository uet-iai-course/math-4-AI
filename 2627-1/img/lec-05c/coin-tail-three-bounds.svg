<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title desc"><title id="title">Xác suất đuôi của số mặt ngửa và ba cận, n = 100</title><desc id="desc">Thang logarit từ 10 mũ âm 10 đến 1, k từ 55 đến 80. Xác suất đúng P(S ≥ k) giảm nhanh nhất: 0,0284 tại k = 60, 2,8·10⁻⁷ tại k = 75, 5,6·10⁻¹⁰ tại k = 80. Cận mũ một phía của Định lý F.6 (trùng Hoeffding với khoảng [0, 1]): 0,135 tại k = 60 và 3,7·10⁻⁶ tại k = 75. Chebyshev hai phía: 0,25 tại k = 60 và 0,04 tại k = 75. Markov một phía: 0,833 tại k = 60 và 0,667 tại k = 75.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><line x1="88.0" y1="400.0" x2="560.0" y2="400.0" stroke="#d5d9db" stroke-width="1"/><line x1="84.0" y1="400.0" x2="88.0" y2="400.0" stroke="#667078" stroke-width="2"/><text x="80.0" y="408.0" fill="#263238" text-anchor="end" font-size="22">10⁻¹⁰</text><line x1="88.0" y1="328.2" x2="560.0" y2="328.2" stroke="#d5d9db" stroke-width="1"/><line x1="84.0" y1="328.2" x2="88.0" y2="328.2" stroke="#667078" stroke-width="2"/><text x="80.0" y="336.2" fill="#263238" text-anchor="end" font-size="22">10⁻⁸</text><line x1="88.0" y1="256.3" x2="560.0" y2="256.3" stroke="#d5d9db" stroke-width="1"/><line x1="84.0" y1="256.3" x2="88.0" y2="256.3" stroke="#667078" stroke-width="2"/><text x="80.0" y="264.3" fill="#263238" text-anchor="end" font-size="22">10⁻⁶</text><line x1="88.0" y1="184.5" x2="560.0" y2="184.5" stroke="#d5d9db" stroke-width="1"/><line x1="84.0" y1="184.5" x2="88.0" y2="184.5" stroke="#667078" stroke-width="2"/><text x="80.0" y="192.5" fill="#263238" text-anchor="end" font-size="22">10⁻⁴</text><line x1="88.0" y1="112.7" x2="560.0" y2="112.7" stroke="#d5d9db" stroke-width="1"/><line x1="84.0" y1="112.7" x2="88.0" y2="112.7" stroke="#667078" stroke-width="2"/><text x="80.0" y="120.7" fill="#263238" text-anchor="end" font-size="22">10⁻²</text><line x1="88.0" y1="40.8" x2="560.0" y2="40.8" stroke="#d5d9db" stroke-width="1"/><line x1="84.0" y1="40.8" x2="88.0" y2="40.8" stroke="#667078" stroke-width="2"/><text x="80.0" y="48.8" fill="#263238" text-anchor="end" font-size="22">1</text><line x1="88.0" y1="400.0" x2="570.0" y2="400.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="88.0" y1="400.0" x2="88.0" y2="20.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="88.0" y1="400.0" x2="88.0" y2="405.0" stroke="#667078" stroke-width="2"/><text x="88.0" y="428.0" fill="#263238" text-anchor="middle" font-size="22">55</text><line x1="182.4" y1="400.0" x2="182.4" y2="405.0" stroke="#667078" stroke-width="2"/><text x="182.4" y="428.0" fill="#263238" text-anchor="middle" font-size="22">60</text><line x1="276.8" y1="400.0" x2="276.8" y2="405.0" stroke="#667078" stroke-width="2"/><text x="276.8" y="428.0" fill="#263238" text-anchor="middle" font-size="22">65</text><line x1="371.2" y1="400.0" x2="371.2" y2="405.0" stroke="#667078" stroke-width="2"/><text x="371.2" y="428.0" fill="#263238" text-anchor="middle" font-size="22">70</text><line x1="465.6" y1="400.0" x2="465.6" y2="405.0" stroke="#667078" stroke-width="2"/><text x="465.6" y="428.0" fill="#263238" text-anchor="middle" font-size="22">75</text><line x1="560.0" y1="400.0" x2="560.0" y2="405.0" stroke="#667078" stroke-width="2"/><text x="560.0" y="428.0" fill="#263238" text-anchor="middle" font-size="22">80</text><text x="564.0" y="390.0" fill="#263238" text-anchor="end" font-size="22" font-style="italic" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">k</text><path d="M88.0 67.2 L106.9 72.0 L125.8 77.3 L144.6 83.1 L163.5 89.4 L182.4 96.3 L201.3 103.8 L220.2 111.9 L239.0 120.6 L257.9 129.9 L276.8 139.8 L295.7 150.3 L314.6 161.5 L333.4 173.3 L352.3
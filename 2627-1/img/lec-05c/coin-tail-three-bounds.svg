 phía)</text><text x="560.0" y="150.4" fill="#B15A2B" text-anchor="end" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Định lý F.6 (một phía)</text><text x="106.9" y="155.8" fill="#263238" text-anchor="start" font-size="22" font-weight="bold" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">xác suất đúng</text><text x="465.6" y="306.1" fill="#263238" text-anchor="middle" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">2,8·10⁻⁷</text></g></svg>

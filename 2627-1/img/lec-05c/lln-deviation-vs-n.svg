<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">Luật số lớn: xác suất sai lệch của tần suất mặt ngửa và hai cận</title><desc id="desc">Trục hoành n bằng 10, 20, 50, 100, 200 trên thang logarit; trục tung logarit. Xác suất đúng của sai lệch từ 0,1 trở lên giảm từ 0,754 xuống 0,0057. Cận Chebyshev 25/n và cận Hoeffding hai phía 2e^{−0,02n} lớn hơn 1 tại n = 10 và 20, vùng tô ghi cận vô nghĩa. Tại n = 50 và 100 Chebyshev nhỏ hơn Hoeffding (0,5 so với 0,736; 0,25 so với 0,271); tại n = 200 Hoeffding nhỏ hơn (0,037 so với 0,125).</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><rect x="88.0" y="30.0" width="472.0" height="55.7" fill="#F2E3E3"/><line x1="88.0" y1="319.0" x2="560.0" y2="319.0" stroke="#d5d9db" stroke-width="1"/><line x1="84.0" y1="319.0" x2="88.0" y2="319.0" stroke="#667078" stroke-width="2"/><text x="80.0" y="327.0" fill="#263238" text-anchor="end" font-size="22">10⁻²</text><line x1="88.0" y1="202.3" x2="560.0" y2="202.3" stroke="#d5d9db" stroke-width="1"/><line x1="84.0" y1="202.3" x2="88.0" y2="202.3" stroke="#667078" stroke-width="2"/><text x="80.0" y="210.3" fill="#263238" text-anchor="end" font-size="22">10⁻¹</text><line x1="88.0" y1="85.7" x2="560.0" y2="85.7" stroke="#d5d9db" stroke-width="1"/><line x1="84.0" y1="85.7" x2="88.0" y2="85.7" stroke="#667078" stroke-width="2"/><text x="80.0" y="93.7" fill="#263238" text-anchor="end" font-size="22">1</text><line x1="88.0" y1="380.0" x2="570.0" y2="380.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="88.0" y1="380.0" x2="88.0" y2="20.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="118.6" y1="380.0" x2="118.6" y2=
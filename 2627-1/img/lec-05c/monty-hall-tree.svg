<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">Cây Monty Hall khi người chơi chọn cửa 1</title><desc id="desc">Tầng một: xe ở cửa 1, 2 hoặc 3, mỗi nhánh xác suất một phần ba. Tầng hai: cửa người dẫn mở. Xe ở cửa 1: mở cửa 2 hoặc cửa 3, mỗi lá xác suất một phần sáu, giữ cửa thắng. Xe ở cửa 2: mở cửa 3, xác suất một phần ba, đổi cửa thắng. Xe ở cửa 3: mở cửa 2, xác suất một phần ba, đổi cửa thắng. Tổng xác suất đổi thắng là hai phần ba.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><rect x="220.0" y="12.0" width="160.0" height="44.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="300.0" y="42.0" fill="#263238" text-anchor="middle" font-size="22">Chọn cửa 1</text><line x1="300.0" y1="56.0" x2="118.0" y2="120.0" stroke="#667078" stroke-width="2"/><rect x="43.0" y="120.0" width="150.0" height="44.0" rx="8" fill="white" stroke="#2F3E7A" stroke-width="2"/><text x="118.0" y="150.0" fill="#263238" text-anchor="middle" font-size="22">Xe ở 1 · 1/3</text><line x1="300.0" y1="56.0" x2="330.0" y2="120.0" stroke="#667078" stroke-width="2"/><rect x="255.0" y="120.0" width="150.0" height="44.0" rx="8" fill="white" stroke="#2F3E7A" stroke-width="2"/><text x="330.0" y="150.0" fill="#263238" text-anchor="middle" font-size="22">Xe ở 2 · 1/3</text><line x1="300.0" y1="56.0" x2="510.0" y2="120.0" stroke="#667078" stroke-width="2"/><rect x="435.0" y="120.0" width="150.0" height="44.0" rx="8" fill="white" stroke="#2F3E7A" stroke-width="2"/><text x="510.0" y="150.0" fill="#263238" text-anchor="middle" font-size="22">Xe ở 3 · 1/3</text><line x1="118.0" y1="164.0" x2="62.0" y2="240.0" stroke="#667078" stroke-width="2" stroke-dasharray="6 5"/><rect x="6.0" y="240.0" width="112.0" height="72.0" rx="8" fill="white" stroke="#667078" stroke-width="2"/><text x="62.0" y="268.0" fill="#263238" text-anchor="middle" font-size="22">Mở 2</text><text x="62.0" y="298.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">1/6</text><text x="62.0" y="344.0" fill="#667078" text-anchor="middle" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">giữ thắng</text><line x1="118.0" y1="164.0" x2="178.0" y2="240.0" stroke="#667078" stroke-width="2" stroke-dasharray="6 5"/><rect x="122.0" y="240.0" width="112.0" height="72.0" rx="8" fill="white" stroke="#667078" stroke-width="2"/><text x="178.0" y="268.0" fill="#263238" text-anchor="middle" font-size="22">Mở 3</text><text x="178.0" y="298.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">1/6</text><text x="178.0" y="344.0" fill="#667078" text-anchor="middle" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">giữ thắng</text><line x1="330.0" y1="164.0" x2="330.0" y2="240.0" stroke="#667078" stroke-width="2"/><rect x="274.0" y="240.0" width="112.0" height="72.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="330.0" y="268.0" fill="#263238" text-anchor="middle" font-size="22">Mở 3</text><text x="330.0" y="298.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">1/3</text><text x="330.0" y="344.0" fill="#B15A2B" text-anchor="middle" font-size="22" font-weight="bold" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">đổi thắng</text><line x1="510.0" y1="164.0" x2="510.0" y2="240.0" stroke="#667078" stroke-width="2"/><rect x="454.0" y="240.0" width="112.0" height="72.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="510.0" y="268.0" fill="#263238" text-anchor="middle" font-size="22">Mở 2</text><text x="510.0" y="298.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">1/3</text><text x="510.0" y="344.0" fill="#B15A2B" text-anchor="middle" font-size="22" font-weight="bold" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">đổi thắng</text><text x="300.0" y="404.0" fill="#263238" text-anchor="middle" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Đổi thắng: 1/3 + 1/3 = 2/3; giữ thắng: 1/6 + 1/6 = 1/3</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">Sai số chuẩn và chi phí theo cỡ nhóm</title><desc id="desc">Hai bảng cùng trục hoành logarit b từ 1 đến 10 000. Bảng trên: sai số chuẩn căn của 8 chia 3b giảm từ 1,63 tại b = 1 xuống 0,163 tại b = 100 và 0,0163 tại b = 10 000. Bảng dưới: chi phí tương đối b tăng từ 1 lên 100 và 10 000. Từ b = 1 lên b = 100, chi phí tăng 100 lần và sai số chuẩn giảm 10 lần.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><line x1="100.0" y1="250.0" x2="560.0" y2="250.0" stroke="#d5d9db" stroke-width="1"/><line x1="96.0" y1="250.0" x2="100.0" y2="250.0" stroke="#667078" stroke-width="2"/><text x="92.0" y="258.0" fill="#263238" text-anchor="end" font-size="22">0,01</text><line x1="100.0" y1="169.3" x2="560.0" y2="169.3" stroke="#d5d9db" stroke-width="1"/><line x1="96.0" y1="169.3" x2="100.0" y2="169.3" stroke="#667078" stroke-width="2"/><text x="92.0" y="177.3" fill="#263238" text-anchor="end" font-size="22">0,1</text><line x1="100.0" y1="88.5" x2="560.0" y2="88.5" stroke="#d5d9db" stroke-width="1"/><line x1="96.0" y1="88.5" x2="100.0" y2="88.5" stroke="#667078" stroke-width="2"/><text x="92.0" y="96.5" fill="#263238" text-anchor="end" font-size="22">1</text><line x1="100.0" y1="250.0" x2="570.0" y2="250.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="100.0" y1="250.0" x2="100.0" y2="40.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="116.6" y1="250.0" x2="116.6" y2="255.0" stroke="#667078" stroke-width="2"/><text x="116.6" y="278.0" fill="#263238" text-anchor="middle" font-size="22">1</text><line x1="330.5" y1="250.0" x2="330.5" y2="255.0" stroke="#667078" stroke-width="2"/><text x="330.5" y="278.0" fill="#263238" text-anchor="middle" font-size="22">100</text><line x1="544.4" y1="250.0" x2="544.4" y2="255.0" stroke="#667078" stroke-width="2"/><text x="544.4" y="278.0" fill="#263238" text-anchor="middle" font-size="22">10 000</text><text x="564.0" y="240.0" fill="#263238" text-anchor="end" font-size="22" font-style="italic" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">b</text><text x="110.0" y="30.0" fill="#263238" text-anchor="start" font-size="22" font-weight="bold" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">sai số chuẩn √(8/(3b))</text><path d="M116.6 71.3 L544.4 232.8" fill="none" stroke="#2F3E7A" stroke-width="3" stroke-linejoin="round"/><circle cx="116.6" cy="71.3" r="6" fill="#2F3E7A" stroke="#2F3E7A" stroke-width="2"/><text x="128.6" y="59.3" fill="#2F3E7A" text-anchor="start" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">1,63</text><circle cx="330.5" cy="152.1" r="6" fill="#2F3E7A" stroke="#2F3E7A" stroke-width="2"/><text x="342.5" y="140.1" fill="#2F3E7A" text-anchor="start" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">0,163</text><circle cx="544.4" cy="232.8" r="6" fill="#2F3E7A" stroke="#2F3E7A" stroke-width="2"/><text x="532.4" y="182.8" fill="#2F3E7A" text-anchor="end" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">0,0163</text><line x1="100.0" y1="543.0" x2="560.0" y2="543.0" stroke="#d5d9db" stroke-width="1"/><line x1="96.0" y1="543.0" x2="100.0" y2="543.0" stroke="#667078" stroke-width="2"/><text x="92.0" y="551.0" fill="#263238" text-anchor="end" font-size="22">1</text><line x1="100.0" y1="453.3" x2="560.0" y2="453.3" stroke="#d5d9db" stroke-width="1"/><line x1="96.0" y1="453.3" x2="100.0" y2="453.3" stroke="#667078" stroke-width="2"/><text x="92.0" y="461.3" fill="#263238" text-anchor="end" font-size="22">100</text><line x1="100.0" y1="363.5" x2="560.0" y2="363.5" stroke="#d5d9db" stroke-width="1"/><line x1="96.0" y1="363.5" x2="100.0" y2="363.5" stroke="#667078" stroke-width="2"/><text x="92.0" y="371.5" fill="#263238" text-anchor="end" font-size="22">10 000</text><line x1="100.0" y1="550.0" x2="570.0" y2="550.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="100.0" y1="550.0" x2="100.0" y2="340.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="116.6" y1="550.0" x2="116.6" y2="555.0" stroke="#667078" stroke-width="2"/><text x="116.6" y="578.0" fill="#263238" text-anchor="middle" font-size="22">1</text><line x1="330.5" y1="550.0" x2="330.5" y2="555.0" stroke="#667078" stroke-width="2"/><text x="330.5" y="578.0" fill="#263238" text-anchor="middle" font-size="22">100</text><line x1="544.4" y1="550.0" x2="544.4" y2="555.0" stroke="#667078" stroke-width="2"/><text x="544.4" y="578.0" fill="#263238" text-anchor="middle" font-size="22">10 000</text><text x="564.0" y="540.0" fill="#263238" text-anchor="end" font-size="22" font-style="italic" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">b</text><text x="110.0" y="330.0" fill="#263238" text-anchor="start" font-size="22" font-weight="bold" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">chi phí tương đối b</text><path d="M116.6 543.0 L544.4 363.5" fill="none" stroke="#B15A2B" stroke-width="3" stroke-dasharray="10 6" stroke-linejoin="round"/><rect x="110.6" y="537.0" width="12" height="12" fill="white" stroke="#B15A2B" stroke-width="2"/><rect x="324.5" y="447.3" width="12" height="12" fill="white" stroke="#B15A2B" stroke-width="2"/><rect x="538.4" y="357.5" width="12" height="12" fill="white" stroke="#B15A2B" stroke-width="2"/><text x="223.5" y="400.5" fill="#263238" text-anchor="middle" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">×100 chi phí, ÷10 sai số</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Hệ số co của phần tất định theo cỡ nhóm, bước 0,1</title><desc id="desc">Trục hoành b từ 1 đến 32, trục tung từ −2,5 đến 1. Dải tô ứng với trị tuyệt đối nhỏ hơn 1. Đường liền 1 − 0,1b của mất mát tổng giảm tuyến tính, bằng 0 tại b = 10 (ηb = 1/L), bằng −1 tại b = 20 và ra khỏi dải khi b &gt; 20 (ηbL &gt; 2), bằng −2,2 tại b = 32. Đường đứt của mất mát trung bình bằng 0,9 với mọi b.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><rect x="90.0" y="47.8" width="470.0" height="178.4" fill="#EAF2EA"/><line x1="90.0" y1="315.4" x2="560.0" y2="315.4" stroke="#d5d9db" stroke-width="1"/><line x1="86.0" y1="315.4" x2="90.0" y2="315.4" stroke="#667078" stroke-width="2"/><text x="82.0" y="323.4" fill="#263238" text-anchor="end" font-size="22">−2</text><line x1="90.0" y1="226.2" x2="560.0" y2="226.2" stroke="#d5d9db" stroke-width="1"/><line x1="86.0" y1="226.2" x2="90.0" y2="226.2" stroke="#667078" stroke-width="2"/><text x="82.0" y="234.2" fill="#263238" text-anchor="end" font-size="22">−1</text><line x1="90.0" y1="137.0" x2="560.0" y2="137.0" stroke="#d5d9db" stroke-width="1"/><line x1="86.0" y1="137.0" x2="90.0" y2="137.0" stroke="#667078" stroke-width="2"/><text x="82.0" y="145.0" fill="#263238" text-anchor="end" font-size="22">0</text><line x1="90.0" y1="47.8" x2="560.0" y2="47.8" stroke="#d5d9db" stroke-width="1"/><line x1="86.0" y1="47.8" x2="90.0" y2="47.8" stroke="#667078" stroke-width="2"/><text x="82.0" y="55.8" fill="#263238" text-anchor="end" font-size="22">1</text><line x1="90.0" y1="360.0" x2="570.0" y2="360.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="90.0" y1="360.0" x2="90.0" y2="20.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="104.2" y1="360.0" x2="104.2" y2="365.0" stroke="#667078" stroke-width="2"/><text x="104.2" y="388.0" fill="#263238" text-anchor="middle" font-size="22">1</text><line x1="232.4" y1="360.0" x2="232.4" y2="365.0" stroke="#667078" stroke-width="2"/><text x="232.4" y="388.0" fill="#263238" text-anchor="middle" font-size="22">10</text><line x1="374.8" y1="360.0" x2="374.8" y2="365.0" stroke="#667078" stroke-width="2"/><text x="374.8" y="388.0" fill="#263238" text-anchor="middle" font-size="22">20</text><line x1="545.8" y1="360.0" x2="545.8" y2="365.0" stroke="#667078" stroke-width="2"/><text x="545.8" y="388.0" fill="#263238" text-anchor="middle" font-size="22">32</text><text x="564.0" y="350.0" fill="#263238" text-anchor="end" font-size="22" font-style="italic" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">b</text><path d="M104.2 56.8 L545.8 333.2" fill="none" stroke="#B15A2B" stroke-width="3" stroke-linejoin="round"/><path d="M104.2 56.8 L545.8 56.8" fill="none" stroke="#2F3E7A" stroke-width="3" stroke-dasharray="10 6" stroke-linejoin="round"/><circle cx="232.4" cy="137.0" r="6" fill="#B15A2B" stroke="#B15A2B" stroke-width="2"/><circle cx="374.8" cy="226.2" r="6" fill="#B15A2B" stroke="#B15A2B" stroke-width="2"/><text x="364.8" y="258.2" fill="#B15A2B" text-anchor="end" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">b = 20: −1 (ηbL = 2)</text><text x="244.4" y="125.0" fill="#B15A2B" text-anchor="start" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">b = 10: 0 (ηb = 1/L)</text><circle cx="545.8" cy="333.2" r="6" fill="#B15A2B" stroke="#B15A2B" stroke-width="2"/><text x="503.0" y="339.2" fill="#B15A2B" text-anchor="end" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">b = 32: −2,2</text><text x="275.2" y="44.8" fill="#2F3E7A" text-anchor="start" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">trung bình: 0,9</text><text x="132.7" y="295.8" fill="#B15A2B" text-anchor="start" font-size="22" font-weight="bold" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">tổng: 1 − 0,1b</text><text x="531.5" y="88.0" fill="#2E7D32" text-anchor="end" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">|hệ số| &lt; 1</text></g></svg>

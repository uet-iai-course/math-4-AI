<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title desc"><title id="title">Quỹ đạo SGD khi dữ liệu không xáo trộn và khi nhóm được rút mới</title><desc id="desc">Trục ngang: bước k từ 0 đến 30, nhóm 100 quan sát, bước 0,1, θ₀ = 0, tập 3000 quan sát gồm 1000 bản sao mỗi giá trị −1, 1, 3. Đường gấp khúc của dữ liệu sắp theo giá trị đi xuống −0,65 tại k = 10, lên 0,42 tại k = 20 và 2,10 tại k = 30. Đường của nhóm rút mới là kỳ vọng 1 − 0,9 mũ k tăng đều về nghiệm 1, kèm dải một độ lệch chuẩn rộng không quá 0,04. Đường ngang nét đứt tại nghiệm 1.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><line x1="90" y1="390.0" x2="560" y2="390.0" stroke="#d5d9db" stroke-width="1"/><line x1="86" y1="390.0" x2="90" y2="390.0" stroke="#667078" stroke-width="2"/><text x="82" y="398.0" text-anchor="end">−1</text><line x1="90" y1="290.0" x2="560" y2="290.0" stroke="#d5d9db" stroke-width="1"/><line x1="86" y1="290.0" x2="90" y2="290.0" stroke="#667078" stroke-width="2"/><text x="82" y="298.0" text-anchor="end">0</text><line x1="90" y1="190.0" x2="560" y2="190.0" stroke="#d5d9db" stroke-width="1"/><line x1="86" y1="190.0" x2="90" y2="190.0" stroke="#667078" stroke-width="2"/><text x="82" y="198.0" text-anchor="end">1</text><line x1="90" y1="90.0" x2="560" y2="90.0" stroke="#d5d9db" stroke-width="1"/><line x1="86" y1="90.0" x2="90" y2="90.0" stroke="#667078" stroke-width="2"/><text x="82" y="98.0" text-anchor="end">2</text><line x1="90" y1="390" x2="570" y2="390" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="90" y1="390" x2="90" y2="20" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="90.0" y1="390" x2="90.0" y2="395" stroke="
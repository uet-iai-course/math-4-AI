<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Cây tần số tự nhiên của ví dụ xét nghiệm</title><desc id="desc">Cây hai tầng trên 100 000 người: 100 người mắc bệnh, trong đó 95 dương tính và 5 âm tính; 99 900 người không mắc, trong đó 4 995 dương tính và 94 905 âm tính. Trong 5 090 người dương tính có 95 người mắc, nên xác suất mắc khi dương tính xấp xỉ 0,0187.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><rect x="190.0" y="14.0" width="220.0" height="64.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="300.0" y="42.0" fill="#263238" text-anchor="middle" font-size="22">Tổng</text><text x="300.0" y="70.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">100 000 người</text><line x1="300.0" y1="78.0" x2="150.0" y2="120.0" stroke="#667078" stroke-width="2"/><rect x="50.0" y="120.0" width="200.0" height="64.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="150.0" y="148.0" fill="#263238" text-anchor="middle" font-size="22">Mắc</text><text x="150.0" y="176.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">100</text><line x1="300.0" y1="78.0" x2="450.0" y2="120.0" stroke="#667078" stroke-width="2"/><rect x="350.0" y="120.0" width="200.0" height="64.0" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><text x="450.0" y="148.0" fill="#263238" text-anchor="middle" font-size="22">Không mắc</text><text x="450.0" y="176.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">99 900</text><line x1="150.0" y1="184.0" x2="75.0" y2="240.0" stroke="#667078" stroke-width="2"/><rect x="5.0" y="240.0" width="140.0" height="64.0" rx="8" fill="#E8ECF6" stroke="#2F3E7A" stroke-width="2"/><text x="75.0" y="268.0" fill="#263238" text-anchor="middle" font-size="22">Dương tính</text><text x="75.0" y="296.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">95</text><line x1="150.0" y1="184.0" x2="225.0" y2="240.0" stroke="#667078" stroke-width="2" stroke-dasharray="6 5"/><rect x="155.0" y="240.0" width="140.0" height="64.0" rx="8" fill="white" stroke="#667078" stroke-width="2"/><text x="225.0" y="268.0" fill="#263238" text-anchor="middle" font-size="22">Âm tính</text><text x="225.0" y="296.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">5</text><line x1="450.0" y1="184.0" x2="375.0" y2="240.0" stroke="#667078" stroke-width="2"/><rect x="305.0" y="240.0" width="140.0" height="64.0" rx="8" fill="#E8ECF6" stroke="#2F3E7A" stroke-width="2"/><text x="375.0" y="268.0" fill="#263238" text-anchor="middle" font-size="22">Dương tính</text><text x="375.0" y="296.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">4 995</text><line x1="450.0" y1="184.0" x2="525.0" y2="240.0" stroke="#667078" stroke-width="2" stroke-dasharray="6 5"/><rect x="455.0" y="240.0" width="140.0" height="64.0" rx="8" fill="white" stroke="#667078" stroke-width="2"/><text x="525.0" y="268.0" fill="#263238" text-anchor="middle" font-size="22">Âm tính</text><text x="525.0" y="296.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold">94 905</text><text x="300.0" y="350.0" fill="#263238" text-anchor="middle" font-size="22" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Dương tính: 95 + 4 995 = 5 090 người</text><text x="300.0" y="390.0" fill="#B15A2B" text-anchor="middle" font-size="22" font-weight="bold" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">P(mắc | +) = 95 / 5 090 ≈ 0,0187</text></g></svg>

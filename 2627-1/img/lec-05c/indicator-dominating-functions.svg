<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">Ba hàm chặn trên của hàm chỉ thị</title><desc id="desc">Ba khung hình cạnh nhau. Khung Markov: hàm bậc thang bằng 0 khi z nhỏ hơn ε và bằng 1 khi z từ ε trở lên, nằm dưới đường thẳng z chia ε. Khung Chebyshev: bậc thang bằng 1 ngoài khoảng từ μ − t đến μ + t, nằm dưới parabol ((x − μ)/t)². Khung Chernoff: bậc thang bằng 1 khi x từ a trở lên, nằm dưới hàm mũ e^{λ(x − a)}.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="22" fill="#263238"><text x="110.0" y="34.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Markov</text><line x1="30.0" y1="250.0" x2="198.0" y2="250.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><line x1="30.0" y1="250.0" x2="30.0" y2="60.0" stroke="#667078" stroke-width="2" marker-end="url(#arr)"/><text x="22.0" y="176.2" fill="#263238" text-anchor="end" font-size="22">1</text><line x1="26.0" y1="168.2" x2="30.0" y2="168.2" stroke="#667078" stroke-width="2"/><path d="M30.0 250.0 L206.0 70.0" fill="none" stroke="#B15A2B" stroke-width="3" stroke-dasharray="9 6" stroke-linejoin="round"/><path d="M30.0 250.0 L110.0 250.0 L110.0 168.2 L190.0 168.2" fill="none" stroke="#263238" stroke-width="4" stroke-linejoin="round"/><line x1="110.0" y1="250.0" x2="110.0" y2="255.0" stroke="#667078" stroke-width="2"/><text x="110.0" y="280.0" fill="#263238" text-anchor="middle" font-size="22">ε</text><text x="110.0" y="316.0" fill="#B15A2B" text-anchor="middle" font-size="22">z/ε</text><text x="305.0" y="34.0" fill="#263238" text-anchor="middle" font-size="22" font-weight="bold" str
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1160" role="img" aria-labelledby="title desc">
  <title id="title">Hình học của hạ tọa độ và trung bình Polyak</title>
  <desc id="desc">Panel trên vẽ đường mức elip của F bằng x một trừ x hai bình phương cộng alpha nhân chuẩn bình phương, trục dài theo đường chéo, với alpha bằng không phẩy hai lăm để thấy rõ; đường đi hạ tọa độ đi lần lượt theo đoạn ngang rồi đoạn dọc, mỗi đoạn dừng tại điểm tiếp xúc với một đường mức, và tiến dần về gốc dọc đường chéo. Khung dưới cho hệ số co chính xác khi alpha bằng không phẩy không một. Panel dưới cho bốn điểm luân phiên giữa hai vị trí đối xứng và trung bình Polyak tại gốc.</desc>
  <defs>
    <marker id="coord-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8a421f"/></marker>
    <clipPath id="coord-plot-clip"><rect x="80" y="70" width="740" height="335" rx="14"/></clipPath>
  </defs>
  <rect width="900" height="1160" rx="20" fill="#fbfaf8"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#263238">
    <text x="450" y="45" text-anchor="middle" font-size="29" font-weight="bold">A · Hạ lần lượt từng tọa độ</text>
    <rect x="80" y="70" width="740" height="370" rx="14" fill="#fff" stroke="#c2ccd1" stroke-width="2"/>
    <line x1="100" y1="330" x2="800" y2="330" stroke="#455a64" stroke-width="2"/>
<line x1="450" y1="400" x2="450" y2="85" stroke="#455a64" stroke-width="2"/>
    <text x="790" y="356" font-size="21" text-anchor="end">x₁</text>
<text x="440" y="100" font-size="21" text-anchor="end">x₂</text>
    <g clip-path="url(#coord-plot-clip)" fill="none" stroke="#90a4ae" stroke-width="2.5"><ellipse cx="450" cy="330" rx="457.9" ry="152.6" transform="rotate(-45 450 330)"/><ellipse cx="450" cy="330" rx="241.5" ry="80.5" transform="rotate(-45 450 330)"/><ellipse cx="450" cy="330" rx="193.2" ry="64.4" transform="rotate(-45 450 330)"/><ellipse cx="450" cy="330" rx="154.6" ry="51.5" transform="rotate(-45 450 330)"/><ellipse cx="450" cy="330" rx="123.6" ry="41.2" transform="rotate(-45 450 330)"/><ellipse cx="450" cy="330" rx="98.9" ry="33.0" transform="rotate(-45 450 330)"/>
    <line x1="340" y1="440" x2="750" y2="30" stroke="#2f3e7a" stroke-width="2" stroke-dasharray="10 7"/></g>
    <text x="0" y="0" font-size="17" fill="#2f3e7a" text-anchor="middle" transform="translate(708 138) rotate(-45)" stroke="#fff" stroke-width="5" paint-order="stroke">thung lũng x₁≈x₂</text>
    <path d="M420.0 150.0 L594.0 150.0 L594.0 214.8 L542.2 214.8 L542.2 256.3 L509.0 256.3 L509.0 282.8 L487.7 282.8 L487.7 299.8" fill="none" stroke="#8a421f" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="594.0" cy="150.0" r="5" fill="#fff" stroke="#8a421f" stroke-width="3"/><circle cx="594.0" cy="214.8" r="5" fill="#fff" stroke="#8a421f" stroke-width="3"/><circle cx="542.2" cy="214.8" r="5" fill="#fff" stroke="#8a421f" stroke-width="3"/><circle cx="542.2" cy="256.3" r="5" fill="#fff" stroke="#8a421f" stroke-width="3"/><circle cx="509.0" cy="256.3" r="5" fill="#fff" stroke="#8a421f" stroke-width="3"/><circle cx="509.0" cy="282.8" r="5" fill="#fff" stroke="#8a421f" stroke-width="3"/><circle cx="487.7" cy="282.8" r="5" fill="#fff" stroke="#8a421f" stroke-width="3"/><circle cx="487.7" cy="299.8" r="5" fill="#fff" stroke="#8a421f" stroke-width="3"/>
    <circle cx="420.0" cy="150.0" r="8" fill="#263238"/>
<text x="406" y="157" font-size="20" text-anchor="end" stroke="#fff" stroke-width="5" paint-order="stroke">x⁽⁰⁾</text>
    <text x="507" y="136" font-size="19" fill="#7b3b1c" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">cập nhật x₁: đoạn ngang</text>
<text x="608" y="214" font-size="19" fill="#7b3b1c" stroke="#fff" stroke-width="5" paint-order="stroke">cập nhật x₂: đoạn dọc</text>
    <path d="M443 323l14 14m0 -14l-14 14" stroke="#2e7d32" stroke-width="3"/>
    <text x="100" y="426" font-size="17" fill="#455a64">Hình vẽ dùng α=0,25 để các bậc thấy rõ; khung dưới dùng α=0,01.</text>
    <rect x="110" y="465" width="680" height="124" rx="13" fill="#eef2f8" stroke="#2f3e7a" stroke-width="2"/>
    <text x="450" y="497" text-anchor="middle" font-size="20">F=(x₁−x₂)²+α(x₁²+x₂²),  α=0,01</text>
    <text x="450" y="533" text-anchor="middle" font-size="20">x₁ᵏ⁺¹=x₂ᵏ/1,01  ⇒  một cập nhật có hệ số 0,9901</text>
    <text x="450" y="569" text-anchor="middle" font-size="20">x₂ᵏ⁺¹=x₂ᵏ/(1,01)²  ⇒  một chu kỳ có hệ số 0,9803</text>

    <line x1="70" y1="620" x2="830" y2="620" stroke="#b0bec5" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="450" y="665" text-anchor="middle" font-size="29" font-weight="bold">B · Lấy trung bình quỹ đạo</text>
    <rect x="80" y="690" width="740" height="310" rx="14" fill="#fff" stroke="#c2ccd1" stroke-width="2"/>
    <line x1="145" y1="845" x2="755" y2="845" stroke="#455a64" stroke-width="2"/><line x1="450" y1="965" x2="450" y2="725" stroke="#455a64" stroke-width="2"/>
    <text x="745" y="875" font-size="21">θ₁</text><text x="420" y="738" font-size="21">θ₂</text>
    <path d="M700 950L200 740" fill="none" stroke="#8a421f" stroke-width="4" stroke-dasharray="11 8"/>
    <rect x="688" y="938" width="24" height="24" fill="#e8edf8" stroke="#2f3e7a" stroke-width="3"/><text x="680" y="968" font-size="20" text-anchor="end">θ₁=θ₃=(1,−1)</text>
    <circle cx="200" cy="740" r="13" fill="#f7efe6" stroke="#8a421f" stroke-width="3"/><text x="220" y="730" font-size="20">θ₂=θ₄=(−1,1)</text>
    <path d="M450 830l6 12 14 2-10 10 3 14-13-7-13 7 3-14-10-10 14-2Z" fill="#fff" stroke="#2e7d32" stroke-width="4"/>
    <text x="475" y="827" font-size="21" font-weight="bold" fill="#1f6728">θ̂₄=(0,0)</text>
    <text x="450" y="988" text-anchor="middle" font-size="18" fill="#455a64">Đoạn thẳng: quỹ đạo dao động giữa hai điểm; ngôi sao: trung bình.</text>
    <rect x="110" y="1025" width="680" height="100" rx="13" fill="#eef7ef" stroke="#2e7d32" stroke-width="2"/>
    <text x="450" y="1060" text-anchor="middle" font-size="21">θ̂₄=(θ₁+θ₂+θ₃+θ₄)/4=(0,0)</text>
    <text x="450" y="1096" text-anchor="middle" font-size="19">Trung bình triệt dao động đối xứng; không đổi quy tắc cập nhật gốc.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" role="img" aria-labelledby="title desc"><title id="title">Hai lô dịch chuyển chung được đưa về cùng đầu ra nhưng một giá trị phụ thuộc lô</title><desc id="desc">Hình tự vẽ từ công thức của ví dụ; các giá trị là dữ liệu toán học, không phải kết quả thực nghiệm.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="20.00" y="28.00" font-size="24" fill="#26324a" text-anchor="start">Trước chuẩn hóa: cùng một thang giá trị</text><text x="8.00" y="101.00" font-size="25" fill="#2f3e7a" text-anchor="start">a</text><line x1="105.00" y1="95.00" x2="565.00" y2="95.00" stroke="#627086" stroke-width="1.5"/><line x1="120.00" y1="90.00" x2="120.00" y2="100.00" stroke="#627086" stroke-width="1.5"/><text x="120.00" y="125.00" font-size="22" fill="#26324a" text-anchor="middle">1</text><line x1="225.00" y1="90.00" x2="225.00" y2="100.00" stroke="#627086" stroke-width="1.5"/><text x="225.00" y="125.00" font-size="22" fill="#26324a" text-anchor="middle">3</text><line x1="330.00" y1="90.00" x2="330.00" y2="100.00" stroke="#627086" stroke-width="1.5"/><text x="330.00" y="125.00" font-size="22" fill="#26324a" text-anchor="middle">5</text><line x1="435.00" y1="90.00" x2="435.00" y2="100.00" stroke="#627086" stroke-width="1.5"/><text x="435.00" y="125.00" font-size="22" fill="#26324a" text-anchor="middle">7</text><line x1="540.00" y1="90.00" x2="540.00" y2="100.00" stroke="#627086" stroke-width="1.5"/><text x="540.00" y="125.00" font-size="22" fill="#26324a" text-anchor="middle">9</text><circle cx="120.00" cy="83.00" r="5" fill="#2f3e7a"/><circle cx="120.00" cy="71.00" r="5" fill="#2f3e7a"/><circle cx="330.00" cy="83.00" r="5" fill="#2f3e7a"/><circle cx="330.00" cy="71.00" r="5" fill="#2f3e7a"/><text x="105.00" y="59.00" font-size="24" fill="#2f3e7a" text-anchor="start">μ = 3; σ² = 4</text><text x="8.00" y="206.00" font-size="25" fill="#b15a2b" text-anchor="start">a + 4</text><line x1="105.00" y1="200.00" x2="565.00" y2="200.00" stroke="#627086" stroke-width="1.5"/><line x1="120.00" y1="195.00" x2="120.00" y2="205.00" stroke="#627086" stroke-width="1.5"/><text x="120.00" y="230.00" font-size="22" fill="#26324a" text-anchor="middle">1</text><line x1="225.00" y1="195.00" x2="225.00" y2="205.00" stroke="#627086" stroke-width="1.5"/><text x="225.00" y="230.00" font-size="22" fill="#26324a" text-anchor="middle">3</text><line x1="330.00" y1="195.00" x2="330.00" y2="205.00" stroke="#627086" stroke-width="1.5"/><text x="330.00" y="230.00" font-size="22" fill="#26324a" text-anchor="middle">5</text><line x1="435.00" y1="195.00" x2="435.00" y2="205.00" stroke="#627086" stroke-width="1.5"/><text x="435.00" y="230.00" font-size="22" fill="#26324a" text-anchor="middle">7</text><line x1="540.00" y1="195.00" x2="540.00" y2="205.00" stroke="#627086" stroke-width="1.5"/><text x="540.00" y="230.00" font-size="22" fill="#26324a" text-anchor="middle">9</text><circle cx="330.00" cy="188.00" r="5" fill="#b15a2b"/><circle cx="330.00" cy="176.00" r="5" fill="#b15a2b"/><circle cx="540.00" cy="188.00" r="5" fill="#b15a2b"/><circle cx="540.00" cy="176.00" r="5" fill="#b15a2b"/><text x="105.00" y="164.00" font-size="24" fill="#b15a2b" text-anchor="start">μ = 7; σ² = 4</text><text x="20.00" y="278.00" font-size="24" fill="#26324a" text-anchor="start">Sau chuẩn hóa và co giãn, dịch chuyển:</text><text x="310.00" y="322.00" font-size="30" fill="#287c74" text-anchor="middle">z = (−1; −1; 3; 3)</text><text x="310.00" y="366.00" font-size="25" fill="#26324a" text-anchor="middle">γ = 2, β = 1, ε → 0⁺</text></g></svg>
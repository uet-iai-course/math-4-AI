<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id="title">Hai đường tính toán của VAE</title><desc id="desc">Bên trái: quan sát qua bộ mã hóa, tạo trung bình và độ lệch chuẩn rồi lấy mẫu mã. Bên phải: lấy mã từ tiên nghiệm và giải mã để sinh quan sát mới.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="600" height="850" fill="#fff"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#172033" font-size="25"><text x="150" y="40">Suy luận từ x</text><text x="450" y="40">Sinh mẫu mới</text></g>
<g fill="#eff6ff" stroke="#1e40af" stroke-width="2"><rect x="20" y="75" width="260" height="100" rx="8"/><rect x="20" y="235" width="260" height="100" rx="8"/><rect x="20" y="395" width="260" height="125" rx="8"/><rect x="20" y="580" width="260" height="150" rx="8"/></g>
<g fill="#f0fdf4" stroke="#166534" stroke-width="2"><rect x="320" y="75" width="260" height="100" rx="8"/><rect x="320" y="235" width="260" height="100" rx="8"/><rect x="320" y="395" width="260" height="125" rx="8"/><rect x="320" y="580" width="260" height="150" rx="8"/></g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)"><path d="M150 175V225M150 335V385M150 520V570M450 175V225M450 335V385M450 520V570"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="25" fill="#172033"><text x="150" y="135">Quan sát x</text><text x="150" y="275">Bộ mã hóa</text><text x="150" y="310">qφ(z | x)</text><text x="150" y="440">Trung bình μφ(x)</text><text x="150" y="480">Độ lệch chuẩn σφ(x)</text><text x="150" y="620">Nhiễu ε ∼ N(0, I)</text><text x="150" y="660">z = μφ(x)</text><text x="150" y="700">+ σφ(x) ⊙ ε</text><text x="450" y="115">Tiên nghiệm</text><text x="450" y="150">p(z) = N(0, I)</text><text x="450" y="292">Lấy mẫu z</text><text x="450" y="440">Phân phối giải mã</text><text x="450" y="480">pθ(x | z)</text><text x="450" y="645">Lấy mẫu x mới</text><text x="450" y="685">từ pθ(x | z)</text><text x="300" y="785" font-size="23">Bộ mã hóa phục vụ suy luận;</text><text x="300" y="820" font-size="23">đường sinh bắt đầu từ tiên nghiệm.</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Dữ liệu cân nặng, chiều cao và đường hồi quy tuyến tính</title>
  <desc id="desc">Năm điểm dữ liệu minh họa tại cân nặng 50, 55, 60, 65 và 70 ki-lô-gam với chiều cao tương ứng 158, 162, 164, 169 và 172 xen-ti-mét. Đường hồi quy h mũ bằng 123 cộng 0,7 lần cân nặng đi qua miền dữ liệu. Ba đoạn nét đứt thẳng đứng biểu diễn phần dư tại 55, 60 và 65 ki-lô-gam.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#24324a" />
    </marker>
    <style>
      .panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.grid{stroke:#d7dbe5;stroke-width:1}.axis{stroke:#24324a;stroke-width:3;marker-end:url(#arrow)}.fit{stroke:#315d92;stroke-width:6}.residual{stroke:#b44b20;stroke-width:4;stroke-dasharray:8 6}.point{fill:#fff;stroke:#172033;stroke-width:5}.pred{fill:#eef4f3;stroke:#16706a;stroke-width:4}.label{font-family:sans-serif;font-size:22px;fill:#24324a}.small{font-family:sans-serif;font-size:18px;fill:#44516a}.fit-label{font-family:sans-serif;font-size:24px;font-weight:700;fill:#315d92}
    </style>
  </defs>

  <rect class="panel" x="22" y="20" width="856" height="486" rx="16" />

  <line class="grid" x1="140" y1="460" x2="760" y2="460" />
  <line class="grid" x1="140" y1="375" x2="760" y2="375" />
  <line class="grid" x1="140" y1="290" x2="760" y2="290" />
  <line class="grid" x1="140" y1="205" x2="760" y2="205" />
  <line class="grid" x1="140" y1="120" x2="760" y2="120" />
  <line class="grid" x1="140" y1="460" x2="140" y2="120" />
  <line class="grid" x1="295" y1="460" x2="295" y2="120" />
  <line class="grid" x1="450" y1="460" x2="450" y2="120" />
  <line class="grid" x1="605" y1="460" x2="605" y2="120" />
  <line class="grid" x1="760" y1="460" x2="760" y2="120" />

  <line class="axis" x1="105" y1="460" x2="810" y2="460" />
  <line class="axis" x1="140" y1="488" x2="140" y2="82" />
  <text class="label" x="805" y="446" text-anchor="end">Cân nặng m (kg)</text>
  <text class="label" x="153" y="88">Chiều cao h (cm)</text>

  <text class="small" x="140" y="490" text-anchor="middle">50</text>
  <text class="small" x="295" y="490" text-anchor="middle">55</text>
  <text class="small" x="450" y="490" text-anchor="middle">60</text>
  <text class="small" x="605" y="490" text-anchor="middle">65</text>
  <text class="small" x="760" y="490" text-anchor="middle">70</text>
  <text class="small" x="122" y="466" text-anchor="end">155</text>
  <text class="small" x="122" y="381" text-anchor="end">160</text>
  <text class="small" x="122" y="296" text-anchor="end">165</text>
  <text class="small" x="122" y="211" text-anchor="end">170</text>
  <text class="small" x="122" y="126" text-anchor="end">175</text>

  <line class="fit" x1="140" y1="409" x2="760" y2="171" />
  <text class="fit-label" x="455" y="152">ĥ = 123 + 0,7m</text>

  <line class="residual" x1="295" y1="341" x2="295" y2="349.5" />
  <line class="residual" x1="450" y1="307" x2="450" y2="290" />
  <line class="residual" x1="605" y1="222" x2="605" y2="230.5" />

  <circle class="point" cx="140" cy="409" r="10" />
  <circle class="point" cx="295" cy="341" r="10" />
  <circle class="point" cx="450" cy="307" r="10" />
  <circle class="point" cx="605" cy="222" r="10" />
  <circle class="point" cx="760" cy="171" r="10" />
  <rect class="pred" x="287" y="341.5" width="16" height="16" />
  <rect class="pred" x="442" y="282" width="16" height="16" />
  <rect class="pred" x="597" y="222.5" width="16" height="16" />

  <text class="small" x="450" y="526" text-anchor="middle">○ quan sát · □ dự đoán · nét đứt: phần dư · dữ liệu minh họa tự tạo</text>
</svg>

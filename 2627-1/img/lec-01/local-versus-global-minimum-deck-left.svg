<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 48 594 485" role="img" aria-labelledby="title desc">
  <title id="title">Cực tiểu địa phương khác cực tiểu toàn cục</title>
  <desc id="desc">Hàm không lồi trên đoạn từ âm hai đến không phẩy năm có cực tiểu toàn cục tại x bằng âm một, đánh dấu hình thoi, và cực tiểu địa phương tại điểm biên phải x bằng không phẩy năm, đánh dấu hình tròn; lân cận của điểm biên phải giao với đoạn.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:17px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#315d92;stroke-width:5}.local{fill:#fff;stroke:#b44b20;stroke-width:4}.global{fill:#fff8e6;stroke:#16706a;stroke-width:4}.neighborhood{fill:none;stroke:#b44b20;stroke-width:2;stroke-dasharray:7 5}.guide{stroke:#91a4bd;stroke-width:1.5;stroke-dasharray:6 5}</style>
  </defs>
  <rect x="10" y="48" width="594" height="485" fill="#f3f6fb"/>

  <rect class="panel" x="22" y="58" width="570" height="465" rx="14"/>
  <text class="title" x="307" y="94" text-anchor="middle">Hàm không lồi: hai kết luận khác nhau</text>
  <line class="axis" x1="72" y1="395" x2="545" y2="395"/><text class="label" x="550" y="402">x</text>
  <line class="axis" x1="90" y1="415" x2="90" y2="130"/><text class="label" x="68" y="126">f</text>
  <path class="curve" d="M95 180 C155 180 185 395 257 395 C305 395 305 235 355 235 C402 235 430 355 500 355"/>
  <path class="global" d="M257 382 L270 395 L257 408 L244 395 Z"/>
  <path class="neighborhood" d="M420 337 C445 322 482 321 500 333 M420 373 C445 388 482 389 500 377"/>
  <circle class="local" cx="500" cy="355" r="9"/>
  <line class="guide" x1="500" y1="355" x2="500" y2="395"/><line class="guide" x1="512" y1="234" x2="502" y2="342"/>
  <text class="label" x="257" y="430" text-anchor="middle">Cực tiểu toàn cục ◇</text>
  <text class="small" x="257" y="454" text-anchor="middle">x = −1, f(x) = 0</text>
  <text class="label" x="570" y="198" text-anchor="end">Cực tiểu địa phương ○</text>
  <text class="small" x="570" y="224" text-anchor="end">điểm biên x = 0,5</text>
  <text class="small" x="307" y="492" text-anchor="middle">Trên C = [−2; 0,5], lân cận của điểm biên phải giao với C.</text>

</svg>

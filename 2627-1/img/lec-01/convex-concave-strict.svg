<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Phân biệt hàm lồi, hàm lồi chặt và hàm lõm</title>
  <desc id="desc">Ba khung so sánh vị trí đồ thị với dây cung. Với hàm lồi, đồ thị không vượt dây cung. Với hàm lồi chặt, điểm trong của đồ thị nằm thấp hơn dây cung khi hai đầu mút khác nhau. Với hàm lõm, chiều bất đẳng thức đảo lại.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#315d92;stroke-width:5}.chord{stroke:#b44b20;stroke-width:4}.point{fill:#fff;stroke:#172033;stroke-width:3}.strict{fill:#fff8e6;stroke:#16706a;stroke-width:4}.guide{stroke:#91a4bd;stroke-width:1.5;stroke-dasharray:6 5}</style></defs>
  <rect width="1200" height="570" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Dây cung là phép kiểm tra hình học cho tính lồi và tính lõm</text>
  <rect class="panel" x="18" y="58" width="378" height="475" rx="14"/><text class="title" x="207" y="94" text-anchor="middle">Hàm lồi</text>
  <line class="axis" x1="54" y1="390" x2="360" y2="390"/><line class="axis" x1="70" y1="420" x2="70" y2="125"/>
  <path class="curve" d="M90 315 Q207 480 330 145"/><line class="chord" x1="112" y1="338" x2="310" y2="184"/>
  <circle class="point" cx="112" cy="338" r="7"/><circle class="point" cx="310" cy="184" r="7"/>
  <text class="label" x="207" y="445" text-anchor="middle">đồ thị ≤ dây cung</text><text class="small" x="207" y="480" text-anchor="middle">Cho phép dấu bằng trên một đoạn.</text>

  <rect class="panel" x="411" y="58" width="378" height="475" rx="14"/><text class="title" x="600" y="94" text-anchor="middle">Lồi chặt</text>
  <line class="axis" x1="447" y1="390" x2="753" y2="390"/><line class="axis" x1="463" y1="420" x2="463" y2="125"/>
  <path class="curve" d="M485 315 Q600 490 725 145"/><line class="chord" x1="505" y1="340" x2="704" y2="185"/>
  <circle class="point" cx="505" cy="340" r="7"/><circle class="point" cx="704" cy="185" r="7"/><path class="strict" d="M603 346 L615 358 L603 370 L591 358 Z"/>
  <line class="guide" x1="603" y1="264" x2="603" y2="358"/>
  <text class="label" x="600" y="445" text-anchor="middle">đồ thị &lt; dây cung ở điểm trong</text><text class="small" x="600" y="480" text-anchor="middle">Khi x khác y và 0&lt;θ&lt;1.</text>

  <rect class="panel" x="804" y="58" width="378" height="475" rx="14"/><text class="title" x="993" y="94" text-anchor="middle">Hàm lõm</text>
  <line class="axis" x1="840" y1="390" x2="1146" y2="390"/><line class="axis" x1="856" y1="420" x2="856" y2="125"/>
  <path class="curve" d="M880 165 Q993 35 1115 325"/><line class="chord" x1="900" y1="147" x2="1095" y2="282"/>
  <circle class="point" cx="900" cy="147" r="7"/><circle class="point" cx="1095" cy="282" r="7"/>
  <text class="label" x="993" y="445" text-anchor="middle">đồ thị ≥ dây cung</text><text class="small" x="993" y="480" text-anchor="middle">Tương đương −f là hàm lồi.</text>
  <text class="small" x="600" y="552" text-anchor="middle">Lồi chặt (còn gọi là lồi nghiêm ngặt) mạnh hơn lồi; không tự động suy ra nghiệm tối ưu tồn tại.</text>
</svg>

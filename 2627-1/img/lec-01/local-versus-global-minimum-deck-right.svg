<svg xmlns="http://www.w3.org/2000/svg" viewBox="606 48 584 485" role="img" aria-labelledby="title desc">
  <title id="title">Cực tiểu của hàm lồi</title>
  <desc id="desc">Hàm lồi dạng parabol có một điểm cực tiểu đánh dấu hình thoi, vừa địa phương vừa toàn cục; một dây cung nối hai điểm trên đồ thị nằm phía trên đồ thị.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:17px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#315d92;stroke-width:5}.local{fill:#fff;stroke:#b44b20;stroke-width:4}.global{fill:#fff8e6;stroke:#16706a;stroke-width:4}.neighborhood{fill:none;stroke:#b44b20;stroke-width:2;stroke-dasharray:7 5}.guide{stroke:#91a4bd;stroke-width:1.5;stroke-dasharray:6 5}</style>
  </defs>
  <rect x="606" y="48" width="584" height="485" fill="#f3f6fb"/>

  <rect class="panel" x="616" y="58" width="562" height="465" rx="14"/>
  <text class="title" x="897" y="94" text-anchor="middle">Hàm lồi: địa phương cũng là toàn cục</text>
  <line class="axis" x1="666" y1="430" x2="1130" y2="430"/><text class="label" x="1135" y="437">x</text>
  <line class="axis" x1="684" y1="455" x2="684" y2="130"/><text class="label" x="663" y="126">f</text>
  <path class="curve" d="M700 185 Q895 545 1090 185"/>
  <path class="global" d="M895 347 L908 360 L895 373 L882 360 Z"/>
  <line class="guide" x1="895" y1="360" x2="895" y2="430"/>
  <text class="small" x="895" y="205" text-anchor="middle">◇: vừa địa phương vừa toàn cục</text>
  <path d="M760 279 L1030 279" stroke="#16706a" stroke-width="3"/>
  <circle cx="760" cy="279" r="7" fill="#fff" stroke="#16706a" stroke-width="3"/><circle cx="1030" cy="279" r="7" fill="#fff" stroke="#16706a" stroke-width="3"/>
  <text class="small" x="895" y="252" text-anchor="middle">Dây cung nằm phía trên đồ thị</text>
  <text class="small" x="897" y="478" text-anchor="middle">Kết luận cần cả miền khả thi lồi và hàm mục tiêu lồi.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Thư viện các tập lồi cơ bản</title>
  <desc id="desc">Năm khung minh họa nửa không gian, tập affine, quả cầu hoặc elip, đa diện và nón bậc hai. Nón bậc hai gồm các điểm u một, u hai, t thỏa chuẩn Euclid của u không vượt quá t; các lát cắt tại t dương là các đĩa và chỉ nhánh t không âm được giữ lại.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.region{fill:#e9f1fb;stroke:#315d92;stroke-width:3}.affine{stroke:#6a45a5;stroke-width:6}.poly{fill:#eef4f3;stroke:#16706a;stroke-width:4}.boundary{stroke:#b44b20;stroke-width:4}.point{fill:#fff;stroke:#172033;stroke-width:3}.segment{stroke:#9b6b12;stroke-width:4}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.cone{fill:#f2edfa;stroke:#6a45a5;stroke-width:4}.slice{fill:#fff;fill-opacity:.75;stroke:#315d92;stroke-width:3}.guide{stroke:#91a4bd;stroke-width:2;stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1200" height="820" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">Nhận dạng tập lồi từ những khối xây dựng quen thuộc</text>

  <rect class="panel" x="22" y="58" width="565" height="215" rx="14"/>
  <text class="title" x="304" y="91" text-anchor="middle">Nửa không gian</text>
  <polygon class="region" points="55,250 55,125 375,250"/><line class="boundary" x1="95" y1="115" x2="390" y2="250"/>
  <circle class="point" cx="125" cy="205" r="7"/><circle class="point" cx="285" cy="220" r="7"/><line class="segment" x1="125" y1="205" x2="285" y2="220"/>
  <text class="label" x="462" y="145" text-anchor="middle">a^T x≤b</text><text class="small" x="462" y="180" text-anchor="middle">Một bất đẳng thức</text><text class="small" x="462" y="205" text-anchor="middle">tuyến tính.</text>

  <rect class="panel" x="613" y="58" width="565" height="215" rx="14"/>
  <text class="title" x="895" y="91" text-anchor="middle">Tập affine</text>
  <line class="axis" x1="650" y1="240" x2="1135" y2="240"/><line class="affine" x1="700" y1="220" x2="1045" y2="120"/>
  <circle class="point" cx="760" cy="203" r="7"/><circle class="point" cx="970" cy="142" r="7"/><line class="segment" x1="760" y1="203" x2="970" y2="142"/>
  <text class="label" x="1080" y="145" text-anchor="middle">Ax=b</text><text class="small" x="1080" y="180" text-anchor="middle">Tịnh tiến của</text><text class="small" x="1080" y="205" text-anchor="middle">không gian con.</text>

  <rect class="panel" x="22" y="293" width="565" height="215" rx="14"/>
  <text class="title" x="304" y="326" text-anchor="middle">Quả cầu và elip</text>
  <ellipse class="region" cx="205" cy="414" rx="125" ry="65"/>
  <circle class="point" cx="145" cy="430" r="7"/><circle class="point" cx="275" cy="389" r="7"/><line class="segment" x1="145" y1="430" x2="275" y2="389"/>
  <text class="label" x="442" y="382" text-anchor="middle">||x−c||_2≤r</text><text class="small" x="442" y="419" text-anchor="middle">Biến đổi affine của</text><text class="small" x="442" y="444" text-anchor="middle">quả cầu tạo elip.</text>

  <rect class="panel" x="613" y="293" width="565" height="215" rx="14"/>
  <text class="title" x="895" y="326" text-anchor="middle">Đa diện</text>
  <polygon class="poly" points="680,470 715,355 875,345 980,400 950,485 785,495"/>
  <circle class="point" cx="760" cy="435" r="7"/><circle class="point" cx="910" cy="397" r="7"/><line class="segment" x1="760" y1="435" x2="910" y2="397"/>
  <text class="label" x="1080" y="375" text-anchor="middle">Ax≤b</text><text class="small" x="1080" y="410" text-anchor="middle">Giao hữu hạn</text><text class="small" x="1080" y="435" text-anchor="middle">các nửa không gian.</text>

  <rect class="panel" x="22" y="528" width="1156" height="255" rx="14"/>
  <text class="title" x="600" y="562" text-anchor="middle">Nón bậc hai: chuẩn của u không vượt quá t</text>
  <g aria-label="Nón bậc hai với các lát cắt tại t dương">
    <path class="cone" d="M115 755 L300 610 L485 755 Z"/>
    <ellipse class="slice" cx="300" cy="610" rx="185" ry="30"/><ellipse class="slice" cx="300" cy="670" rx="108" ry="20"/>
    <circle cx="300" cy="755" r="7" fill="#fff" stroke="#6a45a5" stroke-width="4"/>
    <line class="axis" x1="300" y1="765" x2="300" y2="580"/><line class="axis" x1="300" y1="755" x2="500" y2="755"/><line class="axis" x1="300" y1="755" x2="205" y2="790"/>
    <line class="guide" x1="115" y1="610" x2="485" y2="610"/><line class="guide" x1="192" y1="670" x2="408" y2="670"/>
    <text class="label" x="316" y="587">t</text><text class="small" x="505" y="761">u1</text><text class="small" x="180" y="798">u2</text>
    <text class="small" x="408" y="600">lát t=t2</text><text class="small" x="405" y="660">lát t=t1</text>
  </g>
  <text class="label" x="795" y="616" text-anchor="middle">||(u1,u2)||_2≤t</text>
  <text class="label" x="795" y="654" text-anchor="middle">t≥0: chỉ giữ nhánh phía trên</text>
  <text class="small" x="795" y="697" text-anchor="middle">Với t cố định, lát cắt là một đĩa bán kính t.</text>
  <text class="small" x="795" y="728" text-anchor="middle">Khi t tăng, đĩa mở rộng tuyến tính từ đỉnh nón.</text>
  <text class="small" x="600" y="810" text-anchor="middle">Đoạn màu nâu chỉ là phép kiểm tra trực quan; chứng minh dùng định nghĩa hoặc phép bảo toàn.</text>
</svg>

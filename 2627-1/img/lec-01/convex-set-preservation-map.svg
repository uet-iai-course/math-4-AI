<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Bản đồ các phép bảo toàn tính lồi của tập</title>
  <desc id="desc">Sơ đồ gồm bốn phép tạo tập lồi mới từ các tập lồi đã biết: giao tùy ý, ảnh qua ánh xạ affine, nghịch ảnh qua ánh xạ affine và tổng Minkowski. Mỗi nhánh ghi công thức và trực quan hình học.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.source{fill:#fff8e6;stroke:#9b6b12;stroke-width:4}.card1{fill:#e9f1fb;stroke:#315d92;stroke-width:3}.card2{fill:#eef4f3;stroke:#16706a;stroke-width:3}.card3{fill:#fff1e9;stroke:#b44b20;stroke-width:3}.card4{fill:#f2edfa;stroke:#6a45a5;stroke-width:3}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.arrow{stroke:#24324a;stroke-width:3;fill:none;marker-end:url(#arrow)}.shape{fill:#fff;stroke:#24324a;stroke-width:3}</style></defs>
  <rect width="1200" height="590" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Tạo tập lồi phức tạp từ các tập lồi đã biết</text>
  <rect class="panel" x="22" y="58" width="1156" height="495" rx="14"/>
  <rect class="source" x="455" y="215" width="290" height="145" rx="18"/>
  <text class="title" x="600" y="258" text-anchor="middle">Tập lồi đã biết</text>
  <ellipse class="shape" cx="600" cy="315" rx="78" ry="27"/>
  <text class="small" x="600" y="322" text-anchor="middle">C, D</text>

  <path class="arrow" d="M455 250 C400 210 350 180 315 160"/><path class="arrow" d="M745 250 C800 210 850 180 885 160"/>
  <path class="arrow" d="M455 330 C400 380 350 420 315 445"/><path class="arrow" d="M745 330 C800 380 850 420 885 445"/>

  <rect class="card1" x="55" y="88" width="330" height="155" rx="12"/><text class="title" x="220" y="124" text-anchor="middle">Giao</text>
  <text class="label" x="220" y="164" text-anchor="middle">C∩D là tập lồi</text>
  <text class="small" x="220" y="199" text-anchor="middle">Mọi điểm phải đồng thời thỏa</text><text class="small" x="220" y="223" text-anchor="middle">các điều kiện của C và D.</text>

  <rect class="card2" x="815" y="88" width="330" height="155" rx="12"/><text class="title" x="980" y="124" text-anchor="middle">Ảnh affine</text>
  <text class="label" x="980" y="164" text-anchor="middle">{Ax+b: x thuộc C}</text>
  <text class="small" x="980" y="199" text-anchor="middle">Đoạn nối được biến đổi thành</text><text class="small" x="980" y="223" text-anchor="middle">đoạn nối.</text>

  <rect class="card3" x="55" y="382" width="330" height="145" rx="12"/><text class="title" x="220" y="418" text-anchor="middle">Nghịch ảnh affine</text>
  <text class="label" x="220" y="458" text-anchor="middle">{x: Ax+b thuộc C}</text>
  <text class="small" x="220" y="494" text-anchor="middle">Dùng để kéo ràng buộc lồi</text><text class="small" x="220" y="518" text-anchor="middle">về không gian biến quyết định.</text>

  <rect class="card4" x="815" y="382" width="330" height="145" rx="12"/><text class="title" x="980" y="418" text-anchor="middle">Tổng Minkowski</text>
  <text class="label" x="980" y="458" text-anchor="middle">C+D={x+y: x thuộc C, y thuộc D}</text>
  <text class="small" x="980" y="494" text-anchor="middle">Cộng mọi cặp điểm vẫn giữ</text><text class="small" x="980" y="518" text-anchor="middle">toàn bộ các đoạn nối.</text>
  <text class="small" x="600" y="580" text-anchor="middle">Trong mô hình hóa, giao thường tạo tập khả thi từ nhiều ràng buộc lồi.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Tập lồi và tổ hợp lồi của hai điểm</title>
  <desc id="desc">Khung trái cho hai điểm x và y trong một tập lồi, toàn bộ đoạn nối và mọi tổ hợp theta x cộng một trừ theta nhân y đều nằm trong tập khi theta từ 0 đến 1. Khung phải là tập không lồi vì đoạn nối hai điểm đi ra ngoài tập.</desc>
  <defs><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:23px;fill:#24324a}.small{font-family:sans-serif;font-size:21px;fill:#44516a}.set{fill:#e9f1fb;stroke:#315d92;stroke-width:4}.nonconvex{fill:#fff1e9;stroke:#b44b20;stroke-width:4}.segment{stroke:#16706a;stroke-width:6}.outside{stroke:#b44b20;stroke-width:6;stroke-dasharray:6 5}.point{fill:#fff;stroke:#172033;stroke-width:4}.combo{fill:#fff8e6;stroke:#9b6b12;stroke-width:4}</style></defs>
  <rect width="1200" height="560" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Tập lồi chứa toàn bộ đoạn nối giữa mọi cặp điểm của nó</text>
  <rect class="panel" x="22" y="58" width="570" height="465" rx="14"/><text class="title" x="307" y="94" text-anchor="middle">Tập lồi C</text>
  <ellipse class="set" cx="300" cy="284" rx="215" ry="132" transform="rotate(-15 300 284)"/>
  <line class="segment" x1="170" y1="340" x2="440" y2="210"/>
  <circle class="point" cx="170" cy="340" r="9"/><circle class="point" cx="440" cy="210" r="9"/><path class="combo" d="M332 249 L345 262 L332 275 L319 262 Z"/>
  <text class="label" x="142" y="374">x</text><text class="label" x="451" y="202">y</text><text class="label" x="338" y="243">z</text>
  <text class="label" x="307" y="458" text-anchor="middle">z=θx+(1−θ)y,  0≤θ≤1</text>
  <text class="small" x="307" y="494" text-anchor="middle">Hai điểm tròn, điểm thoi và cả đoạn đều thuộc C.</text>

  <rect class="panel" x="616" y="58" width="562" height="465" rx="14"/><text class="title" x="897" y="94" text-anchor="middle">Tập không lồi D</text>
  <path class="nonconvex" d="M680 315 C662 205 744 135 836 180 C856 186 862 292 897 308 C932 292 938 186 958 180 C1050 135 1132 205 1114 315 C1098 420 991 428 921 370 C911 362 904 356 897 350 C890 356 883 362 873 370 C803 428 696 420 680 315 Z"/>
  <line class="segment" x1="760" y1="255" x2="1034" y2="255"/>
  <line class="outside" x1="866" y1="255" x2="928" y2="255"/>
  <circle class="point" cx="760" cy="255" r="9"/><circle class="point" cx="1034" cy="255" r="9"/>
  <rect x="889" y="247" width="16" height="16" fill="#fff" stroke="#b44b20" stroke-width="4"/>
  <text class="label" x="733" y="290">x</text><text class="label" x="1045" y="247">y</text>
  <text class="label" x="897" y="458" text-anchor="middle">Có một phần đoạn nối nằm ngoài D.</text>
  <text class="small" x="897" y="494" text-anchor="middle">Chỉ cần một cặp phản ví dụ để bác bỏ tính lồi.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Biên tuyến tính chia mặt phẳng đặc trưng</title>
  <desc id="desc">Hai trục đặc trưng a một và a hai cắt nhau tại gốc. Đường a chuyển vị w bằng không đi qua gốc và chia mặt phẳng thành miền dương phía trên trái với các điểm tròn, miền âm phía dưới phải với các điểm vuông. Véc tơ w xuất phát từ gốc, vuông góc với biên và hướng vào miền dương.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#24324a" />
    </marker>
    <style>
      .frame{fill:#f8fafc;stroke:#bac5d6;stroke-width:2}.positive{fill:#e9f1fb}.negative{fill:#fff1e9}.axis{stroke:#44516a;stroke-width:2.5;marker-end:url(#arrow)}.boundary{stroke:#315d92;stroke-width:5;stroke-dasharray:12 8}.normal{stroke:#24324a;stroke-width:5;marker-end:url(#arrow)}.pos-point{fill:#fff;stroke:#315d92;stroke-width:4}.neg-point{fill:#fff;stroke:#b44b20;stroke-width:4}.label{font-family:sans-serif;font-size:25px;fill:#24324a}.region{font-family:sans-serif;font-size:27px;font-weight:700}.small{font-family:sans-serif;font-size:21px;fill:#44516a}
    </style>
  </defs>

  <rect class="frame" x="50" y="40" width="800" height="480" rx="16" />
  <polygon class="positive" points="52,42 848,42 848,81 52,479" />
  <polygon class="negative" points="52,479 848,81 848,518 52,518" />

  <line class="axis" x1="70" y1="290" x2="830" y2="290" />
  <line class="axis" x1="430" y1="500" x2="430" y2="65" />
  <text class="label" x="815" y="277">a₁</text>
  <text class="label" x="445" y="82">a₂</text>
  <text class="small" x="405" y="318">0</text>

  <line class="boundary" x1="70" y1="470" x2="830" y2="90" />
  <text class="label" x="650" y="145" fill="#315d92">aᵀw = 0</text>

  <line class="normal" x1="430" y1="290" x2="340" y2="110" />
  <text class="label" x="310" y="105" font-weight="700">w</text>

  <text class="region" x="105" y="105" fill="#315d92">aᵀw &gt; 0</text>
  <text class="region" x="625" y="475" fill="#b44b20">aᵀw &lt; 0</text>

  <circle class="pos-point" cx="185" cy="205" r="13" />
  <circle class="pos-point" cx="285" cy="155" r="13" />
  <text class="small" x="90" y="385">lớp +1: hình tròn</text>
  <circle class="pos-point" cx="155" cy="310" r="13" />
  <circle class="pos-point" cx="270" cy="260" r="13" />

  <rect class="neg-point" x="550" y="340" width="26" height="26" />
  <rect class="neg-point" x="640" y="390" width="26" height="26" />
  <rect class="neg-point" x="505" y="430" width="26" height="26" />
  <rect class="neg-point" x="705" y="300" width="26" height="26" />
  <text class="small" x="640" y="350">lớp −1: hình vuông</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Bao lồi và bao nón của một tập điểm</title>
  <desc id="desc">Khung trái cho bao lồi là đa giác nhỏ nhất chứa năm điểm, gồm các tổ hợp có hệ số không âm và tổng bằng một. Khung phải cho bao nón của hai điểm x một, x hai là vùng hình quạt không bị chặn xuất phát từ gốc, gồm các tổ hợp với hệ số không âm và không ràng buộc tổng hệ số.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 5L0 10Z" fill="#24324a"/></marker><marker id="arrow-ray" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#b44b20"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.hull{fill:#e9f1fb;stroke:#315d92;stroke-width:4}.cone{fill:#fff1e9;stroke:#b44b20;stroke-width:4}.cone-fill{fill:#fff1e9;stroke:none}.point{fill:#fff;stroke:#172033;stroke-width:4}.sample{fill:#fff8e6;stroke:#9b6b12;stroke-width:4}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.ray{stroke:#b44b20;stroke-width:4;marker-end:url(#arrow-ray)}</style></defs>
  <rect width="1200" height="570" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Hai phép đóng tập điểm bằng các tổ hợp có hệ số không âm</text>
  <rect class="panel" x="22" y="58" width="570" height="475" rx="14"/><text class="title" x="307" y="94" text-anchor="middle">Bao lồi: lấp đầy giữa các điểm</text>
  <polygon class="hull" points="120,360 180,165 405,135 505,330 340,410"/>
  <g class="point"><circle cx="340" cy="410" r="9"/><circle cx="120" cy="360" r="9"/><circle cx="180" cy="165" r="9"/><circle cx="405" cy="135" r="9"/><circle cx="505" cy="330" r="9"/></g>
  <circle class="sample" cx="305" cy="278" r="10"/><text class="label" x="320" y="270">một tổ hợp lồi</text>
  <text class="label" x="307" y="449" text-anchor="middle">Σ θᵢxᵢ;  θᵢ ≥ 0;  Σ θᵢ = 1</text>
  <text class="small" x="307" y="484" text-anchor="middle">Tập lồi nhỏ nhất chứa các điểm ban đầu.</text>
  <text class="small" x="307" y="510" text-anchor="middle">Tổng hệ số bằng 1 giữ tổ hợp trong đa giác.</text>

  <rect class="panel" x="616" y="58" width="562" height="475" rx="14"/><text class="title" x="897" y="94" text-anchor="middle">Bao nón: kéo dài từ gốc theo các tia</text>
  <line class="axis" x1="680" y1="420" x2="1130" y2="420"/><line class="axis" x1="720" y1="465" x2="720" y2="125"/>
  <path class="cone-fill" d="M720 420 L827.3 125 L1150 125 L1150 287.7 Z"/>
  <line class="ray" x1="720" y1="420" x2="827.3" y2="125"/><line class="ray" x1="720" y1="420" x2="1150" y2="287.7"/>
  <circle class="point" cx="785" cy="241" r="9"/><circle class="point" cx="1000" cy="333" r="9"/><circle class="sample" cx="1037" cy="163" r="10"/><text class="label" x="1018" y="169" text-anchor="end">x₁ + 0,9x₂</text>
  <text class="label" x="690" y="449">0</text><text class="small" x="762" y="236" text-anchor="end">x₁</text><text class="small" x="1000" y="362" text-anchor="middle">x₂</text>
  <text class="label" x="897" y="469" text-anchor="middle">Σ αᵢxᵢ;  αᵢ ≥ 0</text>
  <text class="small" x="897" y="501" text-anchor="middle">Không ràng buộc tổng hệ số nên tổ hợp đi xa gốc tùy ý.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Bao lồi và bao nón của một tập điểm</title>
  <desc id="desc">Khung trái cho bao lồi là đa giác nhỏ nhất chứa bốn điểm, gồm các tổ hợp có hệ số không âm và tổng bằng một. Khung phải cho bao nón là vùng hình quạt xuất phát từ gốc, gồm các tổ hợp không âm không bị ràng buộc tổng hệ số.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.hull{fill:#e9f1fb;stroke:#315d92;stroke-width:4}.cone{fill:#fff1e9;stroke:#b44b20;stroke-width:4}.point{fill:#fff;stroke:#172033;stroke-width:4}.sample{fill:#fff8e6;stroke:#9b6b12;stroke-width:4}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.ray{stroke:#b44b20;stroke-width:4;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="570" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Hai phép đóng tập điểm bằng các tổ hợp có hệ số không âm</text>
  <rect class="panel" x="22" y="58" width="570" height="475" rx="14"/><text class="title" x="307" y="94" text-anchor="middle">Bao lồi: lấp đầy giữa các điểm</text>
  <polygon class="hull" points="120,360 180,165 405,135 505,330 340,410"/>
  <g class="point"><circle cx="120" cy="360" r="9"/><circle cx="180" cy="165" r="9"/><circle cx="405" cy="135" r="9"/><circle cx="505" cy="330" r="9"/></g>
  <circle class="sample" cx="305" cy="278" r="10"/><text class="label" x="320" y="270">một tổ hợp lồi</text>
  <text class="label" x="307" y="449" text-anchor="middle">Tổng θ_i x_i;  θ_i≥0;  tổng θ_i=1</text>
  <text class="small" x="307" y="484" text-anchor="middle">Tập lồi nhỏ nhất chứa các điểm ban đầu.</text>
  <text class="small" x="307" y="510" text-anchor="middle">Hệ số tổng bằng 1 giữ kết quả trong vùng giữa.</text>

  <rect class="panel" x="616" y="58" width="562" height="475" rx="14"/><text class="title" x="897" y="94" text-anchor="middle">Bao nón: kéo dài từ gốc theo các tia</text>
  <line class="axis" x1="680" y1="420" x2="1130" y2="420"/><line class="axis" x1="720" y1="465" x2="720" y2="125"/>
  <path class="cone" d="M720 420 L820 145 L1110 300 L720 420 Z"/>
  <line class="ray" x1="720" y1="420" x2="820" y2="145"/><line class="ray" x1="720" y1="420" x2="1110" y2="300"/>
  <circle class="point" cx="785" cy="241" r="9"/><circle class="point" cx="1000" cy="333" r="9"/><circle class="sample" cx="867" cy="304" r="10"/>
  <text class="label" x="690" y="449">0</text><text class="small" x="794" y="223">x1</text><text class="small" x="1012" y="326">x2</text>
  <text class="label" x="897" y="469" text-anchor="middle">Tổng α_i x_i;  α_i≥0</text>
  <text class="small" x="897" y="501" text-anchor="middle">Không ép tổng hệ số bằng 1 nên độ dài có thể tăng.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Mất mát logistic của hai mẫu tách được tuyến tính không đạt cận dưới</title>
  <desc id="desc">Hai mẫu một chiều tại a bằng một lớp dương và a bằng âm một lớp âm đều có biên có dấu bằng w. Khi w tăng, mất mát hai lần log của một cộng e mũ âm w giảm dần tới không. Đồ thị có đường tiệm cận ngang tại không nhưng không có điểm hữu hạn nào của đồ thị nằm trên đường này.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>
      .bg{fill:#f3f6fb}.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.positive{fill:#e9f1fb;stroke:#315d92;stroke-width:5}.negative{fill:#fff1e9;stroke:#b44b20;stroke-width:5}.box{fill:#fff8e6;stroke:#9b6b12;stroke-width:3}.result{fill:#eef4f3;stroke:#16706a;stroke-width:3}.title{font-family:sans-serif;font-size:27px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:21px;fill:#24324a}.small{font-family:sans-serif;font-size:18px;fill:#44516a}.axis{stroke:#24324a;stroke-width:3;marker-end:url(#arrow)}.curve{fill:none;stroke:#6a45a5;stroke-width:6}.guide{stroke:#91a4bd;stroke-width:2;stroke-dasharray:7 6}.asymptote{stroke:#b44b20;stroke-width:3;stroke-dasharray:9 7}.point{fill:#fff;stroke:#6a45a5;stroke-width:4}.halo{paint-order:stroke;stroke:#fbfcff;stroke-width:6px;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <text class="title" x="600" y="38" text-anchor="middle">Giá trị có thể tiến sát cận dưới mà không có điểm nào đạt cận dưới</text>

  <rect class="panel" x="20" y="60" width="330" height="500" rx="15"/>
  <text class="title" x="185" y="100" text-anchor="middle">Hai mẫu tách được</text>
  <line class="axis" x1="45" y1="220" x2="330" y2="220"/>
  <text class="small" x="318" y="206">a</text>
  <text class="small" x="90" y="260" text-anchor="middle">−1</text><text class="small" x="180" y="260" text-anchor="middle">0</text><text class="small" x="270" y="260" text-anchor="middle">1</text>
  <line x1="180" y1="213" x2="180" y2="227" stroke="#24324a" stroke-width="3"/>
  <rect class="negative" x="77" y="207" width="26" height="26"/>
  <circle class="positive" cx="270" cy="220" r="14"/>
  <text class="small" x="90" y="190" text-anchor="middle">y₂ = −1</text>
  <text class="small" x="270" y="190" text-anchor="middle">y₁ = +1</text>
  <text class="label" x="185" y="305" text-anchor="middle">mᵢ = yᵢaᵢw</text>
  <rect class="box" x="52" y="335" width="266" height="120" rx="12"/>
  <text class="label" x="185" y="372" text-anchor="middle">m₁ = w và m₂ = w</text>
  <text class="small" x="185" y="408" text-anchor="middle">Tăng w làm cả hai biên</text>
  <text class="small" x="185" y="434" text-anchor="middle">cùng tăng.</text>
  <text class="small" x="185" y="515" text-anchor="middle">○ lớp +1; □ lớp −1</text>

  <rect class="panel" x="370" y="60" width="500" height="500" rx="15"/>
  <text class="title" x="620" y="100" text-anchor="middle">L(w)=2 log(1+exp(−w))</text>
  <line class="axis" x1="420" y1="470" x2="830" y2="470"/><text class="small" x="836" y="477">w</text>
  <line class="axis" x1="450" y1="470" x2="450" y2="135"/><text class="small" x="462" y="150">L(w)</text>
  <line class="asymptote" x1="420" y1="470" x2="805" y2="470"/>
  <line class="guide" x1="535.0" y1="348.0" x2="535.0" y2="470"/><line class="guide" x1="620.0" y1="420.5" x2="620.0" y2="470"/><line class="guide" x1="790.0" y1="462.9" x2="790.0" y2="470"/>
  <polyline class="curve" points="450.0,199.9 458.5,218.9 467.0,237.0 475.5,254.0 484.0,270.1 492.5,285.3 501.0,299.6 509.5,312.9 518.0,325.4 526.5,337.1 535.0,348.0 543.5,358.1 552.0,367.4 560.5,376.1 569.0,384.1 577.5,391.5 586.0,398.4 594.5,404.6 603.0,410.4 611.5,415.7 620.0,420.5 628.5,425.0 637.0,429.1 645.5,432.8 654.0,436.2 662.5,439.3 671.0,442.1 679.5,444.7 688.0,447.0 696.5,449.1 705.0,451.1 713.5,452.8 722.0,454.4 730.5,455.9 739.0,457.2 747.5,458.4 756.0,459.5 764.5,460.5 773.0,461.4 781.5,462.2 790.0,462.9 798.5,463.6"/>
  <circle class="point" cx="450.0" cy="199.9" r="8"/><circle class="point" cx="535.0" cy="348.0" r="8"/><circle class="point" cx="620.0" cy="420.5" r="8"/><circle class="point" cx="790.0" cy="462.9" r="8"/>
  <text class="small halo" x="470" y="458">cận dưới 0</text>
  <text class="small" x="450.0" y="498" text-anchor="middle">0</text><text class="small" x="535.0" y="498" text-anchor="middle">1</text><text class="small" x="620.0" y="498" text-anchor="middle">2</text><text class="small" x="790.0" y="498" text-anchor="middle">4</text>
  <text class="small" x="620" y="545" text-anchor="middle">Mỗi điểm hữu hạn vẫn nằm phía trên đường L=0.</text>

  <rect class="panel" x="890" y="60" width="290" height="500" rx="15"/>
  <text class="title" x="1035" y="100" text-anchor="middle">Hai khái niệm</text>
  <rect class="result" x="915" y="135" width="240" height="145" rx="12"/>
  <text class="label" x="1035" y="175" text-anchor="middle">Infimum</text>
  <text class="title" x="1035" y="218" text-anchor="middle">inf L = 0</text>
  <text class="small" x="1035" y="253" text-anchor="middle">Có thể tiến gần tùy ý.</text>
  <rect class="box" x="915" y="315" width="240" height="175" rx="12"/>
  <text class="label" x="1035" y="355" text-anchor="middle">Minimum</text>
  <text class="title" x="1035" y="400" text-anchor="middle">không tồn tại</text>
  <text class="small" x="1035" y="438" text-anchor="middle">Không có w hữu hạn</text>
  <text class="small" x="1035" y="465" text-anchor="middle">sao cho L(w)=0.</text>
  <text class="small" x="600" y="586" text-anchor="middle">Miền của bài toán là toàn bộ R; không thêm cận nhân tạo cho w.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Ca phân loại logistic hai mẫu trên tập khả thi đóng và bị chặn</title>
  <desc id="desc">Hai mẫu một chiều là a một bằng 1 lớp dương và a hai bằng âm 1 lớp âm. Cả hai biên có dấu đều bằng w. Mất mát L bằng hai lần log của một cộng e mũ âm w, lồi và giảm. Trên tập khả thi C từ âm 1 đến 1, nghiệm duy nhất là điểm biên w bằng 1 với mất mát xấp xỉ 0,627. Nếu bỏ C, cận dưới 0 không đạt được khi w tiến ra dương vô cùng.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.positive{fill:#e9f1fb;stroke:#315d92;stroke-width:4}.negative{fill:#fff1e9;stroke:#b44b20;stroke-width:4}.proof{fill:#eef4f3;stroke:#16706a;stroke-width:3}.rule{fill:#fff8e6;stroke:#9b6b12;stroke-width:3}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.tiny{font-family:sans-serif;font-size:14px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#6a45a5;stroke-width:5}.tail{fill:none;stroke:#6a45a5;stroke-width:4;stroke-dasharray:9 6}.feasible{fill:#e9f1fb;fill-opacity:.7;stroke:#315d92;stroke-width:2}.guide{stroke:#91a4bd;stroke-width:1.5;stroke-dasharray:6 5}.minimum{fill:#fff8e6;stroke:#16706a;stroke-width:4}.arrow{stroke:#24324a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.asymptote{stroke:#b44b20;stroke-width:2;stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1200" height="610" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">Tập khả thi đóng và bị chặn biến một cận dưới thành nghiệm đạt được</text>

  <rect class="panel" x="20" y="58" width="330" height="515" rx="14"/>
  <text class="title" x="185" y="94" text-anchor="middle">Hai mẫu, hai lớp</text>
  <line class="axis" x1="55" y1="205" x2="315" y2="205"/><text class="small" x="320" y="211">a</text>
  <text class="small" x="72" y="231">−1</text><text class="small" x="177" y="231">0</text><text class="small" x="296" y="231">1</text>
  <rect class="negative" x="65" y="188" width="22" height="22"/><circle class="positive" cx="305" cy="199" r="12"/>
  <text class="small" x="76" y="168" text-anchor="middle">y₂=−1</text><text class="small" x="298" y="168" text-anchor="middle">y₁=+1</text>
  <text class="small" x="185" y="268" text-anchor="middle">○ lớp +1; □ lớp −1</text>
  <text class="label" x="185" y="307" text-anchor="middle">Biên có dấu: m_i=y_i a_i w</text>
  <g class="small"><text x="52" y="347">i</text><text x="92" y="347">a_i</text><text x="145" y="347">y_i</text><text x="205" y="347">y_i a_i</text><text x="275" y="347">m_i</text><text x="52" y="385">1</text><text x="98" y="385">1</text><text x="145" y="385">+1</text><text x="220" y="385">1</text><text x="278" y="385">w</text><text x="52" y="425">2</text><text x="92" y="425">−1</text><text x="145" y="425">−1</text><text x="220" y="425">1</text><text x="278" y="425">w</text></g>
  <line x1="45" y1="358" x2="310" y2="358" stroke="#bac5d6" stroke-width="2"/>
  <rect class="rule" x="50" y="470" width="270" height="72" rx="10"/><text class="small" x="185" y="497" text-anchor="middle">Cả hai biên có dấu đều bằng w.</text><text class="small" x="185" y="524" text-anchor="middle">Khi w tăng, cả hai mẫu được ưu tiên.</text>

  <rect class="panel" x="370" y="58" width="440" height="515" rx="14"/>
  <text class="title" x="590" y="94" text-anchor="middle">Mất mát logistic giảm trên C</text>
  <text class="small" x="590" y="126" text-anchor="middle">L(w)=2 log(1+exp(−w));  C=[−1,1]</text>
  <line class="axis" x1="408" y1="430" x2="785" y2="430"/><text class="small" x="790" y="437">w</text>
  <line class="axis" x1="430" y1="458" x2="430" y2="150"/><text class="small" x="407" y="147">L(w)</text>
  <rect class="feasible" x="430" y="430" width="220" height="18"/>
  <line class="guide" x1="430" y1="150" x2="430" y2="430"/><line class="guide" x1="650" y1="360" x2="650" y2="430"/>
  <path class="curve" d="M430 160 C470 220 510 275 540 300 C580 335 615 354 650 365"/>
  <path class="tail" d="M650 365 C700 390 745 410 780 418"/>
  <line class="asymptote" x1="650" y1="425" x2="780" y2="425"/>
  <path class="minimum" d="M650 353 L662 365 L650 377 L638 365 Z"/>
  <text class="small" x="430" y="476" text-anchor="middle">−1</text><text class="small" x="540" y="476" text-anchor="middle">0</text><text class="small" x="650" y="476" text-anchor="middle">1</text>
  <text class="small" x="662" y="349">w*=1</text><text class="small" x="662" y="374">L(w*)≈0,627</text>
  <text class="label" x="590" y="512" text-anchor="middle">Nghiệm nằm trên biên phải của C.</text>
  <text class="small" x="590" y="543" text-anchor="middle">Bỏ C: L(w)→0 khi w→∞, nhưng L(w)&gt;0 với mọi w hữu hạn.</text>

  <rect class="panel" x="830" y="58" width="350" height="515" rx="14"/>
  <text class="title" x="1005" y="94" text-anchor="middle">Cây chứng minh</text>
  <rect class="proof" x="848" y="120" width="150" height="112" rx="10"/>
  <text class="label" x="923" y="150" text-anchor="middle">ell lồi chặt</text><text class="tiny" x="923" y="177" text-anchor="middle">ell=log(1+exp(−m))</text><text class="tiny" x="923" y="203" text-anchor="middle">ell''(m)&gt;0</text>
  <rect class="proof" x="1012" y="120" width="150" height="112" rx="10"/>
  <text class="label" x="1087" y="150" text-anchor="middle">Biên affine</text><text class="tiny" x="1087" y="181" text-anchor="middle">m_i(w)=w</text><text class="tiny" x="1087" y="207" text-anchor="middle">theo biến w</text>
  <path class="arrow" d="M923 237 L965 269"/><path class="arrow" d="M1087 237 L1045 269"/>
  <rect class="rule" x="855" y="275" width="300" height="72" rx="10"/>
  <text class="label" x="1005" y="304" text-anchor="middle">Hợp với hàm affine</text><text class="small" x="1005" y="331" text-anchor="middle">ell(m_i(w)) lồi theo w</text>
  <path class="arrow" d="M1005 352 L1005 374"/>
  <rect class="proof" x="855" y="380" width="300" height="72" rx="10"/>
  <text class="label" x="1005" y="409" text-anchor="middle">Cộng hai mất mát</text><text class="small" x="1005" y="436" text-anchor="middle">L(w)=2ell(w) lồi chặt</text>
  <path class="arrow" d="M1005 457 L1005 479"/>
  <rect class="rule" x="855" y="485" width="300" height="58" rx="10"/>
  <text class="small" x="1005" y="510" text-anchor="middle">L liên tục; C đóng và bị chặn</text><text class="small" x="1005" y="533" text-anchor="middle">nên có nghiệm; L giảm nên w*=1.</text>
  <text class="small" x="600" y="596" text-anchor="middle">Không có C: inf L=0 nhưng không có w hữu hạn nào đạt giá trị 0.</text>
</svg>

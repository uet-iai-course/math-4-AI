<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Mất mát logistic của hai mẫu tách tuyến tính không đạt cận dưới</title>
  <desc id="desc">Hai mẫu một chiều tại a bằng một lớp dương và a bằng âm một lớp âm đều có biên có dấu bằng w. Khi w tăng, mất mát hai lần log của một cộng e mũ âm w giảm dần tới không. Đồ thị có đường tiệm cận ngang tại không nhưng không có điểm hữu hạn nào chạm đường này.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>
      .bg{fill:#f3f6fb}.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.positive{fill:#e9f1fb;stroke:#315d92;stroke-width:5}.negative{fill:#fff1e9;stroke:#b44b20;stroke-width:5}.box{fill:#fff8e6;stroke:#9b6b12;stroke-width:3}.result{fill:#eef4f3;stroke:#16706a;stroke-width:3}.title{font-family:sans-serif;font-size:27px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:21px;fill:#24324a}.small{font-family:sans-serif;font-size:18px;fill:#44516a}.axis{stroke:#24324a;stroke-width:3;marker-end:url(#arrow)}.curve{fill:none;stroke:#6a45a5;stroke-width:6}.guide{stroke:#91a4bd;stroke-width:2;stroke-dasharray:7 6}.asymptote{stroke:#b44b20;stroke-width:3;stroke-dasharray:9 7}.point{fill:#fff;stroke:#6a45a5;stroke-width:4}
    </style>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <text class="title" x="600" y="38" text-anchor="middle">Giá trị có thể tiến sát cận dưới mà không có điểm nào đạt cận dưới</text>

  <rect class="panel" x="20" y="60" width="330" height="500" rx="15"/>
  <text class="title" x="185" y="100" text-anchor="middle">Hai mẫu tách được</text>
  <line class="axis" x1="55" y1="220" x2="315" y2="220"/>
  <text class="small" x="320" y="227">a</text>
  <text class="small" x="72" y="250">−1</text><text class="small" x="175" y="250">0</text><text class="small" x="296" y="250">1</text>
  <rect class="negative" x="64" y="207" width="26" height="26"/>
  <circle class="positive" cx="305" cy="220" r="14"/>
  <text class="small" x="77" y="185" text-anchor="middle">y_2=−1</text>
  <text class="small" x="305" y="185" text-anchor="middle">y_1=+1</text>
  <text class="label" x="185" y="305" text-anchor="middle">m_i=y_i a_i w</text>
  <rect class="box" x="52" y="335" width="266" height="120" rx="12"/>
  <text class="label" x="185" y="372" text-anchor="middle">m_1=w và m_2=w</text>
  <text class="small" x="185" y="408" text-anchor="middle">Tăng w làm cả hai biên</text>
  <text class="small" x="185" y="434" text-anchor="middle">cùng tăng.</text>
  <text class="small" x="185" y="515" text-anchor="middle">○ lớp +1; □ lớp −1</text>

  <rect class="panel" x="370" y="60" width="500" height="500" rx="15"/>
  <text class="title" x="620" y="100" text-anchor="middle">L(w)=2 log(1+exp(−w))</text>
  <line class="axis" x1="420" y1="480" x2="830" y2="480"/><text class="small" x="836" y="488">w</text>
  <line class="axis" x1="450" y1="515" x2="450" y2="135"/><text class="small" x="425" y="132">L(w)</text>
  <line class="asymptote" x1="420" y1="470" x2="830" y2="470"/>
  <text class="small" x="467" y="461">cận dưới 0</text>
  <path class="curve" d="M450 112 C478 145 500 178 515 200 C545 252 573 310 605 348 C636 386 662 410 690 421 C728 444 760 458 825 467"/>
  <circle class="point" cx="515" cy="200" r="8"/><circle class="point" cx="605" cy="348" r="8"/><circle class="point" cx="690" cy="421" r="8"/><circle class="point" cx="790" cy="463" r="8"/>
  <line class="guide" x1="515" y1="200" x2="515" y2="480"/><line class="guide" x1="605" y1="348" x2="605" y2="480"/><line class="guide" x1="690" y1="421" x2="690" y2="480"/><line class="guide" x1="790" y1="463" x2="790" y2="480"/>
  <text class="small" x="515" y="510" text-anchor="middle">0</text><text class="small" x="605" y="510" text-anchor="middle">1</text><text class="small" x="690" y="510" text-anchor="middle">2</text><text class="small" x="790" y="510" text-anchor="middle">4</text>
  <text class="small" x="620" y="545" text-anchor="middle">Mỗi điểm hữu hạn vẫn nằm phía trên đường L=0.</text>

  <rect class="panel" x="890" y="60" width="290" height="500" rx="15"/>
  <text class="title" x="1035" y="100" text-anchor="middle">Hai khái niệm</text>
  <rect class="result" x="915" y="135" width="240" height="145" rx="12"/>
  <text class="label" x="1035" y="175" text-anchor="middle">Infimum</text>
  <text class="title" x="1035" y="218" text-anchor="middle">inf L = 0</text>
  <text class="small" x="1035" y="253" text-anchor="middle">Có thể tiến gần tùy ý.</text>
  <rect class="box" x="915" y="315" width="240" height="175" rx="12"/>
  <text class="label" x="1035" y="355" text-anchor="middle">Minimum</text>
  <text class="title" x="1035" y="400" text-anchor="middle">không tồn tại</text>
  <text class="small" x="1035" y="438" text-anchor="middle">Không có w hữu hạn</text>
  <text class="small" x="1035" y="465" text-anchor="middle">sao cho L(w)=0.</text>
  <text class="small" x="600" y="586" text-anchor="middle">Miền của ca này là toàn bộ R; không thêm cận nhân tạo cho w.</text>
</svg>

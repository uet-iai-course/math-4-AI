<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Đường hồi quy và các phần dư của ba điểm dữ liệu</title>
  <desc id="desc">Ba điểm dữ liệu tại hoành độ không, một và hai với giá trị lần lượt một, hai và hai. Đường hồi quy có hệ số chặn bảy phần sáu và hệ số góc một phần hai. Ba đoạn nét đứt thẳng đứng biểu diễn các phần dư một phần sáu, âm một phần ba và một phần sáu theo quy ước dự đoán trừ quan sát.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>
      .bg{fill:#f3f6fb}.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.axis{stroke:#24324a;stroke-width:3;marker-end:url(#arrow)}.grid{stroke:#d7dbe5;stroke-width:1}.fit{stroke:#315d92;stroke-width:6}.residual{stroke:#b44b20;stroke-width:4;stroke-dasharray:8 6}.point{fill:#fff;stroke:#172033;stroke-width:5}.pred{fill:#eef4f3;stroke:#16706a;stroke-width:4}.title{font-family:sans-serif;font-size:30px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:22px;fill:#24324a}.small{font-family:sans-serif;font-size:19px;fill:#44516a}.box{fill:#fff8e6;stroke:#9b6b12;stroke-width:3}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="600" y="42" text-anchor="middle">Bình phương nhỏ nhất chọn đường làm tổng bình phương phần dư nhỏ nhất</text>
  <rect class="panel" x="28" y="70" width="770" height="445" rx="16"/>

  <line class="grid" x1="120" y1="425" x2="730" y2="425"/><line class="grid" x1="120" y1="315" x2="730" y2="315"/><line class="grid" x1="120" y1="205" x2="730" y2="205"/>
  <line class="grid" x1="170" y1="465" x2="170" y2="120"/><line class="grid" x1="410" y1="465" x2="410" y2="120"/><line class="grid" x1="650" y1="465" x2="650" y2="120"/>
  <line class="axis" x1="95" y1="465" x2="760" y2="465"/><line class="axis" x1="120" y1="490" x2="120" y2="100"/>
  <text class="label" x="765" y="475">t</text><text class="label" x="95" y="102">y</text>
  <text class="small" x="170" y="494" text-anchor="middle">0</text><text class="small" x="410" y="494" text-anchor="middle">1</text><text class="small" x="650" y="494" text-anchor="middle">2</text>
  <text class="small" x="92" y="431">1</text><text class="small" x="92" y="321">2</text><text class="small" x="92" y="211">3</text>

  <line class="fit" x1="150" y1="407" x2="705" y2="280"/>
  <text class="label" x="535" y="250">ŷ=7/6+t/2</text>

  <line class="residual" x1="170" y1="425" x2="170" y2="407"/>
  <line class="residual" x1="410" y1="315" x2="410" y2="352"/>
  <line class="residual" x1="650" y1="315" x2="650" y2="297"/>
  <circle class="point" cx="170" cy="425" r="10"/><circle class="point" cx="410" cy="315" r="10"/><circle class="point" cx="650" cy="315" r="10"/>
  <rect class="pred" x="162" y="399" width="16" height="16"/><rect class="pred" x="402" y="344" width="16" height="16"/><rect class="pred" x="642" y="289" width="16" height="16"/>

  <rect class="box" x="830" y="105" width="335" height="355" rx="14"/>
  <text class="title" x="997" y="150" text-anchor="middle">Ba phần dư</text>
  <text class="label" x="870" y="210">t=0:</text><text class="label" x="1100" y="210" text-anchor="end">1/6</text>
  <text class="label" x="870" y="265">t=1:</text><text class="label" x="1100" y="265" text-anchor="end">−1/3</text>
  <text class="label" x="870" y="320">t=2:</text><text class="label" x="1100" y="320" text-anchor="end">1/6</text>
  <line x1="865" y1="340" x2="1120" y2="340" stroke="#9b6b12" stroke-width="2"/>
  <text class="label" x="997" y="385" text-anchor="middle">Tổng = 0</text>
  <text class="title" x="997" y="430" text-anchor="middle">SSE = 1/6</text>
  <text class="small" x="600" y="542" text-anchor="middle">○ quan sát; □ dự đoán; nét đứt là phần dư dự đoán trừ quan sát.</text>
</svg>

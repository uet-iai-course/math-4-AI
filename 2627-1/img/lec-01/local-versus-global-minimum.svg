<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">So sánh cực tiểu địa phương và cực tiểu toàn cục</title>
  <desc id="desc">Khung trái là hàm không lồi có một đáy địa phương nông và một đáy toàn cục sâu hơn. Khung phải là hàm lồi, trong đó một cực tiểu địa phương cũng là cực tiểu toàn cục. Hai loại điểm dùng hình tròn và hình thoi cùng nhãn văn bản để không phụ thuộc riêng vào màu.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#315d92;stroke-width:5}.local{fill:#fff;stroke:#b44b20;stroke-width:4}.global{fill:#fff8e6;stroke:#16706a;stroke-width:4}.neighborhood{fill:none;stroke:#b44b20;stroke-width:2;stroke-dasharray:7 5}.guide{stroke:#91a4bd;stroke-width:1.5;stroke-dasharray:6 5}</style>
  </defs>
  <rect width="1200" height="560" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">“Tốt nhất quanh đây” khác với “tốt nhất trên toàn miền”</text>

  <rect class="panel" x="22" y="58" width="570" height="465" rx="14"/>
  <text class="title" x="307" y="94" text-anchor="middle">Hàm không lồi: hai kết luận khác nhau</text>
  <line class="axis" x1="72" y1="430" x2="545" y2="430"/><text class="label" x="550" y="437">x</text>
  <line class="axis" x1="90" y1="455" x2="90" y2="130"/><text class="label" x="68" y="126">f</text>
  <path class="curve" d="M95 180 C155 180 185 395 257 395 C305 395 305 235 355 235 C402 235 430 355 500 355"/>
  <path class="global" d="M257 382 L270 395 L257 408 L244 395 Z"/>
  <path class="neighborhood" d="M420 332 C445 315 482 314 500 327 M420 378 C445 395 482 396 500 383"/>
  <circle class="local" cx="500" cy="355" r="9"/>
  <line class="guide" x1="257" y1="395" x2="257" y2="430"/><line class="guide" x1="500" y1="355" x2="500" y2="430"/>
  <text class="label" x="257" y="338" text-anchor="middle">Cực tiểu toàn cục ◇</text>
  <text class="small" x="257" y="365" text-anchor="middle">x = −1, f(x) = 0</text>
  <text class="label" x="455" y="286" text-anchor="middle">Cực tiểu địa phương ○</text>
  <text class="small" x="455" y="313" text-anchor="middle">điểm biên x = 0,5</text>
  <text class="small" x="307" y="478" text-anchor="middle">Trên C = [−2; 0,5], lân cận của điểm biên phải giao với C.</text>

  <rect class="panel" x="616" y="58" width="562" height="465" rx="14"/>
  <text class="title" x="897" y="94" text-anchor="middle">Hàm lồi: địa phương cũng là toàn cục</text>
  <line class="axis" x1="666" y1="430" x2="1130" y2="430"/><text class="label" x="1135" y="437">x</text>
  <line class="axis" x1="684" y1="455" x2="684" y2="130"/><text class="label" x="663" y="126">f</text>
  <path class="curve" d="M700 185 Q895 545 1090 185"/>
  <path class="global" d="M895 347 L908 360 L895 373 L882 360 Z"/>
  <line class="guide" x1="895" y1="360" x2="895" y2="430"/>
  <text class="small" x="895" y="205" text-anchor="middle">Điểm được đánh dấu: địa phương và toàn cục</text>
  <path d="M760 279 L1030 279" stroke="#16706a" stroke-width="3"/>
  <circle cx="760" cy="279" r="7" fill="#fff" stroke="#16706a" stroke-width="3"/><circle cx="1030" cy="279" r="7" fill="#fff" stroke="#16706a" stroke-width="3"/>
  <text class="small" x="895" y="252" text-anchor="middle">Dây cung nằm phía trên đồ thị</text>
  <text class="small" x="897" y="478" text-anchor="middle">Kết luận cần cả tập khả thi lồi và hàm mục tiêu lồi.</text>
</svg>

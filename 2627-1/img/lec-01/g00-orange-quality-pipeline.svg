<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Dây chuyền phân loại chất lượng cam bằng hai đặc trưng</title>
  <desc id="desc">Bên trái, ba quả cam tròn, méo và có vết đi dưới camera. Ở giữa là hai đặc trưng do con người chọn: tỉ lệ hai kích thước chính và phần trăm diện tích vết sẫm. Bên phải, cam tốt hình tròn và cam xấu hình vuông nằm trong hai vùng của mặt phẳng đặc trưng, được ngăn bởi một biên tuyến tính; véc tơ w vuông góc với biên.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#24324a" />
    </marker>
    <style>
      .frame{fill:#f8fafc;stroke:#bac5d6;stroke-width:2}.belt{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2}.roller{fill:#cbd5e1;stroke:#64748b;stroke-width:1.5}.camera{fill:#24324a}.beam{stroke:#94a3b8;stroke-width:2;stroke-dasharray:5 6}.orange{fill:#f5a037;stroke:#9a4c0a;stroke-width:3}.spot{fill:#6f4b32;stroke:#4b3425;stroke-width:1}.leaf{fill:#3c7a4d;stroke:#285736;stroke-width:1.5}.flow{stroke:#24324a;stroke-width:3;marker-end:url(#arrow)}.feature{fill:#e9f1fb;stroke:#315d92;stroke-width:2}.axis{stroke:#44516a;stroke-width:2.5;marker-end:url(#arrow)}.grid{stroke:#dbe3ef;stroke-width:1}.boundary{stroke:#315d92;stroke-width:4.5;stroke-dasharray:12 8}.normal{stroke:#24324a;stroke-width:4.5;marker-end:url(#arrow)}.pos{fill:#fff;stroke:#315d92;stroke-width:4}.neg{fill:#fff;stroke:#b44b20;stroke-width:4}.label{font-family:sans-serif;font-size:20px;fill:#24324a}.small{font-family:sans-serif;font-size:15px;fill:#44516a}.zone{font-family:sans-serif;font-size:18px;font-weight:700;fill:#2f3e7a}.formula{font-family:sans-serif;font-size:21px;font-weight:700;fill:#1d2b45}
    </style>
  </defs>

  <rect class="frame" x="12" y="12" width="1176" height="396" rx="16" />

  <text class="zone" x="38" y="44">1. Quan sát trên dây chuyền</text>
  <rect class="camera" x="158" y="60" width="82" height="44" rx="8" />
  <circle cx="199" cy="104" r="9" fill="#7dd3fc" stroke="#24324a" stroke-width="2" />
  <text class="small" x="248" y="88">camera</text>
  <line class="beam" x1="112" y1="112" x2="112" y2="214" />
  <line class="beam" x1="200" y1="118" x2="200" y2="214" />
  <line class="beam" x1="288" y1="112" x2="288" y2="214" />
  <circle class="orange" cx="112" cy="218" r="20" />
  <path class="leaf" d="M108 197 Q116 187 125 194 Q117 201 108 197Z" />
  <ellipse class="orange" cx="200" cy="218" rx="29" ry="18" />
  <circle class="orange" cx="288" cy="218" r="20" />
  <circle class="spot" cx="281" cy="211" r="5" />
  <circle class="spot" cx="294" cy="222" r="4" />
  <circle class="spot" cx="283" cy="229" r="3" />
  <rect class="belt" x="48" y="246" width="320" height="32" rx="8" />
  <circle class="roller" cx="90" cy="294" r="10" />
  <circle class="roller" cx="165" cy="294" r="10" />
  <circle class="roller" cx="240" cy="294" r="10" />
  <circle class="roller" cx="315" cy="294" r="10" />
  <line class="flow" x1="346" y1="230" x2="420" y2="230" />

  <text class="zone" x="438" y="44">2. Trích đặc trưng</text>
  <rect class="feature" x="430" y="92" width="300" height="236" rx="14" />
  <text class="formula" x="462" y="150">z₁ = d(max) / d(min)</text>
  <text class="small" x="462" y="178">tỉ lệ hai kích thước chính</text>
  <line x1="462" y1="202" x2="698" y2="202" stroke="#bac5d6" stroke-width="2" />
  <text class="formula" x="462" y="250">z₂ = 100 × A(vết) / A(quả)</text>
  <text class="small" x="462" y="278">phần trăm diện tích vết sẫm</text>
  <text class="small" x="462" y="310">Hai đặc trưng do con người chọn.</text>
  <line class="flow" x1="742" y1="230" x2="812" y2="230" />

  <text class="zone" x="820" y="44">3. Mặt phẳng đặc trưng</text>
  <line class="grid" x1="830" y1="322" x2="1140" y2="322" />
  <line class="grid" x1="830" y1="262" x2="1140" y2="262" />
  <line class="grid" x1="830" y1="202" x2="1140" y2="202" />
  <line class="grid" x1="830" y1="142" x2="1140" y2="142" />
  <line class="grid" x1="830" y1="82" x2="1140" y2="82" />
  <line class="grid" x1="830" y1="322" x2="830" y2="82" />
  <line class="grid" x1="907.5" y1="322" x2="907.5" y2="82" />
  <line class="grid" x1="985" y1="322" x2="985" y2="82" />
  <line class="grid" x1="1062.5" y1="322" x2="1062.5" y2="82" />
  <line class="grid" x1="1140" y1="322" x2="1140" y2="82" />
  <line class="axis" x1="830" y1="322" x2="1162" y2="322" />
  <line class="axis" x1="830" y1="322" x2="830" y2="62" />
  <text class="small" x="821" y="344">1,0</text>
  <text class="small" x="899" y="344">1,1</text>
  <text class="small" x="976" y="344">1,2</text>
  <text class="small" x="1054" y="344">1,3</text>
  <text class="small" x="1132" y="344">1,4</text>
  <text class="small" x="1150" y="306">z₁</text>
  <text class="small" x="806" y="327">0</text>
  <text class="small" x="806" y="267">5</text>
  <text class="small" x="798" y="207">10</text>
  <text class="small" x="798" y="147">15</text>
  <text class="small" x="798" y="87">20</text>
  <text class="small" x="788" y="68">z₂ (%)</text>

  <line class="boundary" x1="830" y1="82" x2="1140" y2="322" />
  <text class="small" x="935" y="72" fill="#315d92">biên tuyến tính minh họa</text>
  <line class="normal" x1="985" y1="202" x2="937" y2="264" />
  <text class="label" x="914" y="278" font-weight="700">w</text>

  <circle class="pos" cx="861" cy="298" r="9" />
  <circle class="pos" cx="892" cy="274" r="9" />
  <circle class="pos" cx="923" cy="286" r="9" />
  <circle class="pos" cx="946" cy="304" r="9" />
  <rect class="neg" x="992" y="121" width="18" height="18" />
  <rect class="neg" x="1054" y="133" width="18" height="18" />
  <rect class="neg" x="1082" y="253" width="18" height="18" />
  <rect class="neg" x="1122" y="217" width="18" height="18" />
  <text class="small" x="842" y="250" fill="#315d92">tốt (+1): hình tròn</text>
  <text class="small" x="1018" y="108" fill="#b44b20">xấu (−1): hình vuông</text>

  <text class="small" x="600" y="394" text-anchor="middle">Số liệu điểm là minh họa, không phải dữ liệu thật.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Kiểm tra trên đường thẳng và thư viện hàm lồi cơ bản</title>
  <desc id="desc">Khung trái minh họa hạn chế một hàm nhiều biến lên đường x không cộng t v để được hàm một biến. Hai khung phải liệt kê và minh họa các hàm affine, chuẩn, cực đại theo điểm, hàm mũ, log tổng mũ và dạng toàn phương với ma trận nửa xác định dương.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.card{fill:#e9f1fb;stroke:#315d92;stroke-width:3}.card2{fill:#eef4f3;stroke:#16706a;stroke-width:3}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.surface{fill:#e9f1fb;stroke:#315d92;stroke-width:3}.line{stroke:#b44b20;stroke-width:5}.curve{fill:none;stroke:#6a45a5;stroke-width:5}.point{fill:#fff;stroke:#172033;stroke-width:3}</style></defs>
  <rect width="1200" height="590" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Một hàm lồi khi và chỉ khi mọi lát cắt theo đường thẳng đều lồi</text>
  <rect class="panel" x="22" y="58" width="535" height="495" rx="14"/><text class="title" x="289" y="94" text-anchor="middle">Từ nhiều biến về một biến</text>
  <path class="surface" d="M72 315 Q190 180 310 260 Q400 320 500 165 L500 280 Q400 430 310 365 Q190 285 72 420 Z"/>
  <line class="line" x1="110" y1="383" x2="455" y2="230"/><circle class="point" cx="215" cy="336" r="8"/>
  <text class="label" x="225" y="323">x0</text><text class="label" x="420" y="220">hướng v</text>
  <line class="axis" x1="90" y1="485" x2="495" y2="485"/><path class="curve" d="M115 455 Q285 575 465 390"/>
  <text class="label" x="289" y="135" text-anchor="middle">g(t)=f(x0+t v)</text>
  <text class="small" x="289" y="520" text-anchor="middle">Kiểm tra g lồi với mọi x0 và mọi hướng v.</text>

  <rect class="panel" x="582" y="58" width="596" height="235" rx="14"/><text class="title" x="880" y="94" text-anchor="middle">Các hàm đóng vai trò “khối xây dựng”</text>
  <rect class="card" x="610" y="120" width="170" height="135" rx="10"/><text class="label" x="695" y="153" text-anchor="middle">Hàm affine</text><text class="small" x="695" y="190" text-anchor="middle">a^T x+b</text><text class="small" x="695" y="224" text-anchor="middle">vừa lồi, vừa lõm</text>
  <rect class="card" x="795" y="120" width="170" height="135" rx="10"/><text class="label" x="880" y="153" text-anchor="middle">Chuẩn</text><text class="small" x="880" y="190" text-anchor="middle">||x||</text><text class="small" x="880" y="224" text-anchor="middle">mọi chuẩn đều lồi</text>
  <rect class="card" x="980" y="120" width="170" height="135" rx="10"/><text class="label" x="1065" y="153" text-anchor="middle">Cực đại theo điểm</text><text class="small" x="1065" y="190" text-anchor="middle">max_i f_i(x)</text><text class="small" x="1065" y="224" text-anchor="middle">của các hàm lồi</text>

  <rect class="panel" x="582" y="318" width="596" height="235" rx="14"/><text class="title" x="880" y="354" text-anchor="middle">Các hàm trơn thường gặp</text>
  <rect class="card2" x="610" y="380" width="170" height="135" rx="10"/><text class="label" x="695" y="413" text-anchor="middle">Hàm mũ</text><text class="small" x="695" y="450" text-anchor="middle">exp(x)</text><text class="small" x="695" y="484" text-anchor="middle">lồi trên R</text>
  <rect class="card2" x="795" y="380" width="170" height="135" rx="10"/><text class="label" x="880" y="413" text-anchor="middle">Log tổng mũ</text><text class="small" x="880" y="450" text-anchor="middle">log Σ exp(x_i)</text><text class="small" x="880" y="484" text-anchor="middle">xấp xỉ cực đại trơn</text>
  <rect class="card2" x="980" y="380" width="170" height="135" rx="10"/><text class="label" x="1065" y="413" text-anchor="middle">Toàn phương</text><text class="small" x="1065" y="450" text-anchor="middle">x^T Qx</text><text class="small" x="1065" y="484" text-anchor="middle">lồi khi Q PSD</text>
  <text class="small" x="600" y="578" text-anchor="middle">Thư viện giúp nhận dạng; mỗi hàm vẫn cần đúng tập xác định và đúng điều kiện tham số.</text>
</svg>

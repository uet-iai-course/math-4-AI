<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Kiểm tra trên đường thẳng và thư viện hàm lồi cơ bản</title>
  <desc id="desc">Khung trái trên là bản đồ đường mức của f bằng x một bình phương cộng hai x hai bình phương: các elip có tỉ số bán trục căn hai, cùng đường affine x của t bằng x không cộng t v với x không là gốc (ứng với t bằng 0) và v bằng một, một; hai đường mức là f bằng 1 và f bằng 3, mũi tên v kết thúc trên đường mức f bằng 3, đúng giá trị g của 1. Mũi tên dẫn xuống đồ thị một biến g của t bằng f tại x không cộng t v, là một parabol lồi với cùng x không và v. Hai khung phải liệt kê hàm affine, chuẩn, cực đại từng điểm, hàm mũ, log tổng mũ và dạng toàn phương nửa xác định dương.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 5L0 10Z" fill="#24324a"/></marker><marker id="arrow-dir" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#16706a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.subpanel{fill:#f8faff;stroke:#bac5d6;stroke-width:1.5}.card{fill:#e9f1fb;stroke:#315d92;stroke-width:3}.card2{fill:#eef4f3;stroke:#16706a;stroke-width:3}.title{font-family:DejaVu Sans;font-size:23px;font-weight:700;fill:#172033}.label{font-family:DejaVu Sans;font-size:18px;fill:#24324a}.card-title{font-family:DejaVu Sans;font-size:16px;fill:#24324a}.small{font-family:DejaVu Sans;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.contour{fill:none;stroke:#315d92;stroke-width:3}.line{stroke:#b44b20;stroke-width:5}.direction{stroke:#16706a;stroke-width:4;marker-end:url(#arrow-dir)}.halo{paint-order:stroke;stroke:#f8faff;stroke-width:5px;stroke-linejoin:round}.curve{fill:none;stroke:#6a45a5;stroke-width:5}.point{fill:#fff;stroke:#172033;stroke-width:3}.slice-point{fill:#fff8e6;stroke:#16706a;stroke-width:4}.map-arrow{stroke:#24324a;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="590" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Hạn chế trên đường affine và các hàm lồi cơ bản</text>
  <rect class="panel" x="22" y="58" width="535" height="495" rx="14"/><text class="title" x="289" y="91" text-anchor="middle">Hạn chế trên một đường affine</text>
  <rect class="subpanel" x="46" y="108" width="487" height="225" rx="10"/>
  <text class="label" x="289" y="137" text-anchor="middle">Bản đồ đường mức của f(x₁,x₂)=x₁²+2x₂²</text>
  <ellipse class="contour" cx="270" cy="228" rx="86.6" ry="61.2"/><ellipse class="contour" cx="270" cy="228" rx="50" ry="35.4"/>
  <line class="line" x1="190" y1="308" x2="350" y2="148"/>
  <circle class="slice-point" cx="270" cy="228" r="9"/>
  <line class="direction" x1="270" y1="228" x2="320" y2="178"/>
  <text class="small halo" x="255" y="221" text-anchor="end">x₀</text><text class="small halo" x="342" y="187">v = (1, 1)</text>
  <text class="small halo" x="362" y="234">f = 3</text>
  <text class="small halo" x="182" y="306" text-anchor="end">t &lt; 0</text><text class="small halo" x="358" y="160">t &gt; 0</text>
  <text class="small" x="289" y="324" text-anchor="middle">x(t)=x₀+t v nằm trong tập xác định.</text>
  <line class="map-arrow" x1="270" y1="336" x2="270" y2="359"/><text class="small" x="286" y="353">hạn chế theo cùng x₀, v</text>
  <rect class="subpanel" x="46" y="365" width="487" height="166" rx="10"/>
  <line class="axis" x1="83" y1="497" x2="500" y2="497"/><text class="small" x="506" y="504">t</text>
  <line class="axis" x1="270" y1="497" x2="270" y2="386"/><text class="small" x="252" y="385">g</text>
  <path class="curve" d="M120 398 Q270 590 420 398"/><circle class="slice-point" cx="270" cy="494" r="8"/>
  <text class="label" x="390" y="392" text-anchor="middle">g(t)=f(x₀+t v)=3t²</text>
  <text class="small" x="289" y="520" text-anchor="middle">Cùng x₀ và hướng v ở hình trên.</text>

  <rect class="panel" x="582" y="58" width="596" height="235" rx="14"/><text class="title" x="880" y="94" text-anchor="middle">Các hàm lồi cơ bản</text>
  <rect class="card" x="610" y="120" width="170" height="135" rx="10"/><text class="card-title" x="695" y="153" text-anchor="middle">Hàm affine</text><text class="small" x="695" y="190" text-anchor="middle">aᵀx+b</text><text class="small" x="695" y="224" text-anchor="middle">vừa lồi, vừa lõm</text>
  <rect class="card" x="795" y="120" width="170" height="135" rx="10"/><text class="card-title" x="880" y="153" text-anchor="middle">Chuẩn</text><text class="small" x="880" y="190" text-anchor="middle">‖x‖</text><text class="small" x="880" y="224" text-anchor="middle">mọi chuẩn đều lồi</text>
  <rect class="card" x="980" y="120" width="170" height="135" rx="10"/><text class="card-title" x="1065" y="153" text-anchor="middle">Cực đại từng điểm</text><text class="small" x="1065" y="190" text-anchor="middle">max₁≤ᵢ≤ₖ fᵢ(x)</text><text class="small" x="1065" y="224" text-anchor="middle">của các hàm lồi</text>

  <rect class="panel" x="582" y="318" width="596" height="235" rx="14"/><text class="title" x="880" y="354" text-anchor="middle">Các hàm trơn thường gặp</text>
  <rect class="card2" x="610" y="380" width="170" height="135" rx="10"/><text class="card-title" x="695" y="413" text-anchor="middle">Hàm mũ</text><text class="small" x="695" y="450" text-anchor="middle">eᵗ</text><text class="small" x="695" y="484" text-anchor="middle">lồi với t∈ℝ</text>
  <rect class="card2" x="795" y="380" width="170" height="135" rx="10"/><text class="card-title" x="880" y="413" text-anchor="middle">Log-tổng-mũ</text><text class="small" x="880" y="450" text-anchor="middle">log(Σᵢ₌₁ᵐ eᶻⁱ)</text><text class="small" x="880" y="484" text-anchor="middle">xấp xỉ cực đại trơn</text>
  <rect class="card2" x="980" y="380" width="170" height="135" rx="10"/><text class="card-title" x="1065" y="413" text-anchor="middle">Dạng toàn phương</text><text class="small" x="1065" y="450" text-anchor="middle">xᵀQx</text><text class="small" x="1065" y="484" text-anchor="middle">Q=Qᵀ ⪰ 0</text>
  <text class="small" x="600" y="578" text-anchor="middle">Thư viện giúp nhận dạng; mỗi hàm vẫn cần đúng tập xác định và đúng điều kiện tham số.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-labelledby="lg-title lg-desc">
  <title id="lg-title">Hai lớp dữ liệu và biên phân loại</title>
  <desc id="lg-desc">Mẫu hình tròn ở một bên và mẫu hình vuông ở bên kia được tách bởi một đường biên phân loại.</desc>
  <rect width="360" height="150" fill="#f3f6fb"/>
  <path d="M180 12 L180 138" stroke="#315d92" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <circle cx="80" cy="46" r="9" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/>
  <circle cx="122" cy="84" r="9" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/>
  <circle cx="68" cy="108" r="9" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/>
  <circle cx="132" cy="32" r="9" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/>
  <rect x="216" y="52" width="18" height="18" fill="#fff1e9" stroke="#b44b20" stroke-width="3"/>
  <rect x="256" y="96" width="18" height="18" fill="#fff1e9" stroke="#b44b20" stroke-width="3"/>
  <rect x="232" y="16" width="18" height="18" fill="#fff1e9" stroke="#b44b20" stroke-width="3"/>
  <rect x="290" y="58" width="18" height="18" fill="#fff1e9" stroke="#b44b20" stroke-width="3"/>
  <text x="88" y="140" font-family="sans-serif" font-size="12" fill="#24324a">lớp ○</text>
  <text x="240" y="140" font-family="sans-serif" font-size="12" fill="#24324a">lớp □</text>
  <text x="180" y="10" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#44516a">biên phân loại</text>
</svg>

  <text x="42" y="24" font-family="sans-serif" font-size="12" fill="#44516a">y</text>
  <text x="180" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#44516a">mẫu — đường khớp — phần dư</text>
</svg>

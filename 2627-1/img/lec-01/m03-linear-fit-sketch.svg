  <path d="M46 112 L326 34" stroke="#315d92" stroke-width="3" fill="none"/>
  <path d="M78 96 L78 105" stroke="#b44b20" stroke-width="2.5" fill="none"/>
  <path d="M140 72 L140 91" stroke="#b44b20" stroke-width="2.5" fill="none"/>
  <path d="M202 62 L202 66" stroke="#b44b20" stroke-width="2.5" fill="none"/>
  <path d="M264 44 L264 55" stroke="#b44b20" stroke-width="2.5" fill="none"/>
  <circle cx="78" cy="96" r="5" fill="#315d92"/>
  <circle cx="140" cy="72" r="5" fill="#315d92"/>
  <circle cx="202" cy="62" r="5" fill="#315d92"/>
  <circle cx="264" cy="44" r="5" fill="#315d92"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-labelledby="lf-title lf-desc">
  <title id="lf-title">Điểm dữ liệu, đường khớp và phần dư</title>
  <desc id="lf-desc">Năm điểm dữ liệu, một đường thẳng khớp và các đoạn phần dư thẳng đứng giữa điểm và đường, được bình phương trong mục tiêu.</desc>
  <defs>

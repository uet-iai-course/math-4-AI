<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Bài toán tối ưu tổng quát</title>
  <desc id="desc">Sơ đồ nối dữ kiện với biến quyết định, hàm mục tiêu và các ràng buộc. Ràng buộc xác định tập khả thi, còn hàm mục tiêu dùng để so sánh các điểm khả thi và chọn nghiệm tối ưu.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.data{fill:#eef4f3;stroke:#16706a;stroke-width:3}.decision{fill:#e9f1fb;stroke:#315d92;stroke-width:3}.objective{fill:#fff1e9;stroke:#b44b20;stroke-width:3}.constraint{fill:#f2edfa;stroke:#6a45a5;stroke-width:3}.output{fill:#fff8e6;stroke:#9b6b12;stroke-width:3}.title{font-family:sans-serif;font-size:25px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:21px;fill:#24324a}.small{font-family:sans-serif;font-size:20px;fill:#44516a}.arrow{stroke:#24324a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="600" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">Một mô hình tối ưu xác định rõ biến quyết định, hàm mục tiêu và tập khả thi</text>
  <rect class="panel" x="14" y="54" width="1172" height="510" rx="14"/>

  <rect class="data" x="30" y="92" width="212" height="350" rx="12"/>
  <text class="title" x="136" y="132" text-anchor="middle">Dữ kiện</text>
  <text class="label" x="136" y="184" text-anchor="middle">Quan sát</text>
  <text class="label" x="136" y="222" text-anchor="middle">Tham số đã biết</text>
  <text class="label" x="136" y="260" text-anchor="middle">Nguồn lực</text>
  <text class="small" x="136" y="322" text-anchor="middle">Dữ kiện không</text>
  <text class="small" x="136" y="350" text-anchor="middle">phải đại lượng</text>
  <text class="small" x="136" y="378" text-anchor="middle">thuật toán được</text>
  <text class="small" x="136" y="406" text-anchor="middle">phép thay đổi.</text>

  <path class="arrow" d="M246 267 L276 267"/>
  <rect class="decision" x="282" y="92" width="226" height="350" rx="12"/>
  <text class="title" x="395" y="132" text-anchor="middle">Biến quyết định</text>
  <text class="label" x="395" y="190" text-anchor="middle">x: n thành phần</text>
  <text class="label" x="395" y="232" text-anchor="middle">Mô hình chọn x.</text>
  <text class="small" x="395" y="294" text-anchor="middle">Ví dụ: trọng số,</text>
  <text class="small" x="395" y="322" text-anchor="middle">phân bổ, lịch hoặc</text>
  <text class="small" x="395" y="350" text-anchor="middle">phương án</text>
  <text class="small" x="395" y="378" text-anchor="middle">điều khiển.</text>

  <path class="arrow" d="M512 190 L546 190"/>
  <path class="arrow" d="M512 390 L546 390"/>
  <rect class="objective" x="552" y="80" width="276" height="230" rx="12"/>
  <text class="title" x="690" y="118" text-anchor="middle">Hàm mục tiêu</text>
  <text class="title" x="690" y="168" text-anchor="middle">cực tiểu f<tspan baseline-shift="sub" font-size="19">0</tspan>(x)</text>
  <text class="label" x="690" y="214" text-anchor="middle">So sánh chất lượng.</text>
  <text class="small" x="690" y="256" text-anchor="middle">Giá trị nhỏ hơn</text>
  <text class="small" x="690" y="284" text-anchor="middle">được ưu tiên.</text>

  <rect class="constraint" x="552" y="326" width="276" height="194" rx="12"/>
  <text class="title" x="690" y="364" text-anchor="middle">Ràng buộc</text>
  <text class="label" x="690" y="412" text-anchor="middle">f<tspan baseline-shift="sub" font-size="16">i</tspan>(x) ≤ 0; h<tspan baseline-shift="sub" font-size="16">j</tspan>(x) = 0</text>
  <text class="small" x="690" y="458" text-anchor="middle">Quy định phương án</text>
  <text class="small" x="690" y="486" text-anchor="middle">được phép.</text>

  <path class="arrow" d="M832 190 C860 190 862 172 890 172"/>
  <path class="arrow" d="M832 423 C862 423 862 390 890 380"/>
  <rect class="output" x="896" y="92" width="274" height="350" rx="12"/>
  <text class="title" x="1033" y="132" text-anchor="middle">Tập khả thi C</text>
  <ellipse cx="1033" cy="226" rx="92" ry="60" fill="#fff" stroke="#6a45a5" stroke-width="3"/>
  <circle cx="992" cy="236" r="6" fill="#6a45a5"/><circle cx="1044" cy="199" r="6" fill="#6a45a5"/><circle cx="1086" cy="250" r="6" fill="#6a45a5"/>
  <path d="M1024 266 l10 10 l18 -25" fill="none" stroke="#9b6b12" stroke-width="5"/>
  <text class="label" x="1033" y="330" text-anchor="middle">x* thuộc C</text>
  <text class="small" x="1033" y="370" text-anchor="middle">f<tspan baseline-shift="sub" font-size="15">0</tspan>(x*) ≤ f<tspan baseline-shift="sub" font-size="15">0</tspan>(x)</text>
  <text class="small" x="1033" y="400" text-anchor="middle">với mọi x thuộc C</text>

  <text class="small" x="600" y="548" text-anchor="middle">Khả thi chỉ có nghĩa là thuộc C; tối ưu còn đòi hỏi không có điểm khả thi nào cho mục tiêu tốt hơn.</text>
</svg>

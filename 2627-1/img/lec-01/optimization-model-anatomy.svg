<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Bài toán tối ưu tổng quát</title>
  <desc id="desc">Sơ đồ nối dữ kiện với biến quyết định, hàm mục tiêu và các ràng buộc. Ràng buộc xác định tập khả thi, còn hàm mục tiêu dùng để so sánh các điểm khả thi và chọn nghiệm tối ưu.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.data{fill:#eef4f3;stroke:#16706a;stroke-width:3}.decision{fill:#e9f1fb;stroke:#315d92;stroke-width:3}.objective{fill:#fff1e9;stroke:#b44b20;stroke-width:3}.constraint{fill:#f2edfa;stroke:#6a45a5;stroke-width:3}.output{fill:#fff8e6;stroke:#9b6b12;stroke-width:3}.title{font-family:sans-serif;font-size:24px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.arrow{stroke:#24324a;stroke-width:3;fill:none;marker-end:url(#arrow)}.guide{stroke:#91a4bd;stroke-width:2;stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1200" height="560" fill="#f3f6fb"/>
  <text class="title" x="600" y="34" text-anchor="middle">Một mô hình tối ưu xác định rõ biến quyết định, hàm mục tiêu và tập khả thi</text>
  <rect class="panel" x="22" y="58" width="1156" height="465" rx="14"/>

  <rect class="data" x="48" y="108" width="185" height="310" rx="12"/>
  <text class="title" x="140" y="146" text-anchor="middle">Dữ kiện</text>
  <text class="label" x="140" y="194" text-anchor="middle">Quan sát</text>
  <text class="label" x="140" y="232" text-anchor="middle">Tham số đã biết</text>
  <text class="label" x="140" y="270" text-anchor="middle">Nguồn lực</text>
  <text class="small" x="140" y="326" text-anchor="middle">Dữ kiện không phải</text>
  <text class="small" x="140" y="352" text-anchor="middle">đại lượng thuật toán</text>
  <text class="small" x="140" y="378" text-anchor="middle">được phép thay đổi.</text>

  <path class="arrow" d="M239 263 L280 263"/>
  <rect class="decision" x="286" y="108" width="190" height="310" rx="12"/>
  <text class="title" x="381" y="146" text-anchor="middle">Biến quyết định</text>
  <text class="label" x="381" y="211" text-anchor="middle">x: n thành phần</text>
  <text class="label" x="381" y="258" text-anchor="middle">Mô hình chọn x.</text>
  <text class="small" x="381" y="309" text-anchor="middle">Ví dụ: trọng số,</text>
  <text class="small" x="381" y="335" text-anchor="middle">phân bổ, lịch hoặc</text>
  <text class="small" x="381" y="361" text-anchor="middle">phương án điều khiển.</text>

  <path class="arrow" d="M482 210 L530 210"/>
  <path class="arrow" d="M482 330 L530 330"/>
  <rect class="objective" x="536" y="98" width="255" height="205" rx="12"/>
  <text class="title" x="663" y="136" text-anchor="middle">Hàm mục tiêu</text>
  <text class="title" x="663" y="188" text-anchor="middle">cực tiểu f0(x)</text>
  <text class="label" x="663" y="232" text-anchor="middle">So sánh chất lượng</text>
  <text class="small" x="663" y="267" text-anchor="middle">Giá trị nhỏ hơn được ưu tiên.</text>

  <rect class="constraint" x="536" y="323" width="255" height="155" rx="12"/>
  <text class="title" x="663" y="360" text-anchor="middle">Ràng buộc</text>
  <text class="label" x="663" y="405" text-anchor="middle">f_i(x)≤0; h_j(x)=0</text>
  <text class="small" x="663" y="443" text-anchor="middle">Quy định phương án được phép.</text>

  <path class="arrow" d="M797 401 C845 401 846 358 884 344"/>
  <rect class="output" x="890" y="108" width="255" height="310" rx="12"/>
  <text class="title" x="1017" y="146" text-anchor="middle">Tập khả thi C</text>
  <ellipse cx="1017" cy="245" rx="88" ry="60" fill="#fff" stroke="#6a45a5" stroke-width="3"/>
  <circle cx="978" cy="255" r="6" fill="#6a45a5"/><circle cx="1028" cy="218" r="6" fill="#6a45a5"/><circle cx="1068" cy="269" r="6" fill="#6a45a5"/>
  <path d="M1008 285 l10 10 l18 -25" fill="none" stroke="#9b6b12" stroke-width="5"/>
  <text class="label" x="1017" y="340" text-anchor="middle">x* thuộc C</text>
  <text class="small" x="1017" y="375" text-anchor="middle">f0(x*)≤f0(x)</text>
  <text class="small" x="1017" y="399" text-anchor="middle">với mọi x thuộc C</text>
  <path class="arrow" d="M797 199 C840 199 846 180 884 180"/>

  <text class="small" x="600" y="504" text-anchor="middle">Khả thi chỉ có nghĩa là thuộc C; tối ưu còn đòi hỏi không có điểm khả thi nào cho mục tiêu tốt hơn.</text>
</svg>

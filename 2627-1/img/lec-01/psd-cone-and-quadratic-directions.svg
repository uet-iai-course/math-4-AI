<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Nón ma trận nửa xác định dương và độ cong theo hướng</title>
  <desc id="desc">Khung trái minh họa nón các ma trận đối xứng nửa xác định dương, đỉnh là ma trận 0, ma trận suy biến trên mặt biên và ma trận xác định dương trong phần trong. Khung phải dùng ma trận A bằng ba một, một hai để cho dạng toàn phương không âm theo mọi hướng: hai đường mức q bằng 2 và q bằng 3 là elip có trục dài theo vector riêng của trị riêng nhỏ, hướng d một kết thúc trên đường q bằng 3, hướng d hai trên đường q bằng 2; hai lát q của t d bằng 3 t bình phương và 2 t bình phương là parabol có đỉnh tại gốc.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 5L0 10Z" fill="#24324a"/></marker><marker id="arrow-d1" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#315d92"/></marker><marker id="arrow-d2" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#b44b20"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.cone{fill:#e9f1fb;stroke:#b44b20;stroke-width:4}.base{fill:#e9f1fb;stroke:#b44b20;stroke-width:4}.boundary{fill:#fff1e9;stroke:#b44b20;stroke-width:4}.inside{fill:#eef4f3;stroke:#16706a;stroke-width:4}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.contour{fill:none;stroke:#6a45a5;stroke-width:4}.slice1{fill:none;stroke:#315d92;stroke-width:5}.slice2{fill:none;stroke:#b44b20;stroke-width:5;stroke-dasharray:10 6}</style></defs>
  <rect width="1200" height="580" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Nón nửa xác định dương và dạng toàn phương theo hướng</text>
  <rect class="panel" x="22" y="58" width="570" height="485" rx="14"/><text class="title" x="307" y="94" text-anchor="middle">Nón các ma trận nửa xác định dương</text>
  <path class="cone" d="M132 160 L307 420 L482 160 Z"/>
  <ellipse class="base" cx="307" cy="160" rx="175" ry="38"/>
  <circle cx="307" cy="420" r="7" fill="#fff" stroke="#315d92" stroke-width="4"/><text class="small" x="325" y="427">ma trận 0</text>
  <rect class="inside" x="242" y="222" width="130" height="64" rx="10"/>
  <text class="label" x="307" y="249" text-anchor="middle">A ≻ 0</text><text class="small" x="307" y="274" text-anchor="middle">phần trong</text>
  <line x1="367.6" y1="330" x2="400" y2="330" stroke="#b44b20" stroke-width="2"/><circle cx="367.6" cy="330" r="6" fill="#fff1e9" stroke="#b44b20" stroke-width="3"/>
  <rect class="boundary" x="400" y="298" width="175" height="66" rx="10"/>
  <text class="label" x="487" y="325" text-anchor="middle">A ⪰ 0, det A = 0</text><text class="small" x="487" y="351" text-anchor="middle">trên mặt biên</text>
  <text class="label" x="307" y="469" text-anchor="middle">A, B ⪰ 0; α, β ≥ 0 ⇒ αA + βB ⪰ 0</text>
  <text class="small" x="307" y="505" text-anchor="middle">Đóng với tổ hợp không âm nên tạo thành một nón lồi.</text>

  <rect class="panel" x="616" y="58" width="562" height="485" rx="14"/><text class="title" x="897" y="94" text-anchor="middle">Dạng toàn phương theo các hướng</text>
  <text class="label" x="897" y="132" text-anchor="middle">A = [3 1; 1 2],  q(d) = dᵀAd</text>
  <line class="axis" x1="670" y1="310" x2="905" y2="310"/><line class="axis" x1="785" y1="440" x2="785" y2="165"/>
  <ellipse class="contour" cx="785" cy="310" rx="102.3" ry="63.2" transform="rotate(58.3 785 310)"/>
  <ellipse class="contour" cx="785" cy="310" rx="125.2" ry="77.4" transform="rotate(58.3 785 310)"/>
  <line x1="785" y1="310" x2="870" y2="310" stroke="#315d92" stroke-width="4" marker-end="url(#arrow-d1)"/>
  <line x1="785" y1="310" x2="785" y2="225" stroke="#b44b20" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#arrow-d2)"/>
  <text class="small" x="880" y="330">d₁</text><text class="small" x="793" y="262">d₂</text>
  <text class="small" x="850" y="437">q = 3</text><text class="small" x="800" y="381">q = 2</text>
  <g transform="translate(930 165)"><line class="axis" x1="0" y1="225" x2="210" y2="225"/><line class="axis" x1="105" y1="245" x2="105" y2="10"/><path class="slice1" d="M25 45 Q105 405 185 45"/><path class="slice2" d="M25 105 Q105 345 185 105"/><text class="small" x="204" y="248">t</text><text class="small" x="113" y="18">q(td)</text><text class="small" x="190" y="58">3t²</text><text class="small" x="190" y="118">2t²</text></g>
  <text class="label" x="897" y="465" text-anchor="middle">q(d₁) = 3; q(d₂) = 2; mọi lát đều cong lên</text>
  <text class="small" x="897" y="505" text-anchor="middle">A ⪰ 0 cho phép hướng phẳng; A ≻ 0 loại mọi hướng phẳng d ≠ 0.</text>
</svg>

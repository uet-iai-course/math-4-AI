<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Phân biệt sự tồn tại và tính duy nhất của nghiệm tối ưu</title>
  <desc id="desc">Ba đồ thị đối chiếu: hàm mũ không đạt infimum, hàm hằng có nhiều nghiệm tối ưu và hàm bình phương có một nghiệm tối ưu duy nhất.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24324a"/></marker>
    <style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:28px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:24px;fill:#24324a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#315d92;stroke-width:6}.minimum{fill:#fff8e6;stroke:#16706a;stroke-width:5}.guide{stroke:#b44b20;stroke-width:3;stroke-dasharray:8 6}</style>
  </defs>
  <rect width="1200" height="360" fill="#f3f6fb"/>

  <rect class="panel" x="20" y="10" width="370" height="340" rx="14"/>
  <text class="title" x="205" y="50" text-anchor="middle">Không đạt infimum</text>
  <text class="label" x="205" y="82" text-anchor="middle">min exp(x), x∈R</text>
  <line class="axis" x1="62" y1="300" x2="348" y2="300"/><line class="axis" x1="80" y1="325" x2="80" y2="100"/>
  <path class="curve" d="M70 286 C145 285 215 270 260 228 C300 190 325 135 345 90"/>
  <line class="guide" x1="62" y1="286" x2="345" y2="286"/>
  <text class="label" x="205" y="333" text-anchor="middle">inf = 0, không có nghiệm</text>

  <rect class="panel" x="415" y="10" width="370" height="340" rx="14"/>
  <text class="title" x="600" y="50" text-anchor="middle">Nhiều nghiệm</text>
  <text class="label" x="600" y="82" text-anchor="middle">min 0, x∈[−1,1]</text>
  <line class="axis" x1="457" y1="300" x2="743" y2="300"/><line class="axis" x1="475" y1="325" x2="475" y2="100"/>
  <line x1="500" y1="240" x2="700" y2="240" stroke="#16706a" stroke-width="10"/>
  <circle class="minimum" cx="500" cy="240" r="8"/><circle class="minimum" cx="600" cy="240" r="8"/><circle class="minimum" cx="700" cy="240" r="8"/>
  <text class="label" x="600" y="333" text-anchor="middle">mọi x∈[−1,1] đều tối ưu</text>

  <rect class="panel" x="810" y="10" width="370" height="340" rx="14"/>
  <text class="title" x="995" y="50" text-anchor="middle">Một nghiệm</text>
  <text class="label" x="995" y="82" text-anchor="middle">min x², x∈R</text>
  <line class="axis" x1="852" y1="300" x2="1138" y2="300"/><line class="axis" x1="870" y1="325" x2="870" y2="100"/>
  <path class="curve" d="M885 115 Q995 390 1105 115"/>
  <path class="minimum" d="M995 238 L1008 251 L995 264 L982 251 Z"/>
  <text class="label" x="995" y="333" text-anchor="middle">nghiệm duy nhất x*=0</text>
</svg>

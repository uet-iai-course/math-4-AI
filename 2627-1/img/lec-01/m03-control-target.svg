<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170" role="img" aria-labelledby="ct-title ct-desc">
  <title id="ct-title">Trạng thái, tác động và đích t</title>
  <desc id="ct-desc">Trạng thái x0 nhận tác động u, với ràng buộc độ lớn u không vượt u_max, tạo trạng thái x1. Trạng thái x1 được so với đích t, sinh chi phí bám đích (x1 − t)²; tác động u sinh chi phí năng lượng λu².</desc>
  <defs>
    <marker id="ct-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24324a"/></marker>
  </defs>
  <rect width="380" height="170" fill="#f3f6fb"/>

  <!-- hàng trên: x0 -> u -> x1 -> chi phí bám đích -->
  <circle cx="40" cy="55" r="22" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/>
  <text x="40" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#24324a">x0</text>

  <path d="M62 55 L96 55" stroke="#24324a" stroke-width="3" fill="none" marker-end="url(#ct-arrow)"/>

  <text x="128" y="26" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#44516a">|u| ≤ u_max</text>
  <rect x="100" y="37" width="56" height="36" rx="8" fill="#fff1e9" stroke="#b44b20" stroke-width="3"/>
  <text x="128" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#24324a">u</text>

  <path d="M156 55 L186 55" stroke="#24324a" stroke-width="3" fill="none" marker-end="url(#ct-arrow)"/>

  <circle cx="210" cy="55" r="22" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/>
  <text x="210" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#24324a">x1</text>

  <path d="M232 55 L262 55" stroke="#24324a" stroke-width="2.5" fill="none" marker-end="url(#ct-arrow)"/>
  <rect x="266" y="37" width="96" height="36" rx="8" fill="#eef4f3" stroke="#16706a" stroke-width="2.5"/>
  <text x="314" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#24324a">(x1 − t)²</text>

  <!-- hàng dưới: đích t so với x1; chi phí năng lượng dưới u -->
  <path d="M210 77 L210 110" stroke="#16706a" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <circle cx="210" cy="128" r="18" fill="#fff8e6" stroke="#315d92" stroke-width="3"/>
  <text x="210" y="133" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#24324a">t</text>
  <text x="236" y="98" font-family="sans-serif" font-size="11" fill="#44516a">so với đích</text>

  <path d="M128 73 L128 106" stroke="#24324a" stroke-width="2.5" fill="none" marker-end="url(#ct-arrow)"/>
  <rect x="100" y="110" width="56" height="36" rx="8" fill="#eef4f3" stroke="#16706a" stroke-width="2.5"/>
  <text x="128" y="133" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#24324a">λu²</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-labelledby="ct-title ct-desc">
  <title id="ct-title">Trạng thái, tác động và đích t</title>
  <desc id="ct-desc">Trạng thái x0 nhận tác động u tạo trạng thái x1, so sánh với đích t để phát sinh chi phí bám đích và chi phí năng lượng.</desc>
  <defs>
    <marker id="ct-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24324a"/></marker>
  </defs>
  <rect width="360" height="150" fill="#f3f6fb"/>
  <circle cx="42" cy="52" r="24" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/>
  <text x="42" y="57" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#24324a">x0</text>
  <rect x="104" y="34" width="54" height="36" rx="8" fill="#fff1e9" stroke="#b44b20" stroke-width="3"/>
  <text x="131" y="57" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#24324a">u</text>
  <path d="M70 52 L100 52" stroke="#24324a" stroke-width="3" fill="none" marker-end="url(#ct-arrow)"/>
  <circle cx="204" cy="52" r="26" fill="#e9f1fb" stroke="#315d92" stroke-width="3"/>
  <text x="204" y="57" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#24324a">x1</text>
  <path d="M162 52 L174 52" stroke="#24324a" stroke-width="3" fill="none" marker-end="url(#ct-arrow)"/>
  <path d="M204 78 L204 100" stroke="#16706a" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <circle cx="204" cy="116" r="16" fill="#fff8e6" stroke="#315d92" stroke-width="3"/>
  <text x="204" y="121" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#24324a">t</text>
  <rect x="256" y="30" width="92" height="40" rx="8" fill="#eef4f3" stroke="#16706a" stroke-width="2.5"/>
  <text x="302" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#24324a">(x1−t)²</text>
  <rect x="256" y="82" width="92" height="40" rx="8" fill="#eef4f3" stroke="#16706a" stroke-width="2.5"/>
  <text x="302" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#24324a">λu²</text>
  <path d="M232 60 L252 50" stroke="#24324a" stroke-width="2.5" fill="none" marker-end="url(#ct-arrow)"/>
  <path d="M160 90 C200 130 240 110 252 104" stroke="#24324a" stroke-width="2.5" fill="none" marker-end="url(#ct-arrow)"/>
  <text x="18" y="140" font-family="sans-serif" font-size="11" fill="#44516a">|u| ≤ u_max</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Điều khiển một bước với đánh đổi bám đích và năng lượng</title>
  <desc id="desc">Trạng thái ban đầu x không cộng tác động u tạo trạng thái kế tiếp x một. Một nhánh so sánh x một với đích t để tính sai lệch bình phương; nhánh còn lại tính năng lượng lambda nhân u bình phương. Hai số hạng được cộng thành chi phí q của u, trong khi u phải nằm giữa hai cận.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#24324a"/></marker>
    <style>
      .bg{fill:#f3f6fb}.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.state{fill:#e9f1fb;stroke:#315d92;stroke-width:4}.action{fill:#fff1e9;stroke:#b44b20;stroke-width:4}.cost{fill:#eef4f3;stroke:#16706a;stroke-width:4}.limit{fill:#fff8e6;stroke:#9b6b12;stroke-width:3}.title{font-family:sans-serif;font-size:30px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:24px;fill:#24324a}.small{font-family:sans-serif;font-size:22px;fill:#44516a}.arrow{stroke:#24324a;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#6a45a5;stroke-width:3;stroke-dasharray:9 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="420"/>
  <text class="title" x="600" y="38" text-anchor="middle">Một tác động tạo trạng thái mới và đồng thời phát sinh hai chi phí</text>

  <rect class="panel" x="20" y="56" width="1160" height="320" rx="16"/>
  <circle class="state" cx="125" cy="160" r="82"/>
  <text class="title" x="125" y="150" text-anchor="middle">x0</text>
  <text class="small" x="125" y="186" text-anchor="middle">trạng thái đầu</text>

  <path class="arrow" d="M209 160 L283 160"/>
  <rect class="action" x="289" y="100" width="190" height="120" rx="14"/>
  <text class="title" x="384" y="150" text-anchor="middle">u</text>
  <text class="small" x="384" y="188" text-anchor="middle">tác động</text>

  <path class="arrow" d="M481 160 L547 160"/>
  <circle class="state" cx="635" cy="160" r="86"/>
  <text class="title" x="635" y="150" text-anchor="middle">x1=x0+u</text>
  <text class="small" x="635" y="186" text-anchor="middle">trạng thái mới</text>

  <path class="dash" d="M635 246 L635 284"/>
  <circle class="limit" cx="635" cy="322" r="38"/>
  <text class="title" x="635" y="332" text-anchor="middle">t</text>
  <text class="small" x="684" y="330">so với đích</text>

  <rect class="cost" x="866" y="76" width="292" height="116" rx="14"/>
  <text class="label" x="1012" y="120" text-anchor="middle">Sai lệch bám đích</text>
  <text class="title" x="1012" y="166" text-anchor="middle">(x1−t)²</text>
  <path class="arrow" d="M720 140 L860 128"/>

  <rect class="cost" x="866" y="232" width="292" height="116" rx="14"/>
  <text class="label" x="1012" y="276" text-anchor="middle">Năng lượng</text>
  <text class="title" x="1012" y="322" text-anchor="middle">λu²</text>
  <path class="arrow" d="M450 222 C540 272 740 254 860 284"/>

  <rect class="limit" x="262" y="276" width="244" height="82" rx="12"/>
  <text class="label" x="384" y="308" text-anchor="middle">Giới hạn vật lý</text>
  <text class="title" x="384" y="344" text-anchor="middle">|u| ≤ u_max</text>

  <text class="small" x="600" y="406" text-anchor="middle">Chi phí tổng: q(u)=(x0+u−t)²+λu²; biến u chỉ được chọn trong miền khả thi.</text>
</svg>

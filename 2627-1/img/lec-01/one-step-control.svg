<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Điều khiển một bước với đánh đổi bám đích và năng lượng</title>
  <desc id="desc">Trạng thái ban đầu x không cộng tác động u tạo trạng thái kế tiếp x một. Một nhánh so sánh x một với đích r để tính sai lệch bình phương; nhánh còn lại tính năng lượng lambda nhân u bình phương. Hai hạng được cộng thành chi phí q của u, trong khi u phải nằm giữa hai cận.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24324a"/></marker>
    <style>
      .bg{fill:#f3f6fb}.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.state{fill:#e9f1fb;stroke:#315d92;stroke-width:4}.action{fill:#fff1e9;stroke:#b44b20;stroke-width:4}.cost{fill:#eef4f3;stroke:#16706a;stroke-width:4}.limit{fill:#fff8e6;stroke:#9b6b12;stroke-width:3}.title{font-family:sans-serif;font-size:30px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:24px;fill:#24324a}.small{font-family:sans-serif;font-size:20px;fill:#44516a}.arrow{stroke:#24324a;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#6a45a5;stroke-width:3;stroke-dasharray:9 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="600" y="42" text-anchor="middle">Một tác động tạo trạng thái mới và đồng thời phát sinh hai chi phí</text>

  <rect class="panel" x="28" y="70" width="1144" height="442" rx="16"/>
  <circle class="state" cx="145" cy="235" r="72"/>
  <text class="title" x="145" y="226" text-anchor="middle">x0</text>
  <text class="small" x="145" y="260" text-anchor="middle">trạng thái đầu</text>

  <rect class="action" x="310" y="170" width="190" height="130" rx="14"/>
  <text class="title" x="405" y="220" text-anchor="middle">u</text>
  <text class="small" x="405" y="258" text-anchor="middle">tác động</text>
  <path class="arrow" d="M220 235 L300 235"/>

  <circle class="state" cx="655" cy="235" r="78"/>
  <text class="title" x="655" y="223" text-anchor="middle">x1=x0+u</text>
  <text class="small" x="655" y="260" text-anchor="middle">trạng thái mới</text>
  <path class="arrow" d="M510 235 L565 235"/>

  <circle class="limit" cx="655" cy="430" r="48"/>
  <text class="title" x="655" y="439" text-anchor="middle">r</text>
  <path class="dash" d="M655 315 L655 374"/>
  <text class="small" x="675" y="350">so với đích</text>

  <rect class="cost" x="840" y="112" width="285" height="125" rx="14"/>
  <text class="label" x="982" y="158" text-anchor="middle">Sai lệch bám đích</text>
  <text class="title" x="982" y="203" text-anchor="middle">(x1−r)²</text>
  <path class="arrow" d="M740 205 L830 175"/>

  <rect class="cost" x="840" y="277" width="285" height="125" rx="14"/>
  <text class="label" x="982" y="323" text-anchor="middle">Năng lượng</text>
  <text class="title" x="982" y="368" text-anchor="middle">λu²</text>
  <path class="arrow" d="M500 270 C635 350 720 350 830 338"/>

  <rect class="limit" x="285" y="390" width="245" height="76" rx="12"/>
  <text class="label" x="407" y="423" text-anchor="middle">Giới hạn vật lý</text>
  <text class="title" x="407" y="454" text-anchor="middle">|u| ≤ u_max</text>

  <text class="small" x="600" y="542" text-anchor="middle">Chi phí tổng: q(u)=(x0+u−r)²+λu²; biến u chỉ được chọn trong miền khả thi.</text>
</svg>

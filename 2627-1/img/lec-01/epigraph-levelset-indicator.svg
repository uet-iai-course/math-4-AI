<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Tập trên đồ thị, tập mức dưới và hàm chỉ thị</title>
  <desc id="desc">Khung trái tô tập trên đồ thị của một hàm lồi. Khung giữa cắt đồ thị tại độ cao alpha để tạo tập mức dưới lồi. Khung phải minh họa hàm chỉ thị của một tập lồi, nhận giá trị 0 trong tập và dương vô cùng ngoài tập.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 5L0 10Z" fill="#24324a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.title{font-family:sans-serif;font-size:23px;font-weight:700;fill:#172033}.label{font-family:sans-serif;font-size:18px;fill:#24324a}.small{font-family:sans-serif;font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2;marker-end:url(#arrow)}.curve{fill:none;stroke:#315d92;stroke-width:5}.epi{fill:#e9f1fb;stroke:none}.level{stroke:#b44b20;stroke-width:4;stroke-dasharray:9 6}.set{fill:#eef4f3;stroke:#16706a;stroke-width:4}.outside{fill:#fff1e9;stroke:#b44b20;stroke-width:3}.inside{fill:#fff;stroke:#16706a;stroke-width:3}</style></defs>
  <rect width="1200" height="570" fill="#f3f6fb"/><text class="title" x="600" y="34" text-anchor="middle">Hàm lồi qua tập lồi: tập trên đồ thị, tập mức dưới, hàm chỉ thị</text>
  <rect class="panel" x="18" y="58" width="378" height="475" rx="14"/><text class="title" x="207" y="94" text-anchor="middle">Tập trên đồ thị</text>
  <line class="axis" x1="54" y1="410" x2="360" y2="410"/><line class="axis" x1="70" y1="435" x2="70" y2="125"/>
  <path class="epi" d="M85 315 Q207 500 340 145 L340 115 L85 115 Z"/><path class="curve" d="M85 315 Q207 500 340 145"/>
  <text class="label" x="207" y="165" text-anchor="middle">epi f={(x,t): t≥f(x)}</text><text class="small" x="207" y="455" text-anchor="middle">f lồi khi và chỉ khi epi f là tập lồi.</text>

  <rect class="panel" x="411" y="58" width="378" height="475" rx="14"/><text class="title" x="600" y="94" text-anchor="middle">Tập mức dưới</text>
  <line class="axis" x1="447" y1="410" x2="753" y2="410"/><line class="axis" x1="463" y1="435" x2="463" y2="125"/>
  <path class="curve" d="M480 200 Q595 530 725 145"/><line class="level" x1="470" y1="275" x2="740" y2="275"/><text class="label" x="735" y="265">α</text>
  <rect class="set" x="510.7" y="399" width="160.4" height="22" rx="8"/><line x1="510.7" y1="275" x2="510.7" y2="399" stroke="#16706a" stroke-width="2" stroke-dasharray="6 5"/><line x1="671.1" y1="275" x2="671.1" y2="399" stroke="#16706a" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="label" x="600" y="452" text-anchor="middle">L<tspan baseline-shift="sub" font-size="13">α</tspan> = {x : f(x) ≤ α}</text><text class="small" x="600" y="485" text-anchor="middle">Nếu f lồi thì mọi tập mức dưới là lồi.</text>

  <rect class="panel" x="804" y="58" width="378" height="475" rx="14"/><text class="title" x="993" y="94" text-anchor="middle">Hàm chỉ thị</text>
  <ellipse class="set" cx="993" cy="235" rx="112" ry="72"/><circle class="inside" cx="960" cy="245" r="9"/><rect class="outside" x="1110" y="165" width="18" height="18"/>
  <text class="label" x="960" y="277" text-anchor="middle">x trong C</text><text class="label" x="1162" y="155" text-anchor="end">x ngoài C</text>
  <text class="label" x="993" y="350" text-anchor="middle">I<tspan baseline-shift="sub" font-size="13">C</tspan>(x) = 0 nếu x thuộc C</text><text class="label" x="993" y="386" text-anchor="middle">I<tspan baseline-shift="sub" font-size="13">C</tspan>(x) = +∞ nếu x ngoài C</text>
  <text class="small" x="993" y="452" text-anchor="middle">Nếu C lồi thì I<tspan baseline-shift="sub" font-size="12">C</tspan> là hàm lồi.</text><text class="small" x="993" y="485" text-anchor="middle">Ràng buộc được đưa vào hàm mục tiêu.</text>
</svg>

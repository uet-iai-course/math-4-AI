<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">Quay lui và ngưỡng Armijo</title><desc id="desc">Giá trị f(x⁰+td) là62−820t+2798t² trên hướng âm gradient. Ngưỡng Armijo là62−82t. Đồ thị phóng đại khoảng0≤t≤0,42 để thấy giao điểm và bước1/4 được nhận.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Mô hình Taylor bậc hai của bước Newton</title>
  <desc id="desc">Hàm f và mô hình Taylor bậc hai m x tiếp xúc tại v bằng không, có cùng giá trị, độ dốc và độ cong dương tại đó. Cực tiểu của mô hình tại v bằng Delta x Newton xác định bước Newton; độ giảm dự báo của mô hình là delta Newton bình phương chia hai.</desc>

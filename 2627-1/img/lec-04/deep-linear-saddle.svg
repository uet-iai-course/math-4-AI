<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
<title id="title">Mặt mất mát của mạng tuyến tính hai lớp</title>
<desc id="desc">Các đường mức của f(a,b)=½(ab−1)² trên hình vuông −2,3≤a,b≤2,3. Hai nhánh hyperbol ab=1 là tập các điểm cực tiểu với f=0. Hai trục tọa độ cùng hyperbol ab=2 là đường mức f=½; gốc (0,0) là điểm yên ngựa với f=½. Đường mức f=2 gồm hyperbol ab=−1 và ab=3. Quỹ đạo giảm gradient với bước 1/4 từ (1,−1) đi dọc đường chéo a=−b qua (0,5;−0,5), (0,34;−0,34), (0,25;−0,25) về điểm yên ngựa. Tại (0,2;0,2), mũi tên hướng Newton chỉ về phía gốc, là hướng tăng của f.</desc>

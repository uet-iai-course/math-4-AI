<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">Đường khả thi và hàm mục tiêu</title><desc id="desc">F(u)=một nửa của2u₁²+5u₂²; đường khả thi u₁+u₂=14. Nghiệm(10,4) có F=140. Mũi tên và điểm thay theo chế độ đã ghi nhãn.</desc>

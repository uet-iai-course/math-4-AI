<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
<title id="title">Cận trên bậc hai của hàm có gradient Lipschitz</title>
<desc id="desc">Hàm mất mát logistic f(s)=log(1+e^s) (nét liền), parabol cận trên q(s)=f(1)+f′(1)(s−1)+(L/2)(s−1)² với L=1/4 (nét đứt) và tiếp tuyến tại s=1 (nét chấm). Parabol nằm trên f, tiếp tuyến nằm dưới f; ba đường chạm nhau tại s=1, với f(1)≈1.313 và f′(1)≈0.731. Trục ngang là s, trục đứng là giá trị hàm.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Đường mức và quỹ đạo exact line search của gradient</title>
  <desc id="desc">Các ellipse là đường mức của một nửa x một bình phương cộng mười x hai bình phương. Các điểm được lấy từ công thức x một bằng mười nhân chín phần mười một mũ k và x hai bằng âm chín phần mười một mũ k.</desc>
  <rect width="900" height="500" fill="#fff"/>
  <g stroke="#d7dceb" fill="none" stroke-width="2"><ellipse cx="430" cy="250" rx="330" ry="104"/><ellipse cx="430" cy="250" rx="245" ry="77"/><ellipse cx="430" cy="250" rx="165" ry="52"/><ellipse cx="430" cy="250" rx="85" ry="27"/></g>
  <g stroke="#33467f" stroke-width="2"><line x1="70" y1="250" x2="825" y2="250"/><line x1="430" y1="60" x2="430" y2="440"/></g>
  <g fill="#33467f" font-family="Arial, sans-serif" font-size="19"><text x="810" y="238">x₁</text><text x="442" y="78">x₂</text><text x="440" y="273">0</text></g>
  <polyline points="730.0,170.0 675.5,315.5 630.8,196.4 594.3,293.8 564.4,214.1 540.0,279.3 520.0,226.0 503.6,269.6 490.2,233.9 479.3,263.1 470.3,239.2 463.0,258.8 457.0,242.8 452.1,255.9 448.1,245.2 444.8,253.9 442.1,246.8" fill="none" stroke="#b24a2b" stroke-width="5" stroke-linejoin="round"/>
  <line x1="442.1" y1="246.8" x2="434" y2="249" stroke="#b24a2b" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#limit-arrow)"/>
  <defs><marker id="limit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b24a2b"/></marker></defs>
  <g fill="#b24a2b"><circle cx="730" cy="170" r="7"/><circle cx="675.5" cy="315.5" r="6"/><circle cx="630.8" cy="196.4" r="6"/><circle cx="594.3" cy="293.8" r="6"/><circle cx="430" cy="250" r="8"/></g>
  <g fill="#222" font-family="Arial, sans-serif" font-size="18"><text x="744" y="166">x⁽⁰⁾=(10,1)</text><text x="650" y="342">x⁽¹⁾=(90/11,−9/11)</text><text x="448" y="242">x*</text><text x="444" y="225" fill="#b24a2b">k→∞</text><text x="82" y="465">x₁⁽ᵏ⁾=10ρᵏ, x₂⁽ᵏ⁾=(−ρ)ᵏ, ρ=9/11.</text></g>
</svg>

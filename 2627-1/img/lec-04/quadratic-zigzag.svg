<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Đường mức và quỹ đạo hạ gradient với tìm kiếm đường chính xác</title>
  <desc id="desc">Các elip là đường mức của f(x)=½(x₁²+10x₂²). Quỹ đạo hạ gradient với tìm kiếm đường chính xác (exact line search) đi từ x⁽⁰⁾=(10,1) qua x⁽¹⁾=(90/11,−9/11), zích zắc hai phía trục x₁ và tiến chậm về x*=0 theo x₁⁽ᵏ⁾=10ρᵏ, x₂⁽ᵏ⁾=(−ρ)ᵏ với ρ=9/11. Mũi tên nét đứt là bước Newton Hd=−g, đưa x⁽⁰⁾ tới gốc sau một bước.</desc>
  <rect width="900" height="500" fill="#fff"/>
  <g stroke="#d7dceb" fill="none" stroke-width="2"><ellipse cx="430" cy="250" rx="330" ry="104.36"/><ellipse cx="430" cy="250" rx="245" ry="77.48"/><ellipse cx="430" cy="250" rx="165" ry="52.18"/><ellipse cx="430" cy="250" rx="85" ry="26.88"/></g>
  <g stroke="#33467f" stroke-width="2"><line x1="70" y1="250" x2="825" y2="250"/><line x1="430" y1="60" x2="430" y2="440"/></g>
  <g fill="#33467f" font-size="19"><text x="810" y="238">x₁</text><text x="442" y="78">x₂</text><text x="440" y="273">0</text></g>
  <polyline points="730.0,220.0 675.5,274.5 630.8,229.9 594.3,266.4 564.4,236.6 540.0,261.0 520.0,241.0 503.6,257.4 490.2,244.0 479.3,254.9 470.3,246.0 463.0,253.3 457.0,247.3 452.1,252.2 448.1,248.2 444.8,251.5 442.1,248.8" fill="none" stroke="#b24a2b" stroke-width="5" stroke-linejoin="round"/>
  <line x1="442.1" y1="248.8" x2="434" y2="249.5" stroke="#b24a2b" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#limit-arrow)"/>
  <line x1="730" y1="220" x2="440" y2="249" stroke="#16706a" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#newton-arrow)"/>
  <defs><marker id="limit-arrow" viewBox="0 0 8 6" markerWidth="4" markerHeight="3" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b24a2b"/></marker><marker id="newton-arrow" viewBox="0 0 9 9" markerWidth="4.5" markerHeight="4.5" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16706a"/></marker></defs>
  <g fill="#b24a2b"><circle cx="730" cy="220" r="7"/><circle cx="675.5" cy="274.5" r="6"/><circle cx="630.8" cy="229.9" r="6"/><circle cx="594.3" cy="266.4" r="6"/><circle cx="430" cy="250" r="8"/></g>
  <g fill="#222" font-size="18" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><text x="744" y="216">x⁽⁰⁾=(10,1)</text><text x="650" y="302">x⁽¹⁾=(90/11,−9/11)</text><text x="404" y="242">x*</text><text x="444" y="225" fill="#b24a2b">k→∞</text><text x="82" y="465">x₁⁽ᵏ⁾=10ρᵏ, x₂⁽ᵏ⁾=(−ρ)ᵏ, ρ=9/11.</text><text x="515" y="190" fill="#16706a">Hd=−g: một bước đến 0</text></g>
</svg>

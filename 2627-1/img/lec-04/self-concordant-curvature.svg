<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Độ cong tự điều chỉnh của hàm s trừ log s</title>
  <desc id="desc">Khung trái cho hàm phi của s bằng s trừ log s trên miền dương, với điểm đầu một phần hai, bước Newton một phần tư đến ba phần tư và nghiệm một. Khung phải cho tỷ số trị tuyệt đối đạo hàm bậc ba chia lũy thừa ba phần hai của đạo hàm bậc hai luôn bằng hai. Dải dưới nêu độ giảm Newton bình phương bằng một phần tư và giới hạn rằng tính tự điều chỉnh không tự bảo đảm nghiệm hoặc hội tụ từ mọi điểm.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16706a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.head{font-size:24px;font-weight:700;fill:#172033}.label{font-size:18px;fill:#24324a}.small{font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2}.curve{fill:none;stroke:#315d92;stroke-width:5}.ratio{fill:none;stroke:#6a45a5;stroke-width:5}.point{fill:#fff8e6;stroke:#16706a;stroke-width:4}.good{fill:#e9f6f0;stroke:#16706a;stroke-width:2}.warn{fill:#fff1ec;stroke:#b44b20;stroke-width:2}</style></defs>
  <rect width="1200" height="650" fill="#f3f6fb"/><text class="head" x="600" y="38" text-anchor="middle">Độ cong dùng chính nó để khống chế tốc độ biến thiên</text>
  <rect class="panel" x="22" y="62" width="566" height="420" rx="14"/><text class="head" x="305" y="99" text-anchor="middle">φ(s)=s−log s, s&gt;0</text><line class="axis" x1="74" y1="428" x2="548" y2="428"/><line class="axis" x1="92" y1="450" x2="92" y2="130"/>
  <path class="curve" d="M126 160 C155 236 190 304 236 342 C260 359 283 368 305 370 C350 369 410 348 520 300"/><circle class="point" cx="190" cy="304" r="8"/><circle class="point" cx="247" cy="350" r="8"/><circle cx="305" cy="370" r="8" fill="#fff" stroke="#b44b20" stroke-width="4"/>
  <line x1="198" y1="308" x2="239" y2="342" stroke="#16706a" stroke-width="4" marker-end="url(#arrow)"/><text class="small" x="130" y="286">s₀=1/2</text><text class="small" x="224" y="330">s₁=3/4</text><text class="small" x="317" y="392">s*=1</text><text class="small" x="522" y="451">s</text><text class="small" x="55" y="140">φ(s)</text><text class="label" x="305" y="458" text-anchor="middle">Δs_N=1/4 đưa 1/2 đến 3/4</text>
  <rect class="panel" x="612" y="62" width="566" height="420" rx="14"/><text class="head" x="895" y="99" text-anchor="middle">Tỷ số tự điều chỉnh đúng bằng 2</text><line class="axis" x1="664" y1="428" x2="1136" y2="428"/><line class="axis" x1="690" y1="450" x2="690" y2="132"/><line class="ratio" x1="710" y1="235" x2="1110" y2="235"/>
  <text class="label" x="720" y="219">2</text><text class="small" x="1120" y="451">s</text><text class="label" x="895" y="158" text-anchor="middle">|φ'''(s)| / φ''(s)^(3/2)</text><text class="label" x="895" y="285" text-anchor="middle">φ''(s)=1/s², |φ'''(s)|=2/s³</text><text class="small" x="895" y="321" text-anchor="middle">Đạt dấu bằng trong điều kiện tự điều chỉnh chuẩn.</text><rect class="good" x="690" y="348" width="410" height="64" rx="12"/><text class="label" x="895" y="388" text-anchor="middle">tỷ số không đổi trên mọi s&gt;0</text>
  <rect class="good" x="22" y="510" width="566" height="108" rx="14"/><text class="head" x="305" y="545" text-anchor="middle">Một bước Newton kiểm tra được</text><text class="label" x="305" y="579" text-anchor="middle">φ'(1/2)=−1, φ''(1/2)=4</text><text class="small" x="305" y="605" text-anchor="middle">δ_N²=−φ'Δs_N=1/4.</text>
  <rect class="warn" x="612" y="510" width="566" height="108" rx="14"/><text class="head" x="895" y="545" text-anchor="middle">Giới hạn phải giữ</text><text class="label" x="895" y="579" text-anchor="middle">Tự điều chỉnh không tự bảo đảm nghiệm tồn tại</text><text class="small" x="895" y="605" text-anchor="middle">hoặc Newton hội tụ từ mọi điểm trong miền.</text>
</svg>

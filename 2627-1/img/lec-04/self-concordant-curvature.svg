<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" font-family="DejaVu Sans">
  <title id="title">Độ cong tự điều chỉnh của hàm s trừ log s</title>
  <desc id="desc">Khung trái cho hàm phi của s bằng s trừ log s trên miền dương, với điểm đầu một phần hai, bước Newton một phần tư đến ba phần tư (mũi tên ngang) và nghiệm một. Khung phải cho tỷ số trị tuyệt đối đạo hàm bậc ba chia lũy thừa ba phần hai của đạo hàm bậc hai luôn bằng hai. Dải dưới nêu độ giảm Newton bình phương bằng một phần tư và giới hạn rằng tính tự điều chỉnh không tự bảo đảm nghiệm hoặc hội tụ từ mọi điểm.</desc>
  <defs><marker id="arrow" viewBox="0 0 9 9" markerWidth="4" markerHeight="4" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16706a"/></marker><style>.panel{fill:#fbfcff;stroke:#bac5d6;stroke-width:2}.head{font-size:24px;font-weight:700;fill:#172033}.label{font-size:18px;fill:#24324a}.small{font-size:16px;fill:#44516a}.axis{stroke:#24324a;stroke-width:2}.curve{fill:none;stroke:#315d92;stroke-width:5}.ratio{fill:none;stroke:#6a45a5;stroke-width:5}.point{fill:#fff8e6;stroke:#16706a;stroke-width:4}.good{fill:#e9f6f0;stroke:#16706a;stroke-width:2}.warn{fill:#fff1ec;stroke:#b44b20;stroke-width:2}</style></defs>
  <rect width="1200" height="650" fill="#f3f6fb"/><text class="head" x="600" y="38" text-anchor="middle">Độ cong và tốc độ biến thiên của độ cong</text>
  <rect class="panel" x="22" y="62" width="566" height="420" rx="14"/><text class="head" x="305" y="99" text-anchor="middle">φ(s)=s−log s, s&gt;0</text><line class="axis" x1="74" y1="428" x2="548" y2="428"/><line class="axis" x1="92" y1="450" x2="92" y2="130"/>
  <polyline class="curve" stroke-linejoin="round" points="125.6,149.8 128.9,164.4 132.2,177.8 135.5,190.3 138.7,201.9 142.0,212.7 145.3,222.8 148.6,232.2 151.9,241.0 155.2,249.3 158.5,257.1 161.8,264.4 165.0,271.2 168.3,277.7 171.6,283.8 174.9,289.5 178.2,295.0 181.5,300.1 184.8,304.9 188.1,309.5 191.3,313.8 194.6,317.9 197.9,321.7 201.2,325.3 204.5,328.8 207.8,332.0 211.1,335.0 214.4,337.9 217.6,340.6 220.9,343.2 224.2,345.6 227.5,347.8 230.8,349.9 234.1,351.9 237.4,353.7 240.6,355.5 243.9,357.1 247.2,358.6 250.5,360.0 253.8,361.2 257.1,362.4 260.4,363.5 263.7,364.5 266.9,365.4 270.2,366.2 273.5,366.9 276.8,367.5 280.1,368.1 283.4,368.6 286.7,369.0 290.0,369.3 293.2,369.6 296.5,369.8 299.8,369.9 303.1,370.0 306.4,370.0 309.7,369.9 313.0,369.8 316.3,369.7 319.5,369.4 322.8,369.1 326.1,368.8 329.4,368.4 332.7,368.0 336.0,367.5 339.3,367.0 342.5,366.4 345.8,365.8 349.1,365.1 352.4,364.4 355.7,363.6 359.0,362.8 362.3,362.0 365.6,361.1 368.8,360.2 372.1,359.3 375.4,358.3 378.7,357.3 382.0,356.2 385.3,355.1 388.6,354.0 391.9,352.8 395.1,351.6 398.4,350.4 401.7,349.2 405.0,347.9 408.3,346.6 411.6,345.2 414.9,343.8 418.2,342.4 421.4,341.0 424.7,339.6 428.0,338.1 431.3,336.6 434.6,335.0 437.9,333.5 441.2,331.9 444.4,330.3 447.7,328.7 451.0,327.0 454.3,325.3 457.6,323.6 460.9,321.9 464.2,320.2 467.5,318.4 470.7,316.6 474.0,314.8 477.3,313.0 480.6,311.1 483.9,309.3 487.2,307.4 490.5,305.5 493.8,303.6 497.0,301.6 500.3,299.7 503.6,297.7 506.9,295.7 510.2,293.7 513.5,291.6 516.8,289.6 520.0,287.5"/><path d="M190 312.1V408M247.5 358.7V408" stroke="#16706a" stroke-width="1.5" stroke-dasharray="3 4"/><circle class="point" cx="190" cy="312.1" r="8"/><circle class="point" cx="247.5" cy="358.7" r="8"/><circle cx="305" cy="370" r="8" fill="#fff" stroke="#b44b20" stroke-width="4"/>
  <line x1="192" y1="402" x2="244" y2="402" stroke="#16706a" stroke-width="3" marker-end="url(#arrow)"/><text class="small" x="176" y="320" text-anchor="end">s₀=1/2</text><text class="small" x="260" y="346">s₁=3/4</text><text class="small" x="317" y="392">s*=1</text><text class="small" x="522" y="451">s</text><text class="small" x="55" y="140">φ(s)</text><text class="label" x="305" y="458" text-anchor="middle">Bước Newton Δs<tspan baseline-shift="sub" font-size="12">N</tspan>=1/4 đưa 1/2 đến 3/4</text>
  <rect class="panel" x="612" y="62" width="566" height="420" rx="14"/><text class="head" x="895" y="99" text-anchor="middle">Tỷ số tự điều chỉnh đúng bằng 2</text><line class="axis" x1="664" y1="428" x2="1136" y2="428"/><line class="axis" x1="690" y1="450" x2="690" y2="132"/><line class="ratio" x1="710" y1="235" x2="1110" y2="235"/>
  <text class="label" x="720" y="219">2</text><text class="small" x="1120" y="451">s</text><text class="label" x="895" y="158" text-anchor="middle">|φ‴(s)| / φ″(s)<tspan baseline-shift="super" font-size="13">3/2</tspan></text><text class="label" x="895" y="285" text-anchor="middle">φ″(s)=1/s², |φ‴(s)|=2/s³</text><text class="small" x="895" y="321" text-anchor="middle">Điều kiện tự điều chỉnh chuẩn đạt dấu bằng.</text><rect class="good" x="700" y="348" width="390" height="64" rx="12"/><text class="label" x="895" y="388" text-anchor="middle">tỷ số không đổi trên mọi s&gt;0</text>
  <rect class="good" x="22" y="510" width="566" height="108" rx="14"/><text class="head" x="305" y="545" text-anchor="middle">Một bước Newton tại s₀=1/2</text><text class="label" x="305" y="579" text-anchor="middle">φ′(1/2)=−1, φ″(1/2)=4</text><text class="small" x="305" y="605" text-anchor="middle">δ<tspan baseline-shift="sub" font-size="11">N</tspan>²=−φ′(1/2)Δs<tspan baseline-shift="sub" font-size="11">N</tspan>=1/4.</text>
  <rect class="warn" x="612" y="510" width="566" height="108" rx="14"/><text class="head" x="895" y="545" text-anchor="middle">Giới hạn của tính tự điều chỉnh</text><text class="label" x="895" y="579" text-anchor="middle">Tự điều chỉnh không tự bảo đảm nghiệm tồn tại</text><text class="small" x="895" y="605" text-anchor="middle">hoặc Newton hội tụ từ mọi điểm trong miền.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">Tham số hóa không gian hạt nhân u = û + Nz</title><desc id="desc">û=(14,0), N=(−1,1) nên u(z)=(14−z, z) nằm trọn trên u₁+u₂=14. Điểm đầu ứng với z⁰=−2 cho u⁰=(16,−2); nghiệm ứng với z*=4 cho u*=(10,4). Số gia Δz=6 cho đúng hướng d=NΔz=(−6,6).</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Hướng khả thi trong không gian rỗng của ràng buộc</title>
  <desc id="desc">Đường thẳng x một cộng x hai bằng một là tập khả thi. Từ một điểm khả thi, hướng Delta x thuộc không gian rỗng của A nằm dọc đường và giữ khả thi; một hướng thường có thể rời khỏi đường.</desc>
  <rect width="900" height="500" fill="#fff"/>
  <g stroke="#33467f" stroke-width="2">
    <line x1="90" y1="420" x2="830" y2="420"/><line x1="90" y1="70" x2="90" y2="430"/>
  </g>
  <line x1="145" y1="390" x2="690" y2="95" stroke="#2f6f8f" stroke-width="6"/>
  <circle cx="415" cy="244" r="9" fill="#333"/>
  <line x1="415" y1="244" x2="545" y2="174" stroke="#2e7d32" stroke-width="5" marker-end="url(#greenArrow)"/>
  <line x1="415" y1="244" x2="610" y2="285" stroke="#a33a1f" stroke-width="5" marker-end="url(#redArrow)"/>
  <defs>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a33a1f"/></marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="20" fill="#222">
    <text x="650" y="115" fill="#2f6f8f">Ax=b</text>
    <text x="440" y="230">x khả thi</text>
    <text x="525" y="150" fill="#2e7d32">AΔx=0</text>
    <text x="610" y="310" fill="#a33a1f">hướng thường phá khả thi</text>
    <text x="810" y="448">x₁</text><text x="55" y="82">x₂</text>
  </g>
</svg>
